name: Приложение «Доска» (Linux, Windows, Android)

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'pages/board.html'
      - 'assets/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-build
  cancel-in-progress: true

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Подготовить релиз desktop-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f desktop-latest "$GITHUB_SHA"
          git push -f origin refs/tags/desktop-latest
          if ! gh release view desktop-latest >/dev/null 2>&1; then
            gh release create desktop-latest --title "MathFrame — Доска (приложение)" \
              --notes "Офлайн-версия электронной доски MathFrame для Linux, Windows и Android. Собирается автоматически из main." --latest=false
          fi
          gh release edit desktop-latest --notes "Офлайн-версия электронной доски MathFrame для Linux, Windows и Android. Сборка из коммита ${GITHUB_SHA::7}."

  desktop:
    needs: init
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            files: |
              desktop/dist/MathFrame-Board-linux.AppImage
              desktop/dist/MathFrame-Board-linux.deb
          - os: windows-latest
            target: win
            files: |
              desktop/dist/MathFrame-Board-windows-setup.exe
              desktop/dist/MathFrame-Board-windows-portable.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run dist:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Загрузить в релиз
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload desktop-latest $(echo "${{ matrix.files }}" | sed 's#desktop/##') --clobber

  android:
    needs: init
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Офлайн-копия доски
        working-directory: desktop
        run: npm install --no-audit --no-fund --ignore-scripts && node scripts/copy-site.js
      - name: Сборка APK
        working-directory: desktop/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p ../dist
          if [ -n "$KEYSTORE_B64" ]; then
            # Релизная подпись: секреты заданы в Settings → Secrets and variables → Actions (см. desktop/README.md)
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks" gradle --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../dist/MathFrame-Board-android.apk
          else
            echo "::warning::Секреты подписи Android не заданы — собираю отладочный APK"
            gradle --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../dist/MathFrame-Board-android.apk
          fi
      - name: Загрузить в релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload desktop-latest desktop/dist/MathFrame-Board-android.apk --clobber
