/* ===== АВАТАРЫ / SKELETON / ПУСТЫЕ СОСТОЯНИЯ ===== */
function hueOf(s){ let h=0; for(const ch of String(s||'?')) h=(h*31+ch.codePointAt(0))>>>0; return h%360; }
function initials(name){
  const parts = String(name||'?').replace(/@.*/,'').trim().split(/[\s._-]+/).filter(Boolean);
  return ((parts[0]||'?')[0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
}
function avatarHTML(name, photo, cls=''){
  const img = (photo && /^https:\/\//.test(photo))
    ? `<img src="${escapeHtml(photo)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : '';
  return `<span class="avatar ${cls}" style="--h:${hueOf(name)}" aria-hidden="true">${escapeHtml(initials(name))}${img}</span>`;
}

}

/* ===== TOAST ===== */
function toast(msg){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;
  const host=document.getElementById('toasts'); host.appendChild(t);
  while(host.children.length>4) host.firstElementChild.remove();
  setTimeout(()=>t.classList.add('out'),3400); setTimeout(()=>t.remove(),3750);}

/* ===== SANITIZER (allowlist) ===== */
const ALLOWED_TAGS = {B:1,STRONG:1,I:1,EM:1,U:1,S:1,STRIKE:1,P:1,BR:1,DIV:1,SPAN:1,UL:1,OL:1,LI:1,BLOCKQUOTE:1,H2:1,H3:1,H4:1,A:1,IMG:1,AUDIO:1,CODE:1,PRE:1};
function sanitizeHTML(html){
  const doc = new DOMParser().parseFromString('<body>'+html+'</body>','text/html');
  (function clean(node){
    [...node.childNodes].forEach(child=>{
      if(child.nodeType===1){
        if(!ALLOWED_TAGS[child.tagName]){
          if(child.tagName==='SCRIPT'||child.tagName==='STYLE'){child.remove();return;}
          while(child.firstChild) node.insertBefore(child.firstChild, child);
          node.removeChild(child); return;
        }
        [...child.attributes].forEach(attr=>{
          const n=attr.name.toLowerCase();
          if(child.tagName==='A' && n==='href' && /^https?:/.test(attr.value)){child.setAttribute('target','_blank');child.setAttribute('rel','noopener');return;}
          if(child.tagName==='IMG' && n==='src' && /^(https?:|data:image)/.test(attr.value)) return;
          if(child.tagName==='AUDIO' && (n==='src'||n==='controls')) return;
          child.removeAttribute(attr.name);
        });
        clean(child);
      } else if(child.nodeType===8){child.remove();}
    });
  })(doc.body);
  return doc.body.innerHTML;
}
function escapeHtml(s){return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ===== TOPIC PICKER (справочник) ===== */
async function loadTopics(){
  if(topicsCache) return topicsCache;
  try{
    const res = await fetch(PAGE_ROOT + 'data/topics/config.json');
    const data = await res.json();
    topicsCache = Array.isArray(data) ? data : (data.topics || data.items || []);
  }catch(e){ topicsCache = []; }
  return topicsCache;
}
let topicPickCallback=null;
function openTopicOverlay(){
  const overlay = document.getElementById('topicOverlay'), modal = document.getElementById('topicModal');
  document.body.classList.add('no-scroll'); overlay.style.visibility='visible'; modal.style.visibility='visible';
  requestAnimationFrame(()=>{ overlay.classList.add('active'); modal.classList.add('active'); });
}
function closeTopicOverlay(){
  const overlay = document.getElementById('topicOverlay'), modal = document.getElementById('topicModal');
  overlay.classList.remove('active'); modal.classList.remove('active');
  setTimeout(()=>{ overlay.style.visibility='hidden'; modal.style.visibility='hidden'; document.body.classList.remove('no-scroll'); },300);
}
document.getElementById('topicOverlay').onclick=closeTopicOverlay;
document.getElementById('topicClose').onclick=closeTopicOverlay;
async function openTopicPicker(cb){
  topicPickCallback = cb;
  const topics = await loadTopics();
  renderTopicList(topics);
  openTopicOverlay();
  const si = document.getElementById('topicSearch');
  if(si && !matchMedia('(pointer:coarse)').matches) setTimeout(()=>si.focus(), 60);
}
/* Esc закрывает верхнее окно: сначала выбор темы, потом редактор */
document.addEventListener('keydown', e=>{
  if(e.key!=='Escape') return;
  if(document.getElementById('topicModal').classList.contains('active')){ closeTopicOverlay(); return; }
  const ed = document.querySelector('.editor-modal.active');
  if(ed && ed._close) ed._close();
});
function renderTopicList(list){
  const el = document.getElementById('topicListEl');
  if(!list.length){ el.innerHTML='<div class="topic-item">Справочник недоступен</div>'; return; }
  el.innerHTML = list.map(t=>`<div class="topic-item" tabindex="0" role="button" data-id="${escapeHtml(t.id)}" data-title="${escapeHtml(t.title||'')}">${escapeHtml(t.title||t.id)}</div>`).join('');
  el.querySelectorAll('.topic-item').forEach(it=>{
    it.onclick=()=>{
      if(it.dataset.id && topicPickCallback) topicPickCallback({id:it.dataset.id, title:it.dataset.title});
      closeTopicOverlay();
    };
    it.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); it.click(); } };
  });
}
document.getElementById('topicSearch').oninput=async(e)=>{
  const q=e.target.value.trim().toLowerCase();
  const topics = await loadTopics();
  renderTopicList(!q ? topics : topics.filter(t=>(t.title||'').toLowerCase().includes(q)));
};

  const path = `forum/${folder}/${Date.now()}_${file.name}`;
  const ref = storage.ref().child(path);
  return ref.put(file, {contentType:file.type}).then(()=>ref.getDownloadURL());
}

function bindToolbar(container, editableEl){
  const updEmpty = ()=>editableEl.classList.toggle('is-empty', !editableEl.textContent.trim() && !editableEl.querySelector('img,audio'));
  editableEl.addEventListener('input', updEmpty); editableEl._updEmpty = updEmpty; updEmpty();
  container.querySelectorAll('.tb-btn[data-cmd]').forEach(b=>b.onclick=()=>{
    editableEl.focus();
    document.execCommand(b.dataset.cmd,false,b.dataset.val||null);
  });
  const linkBtn = container.querySelector('[data-act="link"]');
  if(linkBtn) linkBtn.onclick=()=>{
    editableEl.focus();
    const sel = window.getSelection();
    if(!sel || sel.isCollapsed || !editableEl.contains(sel.anchorNode)){ toast('Сначала выделите текст для ссылки'); return; }
    const url = prompt('Введите URL (с http:// или https://):');
    if(url) document.execCommand('createLink', false, url);
  };
  const imgInput = container.querySelector('input[data-file="img"]');
  const audioInput = container.querySelector('input[data-file="audio"]');
  container.querySelector('[data-act="img"]').onclick=()=>imgInput.click();
  container.querySelector('[data-act="audio"]').onclick=()=>audioInput.click();
  imgInput.onchange=async()=>{
    const f=imgInput.files[0]; if(!f) return;
    if(!fUser) return toast('Войдите, чтобы прикреплять файлы');
    if(f.size>8*1024*1024) return toast('Изображение слишком большое (макс 8МБ)');
    toast('Загрузка изображения…');
    try{ const url=await uploadFile(f, fUser.uid); editableEl.focus();
      document.execCommand('insertHTML',false,`<img src="${url}"><br>`); toast('Изображение добавлено'); }
    catch(e){ toast('Ошибка загрузки: '+e.message); }
    imgInput.value='';
  };
  audioInput.onchange=async()=>{
    const f=audioInput.files[0]; if(!f) return;
    if(!fUser) return toast('Войдите, чтобы прикреплять файлы');
    if(f.size>15*1024*1024) return toast('Аудио слишком большое (макс 15МБ)');
    toast('Загрузка аудио…');
    try{ const url=await uploadFile(f, fUser.uid); editableEl.focus();
      document.execCommand('insertHTML',false,`<audio controls src="${url}"></audio><br>`); toast('Аудио добавлено'); }
    catch(e){ toast('Ошибка загрузки: '+e.message); }
    audioInput.value='';
  };
}

/* ===== РОУТЕР ===== */
window.addEventListener('hashchange', route);
function route(){
  const h = location.hash.slice(1);
  if(unsubDetail){ unsubDetail(); unsubDetail=null; }
  if(h.startsWith('article/')) renderDetail(h.split('/')[1]);
  else renderList();
}

/* ===== СИСТЕМА РЕКОМЕНДАЦИЙ (интегрирована в основную ленту) ===== */
function computeRecoOrder(list){
  if(!list.length) return {order:[], reasons:{}};
  const counts = window._replyCounts || {};
  const byViews = [...list].sort((x,y)=>(y.views||0)-(x.views||0))[0];
  const byNew = [...list].sort((x,y)=>(y.createdAt?.toMillis?.()||0)-(x.createdAt?.toMillis?.()||0))[0];
  const discussedSorted = [...list].sort((x,y)=>(counts[y.id]||0)-(counts[x.id]||0));
  const byDiscussed = (counts[discussedSorted[0]?.id]||0) > 0 ? discussedSorted[0] : null;
  const picks = [
    byViews && {a:byViews, icon:'flame', label:'Популярное'},
    byNew && {a:byNew, icon:'sparkle', label:'Новое'},
    byDiscussed && {a:byDiscussed, icon:'chat', label:'Обсуждаемое'},
  ].filter(Boolean);
  const seen = new Set(); const uniqPicks = picks.filter(p=>{ if(seen.has(p.a.id)) return false; seen.add(p.a.id); return true; });
  const rest = list.filter(a=>!seen.has(a.id));
  if(rest.length){ const r = rest[Math.floor(Math.random()*rest.length)]; uniqPicks.push({a:r, icon:'shuffle', label:'Попробуйте'}); seen.add(r.id); }
  const remaining = list.filter(a=>!seen.has(a.id)).sort((x,y)=>(y.createdAt?.toMillis?.()||0)-(x.createdAt?.toMillis?.()||0));
  const reasons = {}; uniqPicks.forEach(p=>{ reasons[p.a.id] = p; });
  return { order: [...uniqPicks.map(p=>p.a), ...remaining], reasons };
}

function fillTagSelect(){

  else if(listFilter.tag){ listFilter.tag=''; }
  const all = window._articlesCache||[];
  const sa = document.getElementById('statArticles'), su = document.getElementById('statAuthors');
  if(sa) sa.textContent = all.length;
  if(su) su.textContent = new Set(all.map(a=>a.authorUid).filter(Boolean)).size;
}
function emptyAction(act){
  if(act==='write'){ if(requireAuth()) openEditor(); return; }
  if(act==='retry'){ renderList(); return; }
  if(act==='reset'){
    listFilter = {...listFilter, search:'', tag:'', bookmarks:false, mine:false};
    renderList();
  }
}
function timeAgo(ts){
  if(!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const s = Math.floor((Date.now()-d.getTime())/1000);
  if(s<60) return 'только что';
  if(s<3600) return Math.floor(s/60)+' мин назад';
  if(s<86400) return Math.floor(s/3600)+' ч назад';
  if(s<2592000) return Math.floor(s/86400)+' дн назад';
  return d.toLocaleDateString('ru-RU');
}
function readingTime(html){
  const words = (html||'').replace(/<[^>]+>/g,' ').trim().split(/\s+/).filter(Boolean).length;
  return Math.max(1, Math.round(words/180));
}
async function renderArticleCards(){
  const grid = document.getElementById('cardsGrid'); if(!grid) return;
  let list = [...(window._articlesCache||[])];
  const bm = getBookmarks();
  if(listFilter.mine) list = list.filter(a=>fUser && a.authorUid===fUser.uid);
  if(listFilter.bookmarks) list = list.filter(a=>bm.includes(a.id));
  if(listFilter.search) list = list.filter(a=> a.title.toLowerCase().includes(listFilter.search) || (a.bodyHTML||'').toLowerCase().includes(listFilter.search));
  if(listFilter.tag) list = list.filter(a=>(a.tags||[]).includes(listFilter.tag));

  const counts = window._replyCounts || {};
  let reasons = {};
  if(listFilter.sort==='views') list.sort((a,b)=>(b.views||0)-(a.views||0));
  else if(listFilter.sort==='replies') list.sort((a,b)=>(counts[b.id]||0)-(counts[a.id]||0));
  else if(listFilter.sort==='new') list.sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));
  else { const reco = computeRecoOrder(list); list = reco.order; reasons = reco.reasons; }

  grid.removeAttribute('aria-busy');
  const animateAll = listAnimNext; listAnimNext = false;
  const filtered = listFilter.search || listFilter.tag || listFilter.bookmarks || listFilter.mine;
  const note = document.getElementById('resultNote');
  if(note) note.textContent = filtered && list.length ? `Найдено: ${list.length} ${plural(list.length,'статья','статьи','статей')}` : '';
  if(!list.length){
    const total = (window._articlesCache||[]).length;
    let es;
    if(listFilter.search || listFilter.tag) es = {title:'Ничего не нашлось', text:'Попробуйте другой запрос или уберите фильтр по тегу.', action:'reset', label:'Сбросить фильтры'};
    else if(listFilter.bookmarks) es = {title:'Закладок пока нет', text:'Откройте статью и нажмите «В закладки» — она появится здесь.', action:'reset', label:'Показать все статьи'};
    else if(listFilter.mine) es = {title:'Вы ещё не публиковали статей', text:'Поделитесь разбором задачи или конспектом темы — это займёт пару минут.', action:'write', label:'Написать первую статью'};
    else if(!total) es = {title:'Здесь пока тихо', text:'На форуме ещё нет ни одной статьи. Станьте первым автором!', action:'write', label:'Написать статью'};
    else es = {title:'Ничего не нашлось', text:'', action:'reset', label:'Сбросить фильтры'};
    grid.innerHTML = emptyState(es);
    return;
  }
  let k = 0;
  grid.innerHTML = list.map(a=>{
    const anim = animateAll || !shownCards.has(a.id);
    const i = anim ? k++ : 0; shownCards.add(a.id);
    const name = a.authorName||'Аноним';
    const rc = counts[a.id];
    return `
    <article class="card${anim?' fx-in':''}" style="--i:${i}" data-id="${escapeHtml(a.id)}" tabindex="0" role="link" aria-label="${escapeHtml(a.title)}">
      <div class="card-head">
        ${avatarHTML(name, a.authorPhoto)}
        <div class="card-author"><b>${escapeHtml(name)}</b><span>${timeAgo(a.createdAt)} · ${readingTime(a.bodyHTML)} мин чтения</span></div>
        ${reasons[a.id] ? `<span class="tag-chip reco-chip">${ic(reasons[a.id].icon)} ${reasons[a.id].label}</span>` : ''}
      </div>
      <h3>${escapeHtml(a.title)}</h3>
      <p class="excerpt">${escapeHtml((a.bodyHTML||'').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim().slice(0,220))}</p>
      <div class="foot">
        <div class="tags">
          ${(a.tags||[]).map(t=>`<span class="tag-chip">#${escapeHtml(t)}</span>`).join('')}
          ${a.topicRef ? `<span class="topic-badge">${ic('book')} ${escapeHtml(a.topicRef.title)}</span>` : ''}
        </div>
        <div class="card-stats">
          <span title="Просмотры">${ic('eye')} ${a.views||0}</span>
          <span title="Ответы">${ic('chat')} <span data-rc="${escapeHtml(a.id)}">${rc==null?'–':rc}</span></span>
          ${bm.includes(a.id) ? `<span class="bm-on" title="В закладках">${ic('bookmarkFilled')}</span>` : ''}
        </div>
      </div>
    </article>`;
  }).join('');

  await Promise.all(list.map(a=>
    db.collection('forumArticles').doc(a.id).collection('replies').get().then(s=>{
      window._replyCounts = window._replyCounts||{}; window._replyCounts[a.id]=s.size;
      const el = document.querySelector(`[data-rc="${CSS.escape(a.id)}"]`); if(el) el.textContent = s.size;
    }).catch(()=>{})
  ));
}

function openEditor(article=null){
  const draftKey = article ? 'forumDraftEdit_'+article.id : 'forumDraftNew';
  const draft = JSON.parse(localStorage.getItem(draftKey)||'null');
  const overlay = document.createElement('div'); overlay.className='overlay editor-overlay';
  const modal = document.createElement('div'); modal.className='modal editor-modal';
  modal.setAttribute('role','dialog'); modal.setAttribute('aria-modal','true'); modal.setAttribute('aria-labelledby','edTitleH');
  let topicRef = article?.topicRef || draft?.topicRef || null;
  let tags = article?.tags ? [...article.tags] : (draft?.tags || []);
  const hasDraft = !article && draft && (draft.title || draft.bodyHTML);
  modal.innerHTML = `
    <div class="em-head">
      <span class="em-icon">${ic('pencil')}</span>
      <h2 id="edTitleH">${article ? 'Редактировать статью' : 'Новая статья'}<span class="em-sub">${article ? 'Изменения увидят все читатели' : 'Поделитесь разбором, конспектом или вопросом'}</span></h2>
      <button class="modal-close" id="closeEditorBtn" aria-label="Закрыть">${ic('close')}</button>
    </div>
    <div class="em-body">
      <label class="field-label" for="artTitle">Заголовок</label>
      <input class="plain title-input" id="artTitle" maxlength="160" value="${escapeHtml(article?.title || draft?.title || '')}" placeholder="О чём ваша статья?">
      <span class="field-label">Содержание</span>
      ${makeToolbar('artBody', 'Расскажите подробнее: формулы, примеры, картинки…')}
      <label class="field-label" for="artTags">Теги · через запятую, до 8</label>
      <input class="plain" id="artTags" value="${escapeHtml(tags.join(', '))}" placeholder="алгебра, интегралы">
      <div class="tag-preview" id="tagPreview"></div>
      <span class="field-label">Тема справочника</span>
      <div class="topic-pick-row"><button type="button" class="btn small" id="pickTopicBtn">${ic('book','md')} ${topicRef?'Сменить тему':'Выбрать тему'}</button> <span id="topicRefShow"></span></div>
    </div>
    <div class="em-foot">
      <span class="draft-note" id="draftNote"><span class="dot"></span>${hasDraft ? 'Восстановлен черновик' : (article ? 'Редактирование' : 'Черновик сохраняется автоматически')}</span>
      <button class="btn" id="cancelArtBtn">Отмена</button>
      <button class="btn primary" id="saveArtBtn">${ic('send','md')} ${article ? 'Сохранить' : 'Опубликовать'}</button>
    </div>`;
  document.body.append(overlay, modal);
  document.body.classList.add('no-scroll');
  // показываем через transition из common.css (.overlay/.modal → .active)
  void modal.offsetWidth;
  overlay.classList.add('active'); modal.classList.add('active');
  const bodyEl = modal.querySelector('#artBody');
  bodyEl.innerHTML = article?.bodyHTML || draft?.bodyHTML || '';
  bindToolbar(modal, bodyEl);
  if(!matchMedia('(pointer:coarse)').matches) setTimeout(()=>modal.querySelector(article?'#artBody':'#artTitle').focus({preventScroll:true}), 120);

  function showTopicRef(){
    modal.querySelector('#topicRefShow').innerHTML = topicRef ? `<span class="topic-badge">${ic('book')} ${escapeHtml(topicRef.title)}</span>` : '';
    modal.querySelector('#pickTopicBtn').innerHTML = `${ic('book','md')} ${topicRef?'Сменить тему':'Выбрать тему'}`;
  }
  showTopicRef();
  const tagsInput = modal.querySelector('#artTags');
  function showTags(){
    const arr = tagsInput.value.split(',').map(s=>s.trim()).filter(Boolean).slice(0,8);
    modal.querySelector('#tagPreview').innerHTML = arr.map(t=>`<span class="tag-chip">#${escapeHtml(t)}</span>`).join('');
  }
  showTags(); tagsInput.addEventListener('input', showTags);
  modal.querySelector('#pickTopicBtn').onclick=()=>openTopicPicker(t=>{ topicRef=t; showTopicRef(); saveDraft(); });

  let closed = false;
  function close(){
    if(closed) return; closed = true;
    overlay.classList.remove('active'); modal.classList.remove('active');
    setTimeout(()=>{ overlay.remove(); modal.remove();
      if(!document.querySelector('.modal.active')) document.body.classList.remove('no-scroll'); }, 420);
  }
  modal._close = close;
  modal.querySelector('#closeEditorBtn').onclick=close;
  modal.querySelector('#cancelArtBtn').onclick=close;
  overlay.onclick=close;

  const note = modal.querySelector('#draftNote'); let noteT = 0;
  function saveDraft(){
    localStorage.setItem(draftKey, JSON.stringify({
      title: modal.querySelector('#artTitle').value, bodyHTML: bodyEl.innerHTML,
      tags: modal.querySelector('#artTags').value.split(',').map(s=>s.trim()).filter(Boolean), topicRef
    }));
    note.lastChild.textContent = 'Черновик сохранён'; note.classList.add('saved');
    clearTimeout(noteT); noteT = setTimeout(()=>note.classList.remove('saved'), 1200);
  }
  modal.addEventListener('input', saveDraft);

  const saveBtn = modal.querySelector('#saveArtBtn');
  saveBtn.onclick = async ()=>{
    const title = modal.querySelector('#artTitle').value.trim();
    const bodyHTML = sanitizeHTML(bodyEl.innerHTML);
    if(!title || !bodyEl.textContent.trim()) return toast('Заполните заголовок и текст');
    const tagsArr = modal.querySelector('#artTags').value.split(',').map(s=>s.trim()).filter(Boolean).slice(0,8);
    saveBtn.disabled = true;
    try{
      if(article){
        await db.collection('forumArticles').doc(article.id).update({
          title, bodyHTML, tags: tagsArr, topicRef: topicRef||null, updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        toast('Статья обновлена');
        if(location.hash==='#article/'+article.id) route(); else location.hash='article/'+article.id;
      } else {
        const ref = await db.collection('forumArticles').add({
          title, bodyHTML, tags: tagsArr, topicRef: topicRef||null,
          authorUid: fUser.uid, authorName: fUser.displayName||fUser.email||'Аноним',
          authorPhoto: fUser.photoURL||null, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(), views:0
        });
        toast('Статья опубликована'); localStorage.removeItem(draftKey); location.hash='article/'+ref.id;
      }
      // Частицы — только на успешную публикацию/сохранение, не на каждый клик
      // по редактору (тулбар форматирования их не получает).
      if(window.MathFrameUI) window.MathFrameUI.burst(saveBtn, {count:14, spread:38});
      close();
    }catch(e){ toast('Ошибка: '+e.message); saveBtn.disabled = false; }
  };
}

      <div class="replies-head"><h2>Ответы</h2><span class="count-pill" id="replyCount">…</span></div>
      <div id="replyFormRoot"></div>
      <div id="repliesRoot">${[0,1].map(()=>`<div class="reply"><div class="reply-box"><div class="sk-row"><span class="sk sk-av" style="width:28px;height:28px"></span><span class="sk sk-line w30"></span></div><span class="sk sk-line"></span><span class="sk sk-line w70"></span></div></div>`).join('')}</div>
    </section>`;

  document.getElementById('bmBtn').onclick=()=>{ toggleBookmark(id);
    const nowBm = getBookmarks().includes(id);
    const b = document.getElementById('bmBtn'); b.setAttribute('aria-pressed', nowBm);
    b.innerHTML = `${nowBm?ic('bookmarkFilled'):ic('bookmark')} ${nowBm?'В закладках':'В закладки'}`;
    if(nowBm && window.MathFrameUI && window.MathFrameUI.burst) window.MathFrameUI.burst(b, {count:8, spread:22}); };
  document.getElementById('shareBtn').onclick=()=>{
    const url = location.href;
    navigator.clipboard?.writeText(url).then(()=>toast('Ссылка скопирована')).catch(()=>toast(url));
  };
  if(isOwner){
    document.getElementById('editArtBtn').onclick=()=>openEditor(a);
    document.getElementById('delArtBtn').onclick=async()=>{
      if(!confirm('Удалить статью безвозвратно?')) return;
      await db.collection('forumArticles').doc(id).delete();
      toast('Статья удалена'); location.hash='';
    };
  }

  renderReplyForm(document.getElementById('replyFormRoot'), id, null, a);

  let lastReplies = null;
  function rerender(){
    if(!lastReplies) return;   // пока ответы не пришли — остаётся skeleton
    const cnt = document.getElementById('replyCount');
    if(cnt) cnt.textContent = lastReplies.filter(r=>!r.deleted).length;
    renderRepliesTree(document.getElementById('repliesRoot'), lastReplies, id, a);
  }

  const unsubArticle = db.collection('forumArticles').doc(id).onSnapshot(snap=>{
    if(!snap.exists) return;
    a.bestId = snap.data().bestId; rerender();
  });
  const unsubReplies = db.collection('forumArticles').doc(id).collection('replies').orderBy('createdAt','asc')
    .onSnapshot(snap=>{
      lastReplies = snap.docs.map(d=>({id:d.id, ...d.data()}));
      rerender();
    }, err=>toast('Ошибка: '+err.message));
  unsubDetail = ()=>{ unsubArticle(); unsubReplies(); };
}

function renderReplyForm(container, articleId, parentId, article){
  if(!fUser){
    container.innerHTML = `<div class="fx-composer fx-login-hint"><span>Войдите, чтобы оставить ответ и голосовать.</span><button class="btn small primary" id="lf${parentId||'root'}">Войти</button></div>`;
    const btn = container.querySelector('#lf'+(parentId||'root')); if(btn) btn.onclick=()=>window.openAuthModal();
    return;
  }
  const uid = 'rf_'+(parentId||'root')+'_'+Math.random().toString(36).slice(2,7);
  const isMac = /Mac|iPhone|iPad/.test(navigator.platform||'');
  container.innerHTML = `<div class="fx-composer">${makeToolbar(uid, parentId ? 'Ваш ответ…' : 'Поделитесь мнением или решением…')}
    <div class="composer-foot">
      <span class="kbd-hint"><kbd>${isMac?'⌘':'Ctrl'}</kbd> + <kbd>Enter</kbd> — отправить</span>
      <button class="btn primary small" id="${uid}_send">${ic('send','md')} Отправить</button>
    </div></div>`;
  const editable = container.querySelector('#'+uid);
  bindToolbar(container, editable);
  editable.addEventListener('keydown', e=>{ if((e.ctrlKey||e.metaKey) && e.key==='Enter') container.querySelector('#'+uid+'_send').click(); });
  const sendBtn = container.querySelector('#'+uid+'_send');
  sendBtn.onclick = async ()=>{
    const html = sanitizeHTML(editable.innerHTML);
    if(!editable.textContent.trim()) return toast('Введите текст ответа');
    sendBtn.disabled = true;
    try{
      await db.collection('forumArticles').doc(articleId).collection('replies').add({
        parentId: parentId||null, bodyHTML: html, authorUid: fUser.uid,
        authorName: fUser.displayName||fUser.email||'Аноним', authorPhoto: fUser.photoURL||null,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(), likes:0, dislikes:0, voters:{}, deleted:false
      });
      editable.innerHTML=''; if(editable._updEmpty) editable._updEmpty();
      toast('Ответ добавлен');
      if(window.MathFrameUI) window.MathFrameUI.burst(sendBtn, {count:10, spread:28});
    }catch(e){ toast('Ошибка: '+e.message); }
    sendBtn.disabled = false;
  };
  return editable;
}

function renderRepliesTree(root, all, articleId, article){
  // Лента перестраивается на каждый снимок (голос, новый ответ) — открытые формы
  // ответа и набранный в них текст переносим в новую разметку, а анимацию
  // появления получают только ответы, которых ещё не было на экране.
  const openForms = {};
  root.querySelectorAll('.reply[data-rid]').forEach(w=>{
    const host = w.querySelector(':scope > .reply-box > .reply-form');
    if(host && host.style.display!=='none'){
      const ed = host.querySelector('.editable');
      openForms[w.dataset.rid] = { html: ed ? ed.innerHTML : '', focus: !!ed && document.activeElement===ed };
    }
  });
  const firstPaint = !seenReplies.size;
  let order = 0;
  const byParent = {};
  all.forEach(r=>{ const p=r.parentId||'root'; (byParent[p]=byParent[p]||[]).push(r); });
  function sortNodes(list){
    return [...list].sort((x,y)=>{
      if(article.bestId && x.id===article.bestId) return -1;
      if(article.bestId && y.id===article.bestId) return 1;
      return (x.createdAt?.toMillis?.()||0)-(y.createdAt?.toMillis?.()||0);
    });
  }
  function renderNode(r, depth){
    const isBest = article.bestId === r.id;
    const isArticleAuthor = r.authorUid === article.authorUid;
    const myVote = fUser ? (r.voters||{})[fUser.uid] : null;
    const wrap = document.createElement('div'); wrap.className = 'reply'+(isBest?' best':'');
    wrap.dataset.rid = r.id;
    if(!seenReplies.has(r.id)){
      seenReplies.add(r.id);
      wrap.classList.add('fx-in'); wrap.style.setProperty('--i', firstPaint ? order++ : 0);
    }
    const name = r.authorName||'Аноним';
    wrap.innerHTML = r.deleted ? `<div class="reply-box"><div class="reply-deleted">Сообщение удалено</div></div><div class="children"></div>` : `
      <div class="reply-box">
        <div class="reply-top">
          ${avatarHTML(name, r.authorPhoto, 'sm')}
          <b>${escapeHtml(name)}</b>
          ${isArticleAuthor ? '<span class="badge-author">Автор</span>' : ''}
          ${isBest ? `<span class="best-tag">${ic('star')} Лучший ответ</span>` : ''}
          <span>· ${timeAgo(r.createdAt)}</span>
        </div>
        <div class="reply-body">${r.bodyHTML}</div>
        <div class="reply-actions">
          <button class="vote-btn ${myVote==='like'?'active-like':''}" data-vote="like" aria-label="Нравится" aria-pressed="${myVote==='like'}">${ic('thumbUp')} ${r.likes||0}</button>
          <button class="vote-btn ${myVote==='dislike'?'active-dislike':''}" data-vote="dislike" aria-label="Не нравится" aria-pressed="${myVote==='dislike'}">${ic('thumbDown')} ${r.dislikes||0}</button>
          <button class="link-btn" data-act="reply" aria-expanded="false">${ic('reply')} Ответить</button>
          ${(!r.parentId && fUser && fUser.uid===article.authorUid && !isBest) ? `<button class="link-btn" data-act="best">${ic('star')} Отметить лучшим</button>` : ''}
          ${(fUser && (fUser.uid===r.authorUid || fUser.uid===article.authorUid)) ? `<button class="link-btn danger" data-act="del">${ic('trash')} Удалить</button>` : ''}
        </div>
        <div class="reply-form" style="display:none"></div>
      </div>
      <div class="children"></div>`;
    if(!r.deleted){
      wrap.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>{
        if(!requireAuth()) return;
        b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump');
        castVote(articleId, r.id, b.dataset.vote);
      });
      const replyBtn = wrap.querySelector('[data-act="reply"]');
      const formHost = wrap.querySelector('.reply-form');
      const openForm = (saved)=>{
        formHost.style.display='block'; replyBtn.setAttribute('aria-expanded','true');
        formHost.innerHTML='';
        const ed = renderReplyForm(formHost, articleId, r.id, article);
        if(ed && saved){ ed.innerHTML = saved.html; if(ed._updEmpty) ed._updEmpty(); if(saved.focus) setTimeout(()=>ed.focus({preventScroll:true})); }
        else if(ed && !matchMedia('(pointer:coarse)').matches) setTimeout(()=>ed.focus({preventScroll:true}));
      };
      replyBtn.onclick=()=>{
        const showing = formHost.style.display!=='none';
        if(showing){ formHost.style.display='none'; replyBtn.setAttribute('aria-expanded','false'); return; }
        if(!requireAuth()) return;
        openForm(null);
      };
      if(openForms[r.id] && fUser) openForm(openForms[r.id]);
      const bestBtn = wrap.querySelector('[data-act="best"]');
      if(bestBtn) bestBtn.onclick=()=>db.collection('forumArticles').doc(articleId).update({bestId:r.id}).then(()=>toast('Лучший ответ выбран'));
      const delBtn = wrap.querySelector('[data-act="del"]');
      if(delBtn) delBtn.onclick=()=>{ if(confirm('Удалить сообщение?')) db.collection('forumArticles').doc(articleId).collection('replies').doc(r.id).update({deleted:true,bodyHTML:''}); };
    }
    const childrenBox = wrap.querySelector('.children');
    sortNodes(byParent[r.id]||[]).forEach(c=>childrenBox.appendChild(renderNode(c, depth+1)));
    return wrap;
  }
  root.innerHTML='';
  const topLevel = sortNodes(byParent['root']||[]);
  if(!topLevel.length){ root.innerHTML = emptyState({title:'Пока нет ответов', text:'Станьте первым, кто поделится мнением или решением.', compact:true}); return; }
  topLevel.forEach(r=>root.appendChild(renderNode(r,0)));
}

async function castVote(articleId, replyId, type){
  const ref = db.collection('forumArticles').doc(articleId).collection('replies').doc(replyId);
  try{
    await db.runTransaction(async tx=>{
      const snap = await tx.get(ref);
      const d = snap.data(); const voters = {...(d.voters||{})};
      const prev = voters[fUser.uid];
      let likes=d.likes||0, dislikes=d.dislikes||0;
      if(prev===type){ delete voters[fUser.uid]; if(type==='like') likes--; else dislikes--; }
      else{
        if(prev==='like') likes--; if(prev==='dislike') dislikes--;
        voters[fUser.uid]=type; if(type==='like') likes++; else dislikes++;
      }
      tx.update(ref, {voters, likes: Math.max(0,likes), dislikes: Math.max(0,dislikes)});
    });
  }catch(e){ toast('Ошибка голосования'); }
}

route();
</script>
