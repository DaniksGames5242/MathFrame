<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<script>/* MathFrame: тема до первого кадра + маска перехода между страницами (см. common.js › PAGE TRANSITIONS) */(function(){var d=document.documentElement;try{var t=localStorage.getItem('theme');if(t==='light'||(t!=='dark'&&!matchMedia('(prefers-color-scheme: dark)').matches))d.classList.add('light');}catch(e){}try{var s=sessionStorage.getItem('mf-veil');if(!s)return;sessionStorage.removeItem('mf-veil');var v=JSON.parse(s),n=performance.getEntriesByType&&performance.getEntriesByType('navigation')[0];if(!v||!v.fill||Date.now()-v.t>8000||(n&&n.type&&n.type!=='navigate'))return;window.__mfVeil=v;d.style.setProperty('--mf-veil-fill',v.fill);d.classList.add('mf-veil-on');setTimeout(function(){d.classList.remove('mf-veil-on')},4000);}catch(e){}})();</script>
<title>AI‑агент — MathFrame</title>
<meta name="description" content="Помощник по математике: объясняет темы справочника, разбирает решения и отвечает на вопросы." />
<script>document.documentElement.classList.add('agent-page');</script>

<style>
  @font-face { font-family:'BodyFont'; src:url('/assets/fonts/body-font.otf') format('opentype');
               font-weight:400; font-display:swap; }
  @font-face { font-family:'BodyFont'; src:url('/assets/fonts/body-font-bold.otf') format('opentype');
               font-weight:700; font-display:swap; }
</style>
<link rel="stylesheet" href="/assets/css/common.css" />
<!-- KaTeX уже используется в справочнике и мини-сервисах — тот же набор файлов. -->
<link rel="stylesheet" href="/assets/lib/katex/katex.min.css" />
<script defer src="/assets/lib/katex/katex.min.js"></script>
<link rel="stylesheet" href="/assets/css/ai-agent.css" />

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body data-page="ai-agent">

<div id="app-header"></div>

<main class="agent-shell">
  <h1 class="sr-only">AI‑агент</h1>

  <div class="agent-card" id="agentCard">
    <div class="scrim" id="agentScrim" hidden></div>

    <!-- ===== чаты аккаунта ===== -->
    <aside class="chats" id="agentChats" aria-label="Ваши чаты">
      <div class="chats-head">
        <div class="chats-brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19h18"/><path d="M5 17C9 17 10 6 19 5"/><circle cx="11.2" cy="11.6" r="1.6" fill="currentColor" stroke="none"/></svg>
          </span>
          <span>AI‑агент</span>
        </div>
        <button type="button" class="icon-btn ghost" id="agentCollapse" aria-label="Скрыть список чатов" title="Скрыть список чатов">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/><path d="M15.5 10l-2 2 2 2"/></svg>
        </button>
      </div>
      <button type="button" class="new-chat" id="agentNew">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span>Новый чат</span>
      </button>
      <ul class="chat-list" id="agentChatList" aria-label="История чатов"></ul>
      <div class="chats-foot" id="agentSync"></div>
    </aside>

    <!-- ===== текущий чат ===== -->
    <section class="chat" aria-label="Чат с AI‑агентом">
      <header class="chat-top">
        <button type="button" class="icon-btn ghost" id="agentMenu" aria-label="Показать список чатов" title="Показать список чатов" aria-controls="agentChats" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
        </button>
        <input type="text" class="chat-title" id="agentTitle" maxlength="80" placeholder="Новый чат" aria-label="Название чата" autocomplete="off" />
        <span class="role-badge" id="agentBadge" hidden></span>
        <div class="topic-ctl">
          <span class="chip-topic" id="agentCtx" hidden></span>
          <button type="button" class="tbtn" id="agentPick" aria-haspopup="true" aria-expanded="false" title="Задать вопрос в контексте темы справочника">Выбрать тему</button>
        </div>
        <button type="button" class="icon-btn ghost" id="agentNewTop" aria-label="Новый чат" title="Новый чат">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
        <div class="picker" id="agentPicker" hidden>
          <input type="search" id="agentPickInput" placeholder="Название темы справочника…" autocomplete="off" />
          <ul id="agentPickList"></ul>
        </div>
      </header>

      <div class="log-scroll" id="agentScroll">
        <div class="log" id="agentLog" role="log" aria-live="polite"></div>
      </div>

      <div class="agent-banner info" id="agentBanner" hidden></div>

      <form class="composer" id="agentForm" autocomplete="off">
        <button type="button" class="to-bottom" id="agentDown" aria-label="К последнему сообщению" tabindex="-1">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
        </button>
        <div class="composer-in">
          <div class="login-bar" id="agentLogin" hidden>
            <span>Войдите в аккаунт, чтобы задать вопрос агенту — ваши чаты сохранятся в аккаунте.</span>
            <button type="button" class="btn small primary" id="agentLoginBtn">Войти</button>
          </div>
          <div class="compose-row">
            <span class="compose-count" id="agentCount" aria-live="polite" hidden></span>
            <textarea id="agentInput" rows="1" maxlength="4000" aria-label="Ваш вопрос" placeholder="Спросите что угодно о математике…" enterkeyhint="send"></textarea>
            <button type="submit" class="round" id="agentSend" aria-label="Отправить">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
            <button type="button" class="round stop" id="agentStop" aria-label="Остановить" hidden>
              <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            </button>
          </div>
          <div class="fineprint">Агент может ошибаться — важное перепроверяйте. <span class="fp-keys"><kbd>Shift</kbd>+<kbd>Enter</kbd> — новая строка</span></div>
        </div>
      </form>
    </section>
  </div>
</main>

<div id="app-footer"></div>

<script>var PAGE_ROOT = '/';</script>
<script src="/assets/js/mathframe-ui.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/common.js"></script>
<script src="/assets/js/ai-agent.js"></script>
</body>
</html>
