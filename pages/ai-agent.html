<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>AI‑агент — MathFrame</title>
<meta name="description" content="Помощник по математике: объясняет темы справочника, разбирает решения и отвечает на вопросы." />
<script>document.documentElement.classList.add('agent-page');</script>

<style>
  @font-face { font-family:'BodyFont'; src:url('/assets/fonts/body-font.otf') format('opentype');
               font-weight:400; font-display:swap; }
  @font-face { font-family:'BodyFont'; src:url('/assets/fonts/body-font-bold.otf') format('opentype');
               font-weight:700; font-display:swap; }
</style>
<link rel="stylesheet" href="/assets/css/common.css" />
<!-- KaTeX уже используется в справочнике и мини-сервисах — тот же набор файлов. -->
<link rel="stylesheet" href="/assets/lib/katex/katex.min.css" />
<script defer src="/assets/lib/katex/katex.min.js"></script>

<style>
[hidden]{display:none !important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ===== страница как «приложение»: сама не прокручивается, внутри — три зоны ===== */
html.agent-page,
html.agent-page body{overflow:hidden;height:100%}
html.agent-page #app-footer{display:none}

.agent-shell{
  --agent-h:calc(100vh - var(--header-height) - var(--safe-t, 0px));
  height:var(--agent-h);
  max-width:1240px;margin:0 auto;
  padding:.7rem clamp(.5rem,2vw,1rem) calc(.7rem + var(--safe-b, 0px));
  padding-left:max(clamp(.5rem,2vw,1rem),var(--safe-l, 0px));
  padding-right:max(clamp(.5rem,2vw,1rem),var(--safe-r, 0px));
}
@supports (height:100dvh){
  .agent-shell{--agent-h:calc(100dvh - var(--header-height) - var(--safe-t, 0px))}
}
.agent-card{
  position:relative;height:100%;overflow:hidden;
  display:grid;grid-template-columns:272px minmax(0,1fr);
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-lg);
}

/* ===== список чатов ===== */
.chats{
  display:flex;flex-direction:column;min-height:0;min-width:0;
  border-right:1px solid var(--border);background:var(--bg-sunken);
}
.chats-head{padding:.7rem}
.new-chat{
  width:100%;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  font:inherit;font-size:.9rem;font-weight:600;padding:.6rem .8rem;min-height:40px;border-radius:var(--r);
  border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);cursor:pointer;
  transition:background var(--t),color var(--t);
}
.new-chat:hover:not(:disabled){background:var(--accent);color:#fff}
.new-chat:disabled{opacity:.45;cursor:default}
.new-chat svg{width:16px;height:16px}
.chat-list{list-style:none;margin:0;padding:0 .5rem .5rem;flex:1 1 auto;min-height:0;overflow-y:auto}
.chat-item{
  display:flex;align-items:center;gap:.3rem;padding:.5rem .35rem .5rem .65rem;margin-bottom:2px;border-radius:var(--r-sm);
  cursor:pointer;border:1px solid transparent;
}
.chat-item:hover{background:var(--accent-soft)}
.chat-item.on{background:var(--accent-soft);border-color:var(--accent)}
.chat-item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ci-main{min-width:0;flex:1 1 auto}
.ci-title{font-size:.88rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-title.empty{color:var(--text-tertiary);font-style:italic}
.ci-meta{display:flex;align-items:center;gap:.4rem;font-size:.72rem;color:var(--text-tertiary)}
.ci-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:mfaDot 1.1s infinite ease-in-out}
.ci-del{
  flex:0 0 auto;width:28px;height:28px;border:0;border-radius:var(--r-sm);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  background:transparent;color:var(--text-tertiary);opacity:0;transition:opacity var(--t),color var(--t),background var(--t);
}
.ci-del svg{width:15px;height:15px}
.chat-item:hover .ci-del,.chat-item.on .ci-del,.ci-del:focus-visible{opacity:1}
.ci-del:hover{color:#f87171;background:rgba(248,113,113,.12)}
.chats-hint{padding:.6rem .7rem;font-size:.84rem;color:var(--text-secondary)}
.chats-foot{padding:.55rem .8rem;border-top:1px solid var(--border);font-size:.74rem;line-height:1.35;color:var(--text-tertiary)}
.chats-foot.err{color:var(--accent-3)}

/* ===== правая часть: закреплённая шапка · лента · закреплённое поле ввода ===== */
.chat{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}

.chat-top{
  position:relative;z-index:6;flex:0 0 auto;
  display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;
  padding:.6rem .8rem;border-bottom:1px solid var(--border);background:var(--bg-card);
}
.icon-btn{
  display:none;flex:0 0 auto;width:38px;height:38px;border-radius:var(--r-sm);border:1px solid var(--border-strong);
  background:var(--bg-sunken);color:var(--text-secondary);cursor:pointer;align-items:center;justify-content:center;
}
.icon-btn svg{width:18px;height:18px}
.icon-btn:hover{color:var(--accent);border-color:var(--accent)}
.chat-title{
  flex:1 1 180px;min-width:0;font:inherit;font-size:1rem;font-weight:600;color:var(--text-primary);
  padding:.4rem .55rem;border-radius:var(--r-sm);border:1px solid transparent;background:transparent;outline:none;
  text-overflow:ellipsis;
}
.chat-title:hover{border-color:var(--border-strong)}
.chat-title:focus{border-color:var(--accent);background:var(--bg-sunken);box-shadow:0 0 0 3px var(--accent-soft)}
.chat-title:disabled{opacity:.7}
.role-badge{
  flex:0 0 auto;padding:.22rem .65rem;border-radius:2rem;font-size:.74rem;font-weight:600;letter-spacing:.02em;
  color:var(--accent-3);border:1px solid rgba(242,180,92,.4);background:rgba(242,180,92,.1);white-space:nowrap;cursor:help;
}
.topic-ctl{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;min-width:0;max-width:100%}
.chip-topic{
  display:inline-flex;align-items:center;gap:.4rem;max-width:min(320px,100%);
  padding:.28rem .4rem .28rem .8rem;border-radius:2rem;font-size:.82rem;
  background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);
}
.chip-topic span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chip-topic button{
  flex:0 0 auto;width:1.35rem;height:1.35rem;border-radius:50%;border:0;cursor:pointer;
  background:transparent;color:inherit;font-size:1rem;line-height:1;
}
.chip-topic button:hover{background:var(--accent);color:#fff}
.tbtn{
  font:inherit;font-size:.82rem;padding:.4rem .8rem;min-height:36px;border-radius:var(--r-sm);white-space:nowrap;
  border:1px solid var(--border-strong);background:var(--bg-sunken);color:var(--text-secondary);cursor:pointer;
  transition:color var(--t),border-color var(--t);
}
.tbtn:hover:not(:disabled){color:var(--accent);border-color:var(--accent)}
.tbtn:disabled{opacity:.45;cursor:default}

/* выбор темы — выпадает прямо из шапки */
.picker{
  position:absolute;left:0;right:0;top:100%;z-index:8;padding:.7rem .8rem;
  background:var(--bg-card);border-bottom:1px solid var(--border);
  box-shadow:0 18px 30px -12px rgba(0,0,0,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.picker input{
  width:100%;padding:.55rem .75rem;border-radius:var(--r-sm);font:inherit;font-size:16px;
  border:1px solid var(--border-strong);background:var(--bg-sunken);color:var(--text-primary);outline:none;
}
.picker input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.picker ul{list-style:none;margin:.4rem 0 0;padding:0;max-height:min(260px,40vh);overflow:auto}
.picker li button{
  width:100%;text-align:left;font:inherit;font-size:.92rem;padding:.5rem .6rem;border:0;border-radius:var(--r-sm);
  background:transparent;color:var(--text-primary);cursor:pointer;
}
.picker li button:hover{background:var(--accent-soft);color:var(--accent)}
.pick-empty{color:var(--text-tertiary);font-size:.85rem;padding:.4rem .6rem}

/* лента сообщений — единственное, что прокручивается */
.log-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;scroll-behavior:auto}
.log{padding:1rem clamp(.7rem,3vw,1.2rem) 1.2rem;display:flex;flex-direction:column;gap:1rem;max-width:860px;margin:0 auto}
.msg{display:flex}
.msg-user{justify-content:flex-end}
.msg-body{min-width:0;max-width:100%}
.msg-user .msg-body{
  max-width:88%;padding:.6rem .9rem;border-radius:var(--r-lg) var(--r-lg) 4px var(--r-lg);
  background:var(--accent-soft);border:1px solid var(--accent);white-space:pre-wrap;word-break:break-word;
}
.msg-assistant .msg-body{width:100%}

/* ответ */
.md{line-height:1.65;font-size:1rem;word-break:break-word}
.md > :first-child{margin-top:0}
.md > :last-child{margin-bottom:0}
.md p{margin:.55em 0}
.md h3,.md h4{margin:1.1em 0 .4em;font-family:var(--font-display)}
.md h3{font-size:1.15rem}
.md h4{font-size:1.02rem}
.md ul,.md ol{margin:.5em 0;padding-left:1.4em}
.md li{margin:.25em 0}
.md a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.md strong{font-weight:700}
.md hr{border:0;border-top:1px solid var(--border);margin:1em 0}
.md blockquote{margin:.6em 0;padding:.2rem 1rem;border-left:3px solid var(--accent);color:var(--text-secondary)}
.md code{font-family:var(--font-mono);font-size:.88em;background:var(--bg-sunken);border-radius:4px;padding:.12em .35em}
.md pre{margin:.7em 0;padding:.8rem 1rem;overflow-x:auto;background:var(--bg-sunken);border:1px solid var(--border);border-radius:var(--r)}
.md pre code{background:none;padding:0}
.mfa-math[data-display="1"]{display:block;margin:.7em 0;overflow-x:auto;overflow-y:hidden;text-align:center}
.mfa-math .katex{font-size:1.06em}

.typing{display:inline-flex;gap:5px;padding:.5rem 0}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--text-tertiary);animation:mfaDot 1.1s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes mfaDot{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

.msg-err{margin-top:.6rem;padding:.55rem .8rem;border-radius:var(--r-sm);font-size:.9rem;
  color:#f87171;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.3)}
.msg-src{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-top:.7rem;font-size:.78rem;color:var(--text-tertiary)}
.src-chip{
  padding:.15rem .6rem;border-radius:2rem;font-size:.78rem;text-decoration:none;
  color:var(--accent);border:1px solid var(--border-strong);background:var(--bg-sunken);
  transition:border-color var(--t),background var(--t);
}
.src-chip:hover{border-color:var(--accent);background:var(--accent-soft)}
.msg-acts{display:flex;gap:.3rem;margin-top:.5rem}
.act{
  display:inline-flex;align-items:center;gap:.35rem;font:inherit;font-size:.78rem;
  padding:.25rem .55rem;border-radius:var(--r-sm);border:0;background:transparent;color:var(--text-tertiary);cursor:pointer;
}
.act svg{width:14px;height:14px}
.act:hover{color:var(--accent);background:var(--accent-soft)}

/* пустое состояние: здесь же — описание агента */
.agent-empty{padding:clamp(1rem,6vh,3rem) .3rem 1rem;text-align:center}
.agent-empty h2{font-size:clamp(1.35rem,3.6vw,1.8rem);margin-bottom:.5rem}
.agent-empty p{color:var(--text-secondary);font-size:.95rem;max-width:56ch;margin:0 auto 1.2rem}
.suggest{display:grid;gap:.5rem;grid-template-columns:repeat(2,minmax(0,1fr));text-align:left}
.suggest-chip{
  font:inherit;font-size:.88rem;line-height:1.4;text-align:left;padding:.7rem .9rem;border-radius:var(--r);
  border:1px solid var(--border);background:var(--bg-sunken);color:var(--text-primary);cursor:pointer;
  transition:border-color var(--t),background var(--t),transform var(--t);
}
.suggest-chip:hover{border-color:var(--accent);background:var(--accent-soft)}
.suggest-chip:active{transform:scale(.99)}

/* баннеры */
.agent-banner{flex:0 0 auto;margin:0 clamp(.7rem,3vw,1.1rem) .5rem;padding:.6rem .85rem;border-radius:var(--r-sm);font-size:.88rem}
.agent-banner.warn{color:var(--accent-3);background:rgba(242,180,92,.1);border:1px solid rgba(242,180,92,.35)}
.agent-banner.info{color:var(--text-secondary);background:var(--bg-sunken);border:1px solid var(--border)}

/* поле ввода — закреплено внизу */
.composer{
  flex:0 0 auto;z-index:5;
  padding:.7rem clamp(.7rem,3vw,1.1rem) .6rem;
  background:var(--bg-card);border-top:1px solid var(--border);
}
.composer-in{max-width:860px;margin:0 auto}
.login-bar{
  display:flex;gap:.7rem;align-items:center;justify-content:space-between;flex-wrap:wrap;
  margin-bottom:.6rem;padding:.55rem .8rem;border-radius:var(--r-sm);font-size:.88rem;
  background:var(--accent-soft);border:1px solid var(--accent);color:var(--text-primary);
}
.compose-row{display:flex;gap:.55rem;align-items:flex-end}
.compose-row textarea{
  flex:1 1 auto;min-width:0;resize:none;min-height:44px;max-height:180px;padding:.65rem .85rem;
  font:inherit;font-size:16px;line-height:1.45;color:var(--text-primary);
  background:var(--bg-sunken);border:1px solid var(--border-strong);border-radius:var(--r);outline:none;
}
.compose-row textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.compose-row textarea:disabled{opacity:.6}
.round{
  flex:0 0 auto;width:44px;height:44px;border-radius:var(--r);border:0;cursor:pointer;color:#fff;
  display:inline-flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--accent),var(--accent-hover));box-shadow:0 6px 18px var(--accent-glow);
  transition:transform var(--t) var(--e-out),opacity var(--t);
}
.round:hover:not(:disabled){transform:translateY(-1px)}
.round:disabled{opacity:.4;cursor:default;box-shadow:none}
.round.stop{background:var(--bg-sunken);color:var(--text-primary);border:1px solid var(--border-strong);box-shadow:none}
.round svg{width:20px;height:20px}
.fineprint{margin-top:.45rem;font-size:.72rem;color:var(--text-tertiary);text-align:center}

/* ===== узкие экраны: список чатов — выезжающая панель ===== */
.scrim{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.5)}
@media (max-width:820px){
  .agent-shell{padding:0;padding-bottom:var(--safe-b, 0px)}
  .agent-card{grid-template-columns:minmax(0,1fr);border-radius:0;border-left:0;border-right:0}
  .chats{
    position:absolute;z-index:21;top:0;bottom:0;left:0;width:min(86vw,320px);
    transform:translateX(-102%);transition:transform .25s var(--e-out);
    background:var(--bg-body);
    box-shadow:0 0 40px rgba(0,0,0,.5);
  }
  .agent-card.drawer-open .chats{transform:none}
  .icon-btn{display:inline-flex}
  .topic-ctl{flex:1 1 100%}
  .ci-del{opacity:1}
  .suggest{grid-template-columns:minmax(0,1fr)}
  .msg-user .msg-body{max-width:94%}
  .fineprint{display:none}
}
@media (hover:none){ .ci-del{opacity:1} }
@media (prefers-reduced-motion:reduce){
  .typing span,.ci-dot{animation:none;opacity:.7}
  .chats{transition:none}
}
</style>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body data-page="ai-agent">

<div id="app-header"></div>

<main class="agent-shell">
  <h1 class="sr-only">AI‑агент</h1>

  <div class="agent-card" id="agentCard">
    <div class="scrim" id="agentScrim" hidden></div>

    <!-- ===== чаты аккаунта ===== -->
    <aside class="chats" id="agentChats" aria-label="Ваши чаты">
      <div class="chats-head">
        <button type="button" class="new-chat" id="agentNew">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Новый чат
        </button>
      </div>
      <ul class="chat-list" id="agentChatList"></ul>
      <div class="chats-foot" id="agentSync"></div>
    </aside>

    <!-- ===== текущий чат ===== -->
    <section class="chat" aria-label="Чат с AI‑агентом">
      <header class="chat-top">
        <button type="button" class="icon-btn" id="agentMenu" aria-label="Список чатов">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <input type="text" class="chat-title" id="agentTitle" maxlength="80" placeholder="Новый чат" aria-label="Название чата" autocomplete="off" />
        <span class="role-badge" id="agentBadge" hidden></span>
        <div class="topic-ctl">
          <span class="chip-topic" id="agentCtx" hidden></span>
          <button type="button" class="tbtn" id="agentPick" aria-haspopup="true" aria-expanded="false">Выбрать тему</button>
        </div>
        <div class="picker" id="agentPicker" hidden>
          <input type="search" id="agentPickInput" placeholder="Название темы справочника…" autocomplete="off" />
          <ul id="agentPickList"></ul>
        </div>
      </header>

      <div class="log-scroll" id="agentScroll">
        <div class="log" id="agentLog" role="log" aria-live="polite"></div>
      </div>

      <div class="agent-banner info" id="agentBanner" hidden></div>

      <form class="composer" id="agentForm" autocomplete="off">
        <div class="composer-in">
          <div class="login-bar" id="agentLogin" hidden>
            <span>Войдите в аккаунт, чтобы задать вопрос агенту — ваши чаты сохранятся в аккаунте.</span>
            <button type="button" class="btn small primary" id="agentLoginBtn">Войти</button>
          </div>
          <div class="compose-row">
            <textarea id="agentInput" rows="1" maxlength="4000" aria-label="Ваш вопрос" placeholder="Спросите что угодно о математике…"></textarea>
            <button type="submit" class="round" id="agentSend" aria-label="Отправить">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
            <button type="button" class="round stop" id="agentStop" aria-label="Остановить" hidden>
              <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            </button>
          </div>
          <div class="fineprint">Enter — отправить, Shift+Enter — новая строка. Агент может ошибаться — важное перепроверяйте.</div>
        </div>
      </form>
    </section>
  </div>
</main>

<div id="app-footer"></div>

<script>var PAGE_ROOT = '/';</script>
<script src="/assets/js/mathframe-ui.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/common.js"></script>
<script src="/assets/js/ai-agent.js"></script>
</body>
</html>
