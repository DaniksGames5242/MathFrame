			 using the alig attribute, using alignmark attribute in token elements, etc.
			 
			 The restrictions on this transform require <malignmark> and <maligngroup> elements to be outside of
			 any non-grouping mathml elements (that is, mrow and mstyle).  Moreover, these elements cannot be the children of
			 mrows that represent linear fractions or functions.  Also, <malignmark> cannot be a child
			 of token attributes.
			 
			 In the case that the above 
	
	-->
  <xsl:template match="mml:mtable">
    <xsl:variable name="fEqArray">
      <xsl:call-template name="FIsEqArray">
        <xsl:with-param name="ndCur" select="." />
      </xsl:call-template>
    </xsl:variable>
    <xsl:choose>
      <xsl:when test="$fEqArray=1">
        <xsl:element name="m:eqArr">
          <xsl:for-each select="mml:mtr">
            <xsl:element name="m:e">
              <xsl:call-template name="ProcessEqArrayRow">
                <xsl:with-param name="ndCur" select="mml:mtd" />
              </xsl:call-template>
            </xsl:element>
          </xsl:for-each>
        </xsl:element>
      </xsl:when>
      <xsl:otherwise>
        <xsl:variable name="cMaxElmtsInRow">
          <xsl:call-template name="CountMaxElmtsInRow">
            <xsl:with-param name="ndCur" select="*[1]" />
            <xsl:with-param name="cMaxElmtsInRow" select="0" />
          </xsl:call-template>
        </xsl:variable>
        <m:m>
          <m:mPr>
            <m:baseJc m:val="center" />
            <m:plcHide m:val="on" />
            <m:mcs>
              <m:mc>
                <m:mcPr>
                  <m:count>
                    <xsl:attribute name="m:val">
                      <xsl:value-of select="$cMaxElmtsInRow" />
                    </xsl:attribute>
                  </m:count>
                  <m:mcJc m:val="center" />
                </m:mcPr>
              </m:mc>
            </m:mcs>
          </m:mPr>
          <xsl:for-each select="*">
            <xsl:choose>
              <xsl:when test="self::mml:mtr or self::mml:mlabeledtr">
                <m:mr>
                  <xsl:choose>
                    <xsl:when test="self::mml:mtr">
                      <xsl:for-each select="*">
                        <m:e>
                          <xsl:apply-templates select="." />
                        </m:e>
                      </xsl:for-each>
                      <xsl:call-template name="CreateEmptyElmt">
                        <xsl:with-param name="cEmptyMtd" select="$cMaxElmtsInRow - count(*)" />
                      </xsl:call-template>
                    </xsl:when>
                    <xsl:otherwise>
                      <xsl:for-each select="*[position() &gt; 1]">
                        <m:e>
                          <xsl:apply-templates select="." />
                        </m:e>
                      </xsl:for-each>
                      <xsl:call-template name="CreateEmptyElmt">
                        <xsl:with-param name="cEmptyMtd" select="$cMaxElmtsInRow - (count(*) - 1)" />
                      </xsl:call-template>
                    </xsl:otherwise>
                  </xsl:choose>
                </m:mr>
              </xsl:when>
              <xsl:otherwise>
                <m:mr>
                  <m:e>
                    <xsl:apply-templates select="." />
                  </m:e>
                  <xsl:call-template name="CreateEmptyElmt">
                    <xsl:with-param name="cEmptyMtd" select="$cMaxElmtsInRow - 1" />
                  </xsl:call-template>
                </m:mr>
              </xsl:otherwise>
            </xsl:choose>
          </xsl:for-each>
        </m:m>
      </xsl:otherwise>
    </xsl:choose>
  </xsl:template>
  <xsl:template match="m:mtd">
    <xsl:apply-templates select="*" />
  </xsl:template>
  <xsl:template name="CreateEmptyElmt">
    <xsl:param name="cEmptyMtd" />
    <xsl:if test="$cEmptyMtd &gt; 0">
      <m:e></m:e>
      <xsl:call-template name="CreateEmptyElmt">
        <xsl:with-param name="cEmptyMtd" select="$cEmptyMtd - 1" />
      </xsl:call-template>
    </xsl:if>
  </xsl:template>
  <xsl:template name="CountMaxElmtsInRow">
    <xsl:param name="ndCur" />
    <xsl:param name="cMaxElmtsInRow" select="0" />
    <xsl:choose>
      <xsl:when test="not($ndCur)">
        <xsl:value-of select="$cMaxElmtsInRow" />
      </xsl:when>
      <xsl:otherwise>
        <xsl:call-template name="CountMaxElmtsInRow">
          <xsl:with-param name="ndCur" select="$ndCur/following-sibling::*[1]" />
          <xsl:with-param name="cMaxElmtsInRow">
            <xsl:choose>
              <xsl:when test="local-name($ndCur) = 'mlabeledtr' and 
								            namespace-uri($ndCur) = 'http://www.w3.org/1998/Math/MathML'">
                <xsl:choose>
                  <xsl:when test="(count($ndCur/*) - 1) &gt; $cMaxElmtsInRow">
                    <xsl:value-of select="count($ndCur/*) - 1" />
                  </xsl:when>
                  <xsl:otherwise>
                    <xsl:value-of select="$cMaxElmtsInRow" />
                  </xsl:otherwise>
                </xsl:choose>
              </xsl:when>
              <xsl:when test="local-name($ndCur) = 'mtr' and 
								            namespace-uri($ndCur) = 'http://www.w3.org/1998/Math/MathML'">
                <xsl:choose>
                  <xsl:when test="count($ndCur/*) &gt; $cMaxElmtsInRow">
                    <xsl:value-of select="count($ndCur/*)" />
                  </xsl:when>
                  <xsl:otherwise>
                    <xsl:value-of select="$cMaxElmtsInRow" />
                  </xsl:otherwise>
                </xsl:choose>
              </xsl:when>
              <xsl:otherwise>
                <xsl:choose>
                  <xsl:when test="1 &gt; $cMaxElmtsInRow">
                    <xsl:value-of select="1" />
                  </xsl:when>
                  <xsl:otherwise>
                    <xsl:value-of select="$cMaxElmtsInRow" />
                  </xsl:otherwise>
                </xsl:choose>
              </xsl:otherwise>
            </xsl:choose>
          </xsl:with-param>
        </xsl:call-template>
      </xsl:otherwise>
    </xsl:choose>
  </xsl:template>

  <xsl:template name="GetMglyphAltText">
    <xsl:param name="ndCur" select="." />
    <xsl:choose>
      <xsl:when test="$ndCur/@alt">
        <xsl:value-of select="normalize-space($ndCur/@alt)"/>
      </xsl:when>
      <xsl:otherwise>
        <xsl:value-of select="normalize-space($ndCur/@mml:alt)"/>
      </xsl:otherwise>
    </xsl:choose>
  </xsl:template>

  <xsl:template match="mml:mglyph">
    <xsl:element name="m:r">
      <xsl:element name="m:rPr">
        <xsl:element name="m:nor" />
      </xsl:element>
      <xsl:element name="m:t">
        <xsl:call-template name="OutputText">
          <xsl:with-param name="sInput">
            <xsl:call-template name="GetMglyphAltText">
              <xsl:with-param name="ndCur" select="." />
            </xsl:call-template>
          </xsl:with-param>
        </xsl:call-template>
      </xsl:element>
    </xsl:element>
  </xsl:template>

  <!-- Omml doesn't really support mglyph, so just output the alt text -->
  <xsl:template match="mml:mi[child::mml:mglyph] | 
	                     mml:mn[child::mml:mglyph] | 
	                     mml:mo[child::mml:mglyph] | 
	                     mml:ms[child::mml:mglyph] | 
	                     mml:mtext[child::mml:mglyph]">
    <xsl:variable name="mathvariant">
      <xsl:choose>
        <xsl:when test="@mathvariant">
          <xsl:value-of select="@mathvariant"/>
        </xsl:when>
        <xsl:otherwise>
          <xsl:value-of select="@mml:mathvariant"/>
        </xsl:otherwise>
      </xsl:choose>
    </xsl:variable>
    <xsl:variable name="fontstyle">
      <xsl:choose>
        <xsl:when test="@fontstyle">
          <xsl:value-of select="@fontstyle"/>
        </xsl:when>
        <xsl:otherwise>
          <xsl:value-of select="@mml:fontstyle"/>
        </xsl:otherwise>
      </xsl:choose>
    </xsl:variable>
    <xsl:variable name="fontweight">
      <xsl:choose>
        <xsl:when test="@fontweight">
          <xsl:value-of select="@fontweight"/>
        </xsl:when>
        <xsl:otherwise>
          <xsl:value-of select="@mml:fontweight"/>
        </xsl:otherwise>
      </xsl:choose>
    </xsl:variable>
    <xsl:variable name="mathcolor">
      <xsl:choose>
        <xsl:when test="@mathcolor">
          <xsl:value-of select="@mathcolor"/>
        </xsl:when>
        <xsl:otherwise>
          <xsl:value-of select="@mml:mathcolor"/>
        </xsl:otherwise>
      </xsl:choose>
    </xsl:variable>
    <xsl:variable name="mathsize">
      <xsl:choose>
        <xsl:when test="@mathsize">
          <xsl:value-of select="@mathsize"/>
        </xsl:when>
        <xsl:otherwise>
          <xsl:value-of select="@mml:mathsize"/>
        </xsl:otherwise>
      </xsl:choose>
    </xsl:variable>
    <xsl:variable name="color">
      <xsl:choose>
        <xsl:when test="@color">
          <xsl:value-of select="@color"/>
        </xsl:when>
        <xsl:otherwise>
          <xsl:value-of select="@mml:color"/>
        </xsl:otherwise>
      </xsl:choose>
    </xsl:variable>
    <xsl:variable name="fontsize">
      <xsl:choose>
        <xsl:when test="@fontsize">
          <xsl:value-of select="@fontsize"/>
        </xsl:when>
        <xsl:otherwise>
          <xsl:value-of select="@mml:fontsize"/>
        </xsl:otherwise>
      </xsl:choose>
    </xsl:variable>
    <xsl:variable name="fNor">
      <xsl:call-template name="FNor">
        <xsl:with-param name="ndCur" select="." />
      </xsl:call-template>
    </xsl:variable>

    <!-- Output MS Left Quote (if need be) -->
    <xsl:if test="self::mml:ms">
      <xsl:variable name="chLquote">
        <xsl:call-template name="LQuoteFromMs">
          <xsl:with-param name="curMs" select="." />
        </xsl:call-template>
      </xsl:variable>
      <xsl:element name="m:r">
        <xsl:call-template name="CreateRunProp">
          <xsl:with-param name="mathvariant" select="$mathvariant" />
          <xsl:with-param name="fontstyle" select="$fontstyle" />
          <xsl:with-param name="fontweight" select="$fontweight" />
          <xsl:with-param name="mathcolor" select="$mathcolor" />
          <xsl:with-param name="mathsize" select="$mathsize" />
          <xsl:with-param name="color" select="$color" />
          <xsl:with-param name="fontsize" select="$fontsize" />
          <xsl:with-param name="fNor" select="$fNor" />
          <xsl:with-param name="ndCur" select="." />
        </xsl:call-template>
        <xsl:element name="m:t">
          <xsl:call-template name="OutputText">
            <xsl:with-param name="sInput" select="$chLquote"/>
          </xsl:call-template>
        </xsl:element>
      </xsl:element>
    </xsl:if>
    <xsl:for-each select="mml:mglyph | text()">
      <xsl:variable name="fForceNor">
        <xsl:choose>
          <xsl:when test="self::mml:mglyph">1</xsl:when>
          <xsl:otherwise>0</xsl:otherwise>
        </xsl:choose>
      </xsl:variable>

      <xsl:variable name="str">
        <xsl:choose>
          <xsl:when test="self::mml:mglyph">
            <xsl:call-template name="GetMglyphAltText">
              <xsl:with-param name="ndCur" select="." />
            </xsl:call-template>
          </xsl:when>
          <xsl:otherwise>
            <xsl:value-of select="normalize-space(.)"/>
          </xsl:otherwise>
        </xsl:choose>
      </xsl:variable>
      <xsl:if test="string-length($str) &gt; 0">
        <xsl:element name="m:r">
          <xsl:call-template name="CreateRunProp">
            <xsl:with-param name="mathvariant" select="$mathvariant" />
            <xsl:with-param name="fontstyle" select="$fontstyle" />
            <xsl:with-param name="fontweight" select="$fontweight" />
            <xsl:with-param name="mathcolor" select="$mathcolor" />
            <xsl:with-param name="mathsize" select="$mathsize" />
            <xsl:with-param name="color" select="$color" />
            <xsl:with-param name="fontsize" select="$fontsize" />
            <xsl:with-param name="fNor">
              <xsl:choose>
                <xsl:when test="$fForceNor=1">1</xsl:when>
                <xsl:otherwise>
                  <xsl:value-of select="$fNor"/>
                </xsl:otherwise>
              </xsl:choose>
            </xsl:with-param>
            <xsl:with-param name="ndCur" select="." />
          </xsl:call-template>
          <xsl:element name="m:t">
            <xsl:call-template name="OutputText">
              <xsl:with-param name="sInput" select="$str"/>
            </xsl:call-template>
          </xsl:element>
        </xsl:element>
      </xsl:if>
    </xsl:for-each>

    <!-- Output MS Right Quote (if need be) -->
    <xsl:if test="self::mml:ms">
      <xsl:variable name="chRquote">
        <xsl:call-template name="RQuoteFromMs">
          <xsl:with-param name="curMs" select="." />
        </xsl:call-template>
      </xsl:variable>
      <xsl:element name="m:r">
        <xsl:call-template name="CreateRunProp">
          <xsl:with-param name="mathvariant" select="$mathvariant" />
          <xsl:with-param name="fontstyle" select="$fontstyle" />
          <xsl:with-param name="fontweight" select="$fontweight" />
          <xsl:with-param name="mathcolor" select="$mathcolor" />
          <xsl:with-param name="mathsize" select="$mathsize" />
          <xsl:with-param name="color" select="$color" />
          <xsl:with-param name="fontsize" select="$fontsize" />
          <xsl:with-param name="fNor" select="$fNor" />
          <xsl:with-param name="ndCur" select="." />
        </xsl:call-template>
        <xsl:element name="m:t">
          <xsl:call-template name="OutputText">
            <xsl:with-param name="sInput" select="$chRquote"/>
          </xsl:call-template>
        </xsl:element>
      </xsl:element>
    </xsl:if>
  </xsl:template>

  <xsl:template name="FStrContainsNonZeroDigit">
    <xsl:param name="s" />

    <!-- Translate any nonzero digit into a 9 -->
    <xsl:variable name="sNonZeroDigitsToNineDigit" select="translate($s, '12345678', '99999999')" />
    <xsl:choose>
      <!-- Search for 9s -->
      <xsl:when test="contains($sNonZeroDigitsToNineDigit, '9')">1</xsl:when>
      <xsl:otherwise>0</xsl:otherwise>
    </xsl:choose>
  </xsl:template>

  <xsl:template name="FStrContainsDigits">
    <xsl:param name="s" />

    <!-- Translate any digit into a 0 -->
    <xsl:variable name="sDigitsToZeroDigit" select="translate($s, '123456789', '000000000')" />
    <xsl:choose>
      <!-- Search for 0s -->
      <xsl:when test="contains($sDigitsToZeroDigit, '0')">1</xsl:when>
      <xsl:otherwise>0</xsl:otherwise>
    </xsl:choose>
  </xsl:template>


  <!-- Used to determine if mpadded attribute {width, height, depth } 
       indicates to show everything. 
       
       Unlike mathml, whose mpadded structure has great flexibility in modifying the 
       bounding box's width, height, and depth, Word can only have zero or full width, height, and depth.
       Thus, if the width, height, or depth attributes indicate any kind of nonzero width, height, 
       or depth, we'll translate that into a show full width, height, or depth for OMML.  Only if the attribute
       indicates a zero width, height, or depth, will we report back FFull as false.
       
       Example:  s=0%    ->  FFull returns 0.
                 s=2%    ->  FFull returns 1.
                 s=0.1em ->  FFull returns 1.     
       
       -->
  <xsl:template name="FFull">
    <xsl:param name="s" />

    <xsl:variable name="fStrContainsNonZeroDigit">
      <xsl:call-template name="FStrContainsNonZeroDigit">
        <xsl:with-param name="s" select="$s" />
      </xsl:call-template>
    </xsl:variable>

    <xsl:variable name="fStrContainsDigits">
      <xsl:call-template name="FStrContainsDigits">
        <xsl:with-param name="s" select="$s" />
      </xsl:call-template>
    </xsl:variable>

    <xsl:choose>
      <!-- String contained non-zero digit -->
      <xsl:when test="$fStrContainsNonZeroDigit=1">1</xsl:when>
      <!-- String didn't contain a non-zero digit, but it did contain digits.
           This must mean that all digits in the string were 0s. -->
      <xsl:when test="$fStrContainsDigits=1">0</xsl:when>
      <!-- Else, no digits, therefore, return true.
           We return true in the otherwise condition to take account for the possibility
           in MathML to say something like width="height". -->
      <xsl:otherwise>1</xsl:otherwise>
    </xsl:choose>
  </xsl:template>


  <!-- Just outputs phant properties, doesn't do any fancy 
       thinking of its own, just obeys the defaults of 
       phants. -->
  <xsl:template name="CreatePhantPropertiesCore">
    <xsl:param name="fShow" select="1" />
    <xsl:param name="fFullWidth" select="1" />
    <xsl:param name="fFullHeight" select="1" />
    <xsl:param name="fFullDepth" select="1" />

    <xsl:if test="$fShow=0 
                    or $fFullWidth=0 
                    or $fFullHeight=0
                    or $fFullDepth=0">
      <xsl:element name="m:phantPr">
        <xsl:if test="$fShow=0">
          <xsl:element name="m:show">
            <xsl:attribute name="m:val">off</xsl:attribute>
          </xsl:element>
        </xsl:if>
        <xsl:if test="$fFullWidth=0">
          <xsl:element name="m:zeroWid">
            <xsl:attribute name="m:val">on</xsl:attribute>
          </xsl:element>
        </xsl:if>
        <xsl:if test="$fFullHeight=0">
          <xsl:element name="m:zeroAsc">
            <xsl:attribute name="m:val">on</xsl:attribute>
          </xsl:element>
        </xsl:if>
        <xsl:if test="$fFullDepth=0">
          <xsl:element name="m:zeroDesc">
            <xsl:attribute name="m:val">on</xsl:attribute>
          </xsl:element>
        </xsl:if>
      </xsl:element>
    </xsl:if>
  </xsl:template>

  <!-- Figures out if we should factor in width, height, and depth attributes.  
  
       If so, then it 
       gets these attributes, does some processing to figure out what the attributes indicate, 
       then passes these indications to CreatePhantPropertiesCore.  
       
       If we aren't supposed to factor in width, height, or depth, then we'll just output the show
       attribute. -->
  <xsl:template name="CreatePhantProperties">
    <xsl:param name="ndCur" select="." />
    <xsl:param name="fShow" select="1"/>

    <xsl:choose>
      <!-- In the special case that we have an mphantom with one child which is an mpadded, then we should 
           subsume the mpadded attributes into the mphantom attributes.  The test statement below imples the 
           'one child which is an mpadded'.  The first part, that the parent of mpadded is an mphantom, is implied
           by being in this template, which is only called when we've encountered an mphantom.
           
           Word outputs its invisible phantoms with smashing as 

              <mml:mphantom>
                <mml:mpadded . . . >
                  
                </mml:mpadded>
              </mml:mphantom>

            This test is used to allow roundtripping smashed invisible phantoms. -->
      <xsl:when test="count($ndCur/child::*)=1 and count($ndCur/mml:mpadded)=1">
        <xsl:variable name="sLowerCaseWidth">
          <xsl:choose>
            <xsl:when test="$ndCur/mml:mpadded/@width">
              <xsl:value-of select="translate($ndCur/mml:mpadded/@width, $StrUCAlphabet, $StrLCAlphabet)"/>
            </xsl:when>
            <xsl:otherwise>
              <xsl:value-of select="translate($ndCur/mml:mpadded/@mml:width, $StrUCAlphabet, $StrLCAlphabet)"/>
            </xsl:otherwise>
          </xsl:choose>
        </xsl:variable>
        <xsl:variable name="sLowerCaseHeight">
          <xsl:choose>
            <xsl:when test="$ndCur/mml:mpadded/@height">
              <xsl:value-of select="translate($ndCur/mml:mpadded/@height, $StrUCAlphabet, $StrLCAlphabet)"/>
            </xsl:when>
            <xsl:otherwise>
              <xsl:value-of select="translate($ndCur/mml:mpadded/@mml:height, $StrUCAlphabet, $StrLCAlphabet)"/>
            </xsl:otherwise>
          </xsl:choose>
        </xsl:variable>
        <xsl:variable name="sLowerCaseDepth">
          <xsl:choose>
            <xsl:when test="$ndCur/mml:mpadded/@depth">
              <xsl:value-of select="translate($ndCur/mml:mpadded/@depth, $StrUCAlphabet, $StrLCAlphabet)"/>
            </xsl:when>
            <xsl:otherwise>
              <xsl:value-of select="translate($ndCur/mml:mpadded/@mml:depth, $StrUCAlphabet, $StrLCAlphabet)"/>
            </xsl:otherwise>
          </xsl:choose>
        </xsl:variable>

        <xsl:variable name="fFullWidth">
          <xsl:call-template name="FFull">
            <xsl:with-param name="s" select="$sLowerCaseWidth" />
          </xsl:call-template>
        </xsl:variable>
        <xsl:variable name="fFullHeight">
          <xsl:call-template name="FFull">
            <xsl:with-param name="s" select="$sLowerCaseHeight" />
          </xsl:call-template>
        </xsl:variable>
        <xsl:variable name="fFullDepth">
          <xsl:call-template name="FFull">
            <xsl:with-param name="s" select="$sLowerCaseDepth" />
          </xsl:call-template>
        </xsl:variable>

        <xsl:call-template name="CreatePhantPropertiesCore">
          <xsl:with-param name="fShow" select="$fShow"/>
          <xsl:with-param name="fFullWidth" select="$fFullWidth" />
          <xsl:with-param name="fFullHeight" select="$fFullHeight" />
          <xsl:with-param name="fFullDepth" select="$fFullDepth" />
        </xsl:call-template>
      </xsl:when>
      <xsl:otherwise>
        <xsl:call-template name="CreatePhantPropertiesCore">
          <xsl:with-param name="fShow" select="$fShow"/>
        </xsl:call-template>
      </xsl:otherwise>
    </xsl:choose>
  </xsl:template>

  <xsl:template match="mml:mpadded">
    <xsl:choose>
      <xsl:when test="count(parent::mml:mphantom)=1 and count(preceding-sibling::*)=0 and count(following-sibling::*)=0">
        <!-- This mpadded is inside an mphantom that has already setup phantom attributes, therefore, just apply templates -->
        <xsl:apply-templates select="*" />
      </xsl:when>
      <xsl:otherwise>
        <xsl:variable name="sLowerCaseWidth">
          <xsl:choose>
            <xsl:when test="@width">
              <xsl:value-of select="@width"/>
            </xsl:when>
            <xsl:otherwise>
              <xsl:value-of select="@mml:width"/>
            </xsl:otherwise>
          </xsl:choose>
        </xsl:variable>
        <xsl:variable name="sLowerCaseHeight">
          <xsl:choose>
            <xsl:when test="@height">
              <xsl:value-of select="@height"/>
            </xsl:when>
            <xsl:otherwise>
              <xsl:value-of select="@mml:height"/>
            </xsl:otherwise>
          </xsl:choose>
        </xsl:variable>
        <xsl:variable name="sLowerCaseDepth">
          <xsl:choose>
            <xsl:when test="@depth">
              <xsl:value-of select="@depth"/>
            </xsl:when>
            <xsl:otherwise>
              <xsl:value-of select="@mml:depth"/>
            </xsl:otherwise>
          </xsl:choose>
        </xsl:variable>

        <xsl:variable name="fFullWidth">
          <xsl:call-template name="FFull">
            <xsl:with-param name="s" select="$sLowerCaseWidth" />
          </xsl:call-template>
        </xsl:variable>
        <xsl:variable name="fFullHeight">
          <xsl:call-template name="FFull">
            <xsl:with-param name="s" select="$sLowerCaseHeight" />
          </xsl:call-template>
        </xsl:variable>
        <xsl:variable name="fFullDepth">
          <xsl:call-template name="FFull">
            <xsl:with-param name="s" select="$sLowerCaseDepth" />
          </xsl:call-template>
        </xsl:variable>

        <xsl:element name="m:phant">
          <xsl:call-template name="CreatePhantPropertiesCore">
            <xsl:with-param name="fShow" select="1"/>
            <xsl:with-param name="fFullWidth" select="$fFullWidth" />
            <xsl:with-param name="fFullHeight" select="$fFullHeight" />
            <xsl:with-param name="fFullDepth" select="$fFullDepth" />
          </xsl:call-template>
          <m:e>
            <xsl:apply-templates select="*" />
          </m:e>
        </xsl:element>
      </xsl:otherwise>
    </xsl:choose>
  </xsl:template>

  <xsl:template match="mml:mphantom">
    <xsl:element name="m:phant">
      <xsl:call-template name="CreatePhantProperties">
        <xsl:with-param name="ndCur" select="." />
        <xsl:with-param name="fShow" select="0" />
      </xsl:call-template>
      <m:e>
        <xsl:apply-templates select="*" />
      </m:e>
    </xsl:element>
  </xsl:template>

  <xsl:template name="isNaryOper">
    <xsl:param name="sNdCur" />
    <xsl:value-of select="($sNdCur = '&#x222B;' 
                            or $sNdCur = '&#x222C;' 
                            or $sNdCur = '&#x222D;' 
                            or $sNdCur = '&#x222E;' 
                            or $sNdCur = '&#x222F;' 
                            or $sNdCur = '&#x2230;' 
                            or $sNdCur = '&#x2232;' 
                            or $sNdCur = '&#x2233;' 
                            or $sNdCur = '&#x2231;' 
                            or $sNdCur = '&#x2229;' 
                            or $sNdCur = '&#x222A;' 
                            or $sNdCur = '&#x220F;' 
                            or $sNdCur = '&#x2210;' 
                            or $sNdCur = '&#x2211;' 
                            or $sNdCur = '&#x22C0;' 
                            or $sNdCur = '&#x22C1;' 
                            or $sNdCur = '&#x22C2;' 
                            or $sNdCur = '&#x22C3;')" />
  </xsl:template>


  <xsl:template name="isNary">
    <!-- ndCur is the element around the nAry operator -->
    <xsl:param name="ndCur" />
    <xsl:variable name="sNdCur">
      <xsl:value-of select="normalize-space($ndCur)" />
    </xsl:variable>

    <xsl:variable name="fNaryOper">
      <xsl:call-template name="isNaryOper">
        <xsl:with-param name="sNdCur" select="$sNdCur" />
      </xsl:call-template>
    </xsl:variable>

    <!-- Narys shouldn't be MathML accents.  -->
    <xsl:variable name="fUnder">
      <xsl:choose>
        <xsl:when test="$ndCur/parent::*[self::mml:munder]">1</xsl:when>
        <xsl:otherwise>0</xsl:otherwise>
      </xsl:choose>
    </xsl:variable>

    <xsl:variable name="sLowerCaseAccent">
      <xsl:choose>
        <xsl:when test="$fUnder=1">
          <xsl:choose>
            <xsl:when test="$ndCur/parent::*[self::mml:munder]/@accentunder">
              <xsl:value-of select="translate($ndCur/parent::*[self::mml:munder]/@accentunder, $StrUCAlphabet, $StrLCAlphabet)"/>
            </xsl:when>
            <xsl:otherwise>
              <xsl:value-of select="translate($ndCur/parent::*[self::mml:munder]/@mml:accentunder, $StrUCAlphabet, $StrLCAlphabet)"/>
            </xsl:otherwise>
          </xsl:choose>
        </xsl:when>
        <xsl:otherwise>
          <xsl:choose>
            <xsl:when test="$ndCur/parent::*/@accent">
              <xsl:value-of select="translate($ndCur/parent::*/@accent, $StrUCAlphabet, $StrLCAlphabet)"/>
            </xsl:when>
            <xsl:otherwise>
              <xsl:value-of select="translate($ndCur/parent::*/@mml:accent, $StrUCAlphabet, $StrLCAlphabet)"/>
            </xsl:otherwise>
          </xsl:choose>
        </xsl:otherwise>
      </xsl:choose>
    </xsl:variable>

    <xsl:variable name="fAccent">
      <xsl:choose>
        <xsl:when test="$sLowerCaseAccent='true'">1</xsl:when>
        <xsl:otherwise>0</xsl:otherwise>
      </xsl:choose>
    </xsl:variable>

    <xsl:choose>
      <!-- This ndCur is in fact part of an nAry if
      
           1)  The last descendant of ndCur (which could be ndCur itself) is an operator.
           2)  Along that chain of descendants we only encounter mml:mo, mml:mstyle, and mml:mrow elements.
           3)  the operator in mml:mo is a valid nAry operator
           4)  The nAry is not accented.
           -->
      <xsl:when test="$fNaryOper = 'true'
                      and $fAccent=0
                      and $ndCur/descendant-or-self::*[last()]/self::mml:mo
                      and not($ndCur/descendant-or-self::*[not(self::mml:mo or 
			                                                     self::mml:mstyle or 
			                                                     self::mml:mrow)])">
        <xsl:value-of select="true()" />
      </xsl:when>
      <xsl:otherwise>
        <xsl:value-of select="false()" />
      </xsl:otherwise>
    </xsl:choose>
  </xsl:template>

  <xsl:template name="CreateNaryProp">
    <xsl:param name="chr" />
    <xsl:param name="sMathmlType" />
    <xsl:param name="sGrow">
      <xsl:choose>
        <xsl:when test="child::*[1]/@stretchy">
          <xsl:value-of select="translate(child::*[1]/@stretchy, $StrUCAlphabet, $StrLCAlphabet)"/>
        </xsl:when>
        <xsl:otherwise>
          <xsl:value-of select="translate(child::*[1]/@mml:stretchy, $StrUCAlphabet, $StrLCAlphabet)"/>
        </xsl:otherwise>
      </xsl:choose>
    </xsl:param>
    <m:naryPr>
      <m:chr>
        <xsl:attribute name="m:val">
          <xsl:value-of select="$chr" />
        </xsl:attribute>
      </m:chr>
      <m:limLoc>
        <xsl:attribute name="m:val">
          <xsl:choose>
            <xsl:when test="$sMathmlType='munder' or 
									$sMathmlType='mover' or 
									$sMathmlType='munderover'">
              <xsl:text>undOvr</xsl:text>
            </xsl:when>
            <xsl:when test="$sMathmlType='msub' or
					                $sMathmlType='msup' or
					                $sMathmlType='msubsup'">
              <xsl:text>subSup</xsl:text>
            </xsl:when>
          </xsl:choose>
        </xsl:attribute>
      </m:limLoc>
      <m:grow>
        <xsl:attribute name="m:val">
          <xsl:choose>
            <xsl:when test="$sGrow='true'">1</xsl:when>
            <xsl:when test="$sGrow='false'">0</xsl:when>
            <xsl:when test="$chr='&#x222B;' 
                            or $chr='&#x222E;' 
                            or $chr='&#x222F;' 
                            or $chr='&#x2232;' 
                            or $chr='&#x2233;'
                            or $chr='&#x2229;'
                            or $chr='&#x222A;' 
                            or $chr='&#x220F;' 
                            or $chr='&#x2211;' 
                            or $chr='&#x22C0;'
                            or $chr='&#x22C1;' 
                            or $chr='&#x22C2;'
                            or $chr='&#x22C3;'">1</xsl:when>
            <xsl:otherwise>0</xsl:otherwise>
          </xsl:choose>
        </xsl:attribute>
      </m:grow>
      <m:subHide>
        <xsl:attribute name="m:val">
          <xsl:choose>
            <xsl:when test="$sMathmlType='mover' or
						                $sMathmlType='msup'">
              <xsl:text>on</xsl:text>
            </xsl:when>
            <xsl:otherwise>
              <xsl:text>off</xsl:text>
            </xsl:otherwise>
          </xsl:choose>
        </xsl:attribute>
      </m:subHide>
      <m:supHide>
        <xsl:attribute name="m:val">
          <xsl:choose>
            <xsl:when test="$sMathmlType='munder' or
						                $sMathmlType='msub'">
              <xsl:text>on</xsl:text>
            </xsl:when>
            <xsl:otherwise>
              <xsl:text>off</xsl:text>
            </xsl:otherwise>
          </xsl:choose>
        </xsl:attribute>
      </m:supHide>
    </m:naryPr>
  </xsl:template>
</xsl:stylesheet>
  </script>
</head>

      }

      // ===================================================================
      // UI-обработчики
      // ===================================================================
      function setupUiHandlers() {
        // Гамбургер
        els.menuToggle.addEventListener('click', () => {
          const isOpen = els.sidebar.classList.toggle('open');
          els.menuToggle.classList.toggle('hidden', isOpen);
          els.overlay.classList.toggle('visible', isOpen);
        });
        els.overlay.addEventListener('click', () => {
          els.sidebar.classList.remove('open');
          els.menuToggle.classList.remove('hidden');
          els.overlay.classList.remove('visible');
        });
        window.addEventListener('resize', () => {
          if (window.innerWidth > 900) {
            els.sidebar.classList.remove('open');
            els.menuToggle.classList.remove('hidden');
            els.overlay.classList.remove('visible');
          }
        });

        // Параметры поиска
        let optionsOpen = false;
        els.searchOptionsHeader.addEventListener('click', () => {
          optionsOpen = !optionsOpen;
          els.searchOptionsBody.classList.toggle('open', optionsOpen);
          els.searchOptionsArrow.classList.toggle('open', optionsOpen);
        });

        let searchTimer = null;
        els.searchInput.addEventListener('input', () => {
          els.searchWrap.classList.toggle('has-value', els.searchInput.value.length > 0);
          clearTimeout(searchTimer);
          searchTimer = setTimeout(runSearch, 150);
        });
        els.searchClear.addEventListener('click', () => {
          els.searchInput.value = '';
          els.searchWrap.classList.remove('has-value');
          runSearch();
        });
        els.searchInput.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            if (els.searchList && !els.searchList.hidden) { els.searchList.hidden = true; e.stopPropagation(); }
          }
        });
        document.addEventListener('click', (e) => {
          if (!els.searchList || els.searchList.hidden) return;
          if (e.target.closest('.spr-search-input-wrap')) return;
          els.searchList.hidden = true;
        });
        els.searchInput.addEventListener('focus', () => {
          if (lastQuery && els.searchList && els.searchList.innerHTML) els.searchList.hidden = false;
        });
        [els.optKeywords, els.optDescription, els.optFuzzy].forEach(cb => cb.addEventListener('change', runSearch));
        els.optHighlight.addEventListener('change', () => {
          if (currentId) renderTopic(currentId, { skipScroll: true, noHistory: true });
        });

        els.classFilter.addEventListener('change', () => {
          classFilter = els.classFilter.value;
          renderTree();
          if (currentId) renderTopic(currentId, { skipScroll: true, noHistory: true });
        });
        els.typeFilter.addEventListener('change', () => {
          typeFilter = els.typeFilter.value;
          renderTree();
          if (currentId) renderTopic(currentId, { skipScroll: true, noHistory: true });
        });
        els.sortMode.addEventListener('change', () => {
          sortMode = els.sortMode.value;
          renderTree();
          if (currentId) renderTopic(currentId, { skipScroll: true, noHistory: true });
        });

        const themeObserver2 = new MutationObserver(() => applyThemeToLoader());
        themeObserver2.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
      }

      function closeMobileSidebar() {
        if (window.innerWidth <= 900) {
          els.sidebar.classList.remove('open');
          els.menuToggle.classList.remove('hidden');
          els.overlay.classList.remove('visible');
        }
      }

      // ===================================================================
      // РЕСАЙЗ
      // ===================================================================
      function initResizer() {
        let isResizing = false;
        let startX, startWidth;
        const resizer = els.resizer;
        const sidebar = els.sidebar;

        function onStart(e) {
          const ev = e.touches ? e.touches[0] : e;
          isResizing = true;
          startX = ev.clientX;
          startWidth = sidebar.getBoundingClientRect().width;
          resizer.classList.add('active');
          document.body.style.cursor = 'col-resize';
          document.body.style.userSelect = 'none';
          e.preventDefault();
        }

        function onMove(e) {
          if (!isResizing) return;
          const ev = e.touches ? e.touches[0] : e;
          const delta = ev.clientX - startX;
          let newWidth = Math.min(
            Math.max(startWidth + delta, parseInt(getComputedStyle(document.documentElement).getPropertyValue('--spr-sidebar-min-width'))),
            parseInt(getComputedStyle(document.documentElement).getPropertyValue('--spr-sidebar-max-width'))
          );
          document.documentElement.style.setProperty('--spr-sidebar-width', newWidth + 'px');
          localStorage.setItem('spr-sidebar-width', String(newWidth));
          e.preventDefault();
        }

        function onEnd() {
          if (isResizing) {
            isResizing = false;
            resizer.classList.remove('active');
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
          }
        }

        resizer.addEventListener('mousedown', onStart);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);
        resizer.addEventListener('touchstart', onStart);
        window.addEventListener('touchmove', onMove);
        window.addEventListener('touchend', onEnd);
      }

      function restoreSidebarWidth() {
        const saved = localStorage.getItem('spr-sidebar-width');
        if (saved) {
          const w = parseInt(saved);
          const min = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--spr-sidebar-min-width'));
          const max = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--spr-sidebar-max-width'));
          if (w >= min && w <= max) {
            document.documentElement.style.setProperty('--spr-sidebar-width', w + 'px');
          }
        }
      }

      // ===================================================================
      // КОНФИГ
      // ===================================================================
      // Быстрая первая загрузка: /api/topics отдаёт темы БЕЗ описаний (~100 КБ вместо ~3 МБ в gzip).
      // Описание открываемой темы подгружается по месту (ensureDescription), весь config.json с описаниями —
      // только когда он нужен: поиск по тексту, выгрузка, сохранение (ensureAllDescriptions). Если /api/topics
      // недоступен (локальный просмотр без функций) — грузится полный config.json, как раньше.
      let descriptionsPartial = false;
      let fullLoadPromise = null;
      const descPromises = new Map();

      async function fetchFullConfig() {
        const res = await fetch(CONFIG_URL, { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (!Array.isArray(data)) throw new Error('config.json должен содержать массив тем');
        return data;
      }

      async function loadConfig() {
        try {
          const res = await fetch('/api/topics');
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data) && data.length) { descriptionsPartial = true; return data; }
          }
        } catch (e) { /* функции недоступны — полный файл ниже */ }
        return fetchFullConfig();
      }

      function needsDescription(topic) { return descriptionsPartial && topic && topic.description === undefined; }

      // Английский язык (настройки → Язык): описание темы переводит нейросеть (assets/js/i18n.js › translateHtml),
      // перевод кладётся в отдельное поле descEn и НИКОГДА не попадает в config.json (описания там русские).
      // i18n.js подключается позже страницы — язык проверяем при каждом обращении
      const isEn = () => window.MF_LANG === 'en' && !!window.MF_i18n;
      function descOf(topic) { return (isEn() && topic.descEn) || topic.description || ''; }
      function ensureEnglish(topic) {
        if (!isEn() || !topic || topic.descEn || !topic.description) return Promise.resolve(false);
        if (!topic.__trP) topic.__trP = window.MF_i18n.translateHtml(topic.description).then(h => { topic.descEn = h; const ok = h !== topic.description; if (!ok) document.querySelectorAll('.spr-tr-note').forEach(n => n.remove()); return ok; });
        return topic.__trP;
      }

      function ensureDescription(topic) {
        if (!needsDescription(topic)) return Promise.resolve();
        if (!descPromises.has(topic.id)) {
          descPromises.set(topic.id, fetch('/api/topics?id=' + encodeURIComponent(topic.id))
            .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
            .then(d => { if (topic.description === undefined) topic.description = d.description || ''; })
            .catch(() => ensureAllDescriptions())
            .finally(() => descPromises.delete(topic.id)));
        }
        return descPromises.get(topic.id);
      }

      function ensureAllDescriptions() {
        if (!descriptionsPartial) return Promise.resolve();
        if (!fullLoadPromise) {
          fullLoadPromise = fetchFullConfig().then(full => {
            for (const f of full) { const t = topicsById.get(f.id); if (t && t.description === undefined) t.description = f.description || ''; }
            descriptionsPartial = false;
          }).catch(e => { fullLoadPromise = null; throw e; });
        }
        return fullLoadPromise;
      }

      function buildIndexes(list) {
        topics = list;
        topicsById.clear();
        childrenOf.clear();
        for (const t of list) {
          topicsById.set(t.id, t);
          if (!t.class) t.class = 'other';
          if (t.difficulty === undefined) t.difficulty = 3;
          if (!t.type) t.type = 'topic';
        }
        for (const t of list) {
          const key = t.parent || '__root__';
          if (!childrenOf.has(key)) childrenOf.set(key, []);
          childrenOf.get(key).push(t.id);
        }
        const classes = new Set();
        for (const t of list) {
          if (t.class) classes.add(t.class);
        }
        const sel = els.classFilter;
        if (sel) {
          const current = sel.value;
          sel.innerHTML = '<option value="all">Все классы</option>';
          const sorted = Array.from(classes).sort((a, b) => {
            if (a === 'other') return 1;
            if (b === 'other') return -1;
            return parseInt(a) - parseInt(b);
          });
          for (const cls of sorted) {
            const opt = document.createElement('option');
            opt.value = cls;
            opt.textContent = cls === 'other' ? 'Не проходят в школе' : cls + ' класс';
            sel.appendChild(opt);
          }
          if (current && sel.querySelector(`option[value="${current}"]`)) {
            sel.value = current;
            classFilter = current;
          } else {
            sel.value = 'all';
            classFilter = 'all';
          }
        }
      }

      function getChildren(parentId) {
        return childrenOf.get(parentId || '__root__') || [];
      }

      // ===================================================================
      // ФИЛЬТРАЦИЯ И СОРТИРОВКА
      // ===================================================================
      function filterTopic(id) {
        const topic = topicsById.get(id);
        if (!topic) return false;
        if (classFilter !== 'all' && topic.class !== classFilter) {
          const children = getChildren(id);
          for (const childId of children) {
            if (filterTopic(childId)) return true;
          }
          return false;
        }
        if (typeFilter !== 'all' && topic.type !== typeFilter) {
          const children = getChildren(id);
          for (const childId of children) {
            if (filterTopic(childId)) return true;
          }
          return false;
        }
        return true;
      }

      function getFilteredChildren(parentId) {
        const children = getChildren(parentId);
        const filtered = children.filter(id => filterTopic(id));
        return sortChildren(filtered);
      }

      function sortChildren(ids) {
        const mode = sortMode;
        if (mode === 'default') return ids;

        const sorted = [...ids];
        sorted.sort((a, b) => {
          const ta = topicsById.get(a);
          const tb = topicsById.get(b);
          if (!ta || !tb) return 0;

          switch (mode) {
            case 'class-asc':
              if (ta.class === 'other') return 1;
              if (tb.class === 'other') return -1;
              return parseInt(ta.class) - parseInt(tb.class);
            case 'class-desc':
              if (ta.class === 'other') return -1;
              if (tb.class === 'other') return 1;
              return parseInt(tb.class) - parseInt(ta.class);
            case 'alpha-asc':
              return (ta.title || '').localeCompare(tb.title || '', 'ru');
            case 'alpha-desc':
              return (tb.title || '').localeCompare(ta.title || '', 'ru');
            case 'difficulty-asc':
              return (ta.difficulty || 3) - (tb.difficulty || 3);
            case 'difficulty-desc':
              return (tb.difficulty || 3) - (ta.difficulty || 3);
            default:
              return 0;
          }
        });
        return sorted;
      }

      // ===================================================================
      // ИКОНКИ (SVG для папок и тем, PNG для новых типов)
      // ===================================================================
      function getIconForType(type, expandedFlag) {
        // Для папок и обычных тем оставляем SVG
        if (type === 'folder') {
          const commonAttrs = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"';
          return expandedFlag
            ? `<svg ${commonAttrs}><path d="M3 8.2C3 7.32 3.72 6.6 4.6 6.6h4.68c.5 0 .97.24 1.26.65l1 1.4h6.86c.99 0 1.72.93 1.48 1.9l-1.55 6.2a1.6 1.6 0 0 1-1.55 1.21H4.6c-.88 0-1.6-.72-1.6-1.6V8.2Z"/><path d="M3 8.6l1.3 8.86"/></svg>`
            : `<svg ${commonAttrs}><path d="M3 6.6C3 5.72 3.72 5 4.6 5h4.68c.5 0 .97.24 1.26.65l1 1.4h8.06c.88 0 1.6.72 1.6 1.6v9.35c0 .88-.72 1.6-1.6 1.6H4.6c-.88 0-1.6-.72-1.6-1.6V6.6Z"/></svg>`;
        }
        if (type === 'topic') {
          const commonAttrs = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"';
          return `<svg ${commonAttrs}><path d="M6.6 3h7.2l4.2 4.2v13.2a.6.6 0 0 1-.6.6H6.6a.6.6 0 0 1-.6-.6V3.6a.6.6 0 0 1 .6-.6Z"/><path d="M13.8 3v3.6c0 .66.54 1.2 1.2 1.2H18.6"/><path d="M9 13h6M9 16.5h6"/></svg>`;
        }
        // Остальные типы — тоже inline SVG с currentColor (раньше были чёрные PNG,
        // которые сливались с тёмным фоном): цвет берётся из .spr-node-icon и
        // одинаково читается в светлой и тёмной теме, а у активной строки — акцентный.
        const svgAttrs = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
        const docPath = '<path d="M6.6 3h7.2l4.2 4.2v13.2a.6.6 0 0 1-.6.6H6.6a.6.6 0 0 1-.6-.6V3.6a.6.6 0 0 1 .6-.6Z"/><path d="M13.8 3v3.6c0 .66.54 1.2 1.2 1.2H18.6"/>';
        if (type === 'theorem') {
          return `<svg ${svgAttrs}>${docPath}<path d="M9 10.5v6.5h6.5Z"/><path d="M9 14.8h2.2V17"/></svg>`;
        }
        if (type === 'proof') {
          return `<svg ${svgAttrs}>${docPath}<path d="M9 9.5h3"/><circle cx="12" cy="15.2" r="2.7"/><path d="M10.9 15.2l.8.8 1.5-1.6"/></svg>`;
        }
        if (type === 'example') {
          return `<svg ${svgAttrs}><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.46.9 1.04.9 1.7V16h5.4v-.5c0-.66.3-1.24.9-1.7A6 6 0 0 0 12 3Z"/></svg>`;
        }
        // fallback
        return `<svg ${svgAttrs}><circle cx="12" cy="12" r="8"/></svg>`;
      }

      function folderIcon(id, topic) {
        if (topic.type !== 'folder') return getIconForType(topic.type);
        return expanded.has(id) ? getIconForType('folder', true) : getIconForType('folder', false);
      }

      function popIcon(icon) {
        icon.classList.remove('spr-icon-pop');
        void icon.offsetWidth;
        icon.classList.add('spr-icon-pop');
      }

      // ===================================================================
      // ДЕРЕВО
      // ===================================================================
      function renderTree() {
        // Перестройка дерева не должна сбрасывать его прокрутку в начало.
        const prevTreeScroll = els.tree.scrollTop;
        els.tree.innerHTML = '';
        const rootIds = getFilteredChildren(null);
        if (rootIds.length === 0) {
          els.tree.innerHTML = '<p class="spr-search-empty visible">Нет тем, соответствующих фильтру</p>';
          return;
        }
        const ul = buildList(rootIds);
        els.tree.appendChild(ul);
        if (prevTreeScroll) els.tree.scrollTop = prevTreeScroll;

        if (isFirstRender) {
          isFirstRender = false;
          els.tree.querySelectorAll('li').forEach((li, i) => {
            li.style.animationDelay = (i * 0.02) + 's';
          });
        } else {
          els.tree.querySelectorAll('li').forEach(li => li.classList.add('spr-no-anim'));
        }

        applySearchFilterToDom();
        highlightActive();
      }

      function buildList(ids) {
        const ul = document.createElement('ul');
        ids.forEach((id, index) => {
          const topic = topicsById.get(id);
          if (!topic) return;
          const kids = getFilteredChildren(id);
          const li = document.createElement('li');
          li.dataset.id = id;
          li.style.setProperty('--spr-i', index);

          const row = document.createElement('div');
          row.className = 'spr-node-row';
          if (id === currentId) row.classList.add('active');

          const toggleBtn = document.createElement('button');
          toggleBtn.type = 'button';
          toggleBtn.className = 'spr-node-toggle' + (kids.length ? '' : ' no-children');
          toggleBtn.setAttribute('aria-label', 'Развернуть/свернуть');
          toggleBtn.textContent = '▶';
          if (expanded.has(id)) toggleBtn.classList.add('expanded');

          const icon = document.createElement('span');
          icon.className = 'spr-node-icon';
          icon.innerHTML = folderIcon(id, topic);

          const titleBtn = document.createElement('button');
          titleBtn.type = 'button';
          titleBtn.className = 'spr-node-title';
          titleBtn.textContent = topic.title;

          row.addEventListener('click', (e) => {
            if (e.target.closest('.spr-node-toggle')) return;
            navigate(id);
          });

          if (kids.length) {
            toggleBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              const isExpanded = expanded.has(id);
              const childrenWrap = li.querySelector(':scope > .spr-node-children');
              if (!childrenWrap) return;

              if (isExpanded) {
                // Раньше здесь сначала (пока .expanded ещё висит — контейнер в grid-template-rows:1fr,
                // полную высоту) уводили дочерние li в opacity:0 и ждали fadeOutMs, и ТОЛЬКО ПОТОМ
                // снимали .expanded, запуская сжатие высоты (transition 0.42s) — сворачивание
                // выглядело так, будто оно долго "думает", прежде чем реально начать схлопываться.
                // Теперь оба перехода (сжатие высоты и угасание дочерних строк) стартуют
                // ОДНОВРЕМЕННО, как и при разворачивании — так же быстро и отзывчиво.
                childrenWrap.classList.remove('expanding');
                childrenWrap.classList.add('collapsing');
                childrenWrap.classList.remove('expanded');
                toggleBtn.classList.remove('expanded');
                expanded.delete(id);
                if (topic.type === 'folder') { icon.innerHTML = getIconForType('folder', false); popIcon(icon); }
                setTimeout(() => {
                  childrenWrap.classList.remove('collapsing');
                }, 440);
              } else {
                childrenWrap.classList.remove('collapsing');
                childrenWrap.classList.add('expanding');
                toggleBtn.classList.add('expanded');
                expanded.add(id);
                if (topic.type === 'folder') { icon.innerHTML = getIconForType('folder', true); popIcon(icon); }
                void childrenWrap.offsetHeight;
                requestAnimationFrame(() => {
                  childrenWrap.classList.add('expanded');
                  const fadeInMs = 320 + kids.length * 30 + 120;
                  setTimeout(() => {
                    childrenWrap.classList.remove('expanding');
                  }, fadeInMs);
                });
              }
            });
          }

          row.append(toggleBtn, icon, titleBtn);
          li.appendChild(row);

          if (kids.length) {
            const childrenWrap = document.createElement('div');
            childrenWrap.className = 'spr-node-children' + (expanded.has(id) ? ' expanded' : '');
            childrenWrap.appendChild(buildList(kids));
            li.appendChild(childrenWrap);
          }

          ul.appendChild(li);
        });
        return ul;
      }

      function highlightActive() {
        if (currentId) {
          const activeRow = els.tree.querySelector(`li[data-id="${currentId}"] > .spr-node-row`);
          if (activeRow) {
            els.tree.querySelectorAll('.spr-node-row.active').forEach(r => r.classList.remove('active'));
            activeRow.classList.add('active');
            activeRow.classList.remove('spr-active-transition');
            void activeRow.offsetWidth;
            activeRow.classList.add('spr-active-transition');
            setTimeout(() => {
              // При восстановлении после перезагрузки дерево уже прокручено как было.
              if (restoringTreeScroll) return;
              activeRow.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }, 100);
          }
        }
      }

      function expandAncestorsOf(id) {
        let t = topicsById.get(id);
        while (t && t.parent) {
          expanded.add(t.parent);
          t = topicsById.get(t.parent);
        }
      }

      // ===================================================================
      // ПОИСК
      // ===================================================================
      function normalize(s) { return (s || '').toString().toLowerCase(); }
      function stripHtml(html) {
        const div = document.createElement('div');
        div.innerHTML = html || '';
        return div.textContent || '';
      }
      function levenshtein(a, b) {
        const m = a.length, n = b.length;
        if (m === 0) return n;
        if (n === 0) return m;
        const dp = new Array(n + 1);
        for (let j = 0; j <= n; j++) dp[j] = j;
        for (let i = 1; i <= m; i++) {
          let prev = dp[0];
          dp[0] = i;
          for (let j = 1; j <= n; j++) {
            const tmp = dp[j];
            dp[j] = Math.min(dp[j] + 1, dp[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
            prev = tmp;
          }
        }
        return dp[n];
      }
      function fuzzyIncludes(haystack, needle) {
        const h = normalize(haystack);
        const n = normalize(needle);
        if (!n) return true;
        if (h.includes(n)) return true;
        const maxDist = n.length <= 4 ? 1 : Math.floor(n.length / 4) + 1;
        const words = h.split(/[^a-zа-яё0-9ё]+/i).filter(Boolean);
        for (const w of words) {
          if (Math.abs(w.length - n.length) <= maxDist && levenshtein(w, n) <= maxDist) return true;
        }
        return false;
      }
      function simpleIncludes(haystack, needle) { return normalize(haystack).includes(normalize(needle)); }

      function matchesTopic(topic, query, opts) {
        const test = opts.fuzzy ? fuzzyIncludes : simpleIncludes;
        if (test(topic.title, query)) return true;
        if (opts.keywords && topic.keywords && test(topic.keywords, query)) return true;
        if (opts.description && topic.description) {
          if (test(stripHtml(topic.description), query)) return true;
        }
        return false;
      }

      function currentSearchOptions() {
        return {
          keywords: els.optKeywords.checked,
          description: els.optDescription.checked,
          fuzzy: els.optFuzzy.checked,
          highlight: els.optHighlight.checked,
        };
      }

      function runSearch() {
        lastQuery = els.searchInput.value.trim();
        if (lastQuery && els.optDescription.checked && descriptionsPartial) {
          ensureAllDescriptions().then(() => { if (els.searchInput.value.trim() === lastQuery) runSearch(); }).catch(() => {});
        }
        renderTree();
        renderSearchList();
        if (currentId) renderTopic(currentId, { skipScroll: true, noHistory: true });
      }

      // Путь к теме («Алгебра › Уравнения») — подпись под названием в
      // выпадающем списке поиска, чтобы отличать одноимённые темы в разных разделах.
      function topicPathTitle(id) {
        const chain = [];
        let t = topicsById.get(id);
        t = t && t.parent ? topicsById.get(t.parent) : null;
        while (t) { chain.unshift(t.title); t = t.parent ? topicsById.get(t.parent) : null; }
        return chain.join(' › ');
      }

      // Выпадающий список подходящих тем под строкой поиска — как на странице
      // AI-агента (§ выбор темы), вместо одного лишь выделения цветом в дереве.
      function renderSearchList() {
        const list = els.searchList;
        if (!list) return;
        const query = lastQuery;
        if (!query) { list.hidden = true; list.innerHTML = ''; return; }
        const opts = currentSearchOptions();
        const matches = [];
        for (const topic of topicsById.values()) {
          if (topic.type === 'folder') continue;
          if (matchesTopic(topic, query, opts)) {
            matches.push(topic);
            if (matches.length >= 30) break;
          }
        }
        list.innerHTML = '';
        if (!matches.length) {
          const li = document.createElement('li');
          li.className = 'spr-search-list-empty';
          li.textContent = 'Ничего не найдено';
          list.appendChild(li);
          list.hidden = false;
          return;
        }
        matches.forEach(topic => {
          const li = document.createElement('li');
          const btn = document.createElement('button');
          btn.type = 'button';
          const titleSpan = document.createElement('span');
          titleSpan.textContent = topic.title;
          if (opts.highlight) highlightTextInElement(titleSpan, query);
          btn.appendChild(titleSpan);
          const path = topicPathTitle(topic.id);
          if (path) {
            const pathSpan = document.createElement('span');
            pathSpan.className = 'spr-search-list-path';
            pathSpan.textContent = path;
            btn.appendChild(pathSpan);
          }
          btn.addEventListener('click', () => {
            els.searchInput.value = '';
            els.searchWrap.classList.remove('has-value');
            lastQuery = '';
            list.hidden = true; list.innerHTML = '';
            renderTree();
            navigate(topic.id);
          });
          li.appendChild(btn);
          list.appendChild(li);
        });
        list.hidden = false;
      }

      function applySearchFilterToDom() {
        const query = lastQuery;
        els.searchEmpty.classList.remove('visible');
        if (!query) {
          els.tree.querySelectorAll('.spr-node-row').forEach(row => row.classList.remove('search-dim', 'search-match'));
          return;
        }
        const opts = currentSearchOptions();
        const matchedIds = new Set();
        const ancestorIds = new Set();
        const visibleIds = new Set();
        function collectVisible(parentId) {
          const children = getFilteredChildren(parentId);
          for (const id of children) {
            visibleIds.add(id);
            collectVisible(id);
          }
        }
        collectVisible(null);

        for (const id of visibleIds) {
          const t = topicsById.get(id);
          if (t && matchesTopic(t, query, opts)) {
            matchedIds.add(id);
            let p = t.parent;
            while (p) { ancestorIds.add(p); p = topicsById.get(p) ? topicsById.get(p).parent : null; }
          }
        }
        if (matchedIds.size === 0) els.searchEmpty.classList.add('visible');
        ancestorIds.forEach(id => expanded.add(id));
        els.tree.querySelectorAll('li[data-id]').forEach(li => {
          const id = li.dataset.id;
          const row = li.querySelector(':scope > .spr-node-row');
          if (!row) return;
          const toggle = row.querySelector('.spr-node-toggle');
          const childrenWrap = li.querySelector(':scope > .spr-node-children');
          if (ancestorIds.has(id) && childrenWrap) {
            childrenWrap.classList.add('expanded');
            if (toggle) toggle.classList.add('expanded');
            const iconEl = row.querySelector('.spr-node-icon');
            const t = topicsById.get(id);
            if (iconEl && t && t.type === 'folder') iconEl.innerHTML = getIconForType('folder', true);
          }
          if (matchedIds.has(id)) {
            row.classList.add('search-match');
            row.classList.remove('search-dim');
            if (opts.highlight) {
              const titleBtn = row.querySelector('.spr-node-title');
              highlightTextInElement(titleBtn, query);
            }
          } else if (ancestorIds.has(id)) {
            row.classList.remove('search-dim', 'search-match');
          } else {
            row.classList.add('search-dim');
            row.classList.remove('search-match');
          }
        });
      }

      function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
      function walkTextNodes(root, cb) {
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
        const nodes = [];
        let n;
        while ((n = walker.nextNode())) nodes.push(n);
        nodes.forEach(cb);
      }
      function highlightTextInElement(el, query) {
        if (!el || !query) return;
        const regex = new RegExp('(' + escapeRegex(query) + ')', 'gi');
        walkTextNodes(el, (node) => {
          if (node.parentElement && node.parentElement.closest('.katex')) return;
          const text = node.nodeValue;
          regex.lastIndex = 0;
          if (!regex.test(text)) return;
          regex.lastIndex = 0;
          const frag = document.createDocumentFragment();
          let lastIndex = 0, m;
          while ((m = regex.exec(text))) {
            if (m.index > lastIndex) frag.appendChild(document.createTextNode(text.slice(lastIndex, m.index)));
            const mark = document.createElement('mark');
            mark.textContent = m[0];
            frag.appendChild(mark);
            lastIndex = m.index + m[0].length;
            if (m[0].length === 0) regex.lastIndex++;
          }
          if (lastIndex < text.length) frag.appendChild(document.createTextNode(text.slice(lastIndex)));
          node.replaceWith(frag);
        });
      }

      // ===================================================================
      // KATEX
      // ===================================================================
      function renderMathInContainer(container) {
        if (!container) return;
        if (!window.katex) { scheduleKatexRender(container); return; }
        walkTextNodes(container, (node) => {
          const text = node.nodeValue;
          if (!text || text.indexOf('$') === -1) return;
          const frag = renderMathInText(text);
          if (frag) node.replaceWith(frag);
        });
      }
      function renderMathInText(text) {
        const regex = /\$\$([\s\S]+?)\$\$|\$([^\$\n]+?)\$/g;
        let lastIndex = 0, match, found = false;
        const frag = document.createDocumentFragment();
        while ((match = regex.exec(text))) {
          found = true;
          if (match.index > lastIndex) frag.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
          const isBlock = match[1] !== undefined;
          const expr = isBlock ? match[1] : match[2];
          const span = document.createElement('span');
          try {
            window.katex.render(expr, span, { throwOnError: false, displayMode: isBlock });
          } catch (e) {
            span.textContent = (isBlock ? '$$' : '$') + expr + (isBlock ? '$$' : '$');
          }
          frag.appendChild(span);
          lastIndex = regex.lastIndex;
        }
        if (!found) return null;
        if (lastIndex < text.length) frag.appendChild(document.createTextNode(text.slice(lastIndex)));
        return frag;
      }

      let pendingKatexContainers = new Set();
      function scheduleKatexRender(container) {
        if (pendingKatexContainers.has(container)) return;
        pendingKatexContainers.add(container);
        if (katexCheckInterval === null) {
          katexCheckInterval = setInterval(() => {
            if (window.katex) {
              clearInterval(katexCheckInterval);
              katexCheckInterval = null;
              for (const c of pendingKatexContainers) renderMathInContainer(c);
              pendingKatexContainers.clear();
            }
          }, 100);
          setTimeout(() => {
            if (katexCheckInterval) {
              clearInterval(katexCheckInterval);
              katexCheckInterval = null;
              pendingKatexContainers.clear();
            }
          }, 8000);
        }
      }

      // ===================================================================
      // НАВИГАЦИЯ
      // ===================================================================
      function navigate(id, opts) {
        opts = opts || {};
        if (!topicsById.has(id)) return;
        if (isNavigating) return;
        if (opts.fromHyperlink && currentId && currentId !== id) {
          referrerOf.set(id, currentId);
        }

        // Запоминаем, где остановились в уходящей теме (пригодится для «Назад»),
        // и сразу отражаем новую тему в адресе.
        captureState();
        cancelScrollRestore();
        targetId = id;
        if (!opts.fromUrl) setUrlTopic(id);
        captureState();

        const direction = opts.direction || 'forward';
        const slideClass = direction === 'forward' ? 'slide-left' : 'slide-right';

        if (!opts.noHistory) {
          if (historyIndex < historyStack.length - 1) {
            historyStack = historyStack.slice(0, historyIndex + 1);
          }
          historyStack.push(id);
          historyIndex = historyStack.length - 1;
        }

        const inner = els.contentInner;
        inner.classList.remove('slide-left', 'slide-right', 'slide-none');

        requestAnimationFrame(() => {
          inner.classList.add(slideClass);
        });

        setTimeout(() => {
          if (targetId !== id) return;   // пока шла анимация, успели уйти на другую тему
          renderTopic(id, { skipScroll: true, noHistory: true, isTransition: true });
          if (opts.restoreScroll) restoreScrollPosition(savedState.scroll[id] || 0);
          inner.classList.remove(slideClass);
          requestAnimationFrame(() => {
            inner.classList.add('slide-none');
            setTimeout(() => {
              inner.classList.remove('slide-none');
            }, 50);
          });
        }, 300);

        closeMobileSidebar();
        if (!opts.skipScroll && !opts.restoreScroll) {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      }

      // Вызывается и на popstate (кнопки «Назад»/«Вперёд»), и на hashchange (ручная
      // правка адреса, ссылки вида #id) — повторный вызов для той же темы ничего не делает.
      function onHashChange() {
        const id = topicIdFromUrl();
        if (id && id === targetId) return;
        if (id && topicsById.has(id)) {
          const currentIdx = historyStack.indexOf(id);
          let direction = 'forward';
          if (currentIdx !== -1 && currentIdx < historyIndex) direction = 'back';
          else if (currentIdx !== -1 && currentIdx > historyIndex) direction = 'forward';
          else direction = 'forward';
          historyIndex = currentIdx !== -1 ? currentIdx : historyStack.length;
          navigate(id, { direction, noHistory: true, fromUrl: true, restoreScroll: true });
        } else {
          const roots = getFilteredChildren(null);
          if (roots.length) {
            setUrlTopic(roots[0], true);
            navigate(roots[0], { noHistory: true, fromUrl: true });
          } else {
            showEmptyState('Нет тем, соответствующих фильтру.');
          }
        }
      }

      // ===================================================================
      // СОСТОЯНИЕ СТРАНИЦЫ: тема в адресе + прокрутка/дерево/фильтры в sessionStorage
      // ===================================================================
      // Адрес: /spravochnik/#<id> (так же ссылаются на темы AI-агент и другие страницы);
      // ?topic=<id> тоже понимается при открытии и сразу переписывается в #<id>.
      // sessionStorage (переживает перезагрузку вкладки): позиция прокрутки для каждой
      // темы, прокрутка и раскрытые узлы дерева, фильтры, строка поиска, какие темы
      // показаны в упрощённом виде. localStorage: последняя открытая тема — чтобы
      // /spravochnik/ без #id в новой вкладке открылся там же.
      const STATE_KEY = 'spr-state:v1';
      const LAST_TOPIC_KEY = 'spr-last-topic';
      const MAX_SCROLL_ENTRIES = 120;
      const savedState = (function readState() {
        let s = null;
        try { s = JSON.parse(sessionStorage.getItem(STATE_KEY) || 'null'); } catch (e) {}
        if (!s || typeof s !== 'object') s = {};
        if (!s.scroll || typeof s.scroll !== 'object') s.scroll = {};
        if (!s.simplified || typeof s.simplified !== 'object') s.simplified = {};
        return s;
      })();
      let stateReady = false;          // до первой отрисовки ничего не перезаписываем
      let restoringTreeScroll = false;
      let saveTimer = null;
      let scrollRestoreRun = null;

      function topicIdFromUrl() {
        let id = '';
        try { id = decodeURIComponent(location.hash.replace(/^#/, '')); } catch (e) { id = location.hash.replace(/^#/, ''); }
        if (!id) {
          try { id = new URLSearchParams(location.search).get('topic') || ''; } catch (e) {}
        }
        return id;
      }

      function setUrlTopic(id, replace) {
        let url;
        try {
          const u = new URL(location.href);
          u.searchParams.delete('topic');
          u.hash = encodeURIComponent(id);
          url = u.pathname + u.search + u.hash;
        } catch (e) {
          url = '#' + encodeURIComponent(id);
        }
        if (!replace && topicIdFromUrl() === id) replace = true;
        try {
          if (replace) history.replaceState(history.state, '', url);
          else history.pushState({ sprTopic: id }, '', url);
        } catch (e) {
          location.hash = id;
        }
      }

      function captureState() {
        if (!stateReady || !els.tree) return;
        // Прокрутку пишем только когда на экране действительно та тема, к которой
        // шли (во время анимации перехода window ещё показывает прошлую).
        if (currentId && currentId === targetId && !scrollRestoreRun) {
          delete savedState.scroll[currentId];               // свежие — в конец (для обрезки)
          savedState.scroll[currentId] = Math.max(0, Math.round(window.scrollY || window.pageYOffset || 0));
          const keys = Object.keys(savedState.scroll);
          for (let i = 0; i < keys.length - MAX_SCROLL_ENTRIES; i++) delete savedState.scroll[keys[i]];
        }
        savedState.id = targetId || currentId || null;
        if (!restoringTreeScroll) savedState.tree = Math.round(els.tree.scrollTop);
        savedState.expanded = Array.from(expanded);
        savedState.filters = { cls: classFilter, type: typeFilter, sort: sortMode };
        savedState.query = els.searchInput ? els.searchInput.value : '';
        try { sessionStorage.setItem(STATE_KEY, JSON.stringify(savedState)); } catch (e) {}
        if (savedState.id) { try { localStorage.setItem(LAST_TOPIC_KEY, savedState.id); } catch (e) {} }
      }

      // Троттлинг: не чаще раза в 250 мс, последняя позиция всегда записывается.
      function scheduleSave() {
        if (saveTimer) return;
        saveTimer = setTimeout(() => { saveTimer = null; captureState(); }, 250);
      }

      function setupStatePersistence() {
        window.addEventListener('scroll', scheduleSave, { passive: true });
        els.tree.addEventListener('scroll', () => { if (!restoringTreeScroll) scheduleSave(); }, { passive: true });
        // раскрытие/сворачивание узлов, фильтры, строка поиска
        els.tree.addEventListener('click', scheduleSave);
        [els.classFilter, els.typeFilter, els.sortMode].forEach(sel => sel.addEventListener('change', scheduleSave));
        els.searchInput.addEventListener('input', scheduleSave);
        els.searchClear.addEventListener('click', scheduleSave);
        const flush = () => { clearTimeout(saveTimer); saveTimer = null; captureState(); };
        window.addEventListener('pagehide', flush);
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
        window.addEventListener('popstate', onHashChange);
        window.addEventListener('hashchange', onHashChange);
      }

      // Фильтры, строка поиска и раскрытые узлы — до первой отрисовки дерева.
      function restoreTreeState() {
        const f = savedState.filters || {};
        const setSel = (sel, v) => (v != null && sel && sel.querySelector(`option[value="${CSS.escape(String(v))}"]`)) ? (sel.value = String(v), true) : false;
        if (setSel(els.classFilter, f.cls)) classFilter = els.classFilter.value;
        if (setSel(els.typeFilter, f.type)) typeFilter = els.typeFilter.value;
        if (setSel(els.sortMode, f.sort)) sortMode = els.sortMode.value;
        if (typeof savedState.query === 'string' && savedState.query) {
          els.searchInput.value = savedState.query;
          els.searchWrap.classList.add('has-value');
          lastQuery = savedState.query.trim();
        }
        if (Array.isArray(savedState.expanded)) {
          expanded.clear();
          savedState.expanded.forEach(id => { if (topicsById.has(id)) expanded.add(id); });
          return true;
        }
        return false;
      }

      function cancelScrollRestore() {
        if (scrollRestoreRun) scrollRestoreRun.finish();
      }

      // Ставит прокрутку окна на y и держит её там, пока тема «доезжает» (KaTeX,
      // шрифты, картинки, пример) — без видимых прыжков: пока идёт восстановление,
      // у body временно есть min-height, чтобы браузер не обрезал позицию по ещё
      // короткой странице. Любое действие пользователя (колесо, касание, клавиши)
      // сразу прекращает восстановление.
      function restoreScrollPosition(y) {
        cancelScrollRestore();
        y = Math.max(0, Math.round(Number(y) || 0));
        const jump = () => {
          if (Math.abs((window.scrollY || 0) - y) > 1) {
            try { window.scrollTo({ top: y, left: 0, behavior: 'instant' }); } catch (e) { window.scrollTo(0, y); }
          }
        };
        if (!y) { jump(); return; }
        const body = document.body;
        const prevMinHeight = body.style.minHeight;
        body.style.minHeight = (y + window.innerHeight) + 'px';
        let done = false, timer = null, ro = null;
        const stopEvents = ['wheel', 'touchstart', 'keydown', 'mousedown'];
        const finish = () => {
          if (done) return;
          done = true;
          clearTimeout(timer);
          if (ro) ro.disconnect();
          stopEvents.forEach(ev => window.removeEventListener(ev, finish, true));
          body.style.minHeight = prevMinHeight;
          if (scrollRestoreRun === run) scrollRestoreRun = null;
          scheduleSave();
        };
        const run = { finish };
        scrollRestoreRun = run;
        stopEvents.forEach(ev => window.addEventListener(ev, finish, { capture: true, passive: true }));
        jump();
        if (window.ResizeObserver && els.contentInner) {
          ro = new ResizeObserver(() => { if (!done) jump(); });
          ro.observe(els.contentInner);
        }
        const pending = [];
        if (document.fonts && document.fonts.ready) pending.push(document.fonts.ready.catch(() => {}));
        els.topicView.querySelectorAll('img').forEach(img => {
          if (img.complete) return;
          pending.push(new Promise(r => { img.addEventListener('load', r, { once: true }); img.addEventListener('error', r, { once: true }); }));
        });
        Promise.all(pending).then(() => {
          if (done) return;
          requestAnimationFrame(() => { jump(); setTimeout(() => { if (!done) { jump(); finish(); } }, 700); });
        });
        timer = setTimeout(() => { if (!done) { jump(); finish(); } }, 5000);
      }

      function showEmptyState(msg) {
        els.topicView.hidden = true;
        els.emptyState.hidden = false;
        els.emptyState.textContent = msg;
      }

      function renderTopic(id, opts) {
        const t0 = topicsById.get(id);
        if (isEn() && t0 && t0.description !== undefined && !t0.descEn) {
          // сначала показываем оригинал, затем подменяем переведённым текстом (если пользователь не ушёл с темы)
          ensureEnglish(t0).then(ok => { if (ok && currentId === id) renderTopicNow(id, Object.assign({}, opts, { skipScroll: true, noHistory: true })); });
        }
        if (needsDescription(t0)) {
          // Описание ещё не загружено — подгружаем его и рисуем тему сразу после (если пользователь не ушёл).
          currentId = id;
          if (!targetId) targetId = id;
          ensureDescription(t0).then(() => { if (currentId === id) { renderTopicNow(id, opts); if (isEn()) ensureEnglish(t0).then(ok => { if (ok && currentId === id) renderTopicNow(id, Object.assign({}, opts, { skipScroll: true, noHistory: true })); }); } });
          return;
        }
        renderTopicNow(id, opts);
      }

      function renderTopicNow(id, opts) {
        opts = opts || {};
        const topic = topicsById.get(id);
        if (!topic) return;
        currentId = id;
        if (!targetId) targetId = id;
        els.emptyState.hidden = true;
        els.topicView.hidden = false;

        expandAncestorsOf(id);
        renderTree();

        els.title.innerHTML = '';
        if (lastQuery && els.optHighlight.checked) {
          els.title.textContent = topic.title;
          highlightTextInElement(els.title, lastQuery);
        } else {
          els.title.textContent = topic.title;
        }

        renderBreadcrumb(id);
        renderNavButtons(id);
        renderDescription(topic);
        setupSimplifyForTopic(topic);
        renderExample(topic);
        renderTask(topic);

        if (!opts.skipScroll) {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      }

      function renderBreadcrumb(id) {
        const chain = [];
