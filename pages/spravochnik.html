        let t = topicsById.get(id);
        while (t) { chain.unshift(t); t = t.parent ? topicsById.get(t.parent) : null; }
        els.breadcrumb.innerHTML = '';
        chain.forEach((node, i) => {
          if (i > 0) { const sep = document.createElement('span'); sep.className = 'sep'; sep.textContent = '›'; els.breadcrumb.appendChild(sep); }
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = node.title;
          if (i === chain.length - 1) btn.className = 'current';
          else btn.addEventListener('click', () => navigate(node.id, { direction: 'back' }));
          els.breadcrumb.appendChild(btn);
        });
      }

      function renderNavButtons(id) {
        const topic = topicsById.get(id);
        if (topic.parent && topicsById.has(topic.parent)) {
          els.backParent.hidden = false;
          els.backParent.onclick = () => navigate(topic.parent, { direction: 'back' });
        } else {
          els.backParent.hidden = true;
        }
        const refId = referrerOf.get(id);
        if (refId && topicsById.has(refId)) {
          els.backReferrer.hidden = false;
          els.backReferrer.textContent = '← Вернуться к «' + topicsById.get(refId).title + '»';
          els.backReferrer.onclick = () => navigate(refId, { direction: 'back' });
        } else {
          els.backReferrer.hidden = true;
        }
      }

      function renderDescription(topic) {
        if (topic.type === 'proof') {
          renderProofDescription(topic);
          return;
        }
        els.description.innerHTML = descOf(topic);
        if (isEn() && !topic.descEn && /[А-Яа-яЁё]/.test(topic.description || '')) els.description.insertAdjacentHTML('afterbegin', '<p class="spr-tr-note" style="opacity:.6;font-style:italic">Translating the article to English…</p>');
        els.description.querySelectorAll('a[href^="topic:"]').forEach(a => {
          const targetId = a.getAttribute('href').slice('topic:'.length);
          a.addEventListener('click', (e) => {
            e.preventDefault();
            navigate(targetId, { fromHyperlink: true, direction: 'forward' });
          });
        });
        renderMathInContainer(els.description);
        if (lastQuery && els.optHighlight.checked) {
          highlightTextInElement(els.description, lastQuery);
        }
      }

      // ===================================================================
      // «УПРОСТИТЬ»: пересказ темы простыми словами (нейросеть, /api/simplify)
      // ===================================================================
      // Описание темы переводится в текст (формулы остаются в $…$), уходит на сервер,
      // ответ (Markdown + LaTeX) плавно подменяет описание. Ключ нейросети живёт только
      // на сервере. Ответы кэшируются в localStorage по id темы + хэшу исходного
      // текста: пока тема не изменилась, повторного запроса не будет. Какие темы
      // показаны упрощёнными — в savedState.simplified (переживает перезагрузку).
      const SIMPLIFY_ENDPOINT = '/api/simplify';
      const SIMPLIFY_CACHE_PREFIX = 'spr-simplify:v1:';
      const SIMPLIFY_INDEX_KEY = 'spr-simplify-index:v1';
      const SIMPLIFY_CACHE_MAX = 80;
      const SIMPLIFY_MIN_CHARS = 15;
      const simplifyRequests = new Map();   // topicId -> { key, promise }
      const simplifyMemCache = new Map();   // запасной кэш, если localStorage недоступен
      let simplifyShown = false;            // текущая тема сейчас показана упрощённой
      let simplifyMode = 'original';        // original | loading | simplified
      let simplifySwapToken = 0;

      function motionReduced() {
        return document.documentElement.classList.contains('mf-no-motion') ||
          !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      }
      function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

      function hashString(s) {
        let h = 0x811c9dc5;
        for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
        return h.toString(36) + s.length.toString(36);
      }

      // HTML описания → простой текст с разметкой абзацев/списков; формулы остаются в $…$.
      function descriptionToPlainText(html) {
        const root = document.createElement('div');
        root.innerHTML = html || '';
        root.querySelectorAll('script,style,iframe,img,svg,video,audio,canvas,object,embed,button,input,select,textarea').forEach(n => n.remove());
        root.querySelectorAll('.katex').forEach(k => {
          const ann = k.querySelector('annotation[encoding="application/x-tex"]');
          const disp = k.closest('.katex-display');
          const tex = ann ? ann.textContent : k.textContent;
          (disp || k).replaceWith(document.createTextNode(disp ? '$$' + tex + '$$' : '$' + tex + '$'));
        });
        const BLOCK = /^(P|DIV|SECTION|ARTICLE|BLOCKQUOTE|TABLE|TR|UL|OL|PRE|FIGURE|FIGCAPTION|DETAILS|SUMMARY|HR|DL|DT|DD)$/;
        function walk(node) {
          let out = '';
          node.childNodes.forEach(ch => {
            if (ch.nodeType === 3) { out += ch.nodeValue.replace(/\s+/g, ' '); return; }
            if (ch.nodeType !== 1) return;
            const tag = ch.tagName;
            if (tag === 'BR') { out += '\n'; return; }
            const inner = walk(ch);
            if (/^H[1-6]$/.test(tag)) out += '\n\n## ' + inner.trim() + '\n\n';
            else if (tag === 'LI') out += '\n- ' + inner.trim();
            else if (tag === 'TD' || tag === 'TH') out += inner.trim() + ' | ';
            else if (BLOCK.test(tag)) out += '\n\n' + inner + '\n\n';
            else out += inner;
          });
          return out;
        }
        return walk(root).split('\n').map(l => l.replace(/[ \t ]+/g, ' ').trim()).join('\n')
          .replace(/\n{3,}/g, '\n\n').trim();
      }

      function simplifySource(topic) {
        const text = descriptionToPlainText(topic.description || '');
        return { text, key: SIMPLIFY_CACHE_PREFIX + topic.id + ':' + hashString((topic.title || '') + '\n' + text) };
      }

      function simplifyCacheGet(key) {
        if (simplifyMemCache.has(key)) return simplifyMemCache.get(key);
        try {
          const v = JSON.parse(localStorage.getItem(key) || 'null');
          return v && typeof v.t === 'string' && v.t ? v.t : null;
        } catch (e) { return null; }
      }
      function simplifyCacheSet(key, text) {
        simplifyMemCache.set(key, text);
        let index = [];
        try { index = JSON.parse(localStorage.getItem(SIMPLIFY_INDEX_KEY) || '[]'); } catch (e) {}
        if (!Array.isArray(index)) index = [];
        index = index.filter(k => k !== key);
        index.push(key);
        while (index.length > SIMPLIFY_CACHE_MAX) { try { localStorage.removeItem(index.shift()); } catch (e) {} }
        const val = JSON.stringify({ t: text, at: Date.now() });
        for (let attempt = 0; attempt < 4; attempt++) {
          try {
            localStorage.setItem(key, val);
            localStorage.setItem(SIMPLIFY_INDEX_KEY, JSON.stringify(index));
            return;
          } catch (e) {
            // Переполнено хранилище — выбрасываем старую половину кэша и пробуем ещё раз.
            const old = index.filter(k => k !== key);
            if (!old.length) return;
            old.slice(0, Math.max(1, Math.ceil(old.length / 2))).forEach(k => {
              try { localStorage.removeItem(k); } catch (_) {}
              index = index.filter(x => x !== k);
            });
          }
        }
      }

      // Небольшой безопасный Markdown → HTML: весь текст экранируется, формулы
      // вынимаются заранее и возвращаются как есть — их потом отрисует тот же
      // renderMathInContainer (KaTeX), что и в обычных темах.
      function simplifiedMarkdownToHtml(md) {
        const math = [];
        let src = String(md || '').replace(/\r\n?/g, '\n');
        src = src.replace(/\\\[([\s\S]+?)\\\]/g, (m, e) => '$$' + e + '$$')
                 .replace(/\\\(([\s\S]+?)\\\)/g, (m, e) => '$' + e + '$');
        src = src.replace(/\$\$([\s\S]+?)\$\$|\$([^\$\n]+?)\$/g, m => {
          math.push(m);
          return '\u0000' + (math.length - 1) + '\u0000';
        });
        const inline = s => escapeHtml(s)
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>')
          .replace(/__([^_]+?)__/g, '<strong>$1</strong>')
          .replace(/(^|[^\w*])\*(?!\s)([^*\n]+?)\*(?!\w)/g, '$1<em>$2</em>')
          .replace(/(^|[^\w])_(?!\s)([^_\n]+?)_(?!\w)/g, '$1<em>$2</em>')
          .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1');
        let html = '';
        let para = [];
        let list = null;   // { tag, start, items: [] }
        const flushPara = () => { if (para.length) { html += '<p>' + inline(para.join(' ')) + '</p>'; para = []; } };
        const flushList = () => {
          if (!list) return;
          const start = list.tag === 'ol' && list.start > 1 ? ' start="' + list.start + '"' : '';
          html += '<' + list.tag + start + '>' + list.items.map(i => '<li>' + inline(i) + '</li>').join('') + '</' + list.tag + '>';
          list = null;
        };
        for (const raw of src.split('\n')) {
          const line = raw.trim();
          if (!line) { flushPara(); flushList(); continue; }
          let m;
          if ((m = line.match(/^(#{1,6})\s+(.+?)\s*#*$/))) {
            flushPara(); flushList();
            const lvl = Math.min(5, Math.max(3, m[1].length));
            html += '<h' + lvl + '>' + inline(m[2]) + '</h' + lvl + '>';
          } else if (/^(-{3,}|\*{3,}|_{3,})$/.test(line)) {
            flushPara(); flushList();
            html += '<hr>';
          } else if ((m = line.match(/^[-*+•]\s+(.*)$/))) {
            flushPara();
            if (list && list.tag !== 'ul') flushList();
            if (!list) list = { tag: 'ul', start: 1, items: [] };
            list.items.push(m[1]);
          } else if ((m = line.match(/^(\d+)[.)]\s+(.*)$/))) {
            flushPara();
            if (list && list.tag !== 'ol') flushList();
            if (!list) list = { tag: 'ol', start: parseInt(m[1], 10) || 1, items: [] };
            list.items.push(m[2]);
          } else if ((m = line.match(/^>\s?(.*)$/))) {
            flushPara(); flushList();
            html += '<blockquote>' + inline(m[1]) + '</blockquote>';
          } else if (/^\u0000\d+\u0000$/.test(line) && math[+line.slice(1, -1)].startsWith('$$')) {
            flushPara(); flushList();
            html += '<div class="spr-md-math">' + line + '</div>';
          } else if (list && /^\s/.test(raw)) {
            list.items[list.items.length - 1] += ' ' + line;   // продолжение пункта списка
          } else {
            flushList();
            para.push(line);
          }
        }
        flushPara(); flushList();
        return html.replace(/\u0000(\d+)\u0000/g, (m, i) => escapeHtml(math[+i] || ''));
      }

      function renderSimplified(topic, md) {
        const el = els.description;
        el.innerHTML = '<div class="spr-simplified-badge">Простыми словами</div>' +
          '<div class="spr-simplified-body">' + simplifiedMarkdownToHtml(md) + '</div>';
        renderMathInContainer(el);
        if (lastQuery && els.optHighlight.checked) highlightTextInElement(el, lastQuery);
      }

      function setSimplifyUi(mode) {
        simplifyMode = mode;
        const btn = els.simplifyBtn;
        btn.classList.toggle('is-loading', mode === 'loading');
        btn.classList.toggle('is-active', mode === 'simplified');
        btn.setAttribute('aria-pressed', mode === 'simplified' ? 'true' : 'false');
        btn.setAttribute('aria-busy', mode === 'loading' ? 'true' : 'false');
        // Одна кнопка-переключатель: «Простыми словами» ⇄ «Показать оригинал».
        els.simplifyLabel.textContent = mode === 'loading' ? 'Готовлю пересказ…' : mode === 'simplified' ? 'Показать оригинал' : 'Простыми словами';
        btn.title = mode === 'simplified' ? 'Вернуть исходный текст темы' : 'Пересказать тему простыми словами';
        els.simplifyNote.textContent = mode === 'simplified' ? 'Пересказ сделан нейросетью и может содержать неточности — сверяйтесь с оригиналом.' : '';
        els.description.classList.toggle('is-simplifying', mode === 'loading');
      }

      function showSimplifyError(msg) {
        els.simplifyErrorText.textContent = msg || 'Не удалось упростить тему. Попробуйте ещё раз.';
        els.simplifyError.hidden = false;
      }
      function hideSimplifyError() { els.simplifyError.hidden = true; }

      function clearSwapStyles() {
        const el = els.description;
        el.classList.remove('spr-desc-out', 'spr-desc-in');
        el.style.height = '';
        el.style.overflow = '';
        el.style.transition = '';
      }

      // Плавная подмена содержимого описания: старый текст растворяется с лёгким
      // размытием, высота блока перетекает к новой, новый текст проявляется.
      function swapDescription(renderFn, animate) {
        const el = els.description;
        const token = ++simplifySwapToken;
        clearSwapStyles();
        if (!animate || motionReduced()) { renderFn(); return; }
        // Кнопка стоит под текстом: если начало описания уже ушло за верх экрана —
        // мягко поднимаем к началу, чтобы новый текст читался с первой строки.
        const descTop = el.getBoundingClientRect().top;
        const headerH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--header-height'), 10) || 64;
        if (descTop < headerH) window.scrollTo({ top: Math.max(0, window.scrollY + descTop - headerH - 16), behavior: 'smooth' });
        const startH = el.offsetHeight;
        el.classList.add('spr-desc-out');
        wait(230).then(() => {
          if (token !== simplifySwapToken) return;
          renderFn();
          const endH = el.offsetHeight;
          el.style.overflow = 'hidden';
          el.style.height = startH + 'px';
          void el.offsetHeight;
          el.classList.remove('spr-desc-out');
          el.classList.add('spr-desc-in');
          el.style.transition = 'height 0.45s cubic-bezier(0.2, 0.8, 0.2, 1)';
          el.style.height = endH + 'px';
          return wait(520).then(() => { if (token === simplifySwapToken) clearSwapStyles(); });
        });
      }

      // Вызывается при каждой отрисовке темы (renderTopic): кнопка, ошибки,
      // восстановление упрощённого вида из кэша.
      function setupSimplifyForTopic(topic) {
        simplifySwapToken++;
        clearSwapStyles();
        hideSimplifyError();
        simplifyShown = false;
        // Папки (разделы дерева) не пересказываем — кнопка только у обычных тем.
        if (topic.type === 'folder') {
          els.simplifyBar.hidden = true;
          setSimplifyUi('original');
          return;
        }
        const src = simplifySource(topic);
        if (src.text.length < SIMPLIFY_MIN_CHARS) {
          els.simplifyBar.hidden = true;
          setSimplifyUi('original');
          return;
        }
        els.simplifyBar.hidden = false;
        const req = simplifyRequests.get(topic.id);
        if (req && req.key === src.key) { setSimplifyUi('loading'); return; }
        if (savedState.simplified[topic.id]) {
          const cached = simplifyCacheGet(src.key);
          if (cached) {
            renderSimplified(topic, cached);
            simplifyShown = true;
            setSimplifyUi('simplified');
            return;
          }
          delete savedState.simplified[topic.id];   // тема изменилась или кэш очищен
        }
        setSimplifyUi('original');
      }

      async function requestSimplification(topic, text) {
        let token = '';
        try {
          const u = currentUser || (window.Auth && window.Auth.getCurrentUser && window.Auth.getCurrentUser());
          if (u && u.getIdToken) token = await Promise.race([u.getIdToken(), wait(4000).then(() => '')]);
        } catch (e) { token = ''; }
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 70000);
        let res, data = null;
        try {
          const headers = { 'content-type': 'application/json' };
          if (token) headers.authorization = 'Bearer ' + token;
          res = await fetch(SIMPLIFY_ENDPOINT, {
            method: 'POST',
            headers,
            body: JSON.stringify({ id: topic.id, title: topic.title || '', text }),
            signal: ctrl.signal,
          });
          try { data = await res.json(); } catch (e) { data = null; }
        } catch (e) {
          if (e && e.name === 'AbortError') throw new Error('Нейросеть отвечает слишком долго. Попробуйте ещё раз чуть позже.');
          if (navigator.onLine === false) throw new Error('Нет подключения к интернету. Проверьте сеть и попробуйте ещё раз.');
          throw new Error('Не удалось связаться с сервером. Проверьте интернет и попробуйте ещё раз.');
        } finally {
          clearTimeout(timer);
        }
        if (!res.ok) {
          if (data && typeof data.error === 'string' && data.error) throw new Error(data.error);
          if (res.status === 429) throw new Error('Слишком много запросов. Попробуйте чуть позже.');
          if (res.status === 404 || res.status === 405) throw new Error('Сервис упрощения сейчас недоступен.');
          throw new Error('Не удалось упростить тему (ошибка ' + res.status + '). Попробуйте ещё раз.');
        }
        const out = data && typeof data.text === 'string' ? data.text.trim() : '';
        if (!out) throw new Error('Нейросеть вернула пустой ответ. Попробуйте ещё раз.');
        return out;
      }

      function applySimplified(topic, text, animate) {
        savedState.simplified[topic.id] = 1;
        simplifyShown = true;
        setSimplifyUi('simplified');
        swapDescription(() => renderSimplified(topic, text), animate);
        scheduleSave();
      }

      function showOriginal() {
        const topic = topicsById.get(currentId);
        if (!topic || !simplifyShown) return;
        delete savedState.simplified[topic.id];
        simplifyShown = false;
        hideSimplifyError();
        setSimplifyUi('original');
        swapDescription(() => renderDescription(topic), true);
        scheduleSave();
      }

      function simplifyCurrent() {
        const topic = topicsById.get(currentId);
        if (!topic || topic.type === 'folder' || simplifyMode === 'loading') return;
        if (simplifyShown) { showOriginal(); return; }
        hideSimplifyError();
        const src = simplifySource(topic);
        if (src.text.length < SIMPLIFY_MIN_CHARS) return;
        const cached = simplifyCacheGet(src.key);
        if (cached) { applySimplified(topic, cached, true); return; }
        let req = simplifyRequests.get(topic.id);
        if (!req || req.key !== src.key) {
          req = { key: src.key, promise: requestSimplification(topic, src.text) };
          simplifyRequests.set(topic.id, req);
        }
        setSimplifyUi('loading');
        req.promise.then(text => {
          simplifyCacheSet(src.key, text);
          if (currentId === topic.id && targetId === topic.id && simplifyMode === 'loading') applySimplified(topic, text, true);
        }, err => {
          if (currentId === topic.id && targetId === topic.id && simplifyMode === 'loading') {
            setSimplifyUi('original');
            showSimplifyError(err && err.message);
          }
        }).finally(() => {
          if (simplifyRequests.get(topic.id) === req) simplifyRequests.delete(topic.id);
        });
      }

      // «Сообщить об ошибке» — окно с формой (assets/js/support.js), тема подставляется сама
      function setupReportHandler() {
        const btn = document.getElementById('sprReportBtn');
        if (!btn) return;
        btn.addEventListener('click', () => {
          const t = currentId && topicsById.get(currentId);
          if (window.MFSupport) window.MFSupport.openError({ topicId: currentId || '', topicTitle: t ? t.title : '' });
        });
      }

      function setupSimplifyHandlers() {
        els.simplifyBtn.addEventListener('click', simplifyCurrent);
        els.simplifyRetry.addEventListener('click', simplifyCurrent);
      }

      // ===================================================================
      // ПОШАГОВОЕ ДОКАЗАТЕЛЬСТВО (topic.type === 'proof')
      // ===================================================================
      // Описание темы типа "доказательство" делится на пункты (пошаговое доказательство):
      // любые заголовки (h1-h6) в САМОМ НАЧАЛЕ описания остаются статичным "прологом" над
      // аккордеоном (обычно это заголовок вида <h2>Название</h2>, дублирующий topic.title),
      // а каждый следующий элемент верхнего уровня описания становится ОДНИМ пунктом
      // аккордеона — по порядку. Все пункты всегда свёрнуты, кроме текущего; клик по
      // заголовку пункта разворачивает именно его, стрелочки внизу листают пункты по
      // одному (с ограничением по краям — на первом пункте недоступна "‹", на последнем —
      // "›"). Текущий пункт (currentProofStepIndex) также транслируется в интерактивный
      // пример (iframe) как номер GMS-кластера (step = индекс + 1) через sendStepToFrame —
      // см. renderExample.
      function renderProofDescription(topic) {
        const raw = descOf(topic);
        const parseContainer = document.createElement('div');
        parseContainer.innerHTML = raw;

        const children = Array.from(parseContainer.childNodes).filter(n => {
          return !(n.nodeType === Node.TEXT_NODE && !n.textContent.trim());
        });

        let splitAt = 0;
        while (splitAt < children.length && children[splitAt].nodeType === Node.ELEMENT_NODE && /^H[1-6]$/.test(children[splitAt].tagName)) {
          splitAt++;
        }
        const prologueNodes = children.slice(0, splitAt);
        const stepNodes = children.slice(splitAt);

        // Если делить нечего (пустое описание или только заголовок) — просто показываем
        // как обычную тему, без аккордеона.
        if (stepNodes.length === 0) {
          els.description.innerHTML = raw;
          renderMathInContainer(els.description);
          return;
        }

        currentProofStepIndex = 0;
        proofStepsTotal = stepNodes.length;

        els.description.innerHTML = '';
        const prologueWrap = document.createElement('div');
        prologueWrap.className = 'proof-prologue';
        prologueNodes.forEach(n => prologueWrap.appendChild(n.cloneNode(true)));
        if (prologueNodes.length > 0) els.description.appendChild(prologueWrap);

        const stepsWrap = document.createElement('div');
        stepsWrap.className = 'proof-steps';

        const stepEls = [];
        stepNodes.forEach((node, i) => {
          const stepEl = document.createElement('div');
          stepEl.className = 'proof-step';
          stepEl.dataset.index = String(i);

          const header = document.createElement('button');
          header.type = 'button';
          header.className = 'proof-step-header';
          header.innerHTML = `<span class="proof-step-num">${i + 1}</span><span class="proof-step-title">Пункт ${i + 1}</span><span class="proof-step-chevron">▾</span>`;
          header.addEventListener('click', () => setProofStep(i));

          const body = document.createElement('div');
          body.className = 'proof-step-body';
          const bodyInner = document.createElement('div');
          bodyInner.className = 'proof-step-body-inner';
          bodyInner.appendChild(node.cloneNode(true));
          body.appendChild(bodyInner);

          stepEl.appendChild(header);
          stepEl.appendChild(body);
          stepsWrap.appendChild(stepEl);
          stepEls.push(stepEl);
        });

        const nav = document.createElement('div');
        nav.className = 'proof-steps-nav';
        const prevBtn = document.createElement('button');
        prevBtn.type = 'button';
        prevBtn.className = 'proof-nav-btn proof-nav-prev';
        prevBtn.setAttribute('aria-label', 'Предыдущий пункт');
        prevBtn.textContent = '‹';
        prevBtn.addEventListener('click', () => setProofStep(currentProofStepIndex - 1));
        const dots = document.createElement('div');
        dots.className = 'proof-steps-dots';
        stepNodes.forEach((_, i) => {
          const dot = document.createElement('span');
          dot.className = 'proof-step-dot';
          dot.dataset.index = String(i);
          dot.addEventListener('click', () => setProofStep(i));
          dots.appendChild(dot);
        });
        const nextBtn = document.createElement('button');
        nextBtn.type = 'button';
        nextBtn.className = 'proof-nav-btn proof-nav-next';
        nextBtn.setAttribute('aria-label', 'Следующий пункт');
        nextBtn.textContent = '›';
        nextBtn.addEventListener('click', () => setProofStep(currentProofStepIndex + 1));
        nav.appendChild(prevBtn);
        nav.appendChild(dots);
        nav.appendChild(nextBtn);
        stepsWrap.appendChild(nav);

        els.description.appendChild(stepsWrap);

        // Формулы рендерятся один раз для всего аккордеона сразу (все пункты присутствуют
        // в DOM одновременно, скрыты только через CSS) — переключение пунктов после этого
        // не требует повторного вызова KaTeX.
        renderMathInContainer(els.description);
        if (lastQuery && els.optHighlight.checked) {
          highlightTextInElement(els.description, lastQuery);
        }

        function setProofStep(i) {
          i = Math.max(0, Math.min(stepEls.length - 1, i));
          currentProofStepIndex = i;
          stepEls.forEach((el, idx) => el.classList.toggle('expanded', idx === i));
          dots.querySelectorAll('.proof-step-dot').forEach((d, idx) => d.classList.toggle('current', idx === i));
          prevBtn.disabled = (i === 0);
          nextBtn.disabled = (i === stepEls.length - 1);
          const frame = document.getElementById('sprExampleFrame');
          if (frame) sendStepToFrame(frame, i + 1);
        }
        setProofStep(0);
      }

      // ===================================================================
      // ИНТЕРАКТИВНЫЙ ПРИМЕР
      // ===================================================================
      function loadEmbed() {
        if (!compilerModulePromise) compilerModulePromise = import(GMS_EMBED_URL).catch(e => { compilerModulePromise = null; throw e; });
        return compilerModulePromise;
      }
      function loadCompiler() { return loadEmbed().then(m => m.loadCompiler()); }

      // Сообщает интерактивному примеру, какой "шаг" (GMS-кластер с полем step) сейчас
      // ===================================================================
      // ОТКРЫТИЕ / СОЗДАНИЕ / УДАЛЕНИЕ ФАЙЛА ПРИМЕРА (только для админов)
      // ===================================================================
      // Путь к развёрнутой странице IDE (см. vercel.json: /admin/gms-ide/ →
      // /pages/admin/gms-ide.html) — если она лежит по другому адресу,
      // поправьте константу здесь.
      const IDE_URL = '/admin/gms-ide/';
      const EXAMPLE_TOOL_ICONS = {
        ide: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 8 4 12l4.5 4"/><path d="M15.5 8 20 12l-4.5 4"/><path d="M13.5 6.5 10.5 17.5"/></svg>',
        trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M6 7l1 12.5A2 2 0 0 0 9 21h6a2 2 0 0 0 2-2L18 7"/><path d="M10 11v6M14 11v6"/></svg>',
        plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
      };
      const EXAMPLE_TEMPLATE = `// новый пример — можно сразу редактировать в IDE\n`;

      function openExampleInIde(path) {
        if (!path) return;
        window.open(IDE_URL + '?open=' + encodeURIComponent(path), '_blank');
      }

      // Персистит topic.example (после создания/удаления файла) обратно в
      // config.json тем же способом, что и редактор иерархии — POST всего
      // массива тем в /api/config. topics здесь — тот же плоский массив,
      // что рендерит страницу, так что достаточно поменять поле на месте.
      async function saveTopicsConfig() {
        await ensureAllDescriptions();   // сохраняется весь массив — описания должны быть на месте
        const r = await fetch('/api/config', {
          method: 'POST',
          headers: Object.assign({ 'Content-Type': 'application/json' }, await window.Auth.authHeader()),
          body: JSON.stringify({ content: topics }),
        });
        const data = await r.json().catch(() => null);
        if (!r.ok || !data || !data.ok) {
          throw new Error((data && data.error) || ('HTTP ' + r.status));
        }
      }

      async function createExampleForTopic(topic) {
        const suggested = 'data/examples/' + (topic.id || 'topic') + '.gms';
        const path = window.prompt('Путь к новому файлу примера в репозитории:', suggested);
        if (!path) return;
        try {
          const r = await fetch('/api/example', {
            method: 'POST',
            headers: Object.assign({ 'Content-Type': 'application/json' }, await window.Auth.authHeader()),
            body: JSON.stringify({ path, content: EXAMPLE_TEMPLATE }),
          });
          const data = await r.json().catch(() => null);
          if (!r.ok || !data || !data.ok) throw new Error((data && data.error) || ('HTTP ' + r.status));
        } catch (e) {
          alert('Не удалось создать файл примера: ' + e.message);
          return;
        }
        topic.example = path;
        try {
          await saveTopicsConfig();
        } catch (e) {
          alert('Файл создан, но не удалось сохранить ссылку на него в config.json (' + e.message + '). Обновите поле «example» темы вручную в редакторе тем.');
        }
        renderExample(topic);
        openExampleInIde(path);
      }

      async function deleteExampleForTopic(topic) {
        if (!topic.example) return;
        const path = topic.example;
        if (!window.confirm('Удалить файл примера «' + path + '» из репозитория без возможности восстановления?')) return;
        try {
          const r = await fetch('/api/example?path=' + encodeURIComponent(path), { method: 'DELETE', headers: await window.Auth.authHeader() });
          const data = await r.json().catch(() => null);
          if (!r.ok || !data || !data.ok) throw new Error((data && data.error) || ('HTTP ' + r.status));
        } catch (e) {
          alert('Не удалось удалить файл примера: ' + e.message);
          return;
        }
        topic.example = '';
        try {
          await saveTopicsConfig();
        } catch (e) {
          alert('Файл удалён из репозитория, но не удалось обновить config.json (' + e.message + '). Обновите поле «example» темы вручную в редакторе тем.');
        }
        renderExample(topic);
      }

      // Сообщает интерактивному примеру, какой "шаг" (GMS-кластер с полем step) сейчас
      // активен — используется только для тем типа "доказательство" (см.
      // renderProofDescription/setProofStep). step здесь — 1-based номер, совпадающий с
      // полем step в кластерах GMS-сцены.
      function sendStepToFrame(frame, step) {
        try { frame.contentWindow.postMessage({ type: 'geocompiler-set-step', step: step }, '*'); } catch (e) {}
        fitExampleFrame(frame);
      }

      // Высоту рамки под содержимое сцены (сцена + текст описания), тему сайта и
      // отписку при смене темы справочника берёт на себя gms-embed.attachFrame.
      let detachExampleFrame = null;

      async function renderExample(topic) {
        if (topic.type === 'folder') {
          els.example.hidden = true;
          return;
        }

        if (!topic.example) {
          if (!isAdmin) {
            els.example.hidden = true;
            return;
          }
          // Админ видит место под пример, даже если его ещё нет — с кнопкой создания.
          els.example.hidden = false;
          els.example.innerHTML = `
            <div class="spr-example-frame-wrap spr-example-empty">
              <div class="spr-example-empty-inner">
                <span>Для этой темы ещё нет интерактивного примера.</span>
                <button type="button" class="spr-example-tool-btn spr-example-create-btn" id="sprCreateExampleBtn">
                  ${EXAMPLE_TOOL_ICONS.plus} Создать пример
                </button>
              </div>
            </div>
          `;
          document.getElementById('sprCreateExampleBtn').addEventListener('click', () => createExampleForTopic(topic));
          return;
        }

        els.example.hidden = false;
        els.example.innerHTML = `
          <div class="spr-example-frame-wrap">
            <iframe id="sprExampleFrame"
                    title="${escapeHtml(topic.title)}"
                    sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-popups"></iframe>
            <div class="spr-example-status" id="sprExampleStatus">
              <div class="loader-ring"></div>
              <span>Компиляция примера…</span>
            </div>
            ${isAdmin ? `
              <div class="spr-example-toolbar">
                <button type="button" class="spr-example-tool-btn" id="sprOpenIdeBtn" title="Открыть в IDE">${EXAMPLE_TOOL_ICONS.ide}</button>
                <button type="button" class="spr-example-tool-btn danger" id="sprDeleteExampleBtn" title="Удалить пример">${EXAMPLE_TOOL_ICONS.trash}</button>
              </div>
            ` : ''}
          </div>
        `;
        const frame = document.getElementById('sprExampleFrame');
        const status = document.getElementById('sprExampleStatus');
        if (isAdmin) {
          document.getElementById('sprOpenIdeBtn').addEventListener('click', () => openExampleInIde(topic.example));
          document.getElementById('sprDeleteExampleBtn').addEventListener('click', () => deleteExampleForTopic(topic));
        }

        try {
          const [source, mod, embed] = await Promise.all([
            fetch(PAGE_ROOT + topic.example, { cache: 'no-cache' }).then(r => {
              if (!r.ok) throw new Error('Не удалось загрузить файл (' + r.status + ')');
              return r.text();
            }),
            loadCompiler(),
            loadEmbed(),
          ]);
          if (!document.body.contains(frame)) return;
          const en = isEn();
          const result = mod.compile(en ? await window.MF_i18n.translateGms(source) : source);
          if (!document.body.contains(frame)) return;
          if (!result.success) {
            status.innerHTML = 'Ошибка компиляции:<br>' + result.errors.join('<br>');
            status.classList.add('error');
            return;
          }
          if (detachExampleFrame) detachExampleFrame();
          const wrap = frame.closest('.spr-example-frame-wrap');
          detachExampleFrame = embed.attachFrame(frame, {
            fit: wrap,
            onLoad: () => {
              status.hidden = true;
              frame.classList.add('loaded');
              if (wrap) wrap.classList.add('spr-sized');
              if (topic.type === 'proof') sendStepToFrame(frame, currentProofStepIndex + 1);
            },
          });
          frame.srcdoc = en ? window.MF_i18n.injectIntoHtml(result.html) : result.html;
        } catch (e) {
          status.innerHTML = 'Не удалось загрузить пример: ' + e.message;
          status.classList.add('error');
        }
      }

      function escapeHtml(text) {
        return (text || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }

      // ===================================================================
      // ПРАКТИЧЕСКОЕ ЗАДАНИЕ (topic.type === 'example')
      // ===================================================================
      // Необязательное поле topic.task описывает задание с проверкой ответа —
      // варианты ответа (одиночный/множественный выбор) или поле ввода (число/строка).
      // Формат (все поля, кроме type и question, необязательны):
      //   topic.task = {
      //     type: 'choice' | 'input',
      //     question: '<p>...</p>',                 // HTML условия задачи
      //     options: [{ text: '...', correct: true|false }, ...],  // для type = 'choice'
      //     multiple: false,                         // допускать несколько верных вариантов
      //     answer: '25',                             // для type = 'input': эталонный ответ
      //     tolerance: 0.01,                          // для числового ответа — допуск
      //     explanation: '<p>...</p>',                // HTML-пояснение, показывается после проверки
      //   }
      // Если topic.task отсутствует (как у большинства тем типа "пример" на сегодня),
      // панель просто скрывается — это не ломает темы без задания.
      function renderTask(topic) {
        const task = topic.task;
        if (topic.type !== 'example' || !task || (task.type !== 'choice' && task.type !== 'input')) {
          els.task.hidden = true;
          els.task.innerHTML = '';
          return;
        }
        els.task.hidden = false;
        els.task.innerHTML = '';

        const wrap = document.createElement('div');
        wrap.className = 'spr-task-panel';

        const heading = document.createElement('div');
        heading.className = 'spr-task-heading';
        heading.textContent = 'Практическое задание';
        wrap.appendChild(heading);

        if (task.question) {
          const q = document.createElement('div');
          q.className = 'spr-task-question';
          q.innerHTML = task.question;
          wrap.appendChild(q);
        }

        const form = document.createElement('div');
        form.className = 'spr-task-form';

        let getSelection = () => null;

        if (task.type === 'choice') {
          const options = Array.isArray(task.options) ? task.options : [];
          const inputType = task.multiple ? 'checkbox' : 'radio';
          const optsWrap = document.createElement('div');
          optsWrap.className = 'spr-task-options';
          const inputs = [];
          options.forEach((opt, i) => {
            const label = document.createElement('label');
            label.className = 'spr-task-option';
            const input = document.createElement('input');
            input.type = inputType;
            input.name = 'sprTaskOption';
            input.value = String(i);
            const span = document.createElement('span');
            span.innerHTML = opt.text || '';
            label.appendChild(input);
            label.appendChild(span);
            optsWrap.appendChild(label);
            inputs.push({ input, correct: !!opt.correct, label });
          });
          form.appendChild(optsWrap);
          getSelection = () => inputs;
        } else {
          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'spr-task-input';
          input.placeholder = 'Ваш ответ…';
          form.appendChild(input);
          getSelection = () => input;
        }

        const checkBtn = document.createElement('button');
        checkBtn.type = 'button';
        checkBtn.className = 'spr-task-check-btn';
        checkBtn.textContent = 'Проверить';
        form.appendChild(checkBtn);

        const feedback = document.createElement('div');
        feedback.className = 'spr-task-feedback';

        wrap.appendChild(form);
        wrap.appendChild(feedback);
        els.task.appendChild(wrap);
        renderMathInContainer(wrap);

        checkBtn.addEventListener('click', () => {
          feedback.className = 'spr-task-feedback';
          if (task.type === 'choice') {
            const inputs = getSelection();
            const anySelected = inputs.some(o => o.input.checked);
            if (!anySelected) {
              feedback.textContent = 'Выберите хотя бы один вариант.';
              feedback.classList.add('spr-task-feedback-warn');
              return;
            }
            const isCorrect = inputs.every(o => o.input.checked === o.correct);
            inputs.forEach(o => {
              o.label.classList.toggle('spr-task-option-correct', o.correct);
              o.label.classList.toggle('spr-task-option-wrong', o.input.checked && !o.correct);
            });
            feedback.textContent = isCorrect ? 'Верно!' : 'Неверно. Правильные варианты подсвечены.';
            feedback.classList.add(isCorrect ? 'spr-task-feedback-ok' : 'spr-task-feedback-bad');
          } else {
            const input = getSelection();
            const userVal = (input.value || '').trim();
            if (!userVal) {
              feedback.textContent = 'Введите ответ.';
              feedback.classList.add('spr-task-feedback-warn');
              return;
            }
            let isCorrect;
            const expected = task.answer;
            const userNum = parseFloat(userVal.replace(',', '.'));
            const expectedNum = (typeof expected === 'number') ? expected : parseFloat(String(expected).replace(',', '.'));
            if (!isNaN(userNum) && !isNaN(expectedNum)) {
              const tol = (typeof task.tolerance === 'number') ? task.tolerance : 0;
              isCorrect = Math.abs(userNum - expectedNum) <= tol;
            } else {
              isCorrect = userVal.toLowerCase() === String(expected || '').trim().toLowerCase();
            }
            feedback.textContent = isCorrect ? 'Верно!' : 'Неверно, попробуйте ещё раз.';
            feedback.classList.add(isCorrect ? 'spr-task-feedback-ok' : 'spr-task-feedback-bad');
          }
          if (task.explanation) {
            const expl = document.createElement('div');
            expl.className = 'spr-task-explanation';
            expl.innerHTML = task.explanation;
            feedback.appendChild(expl);
            renderMathInContainer(expl);
          }
        });
      }


      // ===================================================================
      // АДМИН: СКАЧИВАНИЕ (MD, DOC, HTML)
      // ===================================================================
      function sanitizeFileName(name) {
        return name.replace(/[^a-zA-Zа-яА-ЯёЁ0-9\-_ ]/g, '_');
      }

      // -------- 1. Markdown (.md) ZIP --------
      async function generateMdZip() {
        await ensureAllDescriptions();
        const zip = new JSZip();
        const rootIds = getChildren(null);
        for (const id of rootIds) {
          const topic = topicsById.get(id);
          if (topic && filterTopic(id)) {
            addTopicToZipMd(zip, topic, '');
          }
        }
        zip.generateAsync({ type: 'blob' }).then((blob) => {
          saveAs(blob, 'mathframe_topics_md.zip');
        }).catch((err) => {
          alert('Ошибка создания архива MD: ' + err.message);
        });
      }

      function addTopicToZipMd(zip, topic, parentPath) {
        const safeTitle = sanitizeFileName(topic.title);
        const path = parentPath ? parentPath + '/' + safeTitle : safeTitle;

        if (topic.type === 'folder') {
          zip.folder(path);
          if (topic.description) {
            const folderDescName = `Описание папки — ${safeTitle}.md`;
            zip.file(path + '/' + folderDescName, topic.description);
          }
          const children = getChildren(topic.id);
          for (const childId of children) {
            const child = topicsById.get(childId);
            if (child && filterTopic(childId)) {
              addTopicToZipMd(zip, child, path);
            }
          }
        } else {
          const children = getChildren(topic.id);
          if (children.length > 0) {
            zip.folder(path);
            zip.file(path + '/' + safeTitle + '.md', topic.description || '');
            for (const childId of children) {
              const child = topicsById.get(childId);
              if (child && filterTopic(childId)) {
                addTopicToZipMd(zip, child, path);
              }
            }
          } else {
            const filePath = parentPath ? parentPath + '/' + safeTitle + '.md' : safeTitle + '.md';
            zip.file(filePath, topic.description || '');
          }
        }
      }

      // -------- 2. Word (.docx) ZIP — настоящий OOXML, формулы как OMML --------

      function escapeXml(str) {
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
      function escapeXmlAttr(str) {
        return escapeXml(str).replace(/"/g, '&quot;');
      }
      function cssColorToHex(c) {
        if (!c) return null;
        c = c.trim();
        let m = c.match(/^#([0-9a-fA-F]{6})$/);
        if (m) return m[1].toUpperCase();
        m = c.match(/^#([0-9a-fA-F]{3})$/);
        if (m) { const s = m[1]; return (s[0] + s[0] + s[1] + s[1] + s[2] + s[2]).toUpperCase(); }
        m = c.match(/^rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/i);
        if (m) return [1, 2, 3].map((i) => (+m[i]).toString(16).padStart(2, '0')).join('').toUpperCase();
        return null;
      }

      // ===== MathML -> OMML через встроенный официальный XSLT Microsoft (браузерный XSLTProcessor) =====
      let _mml2ommlProcessor = null;
      function getMml2OmmlProcessor() {
        if (_mml2ommlProcessor) return _mml2ommlProcessor;
        const xslText = document.getElementById('mml2ommlXsl').textContent;
        const xslDoc = new DOMParser().parseFromString(xslText, 'application/xml');
        const proc = new XSLTProcessor();
        proc.importStylesheet(xslDoc);
        _mml2ommlProcessor = proc;
        return proc;
      }

      function texToOmmlXml(expr, displayMode) {
        if (!window.katex) return null;
        let mathmlStr;
        try {
          mathmlStr = window.katex.renderToString(expr, { throwOnError: false, displayMode, output: 'mathml' });
        } catch (e) { return null; }
        try {
          const parsed = new DOMParser().parseFromString(mathmlStr, 'text/html');
          const mathEl = parsed.querySelector('math');
          if (!mathEl) return null;
          const mmlDoc = new DOMParser().parseFromString(new XMLSerializer().serializeToString(mathEl), 'application/xml');
          if (mmlDoc.getElementsByTagName('parsererror').length) return null;
          const proc = getMml2OmmlProcessor();
          const fragment = proc.transformToFragment(mmlDoc, document);
          const serializer = new XMLSerializer();
          let xml = '';
          fragment.childNodes.forEach((n) => { xml += serializer.serializeToString(n); });
          // Cambria Math — тот же шрифт, что Word подставляет в собственные формулы
          xml = xml.replace(/<m:r>(?!<w:rPr)/g, '<m:r><w:rPr><w:rFonts w:ascii="Cambria Math" w:hAnsi="Cambria Math"/></w:rPr>');
          return xml || null;
        } catch (e) {
          return null;
        }
      }

      // ===== Разбор HTML описания темы в последовательность абзацев WordprocessingML =====

      function pushTextWithFormulas(text, style, runs) {
        const regex = /\$\$([\s\S]+?)\$\$|\$([^\$\n]+?)\$/g;
        let lastIndex = 0, match;
        while ((match = regex.exec(text))) {
          if (match.index > lastIndex) runs.push({ type: 'text', text: text.slice(lastIndex, match.index), style });
          const isBlock = match[1] !== undefined;
          const expr = isBlock ? match[1] : match[2];
          runs.push({ type: 'formula', expr, display: isBlock });
          lastIndex = regex.lastIndex;
        }
        if (lastIndex < text.length) runs.push({ type: 'text', text: text.slice(lastIndex), style });
      }

      function collectInlineRuns(node, style, runs) {
        if (node.nodeType === Node.TEXT_NODE) {
          if (node.nodeValue) pushTextWithFormulas(node.nodeValue, style, runs);
          return;
        }
        if (node.nodeType !== Node.ELEMENT_NODE) return;
        const tag = node.tagName.toLowerCase();
        if (tag === 'br') { runs.push({ type: 'break' }); return; }
        if (tag === 'ul' || tag === 'ol') return; // вложенные списки обрабатываются отдельно в walkList
        const newStyle = Object.assign({}, style);
        if (tag === 'strong' || tag === 'b') newStyle.bold = true;
        if (tag === 'em' || tag === 'i') newStyle.italic = true;
        if (tag === 'u') newStyle.underline = true;
        if (tag === 's' || tag === 'strike' || tag === 'del') newStyle.strike = true;
        if (tag === 'sup') newStyle.vertAlign = 'superscript';
        if (tag === 'sub') newStyle.vertAlign = 'subscript';
        if (tag === 'code') newStyle.code = true;
        const inlineStyleAttr = node.getAttribute && node.getAttribute('style');
        if (inlineStyleAttr) {
          if (/font-weight\s*:\s*(bold|[6-9]\d\d)/i.test(inlineStyleAttr)) newStyle.bold = true;
          if (/font-style\s*:\s*italic/i.test(inlineStyleAttr)) newStyle.italic = true;
          if (/text-decoration[^;]*underline/i.test(inlineStyleAttr)) newStyle.underline = true;
          if (/text-decoration[^;]*line-through/i.test(inlineStyleAttr)) newStyle.strike = true;
          const colorMatch = inlineStyleAttr.match(/(?:^|;)\s*color\s*:\s*([^;]+)/i);
          if (colorMatch) { const hex = cssColorToHex(colorMatch[1]); if (hex) newStyle.color = hex; }
        }
        if (tag === 'a') {
          const href = node.getAttribute('href') || '';
          if (href && !/^topic:/.test(href)) newStyle.href = href;
        }
        for (const child of Array.from(node.childNodes)) collectInlineRuns(child, newStyle, runs);
      }

      function runPropsXml(style) {
        let rpr = '';
        if (style.hyperlink) rpr += '<w:rStyle w:val="Hyperlink"/>';
        if (style.code) rpr += '<w:rFonts w:ascii="Consolas" w:hAnsi="Consolas"/><w:shd w:val="clear" w:fill="F1F3F5"/>';
        if (style.bold) rpr += '<w:b/>';
        if (style.italic) rpr += '<w:i/>';
        if (style.underline) rpr += '<w:u w:val="single"/>';
        if (style.strike) rpr += '<w:strike/>';
        if (style.vertAlign) rpr += `<w:vertAlign w:val="${style.vertAlign}"/>`;
        if (style.color) rpr += `<w:color w:val="${style.color}"/>`;
        return rpr ? `<w:rPr>${rpr}</w:rPr>` : '';
      }

      function textRunXml(text, style, ctx) {
        if (!text) return '';
        style = style || {};
        if (style.href && ctx) {
          const relId = ctx.addHyperlink(style.href);
          const linkStyle = Object.assign({}, style, { hyperlink: true });
          delete linkStyle.href;
          return `<w:hyperlink r:id="${relId}" w:history="1"><w:r>${runPropsXml(linkStyle)}<w:t xml:space="preserve">${escapeXml(text)}</w:t></w:r></w:hyperlink>`;
        }
        return `<w:r>${runPropsXml(style)}<w:t xml:space="preserve">${escapeXml(text)}</w:t></w:r>`;
      }

      function runsToXml(runs, ctx) {
        let xml = '';
        for (const run of runs) {
          if (run.type === 'break') { xml += '<w:r><w:br/></w:r>'; continue; }
          if (run.type === 'formula') {
            const omml = texToOmmlXml(run.expr, run.display);
            xml += omml ? omml : textRunXml((run.display ? '$$' : '$') + run.expr + (run.display ? '$$' : '$'), {}, ctx);
            continue;
          }
          if (run.type === 'text') xml += textRunXml(run.text, run.style, ctx);
        }
        return xml;
      }

      function paragraphXml(runsXml, pStyle, listInfo) {
        let ppr = '';
        if (pStyle) ppr += `<w:pStyle w:val="${pStyle}"/>`;
        if (listInfo) ppr += `<w:numPr><w:ilvl w:val="${listInfo.ilvl}"/><w:numId w:val="${listInfo.numId}"/></w:numPr>`;
        const pprXml = ppr ? `<w:pPr>${ppr}</w:pPr>` : '';
        return `<w:p>${pprXml}${runsXml}</w:p>`;
      }

      function isFormulaOnlyBlock(el) {
        const t = (el.textContent || '').trim();
        const m = t.match(/^\$\$([\s\S]+)\$\$$/);
        return m ? m[1] : null;
      }

      function displayFormulaParagraph(expr, ctx) {
        const omml = texToOmmlXml(expr, true);
        const inner = omml ? `<m:oMathPara>${omml}</m:oMathPara>` : textRunXml('$$' + expr + '$$', {}, ctx);
        return `<w:p><w:pPr><w:jc w:val="center"/></w:pPr>${inner}</w:p>`;
      }

      const DOCX_BLOCK_TAGS = new Set(['P', 'DIV', 'UL', 'OL', 'LI', 'BLOCKQUOTE', 'PRE', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'TABLE', 'HR']);
      function hasBlockChildren(el) {
        return Array.from(el.children || []).some((c) => DOCX_BLOCK_TAGS.has(c.tagName));
      }

      function walkList(listEl, ctx, numId, ilvl, out) {
        const level = Math.min(ilvl, 2);
        for (const li of Array.from(listEl.children)) {
          if (li.tagName.toLowerCase() !== 'li') continue;
          const runs = [];
          const nested = [];
          for (const child of Array.from(li.childNodes)) {
            if (child.nodeType === Node.ELEMENT_NODE && (child.tagName === 'UL' || child.tagName === 'OL')) {
              nested.push(child);
            } else {
              collectInlineRuns(child, {}, runs);
            }
          }
          out.push(paragraphXml(runsToXml(runs, ctx), 'ListParagraph', { numId, ilvl: level }));
          for (const nl of nested) {
            const abstractId = nl.tagName === 'UL' ? 0 : 1;
            const childNumId = ctx.newNumId(abstractId);
            walkList(nl, ctx, childNumId, ilvl + 1, out);
          }
        }
      }

      function tableToXml(tableEl, ctx) {
        const rows = Array.from(tableEl.querySelectorAll('tr'));
        if (!rows.length) return '';
        const colCount = Math.max(...rows.map((r) => r.children.length)) || 1;
        const colWidth = Math.floor(8500 / colCount);
        let gridCols = '';
        for (let i = 0; i < colCount; i++) gridCols += `<w:gridCol w:w="${colWidth}"/>`;
        let rowsXml = '';
        for (const row of rows) {
          let cellsXml = '';
          for (const cell of Array.from(row.children)) {
            const isHeader = cell.tagName.toLowerCase() === 'th';
            const runs = [];
            collectInlineRuns(cell, isHeader ? { bold: true } : {}, runs);
            const cellPara = paragraphXml(runsToXml(runs, ctx));
            const shd = isHeader ? '<w:shd w:val="clear" w:fill="EEF2FF"/>' : '';
            cellsXml += `<w:tc><w:tcPr><w:tcW w:w="${colWidth}" w:type="dxa"/>${shd}</w:tcPr>${cellPara}</w:tc>`;
          }
          rowsXml += `<w:tr>${cellsXml}</w:tr>`;
        }
        const borders = '<w:tblBorders><w:top w:val="single" w:sz="4" w:color="CBD5E1"/><w:left w:val="single" w:sz="4" w:color="CBD5E1"/><w:bottom w:val="single" w:sz="4" w:color="CBD5E1"/><w:right w:val="single" w:sz="4" w:color="CBD5E1"/><w:insideH w:val="single" w:sz="4" w:color="CBD5E1"/><w:insideV w:val="single" w:sz="4" w:color="CBD5E1"/></w:tblBorders>';
        return `<w:tbl><w:tblPr><w:tblW w:w="8500" w:type="dxa"/>${borders}</w:tblPr><w:tblGrid>${gridCols}</w:tblGrid>${rowsXml}</w:tbl><w:p/>`;
      }

      function blockToParagraphs(el, ctx, opts) {
        opts = opts || {};
        const out = [];
        if (el.nodeType === Node.TEXT_NODE) {
          if (el.nodeValue && el.nodeValue.trim()) {
            const runs = [];
            pushTextWithFormulas(el.nodeValue, {}, runs);
            out.push(paragraphXml(runsToXml(runs, ctx), opts.pStyle || 'Normal'));
          }
          return out;
        }
        if (el.nodeType !== Node.ELEMENT_NODE) return out;
        const tag = el.tagName.toLowerCase();

        if (/^h[1-6]$/.test(tag)) {
          const level = Math.min(parseInt(tag[1], 10), 4);
          const runs = []; collectInlineRuns(el, {}, runs);
          out.push(paragraphXml(runsToXml(runs, ctx), 'Heading' + level));
        } else if (tag === 'p' || tag === 'div') {
          const displayFormula = isFormulaOnlyBlock(el);
          if (displayFormula) {
            out.push(displayFormulaParagraph(displayFormula, ctx));
          } else if (hasBlockChildren(el)) {
            for (const child of Array.from(el.childNodes)) out.push(...blockToParagraphs(child, ctx, opts));
          } else {
            const runs = []; collectInlineRuns(el, {}, runs);
            if (runs.length) out.push(paragraphXml(runsToXml(runs, ctx), opts.pStyle || 'Normal'));
          }
        } else if (tag === 'blockquote') {
          if (hasBlockChildren(el)) {
            for (const child of Array.from(el.children)) out.push(...blockToParagraphs(child, ctx, { pStyle: 'Quote' }));
          } else {
            const runs = []; collectInlineRuns(el, {}, runs);
            out.push(paragraphXml(runsToXml(runs, ctx), 'Quote'));
          }
        } else if (tag === 'pre') {
          (el.textContent || '').split('\n').forEach((line) => {
            out.push(paragraphXml(textRunXml(line, {}, ctx), 'CodeBlock'));
          });
        } else if (tag === 'hr') {
          out.push('<w:p><w:pPr><w:pBdr><w:bottom w:val="single" w:sz="6" w:space="1" w:color="CBD5E1"/></w:pBdr></w:pPr></w:p>');
        } else if (tag === 'ul' || tag === 'ol') {
          const abstractId = tag === 'ul' ? 0 : 1;
          const numId = ctx.newNumId(abstractId);
          walkList(el, ctx, numId, 0, out);
        } else if (tag === 'table') {
          out.push(tableToXml(el, ctx));
        } else if (tag === 'br') {
          // игнорируем на верхнем уровне
        } else if (hasBlockChildren(el)) {
          for (const child of Array.from(el.childNodes)) out.push(...blockToParagraphs(child, ctx, opts));
        } else {
          const runs = []; collectInlineRuns(el, {}, runs);
          if (runs.length) out.push(paragraphXml(runsToXml(runs, ctx), opts.pStyle || 'Normal'));
        }
        return out;
      }

      function descriptionToDocxBodyXml(html, title, ctx) {
        const container = document.createElement('div');
        container.innerHTML = html || '';
        const paragraphs = [paragraphXml(textRunXml(title, {}, ctx), 'Title')];
        for (const node of Array.from(container.childNodes)) {
          paragraphs.push(...blockToParagraphs(node, ctx));
        }
        if (paragraphs.length === 1) paragraphs.push('<w:p/>');
        return paragraphs.join('');
      }

      function docxCoreProps(title) {
        const now = new Date().toISOString();

      function docxNumberingXml(numDefs) {

          nums += `<w:num w:numId="${d.numId}"><w:abstractNumId w:val="${d.abstractId}"/><w:lvlOverride w:ilvl="0"><w:startOverride w:val="1"/></w:lvlOverride></w:num>`;

      function docxDocumentRels(hyperlinks) {
        let rels = `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/>`;
        for (const h of hyperlinks) {
          rels += `<Relationship Id="${h.id}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/hyperlink" Target="${escapeXmlAttr(h.url)}" TargetMode="External"/>`;
        }
        return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

${rels}

<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:m="http://schemas.openxmlformats.org/officeDocument/2006/math" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<w:body>
${bodyXml}
<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="850" w:bottom="1134" w:left="1701" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr>
</w:body>
</w:document>`;
      }

      function makeDocxCtx() {
        let numCounter = 10;
        let hyperlinkCounter = 100;
        const numDefs = [];
        const hyperlinks = [];
        const hyperlinkCache = new Map();
        return {
          numDefs, hyperlinks,
          newNumId(abstractId) {
            const id = numCounter++;
            numDefs.push({ numId: id, abstractId });
            return id;
          },
          addHyperlink(url) {
            if (hyperlinkCache.has(url)) return hyperlinkCache.get(url);
            const id = 'rId' + (hyperlinkCounter++);
            hyperlinks.push({ id, url });
            hyperlinkCache.set(url, id);
            return id;
          },
        };
      }

      function buildTopicDocxBlob(title, descriptionHtml) {
        const ctx = makeDocxCtx();
        const bodyXml = descriptionToDocxBodyXml(descriptionHtml, title, ctx);
        const documentXml = docxDocumentXml(bodyXml);
        const numberingXml = docxNumberingXml(ctx.numDefs);
        const relsXml = docxDocumentRels(ctx.hyperlinks);

        const docZip = new JSZip();
        docZip.file('[Content_Types].xml', DOCX_CONTENT_TYPES);
        docZip.file('_rels/.rels', DOCX_RELS_ROOT);
        docZip.file('docProps/core.xml', docxCoreProps(title));
        docZip.file('docProps/app.xml', DOCX_APP_PROPS);
        docZip.file('word/document.xml', documentXml);
        docZip.file('word/styles.xml', DOCX_STYLES);
        docZip.file('word/numbering.xml', numberingXml);
        docZip.file('word/_rels/document.xml.rels', relsXml);
        return docZip.generateAsync({ type: 'blob' });
      }

      async function generateDocxZip() {
        await ensureAllDescriptions();
        const zip = new JSZip();
        const rootIds = getChildren(null);
        (async () => {
          for (const id of rootIds) {
            const topic = topicsById.get(id);
            if (topic && filterTopic(id)) {
              await addTopicToZipDocx(zip, topic, '');
            }
          }
          const blob = await zip.generateAsync({ type: 'blob' });
          saveAs(blob, 'mathframe_topics_docx.zip');
        })().catch((err) => {
          alert('Ошибка создания архива Word: ' + err.message);
        });
      }

      async function addTopicToZipDocx(zip, topic, parentPath) {
        const safeTitle = sanitizeFileName(topic.title);
        const path = parentPath ? parentPath + '/' + safeTitle : safeTitle;

        if (topic.type === 'folder') {
          zip.folder(path);
          if (topic.description) {
            const folderDescName = `Описание папки — ${safeTitle}.docx`;
            const blob = await buildTopicDocxBlob('Описание папки: ' + topic.title, topic.description);
            zip.file(path + '/' + folderDescName, blob);
          }
          const children = getChildren(topic.id);
          for (const childId of children) {
            const child = topicsById.get(childId);
            if (child && filterTopic(childId)) {
              await addTopicToZipDocx(zip, child, path);
            }
          }
        } else {
          const children = getChildren(topic.id);
          if (children.length > 0) {
            zip.folder(path);
            const blob = await buildTopicDocxBlob(topic.title, topic.description);
            zip.file(path + '/' + safeTitle + '.docx', blob);
            for (const childId of children) {
              const child = topicsById.get(childId);
              if (child && filterTopic(childId)) {
                await addTopicToZipDocx(zip, child, path);
              }
            }
          } else {
            const filePath = parentPath ? parentPath + '/' + safeTitle + '.docx' : safeTitle + '.docx';
            const blob = await buildTopicDocxBlob(topic.title, topic.description);
            zip.file(filePath, blob);
          }
        }
      }

            .toggle-link { cursor: pointer; color: #818cf8; font-size: 0.9rem; margin-left: 0.5rem; }
            .toggle-link:hover { text-decoration: underline; }
            .toc { background: #f1f5f9; padding: 1rem 1.5rem; border-radius: 0.5rem; margin-bottom: 2rem; }
            .toc ul { list-style: none; padding-left: 1.5rem; }
            .toc li { margin: 0.3rem 0; }
            .toc a { text-decoration: none; color: #1e293b; }
            .toc a:hover { color: #818cf8; }
          </style>
        </head>
        <body>
          <h1>MathFrame — все темы</h1>
          <div class="toc" id="toc"><h3>Содержание</h3><ul id="tocList"></ul></div>
        `;

        const rootIds = getChildren(null);
        let tocHtml = '';
        let contentHtml = '';

        function buildTopicHtml(topic, level) {
          const id = topic.id;
          const title = escapeHtml(topic.title);
          const tag = level <= 2 ? 'h' + (level + 1) : 'h3';
          const indent = (level - 1) * 20;

          tocHtml += `<li style="margin-left:${(level-1)*20}px;"><a href="#${id}">${title}</a></li>`;

          let html = `<div class="topic" id="${id}" style="margin-left:${indent}px;">`;
          html += `<${tag}>${title}</${tag}>`;
          html += `<div class="topic-meta">Тип: ${topic.type} | Класс: ${topic.class || '—'}</div>`;
          if (topic.description) {
            // Заменяем ссылки вида topic:... на #...
            let desc = topic.description;
            desc = desc.replace(/href="topic:([^"]*)"/g, 'href="#$1"');
            html += `<div class="topic-description">${desc}</div>`;
          }
          const children = getChildren(topic.id);
          if (children.length > 0) {
            html += `<div class="topic-children" id="children-${id}">`;
            for (const childId of children) {
              const child = topicsById.get(childId);
              if (child && filterTopic(childId)) {
                html += buildTopicHtml(child, level + 1);
              }
            }
            html += `</div>`;
            html += `<span class="toggle-link" data-target="children-${id}">Свернуть</span>`;
          }
          html += '</div>';
          return html;
        }

        for (const id of rootIds) {
          const topic = topicsById.get(id);
          if (topic && filterTopic(id)) {
            contentHtml += buildTopicHtml(topic, 1);
          }
        }

        html += contentHtml;
        // Добавляем скрипты отдельно, разбивая тег <script>
        html += `
          <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"><\/script>
          <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"><\/script>
          <script>
            document.addEventListener('DOMContentLoaded', function() {
              document.querySelectorAll('.toggle-link').forEach(function(link) {
                link.addEventListener('click', function() {
                  var targetId = this.dataset.target;
                  var children = document.getElementById(targetId);
                  if (!children) return;
                  children.classList.toggle('collapsed');
                  this.textContent = children.classList.contains('collapsed') ? 'Развернуть' : 'Свернуть';
                });
              });
              if (typeof renderMathInElement === 'function') {
                renderMathInElement(document.body, {
                  delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                  ],
                  throwOnError: false
                });
              }
            });
          <\/script>
        `;
        html += '</body></html>';

        const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
        saveAs(blob, 'mathframe_all_topics.html');
      }

      // ===================================================================
      // МОДАЛЬНОЕ ОКНО ВЫБОРА ФОРМАТА
      // ===================================================================
      function showDownloadModal() {
        els.downloadOverlay.classList.add('active');
      }

      function hideDownloadModal() {
        els.downloadOverlay.classList.remove('active');
      }

      // ===================================================================
      // АУТЕНТИФИКАЦИЯ И ПРОВЕРКА АДМИНА
      // ===================================================================
      function checkAdmin(user) {
        if (!user) {
          isAdmin = false;
          els.adminActions.classList.add('hidden');
          refreshExampleAdminUi();
          return;
        }
        // Владельцы сайта — те, кто может назначать администраторов. Тот же список, что в правилах Firestore (isSuper()) и в api/chat.js.
        const SUPER_ADMIN_EMAILS = ['iagniukovd@gmail.com', 'daniksgames5242@gmail.com', 'mathframe.ru@gmail.com', 'danil.iagniukov@gmail.com'];
        if (SUPER_ADMIN_EMAILS.includes(String(user.email || '').toLowerCase())) {
          isAdmin = true;
          els.adminActions.classList.remove('hidden');
          refreshExampleAdminUi();
          return;
        }
        const db = firebase.firestore();
        db.collection('admins').doc(user.uid).get().then(doc => {
          if (doc.exists && doc.data().granted === true) {
            isAdmin = true;
            els.adminActions.classList.remove('hidden');
          } else {
            isAdmin = false;
            els.adminActions.classList.add('hidden');
          }
          refreshExampleAdminUi();
        }).catch(() => {
          isAdmin = false;
          els.adminActions.classList.add('hidden');
          refreshExampleAdminUi();
        });
      }

      // isAdmin резолвится асинхронно (после Firebase/Firestore), поэтому к моменту
      // первого renderExample() он мог быть ещё не известен — как только он
      // становится известен или меняется, перерисовываем блок примера текущей темы,
      // чтобы кнопки создания/удаления/IDE появились или исчезли без перехода на
      // другую тему и обратно.
      function refreshExampleAdminUi() {
        if (currentId == null) return;
        const topic = topicsById.get(currentId);
        if (topic) renderExample(topic);
      }

      function initAuth() {
        if (window.Auth) {
          window.Auth.onAuthChange(user => {
            currentUser = user;
            checkAdmin(user);
          });
        } else {
          document.addEventListener('authReady', () => {
            window.Auth.onAuthChange(user => {
              currentUser = user;
              checkAdmin(user);
            });
          });
        }
      }

      // ===================================================================
      // ИНИЦИАЛИЗАЦИЯ
      // ===================================================================
      async function init() {
        if (!mountLayout()) return;
        setupUiHandlers();
        restoreSidebarWidth();
        initResizer();

        initAuth();

        els.downloadBtn.addEventListener('click', showDownloadModal);
        els.downloadCancel.addEventListener('click', hideDownloadModal);
        els.downloadOverlay.addEventListener('click', (e) => {
          if (e.target === els.downloadOverlay) hideDownloadModal();
        });
        els.downloadMd.addEventListener('click', () => {
          hideDownloadModal();
          generateMdZip();
        });
        els.downloadDoc.addEventListener('click', () => {
          hideDownloadModal();
          generateDocxZip();
        });
        els.downloadHtml.addEventListener('click', () => {
          hideDownloadModal();
          generateSingleHtml();
        });

        setupSimplifyHandlers();
        setupReportHandler();

        try {
          const data = await loadConfig();
          buildIndexes(data);
          // Загрузочный экран убираем после первой отрисовки темы и восстановления
          // прокрутки (ниже) — чтобы не было видно, как страница «доезжает».
        } catch (e) {
          hideLoader();
          showEmptyState('Не удалось загрузить справочник: ' + e.message);
          console.error(e);
          return;
        }

        if (topics.length === 0) {
          hideLoader();
          showEmptyState('В справочнике пока нет ни одной темы.');
          return;
        }

        // Фильтры, поиск и раскрытые узлы дерева — как были до перезагрузки;
        // если сохранённого состояния нет — по умолчанию раскрыты корневые папки.
        if (!restoreTreeState()) {
          getChildren(null).forEach(id => {
            const t = topicsById.get(id);
            if (t && t.type === 'folder') expanded.add(id);
          });
        }

        // Тема: из адреса (#id или ?topic=id), иначе последняя открытая, иначе первая.
        const urlId = topicIdFromUrl();
        let lastId = savedState.id;
        if (!lastId) { try { lastId = localStorage.getItem(LAST_TOPIC_KEY); } catch (e) {} }
        let startId = urlId && topicsById.has(urlId) ? urlId
          : (lastId && topicsById.has(lastId) ? lastId : getFilteredChildren(null)[0]);
        if (startId) {
          historyStack = [startId];
          historyIndex = 0;
          targetId = startId;
          setUrlTopic(startId, true);   // без лишней записи в истории
        }

        const savedTreeScroll = Number(savedState.tree) || 0;
        const savedScroll = startId ? Number(savedState.scroll[startId]) || 0 : 0;
        restoringTreeScroll = true;
        renderTree();
        if (startId) renderTopic(startId, { skipScroll: true });
        if (savedTreeScroll) els.tree.scrollTop = savedTreeScroll;
        setTimeout(() => { restoringTreeScroll = false; }, 400);

        stateReady = true;
        setupStatePersistence();
        if (startId) restoreScrollPosition(savedScroll);
        hideLoader();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
