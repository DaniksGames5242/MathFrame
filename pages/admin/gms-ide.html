<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>GMS IDE</title>
<style>
  :root{
    --bg:#1b1b2a; --panel:#20202f; --gutter:#181824; --border:#3a3a52;
    --text:#e8e8f0; --muted:#9494ac; --accent:#7c7cff; --err:#ff6b6b; --ok:#5ad48a;
    --kwPrefix:#7c9cff; --kwType:#e0a84f; --kwDecl:#4fc3e0; --str:#8fd18a; --num:#d18ad1;
    --com:#6a6a86; --bool:#ff9d5c; --key:#c9c9ff;
    --lh:19.5px; --fs:13px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif}
  #menubar{display:flex;align-items:center;gap:2px;padding:4px 8px;background:var(--panel);border-bottom:1px solid var(--border)}
  .menu{position:relative}
  .menu-btn{background:transparent;border:none;color:var(--text);padding:6px 10px;cursor:pointer;font-size:13px;border-radius:4px}
  .menu-btn:hover{background:#2a2a40}
  .menu.open .menu-btn{background:#2a2a40}
  .menu-drop{position:absolute;top:100%;left:0;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:4px;display:none;flex-direction:column;min-width:220px;z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.4)}
  .menu.open .menu-drop{display:flex}
  .menu-drop button{background:transparent;border:none;color:var(--text);text-align:left;padding:7px 10px;border-radius:4px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;gap:14px}
  .menu-drop button:hover{background:var(--accent);color:#fff}
  .menu-drop button.primary{color:var(--accent);font-weight:600}
  .menu-drop button.primary:hover{color:#fff}
  .hint{color:var(--muted);font-size:11px}
  .menu-drop button:hover .hint{color:#e8e8ff}
  #filename{color:var(--muted);font-size:13px;margin-left:auto;white-space:nowrap;padding:0 6px}
  #main{display:flex;height:calc(100% - 38px)}
  #editorCol{display:flex;flex-direction:column;flex:1;min-width:0;border-right:1px solid var(--border)}
  #editorWrap{position:relative;flex:1;display:flex;overflow:hidden}
  #gutter{width:46px;flex:none;background:var(--gutter);color:var(--muted);font:var(--fs)/var(--lh) monospace;text-align:right;padding:10px 6px 10px 0;overflow:hidden;white-space:pre}
  #gutter div{height:var(--lh)}
  #codeArea{position:relative;flex:1;overflow:hidden}
  #highlight,#code,#colorLayer{position:absolute;top:0;left:0;right:0;bottom:0;margin:0;padding:10px;font:var(--fs)/var(--lh) monospace;white-space:pre;box-sizing:border-box;tab-size:4;-moz-tab-size:4}
  /* доп. правый отступ, чтобы длинные строки не упирались в край окна (п.10) */
  #highlight,#code,#colorLayer{padding-right:28px}
  /* ВАЖНО: только #code — «источник правды» для скролла (overflow:auto). #highlight и
     #colorLayer раньше тоже имели overflow:auto — из-за этого наведение курсора на
     иконку цвета (у неё pointer-events:auto) перехватывало колесо мыши и скроллило
     #colorLayer отдельно от textarea, а gutter/highlight на секунду отставали от
     реального scrollTop — отсюда «съезжающие» при пролистывании иконки. Теперь у
     этих слоёв overflow:hidden — визуально они всё равно двигаются вместе с #code,
     так как их scrollTop выставляется программно в syncOverlayScroll(), но сами по
     себе (колесом/тачем) прокручиваться уже не могут.*/
  #highlight,#colorLayer{overflow:hidden}
  #code{overflow:auto}
  #highlight{color:var(--text);pointer-events:none;background:transparent}
  #highlight div{height:var(--lh);white-space:pre}
  #code{background:transparent;color:transparent;caret-color:var(--text);border:none;resize:none;z-index:2}
  #code::selection{background:#3a3a6a}
  #colorLayer{pointer-events:none;z-index:3}
  .swatch{position:absolute;width:14px;height:14px;border-radius:3px;border:1px solid rgba(255,255,255,.5);cursor:pointer;pointer-events:auto;padding:0;background-image:repeating-conic-gradient(#888 0% 25%, #3a3a52 0% 50%);background-size:8px 8px}
  .kwp{color:var(--kwPrefix);font-weight:600}
  .kwt{color:var(--kwType);font-weight:600}
  .kwd{color:var(--kwDecl)}
  .str{color:var(--str)}
  .num{color:var(--num)}
  .col-lit{color:var(--num)}
  .bool{color:var(--bool);font-weight:600}
  .key{color:var(--key)}
  .com{color:var(--com);font-style:italic}
  .err-line{text-decoration:underline wavy var(--err);text-decoration-thickness:1.5px;text-underline-offset:3px}
  #errors{height:120px;background:#160f14;border-top:1px solid var(--border);overflow:auto;font:12px/1.5 monospace;padding:6px 10px}
  #errors .ok{color:var(--ok)}
  #errors .e{color:var(--err);cursor:pointer;padding:1px 0;display:block}
  #errors .e.js-err{color:#ffa94d;cursor:default}
  #preview{flex:1;min-width:0;display:none;flex-direction:column}
  #preview.show{display:flex}
  #previewBar{display:flex;gap:6px;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--border)}
  #previewBar span{color:var(--muted);font-size:12px}
  #previewHost{flex:1;min-height:0}
  #previewFrame{width:100%;height:100%;border:none}
  #findBar{position:absolute;top:8px;right:24px;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:6px;display:none;gap:6px;align-items:center;z-index:5}
  #findBar.show{display:flex}
  #findBar input{background:#12121c;border:1px solid var(--border);color:var(--text);border-radius:4px;padding:4px 6px;font:12px monospace}
  #findCount{color:var(--muted);font-size:12px;min-width:50px}
  #suggest{position:absolute;background:var(--panel);border:1px solid var(--accent);border-radius:6px;z-index:30;display:none;font:13px monospace;min-width:170px;box-shadow:0 8px 22px rgba(0,0,0,.5)}
  #suggestHead{display:flex;align-items:center;justify-content:space-between;padding:3px 4px 3px 8px;cursor:move;user-select:none;border-bottom:1px solid var(--border);background:#26263a;border-radius:6px 6px 0 0}
  #suggestDrag{color:var(--muted);font-size:12px;letter-spacing:1px}
  #suggestClose{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 6px;line-height:1;border-radius:3px}
  #suggestClose:hover{color:#fff;background:var(--err)}
  #suggestList{max-height:160px;overflow:auto}
  #suggestList div{padding:4px 10px;cursor:pointer}
  #suggestList div.sel,#suggestList div:hover{background:var(--accent);color:#fff}
  #colorPickerInput{position:fixed;left:0;top:0;width:16px;height:16px;opacity:0;pointer-events:none;border:none;padding:0}

  /* ===== Панель переключения между файлами набора ===== */
  #filesBar{display:flex;align-items:center;gap:6px;padding:5px 8px;background:#191927;border-bottom:1px solid var(--border);font-size:12px}
  #filesBar button{background:#26263a;border:1px solid var(--border);color:var(--text);border-radius:4px;padding:4px 9px;cursor:pointer;font-size:12px}
  #filesBar button:hover{background:var(--accent);color:#fff}
  #filesBar button:disabled{opacity:.4;cursor:default}
  #filesBar button:disabled:hover{background:#26263a;color:var(--text)}
  #fileSelect{background:#12121c;border:1px solid var(--border);color:var(--text);border-radius:4px;padding:4px 6px;font-size:12px;max-width:260px}
  #fileCount{color:var(--muted);white-space:nowrap}
  #filesBarSpacer{flex:1}
  #currentFileLabel{font-weight:600;font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
  #currentFileLabel .dirty-dot{color:var(--accent);margin-left:4px}
  .file-badge{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
  .file-badge.ok{background:var(--ok)}
  .file-badge.err{background:var(--err)}
  .file-badge.unknown{background:var(--muted)}

  /* ===== Заметки к файлу ===== */
  #notesPanel{display:none;flex-direction:column;height:150px;background:#141420;border-top:1px solid var(--border)}
  #notesPanel.show{display:flex}
  #notesHeader{display:flex;align-items:center;gap:8px;padding:5px 10px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border)}
  #notesHeader b{color:var(--text)}
  #notesHeader button{margin-left:auto;background:#26263a;border:1px solid var(--border);color:var(--text);border-radius:4px;padding:3px 8px;cursor:pointer;font-size:11px}
  #notesHeader button:hover{background:var(--accent);color:#fff}
  #notesArea{flex:1;resize:none;border:none;background:transparent;color:var(--text);font:13px/1.5 'Segoe UI',Arial,sans-serif;padding:8px 10px;outline:none}
</style>
</head>
<body>
<div id="menubar">
  <div class="menu" id="menuFile">
    <button class="menu-btn">Файл</button>
    <div class="menu-drop">
      <button id="btnNew">Новый файл <span class="hint">Ctrl+N</span></button>
      <button id="btnOpen">Открыть файл</button>
      <button id="btnOpenFolder">Открыть папку (много файлов)</button>
      <button id="btnCloseFile">Закрыть текущий файл</button>
      <button id="btnSave">Сохранить</button>
      <button id="btnCompileSave">Скомпилировать и сохранить</button>
      <button id="btnCompileRun" class="primary">Скомпилировать, сохранить и запустить <span class="hint">Ctrl+S</span></button>
      <button id="btnCompileAllFolder">Скомпилировать все файлы набора</button>
      <button id="btnChooseOutFolder">Выбрать папку для сохранения компиляций</button>
    </div>
  </div>
  <div class="menu" id="menuEdit">
    <button class="menu-btn">Правка</button>
    <div class="menu-drop">
      <button id="editUndo">Отменить <span class="hint">Ctrl+Z</span></button>
      <button id="editRedo">Повторить <span class="hint">Ctrl+Y</span></button>
      <button id="editCut">Вырезать <span class="hint">Ctrl+X</span></button>
      <button id="editCopy">Копировать <span class="hint">Ctrl+C</span></button>
      <button id="editPaste">Вставить <span class="hint">Ctrl+V</span></button>
      <button id="editSelectAll">Выделить всё <span class="hint">Ctrl+A</span></button>
      <button id="editComment">Закомментировать / раскомментировать <span class="hint">Ctrl+K</span></button>
      <button id="editFind">Найти <span class="hint">Ctrl+F</span></button>
      <button id="editRefresh">Обновить проверку <span class="hint">F5</span></button>
    </div>
  </div>
  <div class="menu" id="menuSettings">
    <button class="menu-btn">Настройки</button>
    <div class="menu-drop">
      <button id="toggleAutoClose">Автозакрытие скобок/кавычек <span class="hint" id="stAutoClose">Вкл</span></button>
      <button id="toggleAutoPunct">Автопостановка ; и , <span class="hint" id="stAutoPunct">Вкл</span></button>
      <button id="toggleAutoSuggest">Автоподсказки полей/переменных <span class="hint" id="stAutoSuggest">Вкл</span></button>
      <button id="toggleAutoIndent">Умный отступ (Enter) <span class="hint" id="stAutoIndent">Вкл</span></button>
    </div>
  </div>
  <div class="menu" id="menuNotes">
    <button class="menu-btn">Заметки</button>
    <div class="menu-drop">
      <button id="btnToggleNotes">Показать/скрыть заметки к файлу</button>
      <button id="btnExportNotes">Экспортировать все заметки…</button>
    </div>
  </div>
  <span id="filename">файл не выбран</span>
</div>
<div id="filesBar">
  <button id="btnPrevFile" title="Предыдущий файл (Alt+←)">◀</button>
  <select id="fileSelect" title="Выбрать файл из набора"></select>
  <button id="btnNextFile" title="Следующий файл (Alt+→)">▶</button>
  <span id="fileCount"></span>
  <span id="filesBarSpacer"></span>
  <span id="currentFileLabel">файл не выбран</span>
  <input type="file" id="folderInput" webkitdirectory multiple style="display:none">
</div>
<div id="main">
  <div id="editorCol">
    <div id="editorWrap">
      <div id="gutter"></div>
      <div id="codeArea">
        <div id="highlight"></div>
        <div id="colorLayer"></div>
        <textarea id="code" spellcheck="false" wrap="off" placeholder="Создайте или откройте .gms файл..."></textarea>
        <div id="findBar">
          <input id="findInput" placeholder="Поиск...">
          <span id="findCount"></span>
          <button id="findPrev">&uarr;</button>
          <button id="findNext">&darr;</button>
          <button id="findClose">✕</button>
        </div>
        <div id="suggest">
          <div id="suggestHead"><span id="suggestDrag" title="Перетащить">⠿⠿</span><button id="suggestClose" title="Закрыть">✕</button></div>
          <div id="suggestList"></div>
        </div>
      </div>
    </div>
    <div id="errors"><span class="ok">Готово. Ошибок пока не найдено.</span></div>
    <div id="notesPanel">
      <div id="notesHeader">Заметки к файлу: <b id="notesFileName">—</b><button id="notesExportBtn">Экспорт всех заметок</button></div>
      <textarea id="notesArea" placeholder="Заметки об этом скрипте (сохраняются автоматически)…"></textarea>
    </div>
  </div>
  <div id="preview">
    <div id="previewBar">
      <span>Тема примера:</span>
      <button id="themeDark">Тёмная</button>
      <button id="themeLight">Светлая</button>
      <button id="previewClose" title="Закрыть превью" style="margin-left:auto">✕ Закрыть</button>
    </div>
    <div id="previewHost"><iframe id="previewFrame" sandbox="allow-scripts allow-same-origin"></iframe></div>
  </div>
</div>
<input type="color" id="colorPickerInput">

<script type="module">
import { compile } from '../../assets/js/GMS-script-compiler.js';

const code = document.getElementById('code');
const highlightEl = document.getElementById('highlight');
const colorLayer = document.getElementById('colorLayer');
const gutter = document.getElementById('gutter');
const errorsEl = document.getElementById('errors');
const filenameEl = document.getElementById('filename');
const preview = document.getElementById('preview');
const previewFrame = document.getElementById('previewFrame');
const colorPickerInput = document.getElementById('colorPickerInput');

// ===== Элементы набора файлов / заметок =====
const fileSelect = document.getElementById('fileSelect');
const fileCountEl = document.getElementById('fileCount');
const currentFileLabel = document.getElementById('currentFileLabel');
const btnPrevFile = document.getElementById('btnPrevFile');
const btnNextFile = document.getElementById('btnNextFile');
const folderInput = document.getElementById('folderInput');
const notesPanel = document.getElementById('notesPanel');
const notesArea = document.getElementById('notesArea');
const notesFileName = document.getElementById('notesFileName');

// ВАЖНО: compile() берёт исходник как sourceCode.match(/\[([\s\S]*)\]/) — то есть
// АБСОЛЮТНО ВСЁ (описание сцены, Start, Update, new/draw объекты, func/Function/Void)
// должно находиться ВНУТРИ одного верхнеуровневого блока [ ... ]. Снаружи скобок код
// просто не попадает в компиляцию.
const TEMPLATE =
`[
\tdescription = "";

\tStart {
\t}

\tUpdate {
\t}
]
`;

// ===== Ключевые слова языка (актуальная версия компилятора) =====
const TYPE_WORDS = ['Point2D','Point3D','Point','Line2D','Line3D','Line','Figure2D','Figure3D','Figure',
 'Primitive','Section','Boolean','Truncate','Hull','Minkowski','Angle3D','Claster2D','Claster3D','Claster','Angle','EquallySing',
 'Vector2D','Vector3D','Vector','InfLine','InfPlane','Filling2D','Filling3D','Filling','Punctir',

 'Chart','Tree','Table','Complex','Hyperbolic','Bifurcation','Cobweb','IFS','Automaton','Voronoi',
 'Fourier','Diagram'];

const DECL_WORDS = ['int','float','string','bool','Vector2','color','list'];

// Поля для автозаполнения "следующий параметр =" по типу блока (наиболее используемые поля)
// Полные наборы полей по типам блоков (объединены основные обязательные поля +
// все второстепенные, извлечённые из компилятора). Используются для выпадающего
// списка автодополнения полей — предлагаются ВСЕ ещё не использованные поля,
// а не одно угаданное.
const ALL_FIELDS = {

    'text','line','circle','ellipse','axis','t','extend','construct','vertex','base',

  Region:['name','f','rangeX','rangeY','level','level2','border','quality','opacity','color','active','layer','rotate','billboard','panelWidth','panelHeight'],
  Chart:['name','data','labels','color','width','height','pointSize','radius','horizontal','markers','regression','showAxes','showValues','rotate','billboard','active','layer'],
  Tree:['name','data','color','edgeColor','labelColor','nodeRadius','spacing','levelGap','boxed','rotate','billboard','panelWidth','panelHeight','active','layer'],
  Table:['name','data','header','headerBg','borders','borderColor','cellWidth','cellHeight','fontSize','color','rotate','billboard','panelWidth','panelHeight','active','layer'],

  Fractal:['name','type','cRe','cIm','centerRe','centerIm','maxIter','scale','opacity','quality','rotate','billboard','panelWidth','panelHeight','active','layer'],

  Bifurcation:['name','f','rmin','rmax','x0','ymin','ymax','skip','keep','color','rotate','billboard','panelWidth','panelHeight','active','layer'],
  IFS:['name','maps','iterations','scale','pointSize','color','active','layer'],

  Diagram:['name','nodes','arrows','accepting','curved','boxed','nodeRadius','labelColor','arrowColor','color','active','layer'],
  Image:['name','src','pos','width','height','rotate','opacity','billboard','active','layer'],
  Histogram:['name','data','bins','color','rotate','billboard','panelWidth','panelHeight','active','layer']
};
// Point/Line/Figure/Claster/Vector/Text/Curve/Field/Trajectory также существуют
// в вариантах 2D/3D — используют тот же набор полей.
for (const base of ['Point','Line','Figure','Claster','Vector','Text','Curve','Field','Trajectory','Filling','Angle3D']) {
  if (ALL_FIELDS[base]) { ALL_FIELDS[base + '2D'] = ALL_FIELDS[base]; ALL_FIELDS[base + '3D'] = ALL_FIELDS[base]; }
}

const THEME_BG = { dark:'#1b1b2a', light:'#ffffff' };

function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ===== Токенизация для подсветки =====
const TYPE_RE_SRC = TYPE_WORDS.slice().sort((a,b)=>b.length-a.length).join('|');
const PREFIX_RE_SRC = PREFIX_WORDS.join('|');
const DECL_RE_SRC = DECL_WORDS.join('|');
// "Function" — слово с двойным смыслом в компиляторе: после "draw" это ИМЯ ТИПА
// (draw Function {...} — график функции, как draw Circle/draw Line и т.п.), а сам
// по себе (Function f(x) {...}) — ключевое слово объявления многострочной функции,
// как func/Void. Раньше оно было только в PREFIX_WORDS, поэтому "draw Function"
// всегда красился как обычное ключевое слово, а не как тип — отсюда некорректная
// подсветка. Отдельная alternative с lookbehind красит его как тип ТОЛЬКО сразу
// после "draw", во всех остальных случаях подхватывается обычный PREFIX_WORDS-матч.
const COMBINED = new RegExp(
  '(//[^\\n]*)' +
  '|(/\\*[\\s\\S]*?\\*/)' +
  '|("(?:[^"\\\\]|\\\\.)*")' +
  '|(#[0-9a-fA-F]{3,8}\\b)' +
  '|(\\b\\d+(?:\\.\\d+)?\\b)' +
  '|((?<=\\bdraw\\s)Function\\b)' +
  '|(\\b(?:' + TYPE_RE_SRC + ')\\b)' +
  '|(\\b(?:' + PREFIX_RE_SRC + ')\\b)' +
  '|(\\b(?:' + DECL_RE_SRC + ')\\b)' +
  '|(\\b(?:true|false)\\b)' +
  '|(\\b[A-Za-z_][A-Za-z0-9_]*\\b(?=\\s*=(?!=)))'
, 'g');
const CLASS_BY_GROUP = ['com','com','str','col-lit','num','kwt','kwt','kwp','kwd','bool','key'];

// ===== Настройки автоматических функций редактора (п.16) =====
const settings = { autoClose: true, autoPunct: true, autoSuggest: true, autoIndent: true };
function refreshSettingsUI(){
  document.getElementById('stAutoClose').textContent = settings.autoClose ? 'Вкл' : 'Выкл';
  document.getElementById('stAutoPunct').textContent = settings.autoPunct ? 'Вкл' : 'Выкл';
  document.getElementById('stAutoSuggest').textContent = settings.autoSuggest ? 'Вкл' : 'Выкл';
  document.getElementById('stAutoIndent').textContent = settings.autoIndent ? 'Вкл' : 'Выкл';
}
function bindToggle(btnId, key){
  document.getElementById(btnId).addEventListener('click', () => {
    settings[key] = !settings[key];
    refreshSettingsUI();
    closeMenus();
    code.focus();
  });
}

function tokenizeToSegments(src){
  const segs = [];
  let last = 0, m;
  COMBINED.lastIndex = 0;
  while ((m = COMBINED.exec(src))) {
    if (m.index > last) segs.push({ cls: null, text: src.slice(last, m.index) });
    const gi = m.slice(1).findIndex(g => g !== undefined);
    segs.push({ cls: CLASS_BY_GROUP[gi], text: m[0] });
    last = m.index + m[0].length;
  }
  if (last < src.length) segs.push({ cls: null, text: src.slice(last) });
  return segs;
}
function segmentsToLines(segs){
  const lines = [[]];
  for (const seg of segs) {
    const parts = seg.text.split('\n');
    parts.forEach((p, i) => {
      if (i > 0) lines.push([]);
      if (p.length) lines[lines.length - 1].push({ cls: seg.cls, text: p });
    });
  }
  return lines;
}

let errorLines = new Set();

function render(){
  const src = code.value;
  const lines = segmentsToLines(tokenizeToSegments(src));
  let html = '';
  for (let i = 0; i < lines.length; i++) {
    const lineHtml = lines[i].map(p => p.cls ? `<span class="${p.cls}">${escapeHtml(p.text)}</span>` : escapeHtml(p.text)).join('') || '&nbsp;';
    const errCls = errorLines.has(i + 1) ? ' err-line' : '';
    html += `<div class="${errCls.trim()}">${lineHtml}</div>`;
  }
  highlightEl.innerHTML = html;
  gutter.innerHTML = lines.map((_, i) => `<div>${i + 1}</div>`).join('');
  updateColorSwatches(src);
  // ВАЖНО: замена innerHTML временно обнуляет прокручиваемое содержимое gutter/highlight/
  // colorLayer, из-за чего их scrollTop сбрасывается браузером на 0. Раньше это не
  // пересинхронизировалось после каждого render() (только по событию scroll textarea),
  // поэтому на больших проскроленных вниз файлах номера строк и иконки цвета "съезжали"
  // и ломались сразу после любого редактирования. Досинхронизируем немедленно.
  syncOverlayScroll();
}

function syncOverlayScroll(){
  highlightEl.scrollTop = code.scrollTop; highlightEl.scrollLeft = code.scrollLeft;
  colorLayer.scrollTop = code.scrollTop; colorLayer.scrollLeft = code.scrollLeft;
  gutter.scrollTop = code.scrollTop;
}
// синхронизация скролла при непосредственной прокрутке textarea
code.addEventListener('scroll', syncOverlayScroll);
// Иконки .swatch — единственные интерактивные (pointer-events:auto) элементы внутри
// colorLayer, поэтому событие колеса, случившееся над ними, всплывает именно до
// colorLayer. Раньше он сам был overflow:auto и «съедал» прокрутку — теперь
// overflow:hidden, а сам скролл вручную передаётся в #code (единственный реальный
// скроллящийся слой), после чего остальные слои синхронизируются как обычно.
colorLayer.addEventListener('wheel', (e) => {
  code.scrollTop += e.deltaY;
  code.scrollLeft += e.deltaX;
  syncOverlayScroll();
  e.preventDefault();
}, { passive: false });

// ===== Отступы / Tab =====
function currentLineStart(pos){ return code.value.lastIndexOf('\n', pos - 1) + 1; }
function lineIndent(lineText){ const m = lineText.match(/^[ \t]*/); return m ? m[0] : ''; }

// Находит ближайшую охватывающую фигурную скобку и заголовок перед ней.
// type !== null только если это литерал объекта (new X {.../draw X {...}) —
// у всех остальных блоков ({} у Start/Update/if/repeat/for/func/Void) — обычные
// операторы с ';', а не список полей через ','.
function findEnclosingBrace(uptoPos){
  const s = code.value.slice(0, uptoPos);
  let depth = 0, idx = -1;
  for (let i = s.length - 1; i >= 0; i--) {
    const c = s[i];
    if (c === '}') depth++;
    else if (c === '{') { if (depth === 0) { idx = i; break; } depth--; }
  }
  if (idx === -1) return null;
  const head = s.slice(0, idx);
  const m = head.match(/\b(new|draw)\s+([A-Za-z0-9_]+)\s*$/);
  return { start: idx + 1, type: m ? m[2] : null };
}
function collectUsedFields(braceStart, uptoPos){
  const seg = code.value.slice(braceStart, uptoPos);
  const fields = [];
  const re = /\b([A-Za-z_][A-Za-z0-9_]*)\s*=/g;
  let m;
  while ((m = re.exec(seg))) fields.push(m[1]);
  return fields;
}

// проверка «завершённости» значения (сбалансированные скобки/кавычки, не висящий оператор)
function isBalancedValue(v){
  if (!v || !v.trim()) return false;
  let depth = 0, inStr = false;
  for (let i = 0; i < v.length; i++) {
    const c = v[i];
    if (inStr) { if (c === '\\') { i++; continue; } if (c === '"') inStr = false; continue; }
    if (c === '"') { inStr = true; continue; }
    if (c === '(' || c === '[') depth++;
    else if (c === ')' || c === ']') { depth--; if (depth < 0) return false; }
  }
  if (inStr || depth !== 0) return false;
  const t = v.trim();
  if (/[+\-*/=,.]$/.test(t)) return false;
  return true;
}
function lastTopLevelEquals(t){
  for (let i = t.length - 1; i >= 0; i--) {
    if (t[i] !== '=') continue;
    const prev = t[i - 1], next = t[i + 1];
    if (prev === '=' || prev === '!' || prev === '<' || prev === '>' || next === '=') continue;
    return i;
  }
  return -1;
}
// Строка считается логически завершённой ТОЛЬКО если:
//  а) есть верхнеуровневое "поле = значение" со сбалансированным значением, либо
//  б) это вызов-оператор вида "имя(...)" с полностью сбалансированными скобками, либо
//  в) это "return <выражение>" со сбалансированным выражением.
// Одиночные слова/ключевые слова/незавершённые идентификаторы (например "Start",
// "name", начало "if (") НИКОГДА не считаются завершённой строкой.
function lineLooksComplete(t){
  if (!t) return false;
  if (/[;,{}\[\]]$/.test(t)) return false;
  if (t.lastIndexOf('//') !== -1) return false;
  const eqIdx = lastTopLevelEquals(t);
  if (eqIdx !== -1) return isBalancedValue(t.slice(eqIdx + 1));
  const retMatch = t.match(/^return\s+(.+)$/);
  if (retMatch) return isBalancedValue(retMatch[1]);
  if (/^[A-Za-z_][A-Za-z0-9_.]*\s*\([\s\S]*\)$/.test(t)) return isBalancedValue(t);
  return false;
}

// вставляет ; или , [следующее поле] непосредственно перед pos, возвращает длину вставки
function maybeApplyPunctuation(pos){
  const lsStart = currentLineStart(pos);
  const head = code.value.slice(lsStart, pos);
  const t = head.replace(/[ \t]+$/, '');
  if (!lineLooksComplete(t)) return 0;
  const braceInfo = findEnclosingBrace(lsStart);
  let insertion;
  if (braceInfo && braceInfo.type) {
    // это литерал объекта: new X {...} / draw X {...} — поля через запятую;
    // конкретное имя следующего поля пользователь выбирает из выпадающего
    // списка (см. updateSuggest), который откроется сразу после вставки запятой.
    insertion = ',';
  } else {
    // верхний уровень, [заголовок], Start/Update/if/repeat/for/func/Void — операторы с ';'
    insertion = ';';
  }
  code.value = code.value.slice(0, pos) + insertion + code.value.slice(pos);
  return insertion.length;
}

code.addEventListener('keydown', (e) => {
  if (suggestVisible() && handleSuggestKeys(e)) return;

  // Горячие клавиши (Ctrl+S/F/N/K и т.п.) обрабатываются глобально на уровне
  // document (см. ниже) — так они работают независимо от фокуса и надёжно
  // перехватывают действия браузера по умолчанию (п.6).

  if (e.key === 'Tab') {
    e.preventDefault();
    const start = code.selectionStart, end = code.selectionEnd;
    if (start === end) {
      code.value = code.value.slice(0, start) + '\t' + code.value.slice(end);
      code.selectionStart = code.selectionEnd = start + 1;
    } else {
      const val = code.value;
      const lsStart = currentLineStart(start);
      const before = val.slice(0, lsStart);
      const sel = val.slice(lsStart, end);
      const after = val.slice(end);
      let lines = sel.split('\n');
      if (e.shiftKey) lines = lines.map(l => l.replace(/^\t| {1,4}/, ''));
      else lines = lines.map(l => '\t' + l);
      code.value = before + lines.join('\n') + after;
      code.selectionStart = lsStart;
      code.selectionEnd = before.length + lines.join('\n').length;
    }
    onEdit();
    return;
  }

  if (e.key === 'Enter') {
    e.preventDefault();
    if (code.selectionStart !== code.selectionEnd) code.value = code.value.slice(0, code.selectionStart) + code.value.slice(code.selectionEnd);
    let pos = code.selectionStart;
    if (settings.autoPunct) pos += maybeApplyPunctuation(pos);
    const lsStart = currentLineStart(pos);
    const lineBefore = code.value.slice(lsStart, pos);
    const indent = lineIndent(lineBefore);
    const trimmed = lineBefore.trim();
    const nextChar = code.value[pos];
    let extra = (settings.autoIndent && /[{\[]\s*$/.test(trimmed)) ? '\t' : '';
    let insertText = '\n' + indent + extra;
    let caretOffset = insertText.length;
    if (extra && nextChar && '}]'.includes(nextChar)) insertText += '\n' + indent;
    code.value = code.value.slice(0, pos) + insertText + code.value.slice(pos);
    code.selectionStart = code.selectionEnd = pos + caretOffset;
    onEdit();
    return;
  }

  if (e.key === ' ' && (e.ctrlKey || e.metaKey)) {
    // Ctrl+Space — принудительно открыть окно подсказки (следующее поле в {} или
    // переменная), не вставляя сам пробел (п.5, "в-третьих").
    e.preventDefault();
    updateSuggest(true);
    return;
  }

  if (e.key === ' ') {
    e.preventDefault();
    if (code.selectionStart !== code.selectionEnd) code.value = code.value.slice(0, code.selectionStart) + code.value.slice(code.selectionEnd);
    let pos = code.selectionStart;
    if (settings.autoPunct) pos += maybeApplyPunctuation(pos);
    code.value = code.value.slice(0, pos) + ' ' + code.value.slice(pos);
    code.selectionStart = code.selectionEnd = pos + 1;
    onEdit();
    return;
  }

  if (settings.autoClose && '({['.includes(e.key)) {
    e.preventDefault();
    const pairs = {'(':')','{':'}','[':']'};
    const start = code.selectionStart, end = code.selectionEnd;
    const ins = e.key + pairs[e.key];
    code.value = code.value.slice(0, start) + ins + code.value.slice(end);
    code.selectionStart = code.selectionEnd = start + 1;
    onEdit();
    return;
  }
  if (settings.autoClose && e.key === '"') {
    e.preventDefault();
    const pos = code.selectionStart;
    if (code.value[pos] === '"') { code.selectionStart = code.selectionEnd = pos + 1; onEdit(); return; }
    code.value = code.value.slice(0, pos) + '""' + code.value.slice(code.selectionEnd);
    code.selectionStart = code.selectionEnd = pos + 1;
    onEdit();
    return;
  }
  if (settings.autoClose && (e.key === ')' || e.key === '}' || e.key === ']')) {
    const pos = code.selectionStart;
    if (code.value[pos] === e.key && code.selectionStart === code.selectionEnd) {
      e.preventDefault();
      code.selectionStart = code.selectionEnd = pos + 1;
      onEdit();
      return;
    }
  }
});

code.addEventListener('keyup', (e) => {
  if (e.ctrlKey || e.metaKey) return; // Ctrl+Space обработан в keydown, здесь пропускаем
  updateSuggest(false);
});

function onEdit(){
  render();
  syncActiveFileContent();
  updateHeaderLabel();
  persistStateDebounced();
  scheduleCheck();
}
code.addEventListener('input', onEdit);

// ===== Комментирование строки/выделения (Ctrl+K, п.19) =====
function toggleComment(){
  const val = code.value;
  const start = code.selectionStart, end = code.selectionEnd;
  const lsStart = currentLineStart(start);
  let lsEnd = val.indexOf('\n', end === start ? start : end - 1);
  if (lsEnd === -1) lsEnd = val.length;
  if (end > lsEnd) lsEnd = (val.indexOf('\n', end) === -1) ? val.length : val.indexOf('\n', end);
  const block = val.slice(lsStart, lsEnd);
  const lines = block.split('\n');
  const meaningful = lines.filter(l => l.trim() !== '');
  const shouldUncomment = meaningful.length > 0 && meaningful.every(l => /^\s*\/\//.test(l));
  const newLines = lines.map(l => {
    if (l.trim() === '') return l;
    return shouldUncomment ? l.replace(/^(\s*)\/\/ ?/, '$1') : l.replace(/^(\s*)/, '$1// ');
  });
  const newBlock = newLines.join('\n');
  code.value = val.slice(0, lsStart) + newBlock + val.slice(lsEnd);
  code.selectionStart = lsStart;
  code.selectionEnd = lsStart + newBlock.length;
  onEdit();
}

// ===== Набор файлов (несколько .gms одновременно, переключение стрелками) =====
// Раньше редактор хранил только ОДИН открытый файл (currentHandle + code.value).
// Теперь единый источник правды — массив openFiles; code.value в любой момент
// зеркалит содержимое openFiles[activeIndex]. currentHandle/currentHtmlHandle
// (File System Access хэндлы конкретного .gms/.html) остаются глобальными
// переменными для совместимости с существующими writeCurrentFile/saveHtmlOutput,
// но теперь синхронизируются с активным файлом набора при каждом переключении.
const LS_KEY = 'gmsIdeState_v1';
let openFiles = [];         // { id, name, content, notes, handle, htmlHandle, savedToDisk, compileStatus }
let activeIndex = -1;
let currentHandle = null;      // FileSystemFileHandle активного .gms (если открыт/сохранён через диалог)
let currentHtmlHandle = null;  // FileSystemFileHandle .html-вывода активного файла (кэш пути, п.8)
let outDirHandle = null;    // папка для авто-сохранения скомпилированных .html всего набора (не хранится между перезагрузками)

function uid(){ return 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function makeFile(name, content){
  return { id: uid(), name, content, notes: '', handle: null, htmlHandle: null, savedToDisk: false, compileStatus: 'unknown' };
}

// ----- localStorage: все открытые файлы, их содержимое и заметки -----
let persistTimer = null;
function persistStateDebounced(){ clearTimeout(persistTimer); persistTimer = setTimeout(persistState, 400); }
function persistState(){
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      activeIndex,
      files: openFiles.map(f => ({ id: f.id, name: f.name, content: f.content, notes: f.notes }))
    }));
  } catch(e) { /* хранилище переполнено/недоступно — тихо игнорируем */ }
}
function restoreState(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || !Array.isArray(data.files) || !data.files.length) return false;
    openFiles = data.files.map(f => ({
      id: f.id || uid(), name: f.name || 'script.gms', content: f.content || '', notes: f.notes || '',
      handle: null, htmlHandle: null, savedToDisk: false, compileStatus: 'unknown'
    }));
    activeIndex = Math.min(Math.max(+data.activeIndex || 0, 0), openFiles.length - 1);
    return true;
  } catch(e) { return false; }
}

// ----- переключение между файлами набора / панель сверху -----
function rebuildFileSelect(){
  fileSelect.innerHTML = openFiles.map((f, i) => {
    const mark = f.compileStatus === 'ok' ? '✓ ' : f.compileStatus === 'err' ? '✕ ' : '• ';
    return `<option value="${i}">${mark}${escapeHtml(f.name)}${f.savedToDisk ? '' : ' *'}</option>`;
  }).join('');
  if (activeIndex >= 0) fileSelect.value = String(activeIndex);
  fileCountEl.textContent = openFiles.length ? `${activeIndex + 1}/${openFiles.length}` : '';
  btnPrevFile.disabled = openFiles.length < 2;
  btnNextFile.disabled = openFiles.length < 2;
}
function updateHeaderLabel(){
  const f = openFiles[activeIndex];
  if (!f) { filenameEl.textContent = 'файл не выбран'; currentFileLabel.textContent = 'файл не выбран'; notesFileName.textContent = '—'; return; }
  const dot = f.savedToDisk ? '' : ' •';
  const prefix = openFiles.length > 1 ? `[${activeIndex + 1}/${openFiles.length}] ` : '';
  filenameEl.textContent = prefix + f.name + dot;
  currentFileLabel.textContent = 'Текущий файл: ' + f.name + dot;
  notesFileName.textContent = f.name;
}
// сохраняет то, что сейчас в textarea, обратно в объект активного файла набора
function syncActiveFileContent(){
  const f = openFiles[activeIndex];
  if (!f) return;
  if (f.content !== code.value) f.savedToDisk = false;
  f.content = code.value;
}
function switchToFile(idx){
  if (!openFiles.length) return;
  idx = Math.max(0, Math.min(idx, openFiles.length - 1));
  if (activeIndex >= 0 && activeIndex < openFiles.length) syncActiveFileContent();
  activeIndex = idx;
  const f = openFiles[activeIndex];
  code.value = f.content;
  notesArea.value = f.notes || '';
  currentHandle = f.handle;
  currentHtmlHandle = f.htmlHandle;
  render();
  rebuildFileSelect();
  updateHeaderLabel();
  persistStateDebounced();
  runCheck(); // сразу пересчитать ошибки/автокомпиляцию нового файла, не дожидаясь паузы в наборе текста
}
function addAndSwitch(fileObj){ openFiles.push(fileObj); switchToFile(openFiles.length - 1); }

btnPrevFile.addEventListener('click', () => switchToFile(activeIndex - 1));
btnNextFile.addEventListener('click', () => switchToFile(activeIndex + 1));
fileSelect.addEventListener('change', () => switchToFile(+fileSelect.value));

// ===== Файлы: создание / открытие одного / открытие папки / закрытие =====
async function createNewFile(){
  closeMenus();
  const used = new Set(openFiles.map(f => f.name));
  let n = 1;
  while (used.has(`script${n}.gms`)) n++;
  addAndSwitch(makeFile(`script${n}.gms`, TEMPLATE));
}
document.getElementById('btnNew').addEventListener('click', createNewFile);

document.getElementById('btnOpen').addEventListener('click', async () => {
  closeMenus();
  try {
    if (window.showOpenFilePicker) {
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: 'GMS файл', accept: {'text/plain': ['.gms']} }]
      });
      const file = await handle.getFile();
      const f = makeFile(handle.name, await file.text());
      f.handle = handle; f.savedToDisk = true;
      addAndSwitch(f);
    } else {
      const input = document.createElement('input');
      input.type = 'file'; input.accept = '.gms';
      input.onchange = async () => {
        const file = input.files[0];
        if (!file) return;
        const f = makeFile(file.name, await file.text());
        addAndSwitch(f); // savedToDisk остаётся false — сохранение только через скачивание
      };
      input.click();
    }
  } catch(err) { if (err.name !== 'AbortError') console.error(err); }
});

document.getElementById('btnCloseFile').addEventListener('click', () => {
  closeMenus();
  if (openFiles.length <= 1) { alert('Это последний открытый файл — закрывать нечего.'); return; }
  if (!confirm(`Закрыть «${openFiles[activeIndex].name}»? Файл и его заметки пропадут из набора (в отличие от localStorage, отменить закрытие будет нельзя).`)) return;
  openFiles.splice(activeIndex, 1);
  switchToFile(Math.min(activeIndex, openFiles.length - 1));
});

// ===== Открыть папку целиком: чтение всех .gms + автокомпиляция + выбор папки вывода =====
document.getElementById('btnOpenFolder').addEventListener('click', () => { closeMenus(); folderInput.click(); });
folderInput.addEventListener('change', async () => {
  const list = [...folderInput.files].filter(f => /\.gms$/i.test(f.name));
  folderInput.value = '';
  if (!list.length) { alert('В выбранной папке не найдено файлов .gms'); return; }
  const loaded = [];
  for (const file of list) loaded.push(makeFile(file.name, await file.text()));
  openFiles = loaded;
  outDirHandle = null;
  switchToFile(0);
  await chooseOutputFolder();
  await compileAllAndSave();
});
async function chooseOutputFolder(){
  if (window.showDirectoryPicker) {
    try { outDirHandle = await window.showDirectoryPicker(); }
    catch(err) { outDirHandle = null; if (err.name !== 'AbortError') console.error(err); }
  } else {
    outDirHandle = null; // нет File System Access API — компиляции будут скачиваться по одной
  }
}
document.getElementById('btnChooseOutFolder').addEventListener('click', () => { closeMenus(); chooseOutputFolder(); });

async function writeCompiledToOutDir(baseName, html){
  if (outDirHandle) {
    try {
      const fh = await outDirHandle.getFileHandle(baseName + '.html', { create: true });
      const w = await fh.createWritable();
      await w.write(html);
      await w.close();
      return true;
    } catch(err) { console.error(err); outDirHandle = null; }
  }
  const blob = new Blob([html], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = baseName + '.html';
  a.click();
  return false;
}
async function compileAllAndSave(){
  closeMenus();
  syncActiveFileContent();
  const failed = [];
  for (const f of openFiles) {
    let res;
    try { res = compile(f.content); }
    catch(e) { res = { success: false, errors: [e.message] }; }
    f.compileStatus = res.success ? 'ok' : 'err';
    if (res.success) await writeCompiledToOutDir(f.name.replace(/\.gms$/i, ''), res.html);
    else failed.push(f.name);
  }
  rebuildFileSelect();
  if (activeIndex >= 0) showCompileErrors(compile(openFiles[activeIndex].content));
  if (failed.length) {
    errorsEl.innerHTML += `<div><span class="e">✕ Не скомпилированы: ${escapeHtml(failed.join(', '))}</span></div>`;
  }
}
document.getElementById('btnCompileAllFolder').addEventListener('click', compileAllAndSave);

async function writeCurrentFile(){
  if (!currentHandle) return false;
  const w = await currentHandle.createWritable();
  await w.write(code.value);
  await w.close();
  const f = openFiles[activeIndex];
  if (f) { f.handle = currentHandle; f.savedToDisk = true; }
  updateHeaderLabel();
  return true;
}

async function saveCurrentFile(){
  if (currentHandle) {
    await writeCurrentFile();
  } else if (window.showSaveFilePicker) {
    try {
      currentHandle = await window.showSaveFilePicker({
        suggestedName: (openFiles[activeIndex] && openFiles[activeIndex].name) || 'script.gms',
        types: [{ description: 'GMS файл', accept: {'text/plain': ['.gms']} }]
      });
      await writeCurrentFile();
      const f = openFiles[activeIndex];
      if (f) f.name = currentHandle.name;
      rebuildFileSelect(); updateHeaderLabel();
    } catch(err) { if (err.name !== 'AbortError') console.error(err); }
  } else {
    const blob = new Blob([code.value], {type:'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (openFiles[activeIndex] && openFiles[activeIndex].name) || 'script.gms';
    a.click();
    const f = openFiles[activeIndex];
    if (f) { f.savedToDisk = true; updateHeaderLabel(); }
  }
}
document.getElementById('btnSave').addEventListener('click', () => { closeMenus(); saveCurrentFile(); });

async function saveHtmlOutput(html){
  // Если файл для вывода уже выбирался раньше (в рамках этого .gms) — пишем в него же,
  // не спрашивая путь заново при каждой компиляции (п.8). Путь запрашивается только
  // один раз за файл: при первой компиляции после открытия/создания .gms или после
  // недоступности File System Access API.
  if (currentHtmlHandle) {
    try {
      const w = await currentHtmlHandle.createWritable();
      await w.write(html);
      await w.close();
      return;
    } catch (err) {
      currentHtmlHandle = null; // хэндл мог протухнуть (файл удалили/переместили) — попросим путь заново
    }
  }
  const base = (openFiles[activeIndex] ? openFiles[activeIndex].name : (currentHandle ? currentHandle.name : 'script')).replace(/\.gms$/i, '');
  if (window.showSaveFilePicker) {
    currentHtmlHandle = await window.showSaveFilePicker({
      suggestedName: base + '.html',
      types: [{ description: 'HTML файл', accept: {'text/html': ['.html']} }]
    });
    const w = await currentHtmlHandle.createWritable();
    await w.write(html);
    await w.close();
    if (openFiles[activeIndex]) openFiles[activeIndex].htmlHandle = currentHtmlHandle;
  } else {
    const blob = new Blob([html], {type:'text/html'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = base + '.html';
    a.click();
  }
}

// ===== Компиляция =====
// compile() возвращает { success, errors: string[] } или { success, html }

function showCompileErrors(res){
  errorLines = new Set();
  if (res.success) {
    errorsEl.innerHTML = '<span class="ok">Компиляция успешна.</span>';
  } else {
    errorsEl.innerHTML = res.errors.map(msg => {
      const loc = locateError(msg);
      const ln = loc ? loc.line : null;
      if (ln) errorLines.add(ln);
      return `<span class="e" data-line="${ln || ''}" data-col="${loc && loc.col ? loc.col : ''}">✕ ${ln ? 'строка ' + ln + ': ' : ''}${escapeHtml(msg)}</span>`;
    }).join('');
    errorsEl.querySelectorAll('.e[data-line]').forEach(el => {
      el.addEventListener('click', () => {
        const ln = +el.dataset.line; const col = el.dataset.col ? +el.dataset.col : null;
        if (ln) jumpToLine(ln, col);
      });
    });
  }
  render();
}
// Компилятор теперь встраивает позицию прямо в текст сообщения — форматы:
//  "...сообщение... (строка N)" (ошибки верхнеуровневых параметров сцены) и
//  "...сообщение... (строка N, символ M)" (formatErrorWithPos — большинство ошибок
//  ссылок между объектами). Раньше строка угадывалась поиском первого имени в
//  кавычках по тексту — это давало неверную строку, если имя встречалось раньше
//  по коду в другом контексте. Теперь сперва пытаемся распарсить встроенную
//  позицию, и только если её нет — используем старую эвристику как запасной вариант.
function locateError(msg){
  if (typeof msg === 'string') {
    const m = msg.match(/строка\s+(\d+)(?:\s*,\s*символ\s+(\d+))?\s*\)\s*$/);
    if (m) return { line: +m[1], col: m[2] ? +m[2] : null };
  }
  const ln = guessLineFromMessage(msg);
  return ln ? { line: ln, col: null } : null;
}
function guessLineFromMessage(msg){
  const m = typeof msg === 'string' ? msg.match(/"([^"]+)"/) : null;
  if (!m) return null;
  const name = m[1];
  const lines = code.value.split('\n');
  const re = new RegExp('\\b' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b');
  for (let i = 0; i < lines.length; i++) if (re.test(lines[i])) return i + 1;
  return null;
}
function jumpToLine(ln, col){
  const lines = code.value.split('\n');
  let pos = 0;
  for (let i = 0; i < ln - 1 && i < lines.length; i++) pos += lines[i].length + 1;
  const lineLen = lines[ln-1] ? lines[ln-1].length : 0;
  code.focus();
  if (col && col >= 1) {
    const c = Math.min(col - 1, lineLen);
    code.selectionStart = code.selectionEnd = pos + c;
  } else {
    code.selectionStart = pos;
    code.selectionEnd = pos + lineLen;
  }
  code.scrollTop = Math.max(0, (ln - 1) * 19.5 - code.clientHeight / 2);
}

async function doCompileAndSave(){
  closeMenus();
  syncActiveFileContent();
  const res = compile(code.value);
  showCompileErrors(res);
  const f = openFiles[activeIndex];
  if (f) f.compileStatus = res.success ? 'ok' : 'err';
  rebuildFileSelect();
  if (!res.success) return;
  await writeCurrentFile();
  await saveHtmlOutput(res.html);
}

// ===== Автоматическая проверка/компиляция при простое в наборе текста =====
// По запросу: компиляция должна выполняться сама при ЛЮБОМ изменении кода, если
// оно не вызвало ошибку — здесь это значит: как только пользователь на мгновение
// перестал печатать, автоматически компилируем, и при успехе (а) обновляем уже
// открытое превью без нажатия «Скомпилировать и запустить», и (б) если для
// текущего набора файлов выбрана папка вывода — сразу перезаписываем туда
// актуальный .html этого файла, тоже без участия пользователя.
let checkTimer = null;
function scheduleCheck(){ clearTimeout(checkTimer); checkTimer = setTimeout(runCheck, 900); }
function runCheck(){
  let res;
  try { res = compile(code.value); }
  catch(e) {
    errorsEl.innerHTML = `<span class="e">✕ Внутренняя ошибка компилятора: ${escapeHtml(e.message)}</span>`;
    const f = openFiles[activeIndex];
    if (f) f.compileStatus = 'err';
    rebuildFileSelect();
    return;
  }
  showCompileErrors(res);
  const f = openFiles[activeIndex];
  if (f) f.compileStatus = res.success ? 'ok' : 'err';
  if (res.success) {
    if (preview.classList.contains('show')) {
      document.getElementById('previewHost').style.background = THEME_BG[previewTheme];
      previewFrame.srcdoc = res.html;
    }
    if (outDirHandle && f) writeCompiledToOutDir(f.name.replace(/\.gms$/i, ''), res.html);
  }
  rebuildFileSelect();
}

// ===== Поиск (Ctrl+F) =====
const findBar = document.getElementById('findBar');
const findInput = document.getElementById('findInput');
const findCount = document.getElementById('findCount');
let matches = [], matchIdx = -1;

function openFind(){ findBar.classList.add('show'); findInput.focus(); findInput.select(); runFind(); }
function closeFind(){ findBar.classList.remove('show'); code.focus(); }
function runFind(){
  const q = findInput.value;
  matches = [];
  if (q) {
    const val = code.value.toLowerCase(); const ql = q.toLowerCase();
    let i = 0;
    while ((i = val.indexOf(ql, i)) !== -1) { matches.push(i); i += Math.max(ql.length, 1); }
  }
  matchIdx = matches.length ? 0 : -1;
  gotoMatch();
}
function gotoMatch(){
  if (matchIdx === -1) { findCount.textContent = '0/0'; return; }
  findCount.textContent = (matchIdx + 1) + '/' + matches.length;
  const pos = matches[matchIdx];
  code.focus();
  code.selectionStart = pos;
  code.selectionEnd = pos + findInput.value.length;
  const lineNum = code.value.slice(0, pos).split('\n').length;
  code.scrollTop = Math.max(0, (lineNum - 1) * 19.5 - code.clientHeight / 2);
}
findInput.addEventListener('input', runFind);
findInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.shiftKey ? prevMatch() : nextMatch(); e.preventDefault(); }
  if (e.key === 'Escape') closeFind();
});
function nextMatch(){ if (!matches.length) return; matchIdx = (matchIdx + 1) % matches.length; gotoMatch(); }
function prevMatch(){ if (!matches.length) return; matchIdx = (matchIdx - 1 + matches.length) % matches.length; gotoMatch(); }
document.getElementById('findNext').onclick = nextMatch;
document.getElementById('findPrev').onclick = prevMatch;
document.getElementById('findClose').onclick = closeFind;

// ===== Предложение переменных / полей =====
const suggestEl = document.getElementById('suggest');
const suggestListEl = document.getElementById('suggestList');
let suggestItems = [], suggestSel = 0, suggestRange = null;

function collectNames(){
  const names = new Set();
  let m;
  const reName = /\bname\s*=\s*([A-Za-z_][A-Za-z0-9_]*)/g;
  while ((m = reName.exec(code.value))) names.add(m[1]);
  const reFunc = /\bfunc\s+([A-Za-z_][A-Za-z0-9_]*)/g;
  while ((m = reFunc.exec(code.value))) names.add(m[1]);
  const reVar = /^\s*([A-Za-z_][A-Za-z0-9_]*)\s*=(?!=)/gm;
  while ((m = reVar.exec(code.value))) if (m[1] !== 'name') names.add(m[1]);
  return [...names];
}
function suggestVisible(){ return suggestEl.style.display === 'block'; }
// formatter(item) может вернуть либо готовую строку (курсор ставится в конец), либо
// { text, cursor, selectLen } — для полей, где нужно подставить синтаксис значения
// (пустые кавычки, [] и т.п.) и сразу поставить курсор/выделение внутрь него (п.5а).
let suggestFormat = (x) => x;
function openSuggest(items, start, end, formatter){
  suggestItems = items; suggestSel = 0;
  suggestRange = { start, end };
  suggestFormat = formatter;
  renderSuggest();
}

// Поля, ожидающие ЛОГИЧЕСКОЕ значение (true/false) — по имени поля, не только из
// GMS_UNQUOTED_FIELDS (которое шире и включает и числовые/enum-поля тоже).
const BOOL_FIELD_HINTS = new Set([
  'active','dynamic','pauseOnDrag','interact','directed','showWeights','billboard',
  'wireframe','showInfo','hideSource','grid','dashed','boxed','filled','showAxes',
  'showValues','markers','regression','horizontal','showDiagonal','showBoundary',
  'showSites','curved','accepting','collision','collideWithPoints','collideWithLines',
  'collideWithCurves','collideWithCircles','collideWithEllipses','collideWithArcs',
  'collideWithFigures','collideWithClusters','collideWithBoundary','extend','stepper',
]);
// Поля, ожидающие список/массив — вставляем скобки с курсором внутри.
const ARRAY_FIELD_HINTS = new Set([
  'elements','parts','data','points','maps','nodes','arrows','labels','highlight',
  'cells','fractions',
]);
// Поля-строки (ссылки на имена, текст, путь и т.п.) — вставляем пустые кавычки.
const STRING_FIELD_HINTS = new Set([
  'name','text','label','f','src','action','funcName','system','latex','field',
  'point','driver','line','circle','ellipse','curve','arc','graph','func','func2',
]);
// Синтаксическая "заготовка" значения для поля — чтобы после вставки сразу было
// удобно её отредактировать (пустые кавычки для строк, белый цвет для последующего
// выбора через визуальный пикер, [] для списков и т.д.) — см. п.5а.
function fieldInsertSpec(fieldName){
  const pre = fieldName + ' = ';
  if (/color/i.test(fieldName)) return { text: pre + '#ffffff', cursor: pre.length, selectLen: 7 };
  if (BOOL_FIELD_HINTS.has(fieldName)) return { text: pre + 'true', cursor: pre.length, selectLen: 4 };
  if (ARRAY_FIELD_HINTS.has(fieldName)) return { text: pre + '[]', cursor: pre.length + 1, selectLen: 0 };
  if (STRING_FIELD_HINTS.has(fieldName)) return { text: pre + '""', cursor: pre.length + 1, selectLen: 0 };
  // Числовое поле по умолчанию (и как запасной вариант) — значение выделено, чтобы
  // сразу перезаписывалось при вводе. Учитывая, что в любое поле можно вместо этого
  // вписать имя переменной, выделение (а не просто курсор после) — самый удобный вариант.
  return { text: pre + '0', cursor: pre.length, selectLen: 1 };
}

function updateSuggest(force){
  if (!force && !settings.autoSuggest) { hideSuggest(); return; }
  const pos = code.selectionStart;
  const head = code.value.slice(0, pos);
  if (isInsideString(pos)) { hideSuggest(); return; }

  // Режим А: значение после "=" — предложить существующие имена объектов/переменных.
  const mVal = head.match(/=\s*([A-Za-z_][A-Za-z0-9_]*)$/);
  if (mVal) {
    const partial = force ? '' : mVal[1];
    const names = collectNames().filter(n => n.toLowerCase().startsWith(partial.toLowerCase()) && n !== partial);
    if (names.length) { openSuggest(names, pos - mVal[1].length, pos, (n) => n); return; }
    hideSuggest(); return;
  }

  // Режим Б: имя нового поля внутри литерала объекта new X {...} / draw X {...} —
  // предложить ВСЕ ещё не использованные поля этого типа.
  const lsStart = currentLineStart(pos);
  const braceInfo = findEnclosingBrace(lsStart);
  if (braceInfo && braceInfo.type && ALL_FIELDS[braceInfo.type]) {
    const afterOpen = code.value.slice(braceInfo.start, pos);
    const lastSep = Math.max(afterOpen.lastIndexOf(','), afterOpen.lastIndexOf('{'));
    const tail = afterOpen.slice(lastSep + 1);
    if (!tail.includes('=')) {
      const partial = force ? '' : tail.replace(/^\s+/, '');
      if (force || /^[A-Za-z0-9_]*$/.test(partial)) {
        const used = collectUsedFields(braceInfo.start, pos);
        const options = ALL_FIELDS[braceInfo.type].filter(f => !used.includes(f) && f.toLowerCase().startsWith(partial.toLowerCase()));
        if (options.length) { openSuggest(options, pos - partial.length, pos, (n) => fieldInsertSpec(n)); return; }
      }
    }
  }
  hideSuggest();
}
function isInsideString(pos){
  const head = code.value.slice(0, pos);
  return ((head.match(/"/g) || []).length) % 2 === 1;
}
function renderSuggest(){
  suggestListEl.innerHTML = suggestItems.map((n, i) => `<div class="${i === suggestSel ? 'sel' : ''}" data-i="${i}">${escapeHtml(n)}</div>`).join('');
  const coords = getCaretCoords();
  suggestEl.style.left = coords.left + 'px';
  suggestEl.style.top = coords.top + 'px';
  suggestEl.style.display = 'block';
  [...suggestListEl.children].forEach(ch => ch.addEventListener('mousedown', (e) => { e.preventDefault(); suggestSel = +ch.dataset.i; acceptSuggest(); }));
}
function hideSuggest(){ suggestEl.style.display = 'none'; suggestItems = []; }
function acceptSuggest(){
  const raw = suggestFormat(suggestItems[suggestSel]);
  const spec = (typeof raw === 'string') ? { text: raw, cursor: raw.length, selectLen: 0 } : raw;
  code.value = code.value.slice(0, suggestRange.start) + spec.text + code.value.slice(suggestRange.end);
  const base = suggestRange.start + spec.cursor;
  code.selectionStart = base;
  code.selectionEnd = base + (spec.selectLen || 0);
  hideSuggest();
  onEdit();
  code.focus();
}
function handleSuggestKeys(e){
  if (e.key === 'ArrowDown') { suggestSel = (suggestSel + 1) % suggestItems.length; renderSuggest(); e.preventDefault(); return true; }
  if (e.key === 'ArrowUp') { suggestSel = (suggestSel - 1 + suggestItems.length) % suggestItems.length; renderSuggest(); e.preventDefault(); return true; }
  if (e.key === 'Enter' || e.key === 'Tab') { acceptSuggest(); e.preventDefault(); return true; }
  if (e.key === 'Escape') { hideSuggest(); e.preventDefault(); return true; }
  return false;
}

// ===== Ненавязчивость окна подсказок (п.4): закрытие крестиком/кликом вовне,
// свободное перетаскивание за шапку =====
document.getElementById('suggestClose').addEventListener('click', (e) => { e.preventDefault(); hideSuggest(); code.focus(); });
document.addEventListener('mousedown', (e) => {
  if (!suggestVisible()) return;
  if (suggestEl.contains(e.target)) return;
  hideSuggest();
});
(function setupSuggestDrag(){
  const head = document.getElementById('suggestHead');
  const codeArea = document.getElementById('codeArea');
  let dragging = false, startLeft = 0, startTop = 0, startX = 0, startY = 0;
  head.addEventListener('mousedown', (e) => {
    dragging = true;
    startLeft = parseFloat(suggestEl.style.left) || 0;
    startTop = parseFloat(suggestEl.style.top) || 0;
    startX = e.clientX; startY = e.clientY;
    e.preventDefault();
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const areaRect = codeArea.getBoundingClientRect();
    let left = startLeft + (e.clientX - startX);
    let top = startTop + (e.clientY - startY);
    left = Math.max(0, Math.min(left, areaRect.width - 40));
    top = Math.max(0, Math.min(top, areaRect.height - 20));
    suggestEl.style.left = left + 'px';
    suggestEl.style.top = top + 'px';
  });
  window.addEventListener('mouseup', () => { dragging = false; });
})();
function getCaretCoords(){
  const mirror = document.createElement('div');
  const style = getComputedStyle(code);
  ['fontFamily','fontSize','lineHeight','padding','border','boxSizing','whiteSpace','wordWrap'].forEach(p => mirror.style[p] = style[p]);
  mirror.style.position = 'absolute'; mirror.style.visibility = 'hidden'; mirror.style.width = code.clientWidth + 'px';
  mirror.style.top = '0'; mirror.style.left = '-9999px';
  const before = code.value.slice(0, code.selectionStart);
  mirror.textContent = before;
  const span = document.createElement('span'); span.textContent = '.';
  mirror.appendChild(span);
  document.body.appendChild(mirror);
  const rect = span.getBoundingClientRect();
  const mirrorRect = mirror.getBoundingClientRect();
  // #suggest — потомок #codeArea (а не #editorWrap), поэтому ширину #gutter (46px)
  // сюда добавлять не нужно — раньше это уводило подсказку правее нужного места.
  const left = (rect.left - mirrorRect.left);
  const top = (rect.top - mirrorRect.top) - code.scrollTop + 19.5;
  document.body.removeChild(mirror);
  return { left: Math.min(left, code.clientWidth - 40), top };
}

// ===== Редактирование цвета (визуальный пикер для полей *color* / color) =====
let CHAR_WIDTH = 7.8;
(function measureCharWidth(){
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  ctx.font = getComputedStyle(code).font || '13px monospace';
  CHAR_WIDTH = ctx.measureText('0').width || CHAR_WIDTH;
})();

function buildLineOffsets(src){
  const offsets = [0];
  for (let i = 0; i < src.length; i++) if (src[i] === '\n') offsets.push(i + 1);
  return offsets;
}
function offsetToLineCol(offsets, idx){
  let line = 0;
  for (let i = 0; i < offsets.length; i++) { if (offsets[i] <= idx) line = i; else break; }
  return { line, col: idx - offsets[line] };
}

const COLOR_FIELD_RE = /\b([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(#[0-9A-Fa-f]{3,8}|default|"[^"]*"|'[^']*')/g;

function swatchCssColor(raw){
  if (raw === 'default') return null; // checkerboard из CSS
  if ((raw.startsWith('"') && raw.endsWith('"')) || (raw.startsWith("'") && raw.endsWith("'"))) raw = raw.slice(1, -1);
  return raw;
}
function normalizeHex(raw){
  let v = raw;
  if ((v.startsWith('"') && v.endsWith('"')) || (v.startsWith("'") && v.endsWith("'"))) v = v.slice(1, -1);
  if (v === 'default' || !v) return '#7c7cff';
  if (/^#[0-9a-fA-F]{3}$/.test(v)) return '#' + [...v.slice(1)].map(ch => ch + ch).join('');
  if (/^#[0-9a-fA-F]{8}$/.test(v)) return v.slice(0, 7);
  if (/^#[0-9a-fA-F]{6}$/.test(v)) return v;
  return nameToHex(v);
}
function nameToHex(name){
  const d = document.createElement('div');
  d.style.color = name;
  document.body.appendChild(d);
  const rgb = getComputedStyle(d).color;
  document.body.removeChild(d);
  const m = rgb.match(/\d+/g);
  if (!m) return '#7c7cff';
  return '#' + m.slice(0, 3).map(n => (+n).toString(16).padStart(2, '0')).join('');
}
function replaceRange(start, end, text){
  code.value = code.value.slice(0, start) + text + code.value.slice(end);
  onEdit();
}
function openColorPicker(start, end, raw, btnEl){
  const rect = btnEl.getBoundingClientRect();
  colorPickerInput.style.left = rect.left + 'px';
  colorPickerInput.style.top = rect.top + 'px';
  colorPickerInput.style.width = rect.width + 'px';
  colorPickerInput.style.height = rect.height + 'px';
  colorPickerInput.value = normalizeHex(raw);
  colorPickerInput.onchange = () => replaceRange(start, end, colorPickerInput.value);
  colorPickerInput.click();
}

function updateColorSwatches(src){
  colorLayer.innerHTML = '';
  const offsets = buildLineOffsets(src);
  COLOR_FIELD_RE.lastIndex = 0;
  let m;
  while ((m = COLOR_FIELD_RE.exec(src))) {
    const key = m[1];
    if (!/color/i.test(key)) continue;
    const raw = m[2];
    const valueEnd = m.index + m[0].length;
    const valueStart = valueEnd - raw.length;
    const { line, col } = offsetToLineCol(offsets, valueEnd);
    const btn = document.createElement('button');
    btn.className = 'swatch';
    // ВАЖНО: colorLayer сам уже позиционирован с padding:10px и является containing
    // block для .swatch (position:absolute) — офсет top/left отсчитывается ОТ padding-
    // края автоматически. Прежний код добавлял ещё +10 вручную поверх этого, из-за
    // чего иконки были на ~10px ниже и правее нужного места (п.1: "смещены вниз").
    // Небольшой зазор (6px) вместо предыдущих 4px + центрирование по высоте строки,
    // чтобы плашка не залезала на следующий символ кода.
    btn.style.left = (col * CHAR_WIDTH + 6) + 'px';
    btn.style.top = (line * 19.5 + (19.5 - 14) / 2) + 'px';
    const css = swatchCssColor(raw);
    if (css) { btn.style.backgroundColor = css; btn.style.backgroundImage = 'none'; }
    btn.title = raw === 'default' ? 'default — клик: задать цвет, ПКМ: оставить default' : raw + ' — клик: изменить цвет, ПКМ: сбросить на default';
    btn.addEventListener('click', (e) => { e.preventDefault(); openColorPicker(valueStart, valueEnd, raw, btn); });
    btn.addEventListener('contextmenu', (e) => { e.preventDefault(); replaceRange(valueStart, valueEnd, 'default'); });
    colorLayer.appendChild(btn);
  }
}

// ===== Глобальные горячие клавиши (п.6, 7, 13, 17, 19) =====
// Раньше часть сочетаний (Ctrl+S/Ctrl+F) вешалась только на textarea — они не
// срабатывали, если фокус был не в редакторе (например, после клика по меню).
// Вешаем на document с capture:true, чтобы гарантированно перехватить нажатие
// раньше действия браузера по умолчанию (сохранение страницы, поиск и т.п.) —
// именно на это жаловался пункт 6.
document.addEventListener('keydown', (e) => {
  const ctrl = e.ctrlKey || e.metaKey;
  if (ctrl && !e.altKey && (e.key === 's' || e.key === 'S' || e.key === 'ы' || e.key === 'Ы')) {
    e.preventDefault(); e.stopPropagation();
    doCompileAndRun(); // Ctrl+S = скомпилировать, сохранить и запустить (п.7)
    return;
  }
  if (ctrl && !e.altKey && (e.key === 'n' || e.key === 'N' || e.key === 'т' || e.key === 'Т')) {
    e.preventDefault(); e.stopPropagation();
    createNewFile(); // Ctrl+N = новый файл (п.13)
    return;
  }
  if (ctrl && !e.altKey && (e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А')) {
    e.preventDefault(); e.stopPropagation();
    openFind(); // Ctrl+F (п.17)
    return;
  }
  if (ctrl && !e.altKey && (e.key === 'k' || e.key === 'K' || e.key === 'л' || e.key === 'Л')) {
    e.preventDefault(); e.stopPropagation();
    code.focus();
    toggleComment(); // Ctrl+K = закомментировать/раскомментировать (п.19)
    return;
  }
  if (e.key === 'F5') { e.preventDefault(); runCheck(); return; }
  if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); switchToFile(activeIndex - 1); return; }
  if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); switchToFile(activeIndex + 1); return; }
}, true);

// ===== Ошибки самого браузера/страницы — тоже в панель ошибок, отдельным цветом (п.14) =====
function appendRuntimeError(text){
  const span = document.createElement('span');
  span.className = 'e js-err';
  span.textContent = '⚠ [браузер] ' + text;
  errorsEl.appendChild(span);
}
window.addEventListener('error', (e) => {
  appendRuntimeError(`${e.message} (${e.filename ? e.filename.split('/').pop() : '?'}:${e.lineno || 0}:${e.colno || 0})`);
});
window.addEventListener('unhandledrejection', (e) => {
  const reason = e.reason && e.reason.message ? e.reason.message : String(e.reason);
  appendRuntimeError('Необработанное отклонение промиса: ' + reason);
});

// ===== Старт: восстановление набора файлов из localStorage, иначе — один новый файл =====
if (!restoreState()) {
  openFiles = [makeFile('script.gms', TEMPLATE)];
  activeIndex = 0;
}
code.value = openFiles[activeIndex].content;
notesArea.value = openFiles[activeIndex].notes || '';
currentHandle = openFiles[activeIndex].handle;
currentHtmlHandle = openFiles[activeIndex].htmlHandle;
rebuildFileSelect();
updateHeaderLabel();
render();
runCheck();
persistState();
</script>
