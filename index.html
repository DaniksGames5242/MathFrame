<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>MathFrame | Образовательная платформа</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #f0f4fa 0%, #e6ecf4 100%);
            color: #1a2c3e;
            height: 100vh;
            overflow: hidden;
        }

        /* ---------- Анимация загрузки (3D, глоу) ---------- */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 20%, #1e3a5f, #0a1a2f);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1), visibility 0.8s;
        }

        .loading-spinner {
            text-align: center;
            animation: floatPulse 2s infinite ease-in-out;
            filter: drop-shadow(0 0 20px rgba(0, 160, 255, 0.6));
        }

        .loading-spinner i {
            font-size: 5rem;
            color: #7bc5ff;
            animation: spin3D 1.2s infinite cubic-bezier(0.45, 0.05, 0.55, 0.95), glowPulse 1.6s infinite;
            display: inline-block;
        }

        .loading-spinner p {
            margin-top: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #b8e1ff, #ffffff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shineMove 2s linear infinite, scaleSoft 1.4s infinite;
            letter-spacing: -0.3px;
            font-size: 1.3rem;
        }

        @keyframes spin3D {
            0% { transform: rotateY(0deg) rotateX(0deg) scale(1); }
            50% { transform: rotateY(180deg) rotateX(12deg) scale(1.08); }
            100% { transform: rotateY(360deg) rotateX(0deg) scale(1); }
        }

        @keyframes glowPulse {
            0% { text-shadow: 0 0 0px rgba(123,197,255,0); filter: drop-shadow(0 0 0px #7bc5ff); }
            50% { text-shadow: 0 0 20px rgba(123,197,255,0.8); filter: drop-shadow(0 0 14px #7bc5ff); }
            100% { text-shadow: 0 0 0px rgba(123,197,255,0); filter: drop-shadow(0 0 0px #7bc5ff); }
        }

        @keyframes shineMove {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        @keyframes scaleSoft {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        @keyframes floatPulse {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }

        /* Плавный выход загрузки и вход контента */
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            opacity: 0;
            transform: scale(0.98);
            transition: opacity 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.2), transform 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.2);
        }

        .app.content-visible {
            opacity: 1;
            transform: scale(1);
        }

        /* Верхняя панель */
        .top-bar {
            background: rgba(255, 255, 255, 0.85);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
            padding: 12px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            z-index: 30;
            flex-shrink: 0;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.02);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .home-btn, .menu-toggle {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(203, 213, 225, 0.5);
            width: 42px;
            height: 42px;
            border-radius: 16px;
            cursor: pointer;
            color: #2c6b9e;
            font-size: 1.2rem;
            transition: all 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .home-btn:hover, .menu-toggle:hover {
            background: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(0,0,0,0.05);
            border-color: #cbdbe0;
        }

        .home-btn:active, .menu-toggle:active {
            transform: scale(0.94);
        }

        .menu-toggle {
            display: none;
        }

        .logo {
            font-weight: 700;
            font-size: 1.35rem;
            background: linear-gradient(135deg, #0f3b5c, #1f6392);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Панель иерархии */
        .hierarchy-panel {
            width: 320px;
            background: rgba(255, 255, 255, 0.96);
            border-right: 1px solid rgba(226, 232, 240, 0.8);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            z-index: 20;
            flex-shrink: 0;
            box-shadow: 4px 0 25px rgba(0, 0, 0, 0.05);
        }

        .panel-header {
            padding: 22px 20px 12px;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #4a627a;
            letter-spacing: 1px;
        }

        /* Кастомные селекты */
        .custom-select {
            position: relative;
            width: 100%;
        }
        .custom-select select {
            appearance: none;
            width: 100%;
            padding: 12px 16px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1e2f3e;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }
        .custom-select select:focus {
            border-color: #2c6b9e;
            box-shadow: 0 0 0 3px rgba(44,107,158,0.15);
        }
        .custom-select::after {
            content: '\f078';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            font-size: 0.7rem;
            color: #6b8cae;
        }

        .level-filter {
            padding: 16px 20px 24px;
            border-top: 1px solid rgba(226, 232, 240, 0.6);
        }

        .level-filter label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #4a627a;
            display: block;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        /* Чекбоксы */
        .search-options-grid label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
        }
        .search-options-grid input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #2c6b9e;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .search-options-grid input[type="checkbox"]:active {
            transform: scale(0.9);
        }

        /* ---------- ПОИСКОВАЯ ПАНЕЛЬ: КОРРЕКТНОЕ СВОРАЧИВАНИЕ ---------- */
        #searchOptionsPanel {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            padding: 0 20px;
            transition: max-height 0.4s cubic-bezier(0.33, 1, 0.68, 1), opacity 0.25s ease, padding 0.2s ease;
            visibility: hidden;
        }
        #searchOptionsPanel.open {
            max-height: 220px;      /* достаточно для 4 чекбоксов */
            opacity: 1;
            padding: 4px 20px 16px 20px;
            visibility: visible;
        }
        .search-options-grid {
            background: #f9fbfe;
            border-radius: 24px;
            padding: 14px;
            margin-top: 6px;
        }

        /* Дерево тем */
        .tree-children {
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.33, 1, 0.68, 1), opacity 0.3s, transform 0.25s;
            max-height: 0;
            opacity: 0;
            transform: translateY(-8px);
        }
        .tree-children.expanded {
            max-height: 1200px;
            opacity: 1;
            transform: translateY(0);
        }

        .tree-node-content {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .tree-node-content:hover {
            background: #ecf5fe;
            transform: translateX(5px);
        }

        .tree-node.active > .tree-node-content {
            background: linear-gradient(95deg, #e2effc, #d4e8fb);
            color: #1a5d9c;
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        /* Контентные анимации */
        .content-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
            scroll-behavior: smooth;
        }

        .unified-card {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 36px;
            border: 1px solid rgba(226, 232, 240, 0.8);
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 18px 30px -12px rgba(0, 0, 0, 0.08);
        }

        .nav-buttons {
            display: flex;
            gap: 14px;
            padding: 18px 28px;
            background: rgba(251, 253, 255, 0.6);
            border-bottom: 1px solid #eff3f8;
        }

        .nav-btn {
            background: #f0f4fa;
            border: none;
            border-radius: 44px;
            padding: 8px 22px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #2c6b9e;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.2);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .nav-btn:active {
            transform: scale(0.95);
            background: #e2e8f2;
        }

        .column-example, .column-description {
            padding: 24px;
            transition: all 0.2s;
        }

        .example-placeholder {
            background: #ffffff;
            border-radius: 24px;
            border: 1px solid #ecf3fa;
            min-height: 420px;
            transition: opacity 0.25s ease, transform 0.25s;
            box-shadow: 0 6px 12px -8px rgba(0,0,0,0.05);
        }

        .desc-placeholder {
            line-height: 1.55;
            font-size: 0.95rem;
            animation: fadeSlideContent 0.3s ease;
        }

        @keyframes fadeSlideContent {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .inline-link {
            color: #2c6b9e;
            text-decoration: none;
            border-bottom: 1.5px dashed #9bb8d4;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.15s;
        }
        .inline-link:active {
            opacity: 0.7;
            transform: scale(0.98);
            display: inline-block;
        }

        .search-highlight {
            background: #ffecb3;
            color: #1e3b4f;
            border-radius: 8px;
            padding: 0 4px;
            font-weight: 700;
            animation: softGlow 0.4s;
        }

        @keyframes softGlow {
            0% { background: #ffd966; }
            100% { background: #ffecb3; }
        }

        /* Мобильные стили */
        @media (max-width: 768px) {
            .top-bar { padding: 10px 18px; }
            .menu-toggle { display: flex; }
            .hierarchy-panel {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                transform: translateX(-100%);
                box-shadow: 8px 0 30px rgba(0,0,0,0.2);
                z-index: 101;
                background: rgba(255, 255, 255, 0.98);
                transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            }
            .hierarchy-panel.open {
                transform: translateX(0);
            }
            .two-columns { flex-direction: column; }
            .column-example { border-right: none; border-bottom: 1px solid #eff3f8; }
            .content-wrapper { padding: 16px; }
        }

        .mobile-overlay {
            position: fixed;
            top: 0;
            left: 320px;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .mobile-overlay.visible {
            display: block;
            opacity: 1;
        }

        .framework-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 30, 45, 0.9);
            backdrop-filter: blur(20px);
            color: white;
            padding: 12px 28px;
            border-radius: 60px;
            font-size: 0.85rem;
            font-weight: 500;
            z-index: 200;
            animation: toastSlide 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.2);
            box-shadow: 0 12px 28px rgba(0,0,0,0.2);
            letter-spacing: 0.2px;
        }

        @keyframes toastSlide {
            from { opacity: 0; transform: translateX(-50%) translateY(30px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .welcome-message {
            text-align: center;
            padding: 30px 20px;
        }
        .welcome-message i {
            font-size: 3.8rem;
            color: #2c6b9e;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner">
        <i class="fas fa-cube"></i>
        <p>MathFrame | immersive learning</p>
    </div>
</div>
<div class="app" id="appRoot">
    <div class="top-bar">
        <div class="logo-area">
            <button class="menu-toggle" id="menuToggleBtn"><i class="fas fa-bars"></i></button>
            <div class="logo"><i class="fas fa-graduation-cap"></i> MathFrame</div>
            <button class="home-btn" id="globalHomeBtn" title="Главная"><i class="fas fa-home"></i></button>
        </div>
    </div>
    <div class="main-layout">
        <div class="hierarchy-panel" id="hierarchyPanel">
            <div class="panel-header"><i class="fas fa-diagram-project"></i> СОДЕРЖАНИЕ</div>
            <div class="hierarchy-search">
                <div class="search-wrapper" style="padding: 0 16px;">
                    <div style="position:relative;">
                        <i class="fas fa-search" style="position:absolute; left:14px; top:50%; transform:translateY(-50%); color:#8ba0bc;"></i>
                        <input type="text" id="hierarchySearchInput" class="search-input" style="padding: 12px 12px 12px 42px; border-radius: 28px; background:#ffffff; width:100%; border:1px solid #e2e8f0;" placeholder="Поиск по темам...">
                    </div>
                </div>
                <div class="search-options-header" id="searchOptionsToggle" style="display: flex; justify-content: space-between; padding: 10px 20px; margin-top: 4px; cursor: pointer; user-select:none;">
                    <span><i class="fas fa-sliders-h"></i> Параметры поиска</span>
                    <i class="fas fa-chevron-down" id="searchChevron" style="transition: transform 0.25s ease;"></i>
                </div>
                <!-- Панель параметров поиска: корректная анимация, изначально открыта -->
                <div id="searchOptionsPanel" class="search-options-panel open">
                    <div class="search-options-grid">
                        <label><input type="checkbox" id="searchInDescCheckbox"> <i class="far fa-file-alt"></i> В описании</label>
                        <label><input type="checkbox" id="keywordsCheckbox" checked> <i class="fas fa-tags"></i> Ключевые слова</label>
                        <label><input type="checkbox" id="fuzzyCheckbox" checked> <i class="fas fa-spell-check"></i> Опечатки</label>
                        <label><input type="checkbox" id="smartSortCheckbox" checked> <i class="fas fa-chart-line"></i> Умная сортировка</label>
                    </div>
                </div>
            </div>
            <div class="topic-tree" id="topicTree"></div>
            <div class="level-filter">
                <label><i class="fas fa-filter"></i> Упростить до</label>
                <div class="custom-select">
                    <select id="levelSelect">
                        <option value="all">Не упрощать (все темы)</option>
                        <option value="9">До 9 класса</option>
                        <option value="7">До 7 класса</option>
                        <option value="5">До 5-6 классов</option>
                        <option value="preschool">Для классов до 5</option>
                    </select>
                </div>
                <label style="margin-top:12px;"><i class="fas fa-sort-amount-down"></i> Сортировка</label>
                <div class="custom-select">
                    <select id="sortSelect">
                        <option value="config">Как в конфиге</option>
                        <option value="name_asc">По алфавиту (А-Я)</option>
                        <option value="name_desc">По алфавиту (Я-А)</option>
                        <option value="grade_asc">По классам (возрастание)</option>
                        <option value="grade_desc">По классам (убывание)</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="content-wrapper" id="unifiedScroller">
            <div class="unified-card" id="unifiedCard">
                <div class="nav-buttons" id="navButtonsContainer"></div>
                <div class="two-columns">
                    <div class="column-example">
                        <div class="section-title" style="font-weight:600;"><i class="fas fa-cursor"></i> ИНТЕРАКТИВНЫЙ ПРИМЕР</div>
                        <div class="example-placeholder" id="examplePlaceholder"></div>
                    </div>
                    <div class="column-description">
                        <div class="section-title" style="font-weight:600;"><i class="fas fa-book"></i> ТЕОРЕТИЧЕСКИЙ МАТЕРИАЛ</div>
                        <div class="desc-placeholder" id="descriptionPlaceholder"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="mobile-overlay" id="mobileOverlay"></div>

<script>
    // Базовые темы (конфиг)
    const DEFAULT_TOPICS = [
        { id: "algebra_7", name: "Алгебра 7–9", parent: null, icon: "fa-folder", gradeLevel: 7, keywords: ["алгебра","выражения","формулы","7 класс"], example: '<div style="padding:20px; text-align:center;"><i class="fas fa-chart-line" style="font-size:2rem;"></i><div>Алгебра 7-9</div></div>', description: '<p><strong>Алгебра</strong> — раздел математики, изучающий операции над величинами и решение уравнений.</p><p><span class="inline-link" data-topic-id="linear_eq">Линейные уравнения</span>.</p>' },
        { id: "linear_eq", name: "Линейные уравнения", parent: "algebra_7", icon: "fa-file-alt", gradeLevel: 7, keywords: ["уравнение","линейное","корень","ax+b=0"], example: '<div style="padding:20px;"><i class="fas fa-chart-line"></i><div>ax + b = 0 → x = -b/a</div><div>Пример: 2x - 6 = 0 → x = 3</div></div>', description: '<p><strong>Линейное уравнение</strong>: ax + b = 0, a≠0. Корень: x = -b/a.</p><p><span class="inline-link" data-topic-id="quadratic_eq">Квадратные уравнения</span>.</p>' },
        { id: "quadratic_eq", name: "Квадратные уравнения", parent: "algebra_7", icon: "fa-file-alt", gradeLevel: 8, keywords: ["дискриминант","парабола","ax²+bx+c=0"], example: '<div style="padding:20px;"><i class="fas fa-chart-line"></i><div>ax² + bx + c = 0, D = b² - 4ac</div></div>', description: '<p>Квадратное уравнение решается через дискриминант. При D>0 — два корня.</p>' },
        { id: "geometry_7", name: "Геометрия 7–9", parent: null, icon: "fa-folder", gradeLevel: 7, keywords: ["геометрия","фигуры","углы"], example: '<div style="padding:20px;text-align:center;"><i class="fas fa-shapes" style="font-size:2rem;"></i><div>Геометрия</div></div>', description: '<p><strong>Геометрия</strong> — раздел математики, изучающий пространственные формы.</p>' },
        { id: "adjacent_angles", name: "Смежные углы", parent: "geometry_7", icon: "fa-file-alt", gradeLevel: 7, keywords: ["углы","смежные","сумма 180"], example: '<div style="padding:20px;"><i class="fas fa-angle-double-right"></i><div>∠α + ∠β = 180°</div></div>', description: '<p><strong>Смежные углы</strong> — два угла с общей стороной, сумма 180°.</p>' },
        { id: "triangles", name: "Треугольники", parent: "geometry_7", icon: "fa-file-alt", gradeLevel: 7, keywords: ["треугольник","сумма углов"], example: '<div style="padding:20px;"><i class="fas fa-shapes"></i><div>Сумма углов = 180°</div></div>', description: '<p>Треугольники: виды, признаки равенства.</p>' },
        { id: "algebra_10", name: "Алгебра 10–11", parent: null, icon: "fa-folder", gradeLevel: 10, keywords: ["алгебра","старшая школа","функции"], example: '<div style="padding:20px;"><i class="fas fa-chart-line"></i><div>Старшая школа</div></div>', description: '<p>Углублённое изучение функций, производных и интегралов.</p>' },
        { id: "logarithms", name: "Логарифмы", parent: "algebra_10", icon: "fa-file-alt", gradeLevel: 10, keywords: ["логарифм","log","степень"], example: '<div style="padding:20px;"><i class="fas fa-chart-line"></i><div>logₐ b = c ⇔ a^c = b</div></div>', description: '<p>Логарифм — показатель степени, в которую нужно возвести основание.</p>' }
    ];

    let currentTopics = [], currentTopicId = null, collapsedFolders = new Map(), navigationStack = [];
    let currentGradeFilter = "all", currentSortMode = "config";
    let currentSearchQuery = "", searchInDescription = false, keywordsEnabled = true, fuzzyEnabled = true, smartSortEnabled = true;
    let matchOnlyByDescription = new Map(), topicRelevanceInfo = new Map();

    async function loadConfigFromFile() { try { const r=await fetch('./config.json'); if(r.ok) return await r.json(); } catch(e){} return JSON.parse(JSON.stringify(DEFAULT_TOPICS)); }
    function deduplicateTopics(arr) { const map=new Map(); arr.forEach(t=>{ const key=`${t.name.toLowerCase()}|${t.parent===null?'null':t.parent}`; if(!map.has(key)) map.set(key,t); }); return Array.from(map.values()); }
    function buildHierarchyOrder(topics) { const ordered=[], roots=topics.filter(t=>t.parent===null).sort((a,b)=>a.name.localeCompare(b.name)); function addWithChildren(t){ ordered.push(t); topics.filter(c=>c.parent===t.id).sort((a,b)=>a.name.localeCompare(b.name)).forEach(ch=>addWithChildren(ch)); } roots.forEach(r=>addWithChildren(r)); return ordered; }
    function levenshtein(a,b) { const m=[]; for(let i=0;i<=b.length;i++) m[i]=[i]; for(let j=0;j<=a.length;j++) m[0][j]=j; for(let i=1;i<=b.length;i++) for(let j=1;j<=a.length;j++) { const cost=a[j-1]===b[i-1]?0:1; m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+cost); } return m[b.length][a.length]; }
    function getMatchPercent(word,text) { if(!text) return 0; const lw=word.toLowerCase(), lt=text.toLowerCase(); const bound=new RegExp(`\\b${lw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\b`,'i'); if(bound.test(text)) return 100; if(lt.includes(lw)) return 80; if(fuzzyEnabled && lw.length>=3){ const words=lt.split(/\s+/); for(let w of words) if(w.length>=3){ const d=levenshtein(lw,w); if(d===1) return 70; if(d===2) return 60; } } return 0; }
    function getTopicRelevanceInfo(topic,words) { if(!words.length) return {found:false}; let nameP=0,kwP=0,descP=0; for(let w of words){ nameP=Math.max(nameP,getMatchPercent(w,topic.name)); if(keywordsEnabled && topic.keywords) kwP=Math.max(kwP,getMatchPercent(w,Array.isArray(topic.keywords)?topic.keywords.join(" "):String(topic.keywords))); if(searchInDescription && topic.description) descP=Math.max(descP,getMatchPercent(w,topic.description.replace(/<[^>]*>/g,''))); } let group=0,percent=0,onlyDesc=false; if(nameP>0){group=1;percent=nameP;} else if(kwP>0){group=2;percent=kwP;} else if(descP>0){group=3;percent=descP;onlyDesc=true;} return {found:group>0,group,percent,onlyDesc}; }
    function getSearchWords() { return currentSearchQuery.trim()?currentSearchQuery.toLowerCase().split(/\s+/).filter(w=>w.length>0):[]; }
    function highlightText(html,words) { if(!words.length) return html; const div=document.createElement('div'); div.innerHTML=html; function walk(node){ if(node.nodeType===Node.TEXT_NODE){ let text=node.nodeValue; for(let w of words){ const regex=new RegExp(`(${w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi'); if(regex.test(text)) text=text.replace(regex,`<span class="search-highlight">$1</span>`); } if(text!==node.nodeValue){ const span=document.createElement('span'); span.innerHTML=text; node.parentNode.replaceChild(span,node); } } else if(node.nodeType===Node.ELEMENT_NODE && !['SCRIPT','STYLE'].includes(node.tagName)) Array.from(node.childNodes).forEach(walk); } Array.from(div.childNodes).forEach(walk); return div.innerHTML; }
    function saveToStorage(){ localStorage.setItem('mathframe_collapsed',JSON.stringify(Object.fromEntries(collapsedFolders))); localStorage.setItem('mathframe_filter',currentGradeFilter); localStorage.setItem('mathframe_sort',currentSortMode); localStorage.setItem('mathframe_search',currentSearchQuery); localStorage.setItem('mathframe_search_in_desc',searchInDescription); localStorage.setItem('mathframe_keywords',keywordsEnabled); localStorage.setItem('mathframe_fuzzy',fuzzyEnabled); localStorage.setItem('mathframe_smart_sort',smartSortEnabled); }
    function loadFromStorage(){ const sc=localStorage.getItem('mathframe_collapsed'); if(sc) collapsedFolders=new Map(Object.entries(JSON.parse(sc))); currentGradeFilter=localStorage.getItem('mathframe_filter')||"all"; currentSortMode=localStorage.getItem('mathframe_sort')||"config"; currentSearchQuery=localStorage.getItem('mathframe_search')||""; searchInDescription=localStorage.getItem('mathframe_search_in_desc')==='true'; keywordsEnabled=localStorage.getItem('mathframe_keywords')!=='false'; fuzzyEnabled=localStorage.getItem('mathframe_fuzzy')!=='false'; smartSortEnabled=localStorage.getItem('mathframe_smart_sort')!=='false'; }
    function updateRelevanceInfo(){ matchOnlyByDescription.clear(); topicRelevanceInfo.clear(); if(!currentSearchQuery.trim()) return; const words=getSearchWords(); for(let t of currentTopics){ const info=getTopicRelevanceInfo(t,words); topicRelevanceInfo.set(t.id,info); if(info.found && info.onlyDesc) matchOnlyByDescription.set(t.id,true); } }
    function expandParentsForMatching(){ if(!currentSearchQuery.trim()) return; for(let t of currentTopics){ if(topicRelevanceInfo.get(t.id)?.found){ let p=t.parent; while(p){ collapsedFolders.set(p,false); p=currentTopics.find(x=>x.id===p)?.parent; } } } }
    function isTopicVisible(t){ const g=t.gradeLevel||1; if(currentGradeFilter==="all") return true; if(currentGradeFilter==="9") return g<=9; if(currentGradeFilter==="7") return g<=7; if(currentGradeFilter==="5") return g<=5; if(currentGradeFilter==="preschool") return g<=4; return true; }
    function sortTopicsByRelevance(arr){ if(!smartSortEnabled || !currentSearchQuery.trim()){ if(currentSortMode==="name_asc") return [...arr].sort((a,b)=>a.name.localeCompare(b.name)); if(currentSortMode==="name_desc") return [...arr].sort((a,b)=>b.name.localeCompare(a.name)); if(currentSortMode==="grade_asc") return [...arr].sort((a,b)=>(a.gradeLevel||0)-(b.gradeLevel||0)); if(currentSortMode==="grade_desc") return [...arr].sort((a,b)=>(b.gradeLevel||0)-(a.gradeLevel||0)); return [...arr]; } return [...arr].sort((a,b)=>{ const ia=topicRelevanceInfo.get(a.id)||{group:999,percent:0}, ib=topicRelevanceInfo.get(b.id)||{group:999,percent:0}; if(ia.group!==ib.group) return ia.group-ib.group; if(ia.percent!==ib.percent) return ib.percent-ia.percent; return a.name.localeCompare(b.name); }); }
    function getChildrenSorted(parentId){ return sortTopicsByRelevance(currentTopics.filter(t=>t.parent===parentId && isTopicVisible(t))); }
    function hasVisibleChildren(id){ const kids=getChildrenSorted(id); if(!kids.length) return false; if(!currentSearchQuery.trim()) return true; return kids.some(c=>topicRelevanceInfo.get(c.id)?.found); }
    function renderNode(topic, parent) {
        const children = getChildrenSorted(topic.id);
        const visibleKids = children.length > 0 && hasVisibleChildren(topic.id);
        const collapsed = collapsedFolders.get(topic.id) === true;
        const node = document.createElement('div'); node.className = 'tree-node'; node.setAttribute('data-id', topic.id);
        const content = document.createElement('div'); content.className = 'tree-node-content';
        const toggle = document.createElement('span'); toggle.className = 'toggle-icon';
        if (visibleKids) { toggle.innerHTML = collapsed ? '<i class="fas fa-chevron-right"></i>' : '<i class="fas fa-chevron-down"></i>'; } else { toggle.classList.add('empty'); toggle.style.width = '20px'; }
        content.appendChild(toggle);
        const icon = document.createElement('i'); icon.className = `fas ${topic.icon || 'fa-book'}`; icon.style.width = '20px';
        content.appendChild(icon);
        const title = document.createElement('span'); title.className = 'node-title'; title.textContent = topic.name;
        content.appendChild(title); node.appendChild(content);
        if (visibleKids) {
            const kidsDiv = document.createElement('div'); kidsDiv.className = 'tree-children';
            if (!collapsed) kidsDiv.classList.add('expanded');
            children.forEach(c => { if (isTopicVisible(c)) renderNode(c, kidsDiv); });
            node.appendChild(kidsDiv);
            toggle.addEventListener('click', (e) => { e.stopPropagation(); const newCollapsed = !collapsedFolders.get(topic.id); collapsedFolders.set(topic.id, newCollapsed); saveToStorage(); if (newCollapsed) { kidsDiv.classList.remove('expanded'); toggle.innerHTML = '<i class="fas fa-chevron-right"></i>'; } else { kidsDiv.classList.add('expanded'); toggle.innerHTML = '<i class="fas fa-chevron-down"></i>'; } });
        }
        parent.appendChild(node);
    }
    function renderTree() { const container = document.getElementById('topicTree'); if (!container) return; container.innerHTML = ''; updateRelevanceInfo(); expandParentsForMatching(); const roots = sortTopicsByRelevance(currentTopics.filter(t => t.parent === null && isTopicVisible(t))); for (let root of roots) renderNode(root, container); highlightActive(); attachEvents(); }
    function highlightActive() { document.querySelectorAll('.tree-node').forEach(n=>n.classList.remove('active')); if(currentTopicId && currentTopicId!=='welcome') document.querySelector(`.tree-node[data-id="${currentTopicId}"]`)?.classList.add('active'); }
    function attachEvents() { document.querySelectorAll('.tree-node-content').forEach(el=>{ el.removeEventListener('click',clickHandler); el.addEventListener('click',clickHandler); }); }
    function clickHandler(e) { if(e.target.closest('.toggle-icon') && !e.target.closest('.toggle-icon')?.classList.contains('empty')) return; const node=this.closest('.tree-node'); if(node){ const id=node.getAttribute('data-id'); if(id){ if(window.innerWidth<=768) closeMenu(); loadTopic(id,false); } } }
    function setExample(container, html) { container.style.opacity = '0'; container.style.transform = 'scale(0.98)'; setTimeout(() => { container.innerHTML = html; container.style.opacity = '1'; container.style.transform = 'scale(1)'; }, 30); }
    function updateDescription() { if (currentTopicId === 'welcome') return; const topic = currentTopics.find(t => t.id === currentTopicId); if (!topic) return; const descDiv = document.getElementById('descriptionPlaceholder'); const raw = topic.description || '<p>Описание отсутствует</p>'; const words = getSearchWords(); const shouldHighlight = words.length && (searchInDescription || keywordsEnabled); descDiv.style.opacity = '0'; descDiv.style.transform = 'translateY(6px)'; setTimeout(() => { descDiv.innerHTML = shouldHighlight ? highlightText(raw, words) : raw; descDiv.querySelectorAll('.inline-link').forEach(link => { link.addEventListener('click', (e) => { e.preventDefault(); const tid = link.getAttribute('data-topic-id'); if (tid && currentTopics.find(t => t.id === tid)) loadTopic(tid, true); }); }); descDiv.style.opacity = '1'; descDiv.style.transform = 'translateY(0)'; }, 50); }
    function showWelcomeScreen() { currentTopicId = 'welcome'; const exampleDiv = document.getElementById('examplePlaceholder'); const descDiv = document.getElementById('descriptionPlaceholder'); exampleDiv.style.opacity = '0'; setTimeout(() => { exampleDiv.innerHTML = `<div class="welcome-message"><i class="fas fa-graduation-cap"></i><h2 style="margin: 16px 0 10px;">MathFrame</h2><p>Современная платформа для изучения точных наук</p><p style="margin-top: 22px; opacity:0.7;">Выберите тему в меню или начните поиск</p></div>`; descDiv.innerHTML = `<p style="font-size: 1rem;"><strong>Добро пожаловать!</strong><br>Адаптивный интерфейс, плавные анимации, умный поиск и качественные примеры.</p><p>Используйте дерево тем, фильтры и гиперссылки внутри материалов.</p>`; exampleDiv.style.opacity = '1'; }, 30); updateNavButtons(); renderTree(); }
    function loadTopic(id, fromLink) { if (id === 'welcome') { showWelcomeScreen(); renderTree(); return; } const topic = currentTopics.find(t => t.id === id); if (!topic) return; if (fromLink && currentTopicId && currentTopicId !== 'welcome') navigationStack.push(currentTopicId); currentTopicId = id; setExample(document.getElementById('examplePlaceholder'), topic.example || '<div style="padding:20px;">Пример не задан</div>'); updateDescription(); updateNavButtons(); renderTree(); showToast(topic.name); }
    function updateNavButtons() { const container = document.getElementById('navButtonsContainer'); if (!container) return; if (currentTopicId === 'welcome') { container.innerHTML = '<button class="nav-btn" id="homeWelcomeBtn"><i class="fas fa-graduation-cap"></i> Главная</button>'; const homeBtn = document.getElementById('homeWelcomeBtn'); if (homeBtn) homeBtn.onclick = () => { if (currentTopicId !== 'welcome') showWelcomeScreen(); else showToast('Вы уже на главной'); }; return; } const topic = currentTopics.find(t => t.id === currentTopicId); const hasParent = topic && topic.parent && currentTopics.some(p => p.id === topic.parent); container.innerHTML = ''; if (hasParent) { const btn = document.createElement('button'); btn.className = 'nav-btn'; btn.innerHTML = '<i class="fas fa-arrow-up"></i> Родительская тема'; btn.onclick = () => { if (topic.parent) loadTopic(topic.parent, false); }; container.appendChild(btn); } if (navigationStack.length) { const back = document.createElement('button'); back.className = 'nav-btn'; back.innerHTML = '<i class="fas fa-undo-alt"></i> Вернуться по ссылке'; back.onclick = () => { if (navigationStack.length) loadTopic(navigationStack.pop(), false); else showToast('Нет истории'); }; container.appendChild(back); } }
    function applyFilters() { currentGradeFilter = document.getElementById('levelSelect').value; currentSortMode = document.getElementById('sortSelect').value; saveToStorage(); renderTree(); if (currentTopicId !== 'welcome') { const cur = currentTopics.find(t => t.id === currentTopicId); if (cur && isTopicVisible(cur)) updateDescription(); else { const first = currentTopics.find(t => t.parent === null && isTopicVisible(t)); if (first) loadTopic(first.id, false); else showWelcomeScreen(); } } else { renderTree(); } }
    function showToast(msg) { let t = document.querySelector('.framework-toast'); if (t) t.remove(); t = document.createElement('div'); t.className = 'framework-toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }
    function closeMenu() { document.getElementById('hierarchyPanel')?.classList.remove('open'); const overlay = document.getElementById('mobileOverlay'); if (overlay) { overlay.classList.remove('visible'); setTimeout(() => overlay.style.display = 'none', 300); } }
    function openMenu() { const panel = document.getElementById('hierarchyPanel'); const overlay = document.getElementById('mobileOverlay'); if (!panel || !overlay) return; panel.classList.add('open'); const panelWidth = panel.offsetWidth; overlay.style.left = panelWidth + 'px'; overlay.style.display = 'block'; requestAnimationFrame(() => overlay.classList.add('visible')); }
    async function init() {
        const loaded = await loadConfigFromFile();
        currentTopics = buildHierarchyOrder(deduplicateTopics(loaded));
        collapsedFolders.clear();
        for (let t of currentTopics) if (currentTopics.some(c => c.parent === t.id)) collapsedFolders.set(t.id, true);
        loadFromStorage();
        document.getElementById('hierarchySearchInput').value = currentSearchQuery;
        document.getElementById('searchInDescCheckbox').checked = searchInDescription;
        document.getElementById('keywordsCheckbox').checked = keywordsEnabled;
        document.getElementById('fuzzyCheckbox').checked = fuzzyEnabled;
        document.getElementById('smartSortCheckbox').checked = smartSortEnabled;
        document.getElementById('levelSelect').value = currentGradeFilter;
        document.getElementById('sortSelect').value = currentSortMode;
        // инициализация панели поиска: корректное состояние open
        const panelOpt = document.getElementById('searchOptionsPanel');
        const chevron = document.getElementById('searchChevron');
        if (panelOpt) {
            panelOpt.classList.add('open');
            chevron.style.transform = 'rotate(0deg)';
        }
        showWelcomeScreen();
        const refresh = () => { saveToStorage(); renderTree(); if (currentTopicId !== 'welcome') updateDescription(); };
        document.getElementById('hierarchySearchInput').addEventListener('input', (e) => { currentSearchQuery = e.target.value; refresh(); });
        document.getElementById('searchInDescCheckbox').addEventListener('change', (e) => { searchInDescription = e.target.checked; refresh(); });
        document.getElementById('keywordsCheckbox').addEventListener('change', (e) => { keywordsEnabled = e.target.checked; refresh(); });
        document.getElementById('fuzzyCheckbox').addEventListener('change', (e) => { fuzzyEnabled = e.target.checked; refresh(); });
        document.getElementById('smartSortCheckbox').addEventListener('change', (e) => { smartSortEnabled = e.target.checked; refresh(); });
        document.getElementById('levelSelect').addEventListener('change', applyFilters);
        document.getElementById('sortSelect').addEventListener('change', applyFilters);
        document.getElementById('menuToggleBtn').addEventListener('click', openMenu);
        document.getElementById('mobileOverlay').addEventListener('click', closeMenu);
        document.getElementById('globalHomeBtn').addEventListener('click', () => { if (currentTopicId !== 'welcome') showWelcomeScreen(); else showToast('Вы уже на главной'); });
        window.addEventListener('resize', () => { if (window.innerWidth > 768) closeMenu(); });
        document.body.addEventListener('click', (e) => { const link = e.target.closest('.inline-link'); if (link && link.dataset.topicId) { e.preventDefault(); const tid = link.dataset.topicId; if (tid && currentTopics.find(t => t.id === tid)) loadTopic(tid, true); } });
        const searchToggle = document.getElementById('searchOptionsToggle');
        if (searchToggle) searchToggle.addEventListener('click', () => {
            panelOpt.classList.toggle('open');
            const isOpen = panelOpt.classList.contains('open');
            chevron.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(180deg)';
        });
        setTimeout(() => { const loader = document.getElementById('loadingOverlay'); if (loader) { loader.style.opacity = '0'; setTimeout(() => { loader.style.display = 'none'; document.getElementById('appRoot').classList.add('content-visible'); }, 700); } else { document.getElementById('appRoot').classList.add('content-visible'); } }, 800);
    }
    init();
</script>
