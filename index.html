<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Редактор геометрических примеров · GitHub sync</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: #0a0c12;
            font-family: 'Segoe UI', 'Montserrat', system-ui, sans-serif;
            padding: 1rem;
            color: #e3e3e8;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #12141c;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            border: 1px solid #2a2e3a;
        }

        .header {
            background: #1e2230;
            color: white;
            padding: 1rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 0.8rem;
            border-bottom: 1px solid #2a2e3a;
        }

        .title {
            font-weight: 900;
            font-size: 1.3rem;
            letter-spacing: 0.05em;
            color: #b7c9ff;
        }

        .file-buttons {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        button {
            background: #2a2e3a;
            border: 1px solid #4a5060;
            color: #eef2ff;
            padding: 0.4rem 1rem;
            border-radius: 30px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
            transition: 0.1s;
        }

        button:hover {
            background: #3a4050;
            border-color: #6a7080;
        }

        .github-buttons button {
            background: #2a3a4a;
            border-color: #4a6a8a;
        }

        .github-buttons button:hover {
            background: #3a5a6a;
        }

        .main {
            padding: 1rem;
        }

        .topic-header {
            background: #1a1e28;
            padding: 1rem;
            border-radius: 16px;
            margin-bottom: 1rem;
            border: 1px solid #2a2e3a;
        }

        .topic-name {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 0.3rem;
            color: #d6e6ff;
        }

        .topic-meta {
            font-size: 0.8rem;
            color: #8a9bc0;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 0.3rem;
        }

        .code-area {
            margin: 1rem 0;
        }

        textarea {
            width: 100%;
            min-height: 400px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            padding: 0.8rem;
            border: 1px solid #2a2e3a;
            border-radius: 12px;
            background: #0f1119;
            color: #eef2ff;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #5a7a9a;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .nav-buttons button {
            background: #2a3a4a;
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
            flex: 1;
            min-width: 120px;
        }

        .nav-buttons button:active {
            transform: scale(0.97);
        }

        .copy-prompt-btn {
            background: #4a6a8a !important;
        }

        .console {
            background: #0a0c10;
            color: #6ef0a0;
            font-family: monospace;
            font-size: 12px;
            padding: 0.8rem;
            border-radius: 12px;
            margin-top: 1rem;
            max-height: 150px;
            overflow-y: auto;
            white-space: pre-wrap;
            border: 1px solid #2a2e3a;
        }

        .status {
            font-size: 0.75rem;
            margin-top: 0.5rem;
            color: #8ab3ff;
            text-align: center;
        }

        @media (max-width: 700px) {
            .topic-name { font-size: 1.2rem; }
            textarea { min-height: 300px; font-size: 10px; }
            button { padding: 0.3rem 0.8rem; font-size: 0.7rem; }
            .nav-buttons button { padding: 0.5rem 0.8rem; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="title">📐 Редактор геометрических примеров</div>
        <div class="file-buttons">
            <input type="file" id="loadConfig" accept=".json" style="display:none">
            <button id="loadBtn">📂 Загрузить конфиг</button>
            <button id="downloadBtn">💾 Скачать конфиг</button>
        </div>
        <div class="github-buttons">
            <button id="loadFromGitHubBtn">📥 Загрузить из GitHub</button>
            <button id="saveToGitHubBtn">📤 Сохранить в GitHub</button>
        </div>
    </div>
    <div class="main">
        <div class="topic-header">
            <div class="topic-name" id="topicName">—</div>
            <div class="topic-meta" id="topicMeta"></div>
        </div>
        <div class="code-area">
            <textarea id="codeEditor" placeholder="HTML-код примера..."></textarea>
        </div>
        <div class="nav-buttons">
            <button id="prevBtn">◀ Предыдущая</button>
            <button id="copyPromptBtn" class="copy-prompt-btn">📋 Копировать промпт</button>
            <button id="nextSaveBtn">Следующая (+сохранить) ▶</button>
        </div>
        <div class="status" id="statusMsg">💡 Загрузка конфига из GitHub...</div>
        <div class="console" id="consoleLog">[Система] Инициализация...</div>
    </div>
</div>

<script>
    // ---------------------- Конфигурация -------------------------
    let configData = null;
    let currentIndex = 0;
    let filteredIndices = [];
    let currentFilteredPos = 0;

    const STORAGE_KEY = 'geometry_editor_progress';
    const EDITED_MARKER = '<!-- __EDITED__ -->';

    // GitHub параметры (только для сохранения, загрузка без токена)
    const GITHUB_TOKEN = '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';
    const GITHUB_OWNER = 'DaniksGames5242';
    const GITHUB_REPO = 'MathFrame.github.io';
    const GITHUB_PATH = 'config.json';
    const GITHUB_BRANCH = 'main';

    // Промпты
    const STANDARDIZE_INSTRUCTION = `
Ты — эксперт по геометрии и фронтенд-разработке. Ниже приведён HTML-код интерактивного геометрического примера.
Приведи этот код в строгое соответствие со следующим стандартом:

=== СТАНДАРТ (кратко) ===
1. Структура: DOCTYPE, html, head (мета-вьюпорт user-scalable=no), body с прозрачным фоном.
2. Стили: базовая адаптивность, отступы, border для canvas, цвета (чёрный, #3366cc, #ff6633 и т.д.).
3. Перетаскивание: вершины (радиус захвата ≥ 22), стороны (строго по нормали), внутренность.
4. Устранение "прилипания": при ограничении позиции обновлять dragOffset.
5. Канвас должен быть статическим (без масштабирования браузером), размеры при ресайзе пересчитываются корректно.
6. Углы отображаются целыми числами, сумма углов 180°.
7. Валидация: минимальное расстояние между вершинами, невырожденность, границы.
8. Информационная панель обновляется динамически.
9. Обязательная пометка об успешном редактировании: добавь в начало HTML-кода (после <body>) строку '${EDITED_MARKER}' (как комментарий).
10. Сохрани все ключевые функции и визуальную тему.

Выдай ТОЛЬКО исправленный HTML-код (без лишних пояснений).
`;

    const WRITE_INSTRUCTION = `
Ты — эксперт по геометрии и фронтенд-разработке. Тебе нужно создать полноценный интерактивный HTML-пример для следующей темы:

=== ТЕМА ===
Имя: %NAME%
Класс: %GRADE%
Ключевые слова: %KEYWORDS%
Описание: %DESCRIPTION% (если нет — раскрой тему самостоятельно)

Требования к примеру (согласно нашему стандарту):
- Полноценный интерактивный canvas с перетаскиванием вершин, сторон и внутренности.
- Фигура должна соответствовать теме.
- Адаптивность, корректная работа на телефонах.
- Отображение всех характерных длин, углов (целые градусы), формул.
- Код должен быть самодостаточным (один HTML-файл).
- В начало HTML-кода (после <body>) добавь строку '${EDITED_MARKER}' как комментарий.

Выдай ТОЛЬКО готовый HTML-код (без лишних пояснений).
`;

    // DOM элементы
    const loadBtn = document.getElementById('loadBtn');
    const loadConfigInput = document.getElementById('loadConfig');
    const downloadBtn = document.getElementById('downloadBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextSaveBtn = document.getElementById('nextSaveBtn');
    const copyPromptBtn = document.getElementById('copyPromptBtn');
    const loadFromGitHubBtn = document.getElementById('loadFromGitHubBtn');
    const saveToGitHubBtn = document.getElementById('saveToGitHubBtn');
    const topicNameSpan = document.getElementById('topicName');
    const topicMetaDiv = document.getElementById('topicMeta');
    const codeEditor = document.getElementById('codeEditor');
    const statusMsgSpan = document.getElementById('statusMsg');
    const consoleLogDiv = document.getElementById('consoleLog');

    function log(message, isError = false) {
        const prefix = isError ? '⚠️ ' : 'ℹ️ ';
        consoleLogDiv.innerHTML += `<div style="color: ${isError ? '#ff9999' : '#aaffaa'}">${prefix}${message}</div>`;
        consoleLogDiv.scrollTop = consoleLogDiv.scrollHeight;
        console.log(message);
    }

    function saveProgress() {
        if (!configData) return;
        const progress = {
            currentIndex,
            currentFilteredPos,
            topicsState: configData.map(topic => ({
                id: topic.id,
                example: topic.example,
                edited: topic.example && topic.example.includes(EDITED_MARKER)
            }))
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
    }

    function loadProgress() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return false;
        try {
            const progress = JSON.parse(saved);
            if (progress.topicsState && configData) {
                for (let i = 0; i < configData.length && i < progress.topicsState.length; i++) {
                    if (progress.topicsState[i].edited) {
                        configData[i].example = progress.topicsState[i].example;
                    }
                }
                currentIndex = progress.currentIndex;
                currentFilteredPos = progress.currentFilteredPos;
                log(`Прогресс восстановлен из localStorage`);
                return true;
            }
        } catch(e) { }
        return false;
    }

    function rebuildFilteredList() {
        if (!configData) return;
        filteredIndices = [];
        for (let i = 0; i < configData.length; i++) {
            const topic = configData[i];
            const example = topic.example || '';
            if (example.includes(EDITED_MARKER)) continue;
            const isPlaceholder = !example || example.includes('В разработке') || example.trim() === '';
            if (isPlaceholder && (!topic.keywords || topic.keywords.length === 0)) continue;
            filteredIndices.push(i);
        }
        if (filteredIndices.length > 0 && !filteredIndices.includes(currentIndex)) {
            currentIndex = filteredIndices[0];
            currentFilteredPos = 0;
        } else if (filteredIndices.length === 0) {
            log(`🎉 Все темы отредактированы!`);
        } else {
            const pos = filteredIndices.indexOf(currentIndex);
            if (pos !== -1) currentFilteredPos = pos;
        }
        log(`Неотредактированных тем: ${filteredIndices.length}`);
    }

    function displayCurrentTopic() {
        if (!configData || configData.length === 0) {
            topicNameSpan.innerText = '—';
            topicMetaDiv.innerHTML = '';
            codeEditor.value = '';
            statusMsgSpan.innerText = '❌ Нет загруженного конфига';
            return;
        }
        const topic = configData[currentIndex];
        topicNameSpan.innerText = topic.name || 'Без названия';
        const grade = topic.gradeLevel ? `${topic.gradeLevel} класс` : '';
        const keywords = (topic.keywords || []).join(' · ');
        topicMetaDiv.innerHTML = `<span>📚 ${grade}</span><span>🏷️ ${keywords}</span>`;
        codeEditor.value = topic.example || '<!-- Пример отсутствует -->';

        const total = configData.length;
        const pos = filteredIndices.indexOf(currentIndex);
        const pendingCount = filteredIndices.length;
        if (pendingCount > 0 && pos !== -1) {
            statusMsgSpan.innerHTML = `Тема ${currentIndex+1}/${total} | Очередь: ${pos+1}/${pendingCount} неотредактированных`;
        } else if (pendingCount === 0) {
            statusMsgSpan.innerHTML = `✅ Все темы обработаны! (${total} всего)`;
        } else {
            statusMsgSpan.innerHTML = `Тема ${currentIndex+1}/${total} (уже отредактирована)`;
        }
    }

    function saveCurrentCode() {
        if (!configData) return false;
        const newCode = codeEditor.value;
        configData[currentIndex].example = newCode;
        if (newCode.includes(EDITED_MARKER)) {
            log(`Тема "${configData[currentIndex].name}" помечена как отредактированная`);
        } else {
            log(`Тема "${configData[currentIndex].name}" сохранена, но метка редактирования отсутствует.`);
        }
        saveProgress();
        rebuildFilteredList();
        return true;
    }

    function nextTopic() {
        if (!configData) return;
        saveCurrentCode();
        if (filteredIndices.length === 0) {
            statusMsgSpan.innerHTML = '✅ Все темы обработаны!';
            log('Все темы отредактированы!', false);
            return;
        }
        let pos = filteredIndices.indexOf(currentIndex);
        let nextPos = (pos !== -1) ? pos + 1 : 0;
        if (nextPos >= filteredIndices.length) {
            statusMsgSpan.innerHTML = '✅ Все темы обработаны!';
            log('Все темы отредактированы!', false);
            return;
        }
        currentFilteredPos = nextPos;
        currentIndex = filteredIndices[nextPos];
        displayCurrentTopic();
        const topic = configData[currentIndex];
        if (!topic.example || !topic.example.includes(EDITED_MARKER)) {
            copyPromptForCurrentTopic();
        }
        saveProgress();
    }

    function prevTopic() {
        if (!configData) return;
        if (currentIndex <= 0) {
            log('Это первая тема', false);
            return;
        }
        currentIndex--;
        const pos = filteredIndices.indexOf(currentIndex);
        if (pos !== -1) currentFilteredPos = pos;
        displayCurrentTopic();
        saveProgress();
    }

    async function copyPromptForCurrentTopic() {
        if (!configData) {
            log('Нет загруженного конфига', true);
            return;
        }
        const topic = configData[currentIndex];
        const exampleCode = topic.example || '';
        const isPlaceholder = !exampleCode || exampleCode.includes('В разработке') || exampleCode.trim() === '' || exampleCode === '<!-- Пример отсутствует -->';
        let promptText = '';
        
        if (!isPlaceholder && !exampleCode.includes(EDITED_MARKER)) {
            promptText = `${STANDARDIZE_INSTRUCTION}\n\n--- ИСХОДНЫЙ КОД ---\n${exampleCode}\n--- КОНЕЦ КОДА ---\n\nПриведи код к стандарту и добавь метку ${EDITED_MARKER}.`;
        } else if (isPlaceholder) {
            let description = `Тема: ${topic.name}\nКласс: ${topic.gradeLevel || '?'}\nКлючевые слова: ${(topic.keywords || []).join(', ')}`;
            promptText = WRITE_INSTRUCTION
                .replace('%NAME%', topic.name || 'Геометрическая тема')
                .replace('%GRADE%', topic.gradeLevel || '?')
                .replace('%KEYWORDS%', (topic.keywords || []).join(', '))
                .replace('%DESCRIPTION%', description);
            promptText += `\n\nСоздай полноценный интерактивный пример.`;
        } else {
            log(`Тема "${topic.name}" уже отредактирована, промпт не нужен`, false);
            return;
        }

        try {
            await navigator.clipboard.writeText(promptText);
            log(`✅ Промпт скопирован для темы "${topic.name}"`);
            statusMsgSpan.innerHTML = `📋 Промпт скопирован! Вставьте в нейросеть и нажмите "Следующая (+сохранить)"`;
        } catch (err) {
            const textarea = document.createElement('textarea');
            textarea.value = promptText;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            log(`✅ Промпт скопирован (резервный метод)`, false);
        }
    }

    // ==================== ЗАГРУЗКА ИЗ GITHUB (как в примере: обычный fetch без токена) ====================
    async function loadFromGitHub() {
        log('Загрузка config.json из GitHub (публичный репозиторий)...');
        statusMsgSpan.innerHTML = '⏳ Загрузка из GitHub...';
        try {
            // Используем относительный путь, как в примере. Если редактор запущен на том же домене, где лежит config.json, этого достаточно.
            // Для надёжности также пробуем прямой raw URL.
            let response;
            try {
                // Сначала пробуем относительный путь (работает, если index.html и config.json в одной папке на сервере)
                response = await fetch('./config.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
            } catch (relErr) {
                // Если не получилось, пробуем raw.githubusercontent.com
                log('Относительный путь не сработал, пробуем raw.githubusercontent...', false);
                response = await fetch(`https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${GITHUB_PATH}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
            }
            
            const json = await response.json();
            if (!Array.isArray(json)) throw new Error('Ответ не является массивом');
            
            applyConfig(json);
        } catch (err) {
            log(`Ошибка загрузки из GitHub: ${err.message}`, true);
            statusMsgSpan.innerHTML = `❌ Ошибка загрузки: ${err.message}`;
            // Пробуем локальный кеш
            if (localStorage.getItem(STORAGE_KEY)) {
                log('Восстановление из локального кеша...');
                if (loadProgress() && configData) {
                    rebuildFilteredList();
                    displayCurrentTopic();
                    log('Восстановлен локальный прогресс');
                    statusMsgSpan.innerHTML = `⚠️ GitHub недоступен, загружен локальный кеш`;
                } else {
                    log('Нет локального кеша.', true);
                }
            } else {
                log('Нет локального кеша. Используйте кнопку "Загрузить конфиг" или проверьте соединение.', true);
            }
        }
    }

    function applyConfig(json) {
        configData = json;
        // Нормализация полей
        configData.forEach(t => {
            if (!t.keywords) t.keywords = [];
            if (!t.icon) t.icon = 'fa-file-alt';
            if (!t.example) t.example = t.example || '<!-- Пример отсутствует -->';
            if (!t.description) t.description = '';
            if (!t.gradeLevel) t.gradeLevel = 3;
        });
        currentIndex = 0;
        currentFilteredPos = 0;
        rebuildFilteredList();
        if (filteredIndices.length > 0) {
            currentIndex = filteredIndices[0];
            currentFilteredPos = 0;
        }
        displayCurrentTopic();
        saveProgress(); // сохраняем локально
        log(`✅ Загружено ${configData.length} тем из GitHub`);
        statusMsgSpan.innerHTML = `📥 Загружено из GitHub: ${configData.length} тем`;
        // Автокопирование промпта для первой неотредактированной
        if (filteredIndices.length > 0) {
            copyPromptForCurrentTopic();
        }
    }

    // ==================== СОХРАНЕНИЕ В GITHUB (с токеном) ====================
    async function saveToGitHub() {
        if (!configData) {
            log('Нет данных для сохранения', true);
            return;
        }
        if (!confirm('ВНИМАНИЕ! Вы перезаписываете config.json в репозитории GitHub. Продолжить?')) return;
        
        log('Сохранение в GitHub...');
        try {
            // Получаем sha текущего файла (с токеном)
            let sha = null;
            const getRes = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}`, {
                headers: { 
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            });
            if (getRes.ok) {
                const fileData = await getRes.json();
                sha = fileData.sha;
            }
            
            const content = JSON.stringify(configData, null, 2);
            const encoded = btoa(unescape(encodeURIComponent(content)));
            const putBody = {
                message: 'Update config.json from geometry editor',
                content: encoded,
                branch: GITHUB_BRANCH
            };
            if (sha) putBody.sha = sha;
            
            const putRes = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(putBody)
            });
            if (!putRes.ok) {
                const errorText = await putRes.text();
                throw new Error(`PUT ${putRes.status}: ${errorText}`);
            }
            log(`✅ Конфиг успешно сохранён в GitHub (${new Date().toLocaleTimeString()})`);
            statusMsgSpan.innerHTML = `✅ Сохранено в GitHub (${configData.length} тем)`;
        } catch (err) {
            log(`Ошибка сохранения в GitHub: ${err.message}`, true);
            statusMsgSpan.innerHTML = `❌ Ошибка сохранения в GitHub`;
        }
    }

    // Локальные файлы
    function loadConfigFromFile(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const json = JSON.parse(e.target.result);
                if (!Array.isArray(json)) throw new Error('Не массив');
                configData = json;
                configData.forEach(t => {
                    if (!t.keywords) t.keywords = [];
                    if (!t.icon) t.icon = 'fa-file-alt';
                    if (!t.example) t.example = t.example || '<!-- Пример отсутствует -->';
                    if (!t.description) t.description = '';
                    if (!t.gradeLevel) t.gradeLevel = 3;
                });
                currentIndex = 0;
                currentFilteredPos = 0;
                rebuildFilteredList();
                if (filteredIndices.length > 0) {
                    currentIndex = filteredIndices[0];
                    currentFilteredPos = 0;
                }
                displayCurrentTopic();
                saveProgress();
                log(`Загружено ${configData.length} тем из файла`);
                statusMsgSpan.innerHTML = `📁 Загружено ${configData.length} тем.`;
                if (filteredIndices.length > 0) copyPromptForCurrentTopic();
            } catch(err) {
                log(`Ошибка парсинга JSON: ${err.message}`, true);
            }
        };
        reader.readAsText(file);
    }

    function downloadConfig() {
        if (!configData) {
            log('Нет данных для скачивания', true);
            return;
        }
        const dataStr = JSON.stringify(configData, null, 2);
        const blob = new Blob([dataStr], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'geometry_config_edited.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        log('Конфиг скачан локально');
    }

    function validateCode(code) {
        const errors = [];
        if (!code.includes('<canvas')) errors.push('Отсутствует <canvas>');
        if (!code.includes('addEventListener') && !code.includes('onPointer')) errors.push('Нет обработчиков перетаскивания');
        if (!code.includes(EDITED_MARKER)) errors.push(`Нет маркера ${EDITED_MARKER}`);
        if (code.includes('В разработке')) errors.push('Присутствует заглушка "В разработке"');
        return errors;
    }

    function handleCodeValidation() {
        const code = codeEditor.value;
        const errors = validateCode(code);
        if (errors.length) {
            log(`⚠️ Найдены проблемы:\n${errors.join('\n')}`, true);
            const errorMsg = `Ошибки в коде темы "${configData[currentIndex].name}":\n${errors.join('\n')}`;
            navigator.clipboard.writeText(errorMsg).catch(()=>{});
            statusMsgSpan.innerHTML = '❗ Обнаружены ошибки — список скопирован';
            return false;
        } else {
            log('✅ Код проходит базовую проверку');
            statusMsgSpan.innerHTML = '✅ Код валиден';
            return true;
        }
    }

    function onNextSave() {
        saveCurrentCode();
        handleCodeValidation();
        nextTopic();
    }

    // Инициализация событий
    loadBtn.addEventListener('click', () => loadConfigInput.click());
    loadConfigInput.addEventListener('change', (e) => {
        if (e.target.files.length) loadConfigFromFile(e.target.files[0]);
        loadConfigInput.value = '';
    });
    downloadBtn.addEventListener('click', downloadConfig);
    prevBtn.addEventListener('click', prevTopic);
    nextSaveBtn.addEventListener('click', onNextSave);
    copyPromptBtn.addEventListener('click', copyPromptForCurrentTopic);
    loadFromGitHubBtn.addEventListener('click', loadFromGitHub);
    saveToGitHubBtn.addEventListener('click', saveToGitHub);

    // Автозагрузка при старте (как в примере)
    loadFromGitHub();
</script>
</body>
</html>
