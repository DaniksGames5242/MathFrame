<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MathFrame | Образовательная платформа</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <style>
        :root {
            --primary: #00f5ff;
            --accent: #7b2cff;
            --dark: #0a0a1f;
            --glass: rgba(15, 23, 42, 0.75);
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #05050f;
            color: #e0f2fe;
            overflow: hidden;
            height: 100vh;
        }

        /* === BACKGROUND === */
        #bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -2;
            opacity: 0.6;
        }

        /* === LOADING SCREEN === */
        .loading-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #1a1a2e 0%, #05050f 80%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 1s ease;
        }
        .loader-3d {
            width: 260px;
            height: 260px;
            perspective: 1200px;
        }
        .loader-sphere {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 
                0 0 80px #00f5ff,
                inset 0 0 60px rgba(123, 44, 255, 0.6);
            animation: spherePulse 4s infinite ease-in-out;
        }

        @keyframes spherePulse {
            0%,100% { transform: scale(1) rotateX(20deg); }
            50% { transform: scale(1.08) rotateX(-20deg); }
        }

        .loader-text {
            margin-top: 40px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.4rem;
            font-weight: 700;
            background: linear-gradient(90deg, #00f5ff, #7b2cff, #00f5ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            background-size: 200% 100%;
            animation: textShine 3s linear infinite;
            letter-spacing: 8px;
        }

        @keyframes textShine {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* === APP === */
        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .app.ready { opacity: 1; }

        .top-bar {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 245, 255, 0.15);
            padding: 14px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.65rem;
            font-weight: 700;
            background: linear-gradient(90deg, #00f5ff, #7b2cff);
            -webkit-background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Glass Card */
        .unified-card {
            background: var(--glass);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(0, 245, 255, 0.2);
            border-radius: 28px;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                inset 0 0 40px rgba(123, 44, 255, 0.1);
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .unified-card:hover {
            transform: translateY(-8px) rotateX(4deg) rotateY(4deg);
        }

        /* 3D Tilt for tree nodes */
        .tree-node-content {
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
        }
        .tree-node-content::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(0,245,255,0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .tree-node-content:hover::before { opacity: 1; }
        .tree-node-content:hover {
            transform: translateX(12px) scale(1.02);
            box-shadow: 0 0 25px rgba(0, 245, 255, 0.4);
        }

        .nav-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(0,245,255,0.3);
            color: white;
            transition: all 0.4s ease;
        }
        .nav-btn:hover {
            background: rgba(123, 44, 255, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(123, 44, 255, 0.3);
        }

        /* Warp Effect */
        .warp-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, transparent 40%, #000 80%);
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            mix-blend-mode: screen;
        }
    </style>
</head>
<body>

<div id="bg-canvas"></div>

<!-- Loading -->
<div class="loading-screen" id="loadingScreen">
    <div style="text-align:center">
        <div class="loader-3d">
            <div id="sphereContainer" style="width:260px;height:260px;"></div>
        </div>
        <div class="loader-text">MATHFRAME</div>
    </div>
</div>

<div class="app" id="app">
    <div class="top-bar">
        <div class="logo">
            <i class="fas fa-infinity"></i> MathFrame
        </div>
        <button class="menu-toggle" id="menuToggleBtn"><i class="fas fa-bars"></i></button>
    </div>

    <div class="main-layout" style="display:flex;flex:1;overflow:hidden;">
        <!-- Hierarchy Panel + Content здесь остаются те же, но с новыми классами -->
        <div class="hierarchy-panel" id="hierarchyPanel" style="width:360px;background:var(--glass);backdrop-filter:blur(20px);border-right:1px solid rgba(0,245,255,0.15);">
            <!-- Твой существующий контент панели (я оставил структуру) -->
            <div style="padding:20px;">
                <input type="text" id="hierarchySearchInput" placeholder="Поиск тем..." 
                       style="width:100%;padding:14px 20px;border-radius:9999px;background:rgba(255,255,255,0.08);border:1px solid rgba(0,245,255,0.3);color:white;">
            </div>
            <div class="topic-tree" id="topicTree" style="padding:0 16px;"></div>
        </div>

        <div class="content-wrapper" style="flex:1;padding:32px;overflow-y:auto;">
            <div class="unified-card" id="unifiedCard" style="max-width:1400px;margin:0 auto;">
                <!-- Твой контент -->
                <div class="nav-buttons" id="navButtonsContainer" style="padding:20px;"></div>
                <div class="two-columns" style="display:flex;">
                    <!-- example и description -->
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.min.js';

    // Background Particles + Grid
    function initBackground() {
        const canvas = document.createElement('canvas');
        canvas.id = 'bg-canvas';
        document.body.appendChild(canvas);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.z = 30;

        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Particles
        const particlesGeometry = new THREE.BufferGeometry();
        const count = 3000;
        const positions = new Float32Array(count * 3);
        const colors = new Float32Array(count * 3);

        for(let i = 0; i < count * 3; i += 3) {
            positions[i]     = (Math.random() - 0.5) * 80;
            positions[i + 1] = (Math.random() - 0.5) * 80;
            positions[i + 2] = (Math.random() - 0.5) * 80;

            colors[i]     = 0.2;
            colors[i + 1] = 0.8;
            colors[i + 2] = 1;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.15,
            vertexColors: true,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });

        const particleSystem = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particleSystem);

        function animateBg() {
            requestAnimationFrame(animateBg);
            particleSystem.rotation.y += 0.0002;
            renderer.render(scene, camera);
        }
        animateBg();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }

    // Улучшенная 3D сфера
    function initLoadingSphere() {
        const container = document.getElementById('sphereContainer');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
        camera.position.z = 3.5;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(260, 260);
        container.appendChild(renderer.domElement);

        const geometry = new THREE.SphereGeometry(1.2, 64, 64);
        const material = new THREE.MeshPhongMaterial({
            color: 0x00f5ff,
            emissive: 0x7b2cff,
            shininess: 100,
            specular: 0xffffff,
            transparent: true,
            opacity: 0.95
        });

        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        const light1 = new THREE.PointLight(0xffffff, 2, 100);
        light1.position.set(5, 5, 8);
        scene.add(light1);

        const light2 = new THREE.PointLight(0x7b2cff, 1.5, 100);
        light2.position.set(-5, -5, -8);
        scene.add(light2);

        function animate() {
            requestAnimationFrame(animate);
            sphere.rotation.y += 0.012;
            sphere.rotation.x += 0.008;
            renderer.render(scene, camera);
        }
        animate();
    }

    // Warp transition
    function warpTransition(callback) {
        const overlay = document.createElement('div');
        overlay.className = 'warp-overlay';
        document.body.appendChild(overlay);

        gsap.to(overlay, { opacity: 0.85, duration: 0.4 });
        
        setTimeout(() => {
            callback();
            gsap.to(overlay, { 
                opacity: 0, 
                duration: 0.6,
                onComplete: () => overlay.remove()
            });
        }, 300);
    }

    // Инициализация
    window.addEventListener('load', () => {
        initBackground();
        initLoadingSphere();

        // Твой существующий JS-код (init() и т.д.) можно оставить почти без изменений,
        // только добавить GSAP анимации при открытии элементов.

        setTimeout(() => {
            document.getElementById('loadingScreen').style.opacity = '0';
            document.getElementById('app').classList.add('ready');
        }, 1800);
    });
</script>
</body>
</html>
