<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>MathFrame | Образовательная платформа</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #f0f4fa 0%, #e6ecf4 100%);
            color: #1a2c3e;
            height: 100vh;
            overflow: hidden;
            max-width: 100vw;
            overflow-x: hidden;
        }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 20%, #1e3a5f, #0a1a2f);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1), visibility 0.8s;
        }

        .loading-spinner {
            text-align: center;
            animation: floatPulse 2s infinite ease-in-out;
            filter: drop-shadow(0 0 20px rgba(0, 160, 255, 0.6));
        }

        .loading-spinner i {
            font-size: 5rem;
            color: #7bc5ff;
            animation: spin3D 1.2s infinite cubic-bezier(0.45, 0.05, 0.55, 0.95), glowPulse 1.6s infinite;
            display: inline-block;
        }

        .loading-spinner p {
            margin-top: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #b8e1ff, #ffffff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shineMove 2s linear infinite, scaleSoft 1.4s infinite;
            letter-spacing: -0.3px;
            font-size: 1.3rem;
        }

        @keyframes spin3D {
            0% { transform: rotateY(0deg) rotateX(0deg) scale(1); }
            50% { transform: rotateY(180deg) rotateX(12deg) scale(1.08); }
            100% { transform: rotateY(360deg) rotateX(0deg) scale(1); }
        }

        @keyframes glowPulse {
            0% { text-shadow: 0 0 0px rgba(123,197,255,0); filter: drop-shadow(0 0 0px #7bc5ff); }
            50% { text-shadow: 0 0 20px rgba(123,197,255,0.8); filter: drop-shadow(0 0 14px #7bc5ff); }
            100% { text-shadow: 0 0 0px rgba(123,197,255,0); filter: drop-shadow(0 0 0px #7bc5ff); }
        }

        @keyframes shineMove {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        @keyframes scaleSoft {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        @keyframes floatPulse {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            opacity: 0;
            transform: scale(0.98);
            transition: opacity 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.2), transform 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.2);
            max-width: 100vw;
            overflow-x: hidden;
        }

        .app.content-visible {
            opacity: 1;
            transform: scale(1);
        }

        /* Top Bar */
        .top-bar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
            padding: 12px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            z-index: 30;
            flex-shrink: 0;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.02);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .menu-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(203, 213, 225, 0.5);
            width: 42px;
            height: 42px;
            border-radius: 16px;
            cursor: pointer;
            color: #2c6b9e;
            font-size: 1.2rem;
            transition: all 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .menu-btn:hover {
            background: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(0,0,0,0.05);
            border-color: #cbdbe0;
        }

        .menu-btn:active {
            transform: scale(0.94);
        }

        .logo {
            font-weight: 700;
            font-size: 1.35rem;
            background: linear-gradient(135deg, #0f3b5c, #1f6392);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .home-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(203, 213, 225, 0.5);
            width: 42px;
            height: 42px;
            border-radius: 16px;
            cursor: pointer;
            color: #2c6b9e;
            font-size: 1.2rem;
            transition: all 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .home-btn:hover {
            background: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(0,0,0,0.05);
            border-color: #cbdbe0;
        }

        .home-btn:active {
            transform: scale(0.94);
        }

        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Content Wrapper */
        .content-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
            scroll-behavior: smooth;
        }

        .unified-card {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 36px;
            border: 1px solid rgba(226, 232, 240, 0.8);
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 18px 30px -12px rgba(0, 0, 0, 0.08);
        }

        .nav-buttons {
            display: flex;
            gap: 14px;
            padding: 18px 28px;
            background: rgba(251, 253, 255, 0.6);
            border-bottom: 1px solid #eff3f8;
        }

        .nav-btn {
            background: #f0f4fa;
            border: none;
            border-radius: 44px;
            padding: 8px 22px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #2c6b9e;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.2);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:active {
            transform: scale(0.95);
            background: #e2e8f2;
        }

        .two-columns {
            display: flex;
            gap: 0;
        }

        .column-example {
            flex: 1;
            padding: 24px;
            border-right: 1px solid #eff3f8;
        }

        .column-description {
            flex: 1;
            padding: 24px;
        }

        .section-title {
            font-weight: 600;
            margin-bottom: 16px;
            color: #2c6b9e;
        }

        .example-placeholder {
            background: #ffffff;
            border-radius: 24px;
            border: 1px solid #ecf3fa;
            transition: opacity 0.2s ease;
            box-shadow: 0 6px 12px -8px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            overflow: visible;
            min-height: 200px;
        }

        .desc-placeholder {
            line-height: 1.55;
            font-size: 0.95rem;
            transition: opacity 0.2s ease;
        }

        .inline-link {
            color: #2c6b9e;
            text-decoration: none;
            border-bottom: 1.5px dashed #9bb8d4;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.15s;
        }

        .inline-link:active {
            opacity: 0.7;
        }

        .search-highlight {
            background: #ffecb3;
            color: #1e3b4f;
            border-radius: 8px;
            padding: 0 4px;
            font-weight: 700;
            animation: softGlow 0.4s;
        }

        @keyframes softGlow {
            0% { background: #ffd966; }
            100% { background: #ffecb3; }
        }

        .welcome-message {
            text-align: center;
            padding: 30px 20px;
            animation: fadeSlideUp 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .welcome-message i {
            font-size: 3.8rem;
            color: #2c6b9e;
            margin-bottom: 20px;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: scale(0.98);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Drawer */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .drawer-overlay.visible {
            display: block;
            opacity: 1;
        }

        .drawer {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            width: 90%;
            max-width: 550px;
            height: 85vh;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            z-index: 1001;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            pointer-events: none;
        }

        .drawer.open {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }

        .drawer-header {
            padding: 20px 20px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
            flex-shrink: 0;
        }

        .drawer-header h3 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #1a2c3e;
        }

        .close-drawer {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #8ba0bc;
            transition: all 0.2s;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-drawer:hover {
            background: #f0f4fa;
            color: #1a2c3e;
        }

        .drawer-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }

        /* Search Area (bottom of drawer) */
        .drawer-search-row {
            padding: 16px 20px;
            border-top: 1px solid rgba(226, 232, 240, 0.8);
            flex-shrink: 0;
            background: white;
        }

        .search-textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 20px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            resize: vertical;
            min-height: 70px;
        }

        .search-textarea:focus {
            border-color: #2c6b9e;
            box-shadow: 0 0 0 3px rgba(44,107,158,0.1);
            background: white;
        }

        .search-btn {
            width: 100%;
            margin-top: 12px;
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
        }

        .search-btn:active {
            transform: scale(0.98);
        }

        /* Filters Toggle */
        .filters-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 28px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            color: #2c6b9e;
            transition: all 0.2s;
            margin-bottom: 12px;
        }

        .filters-toggle:hover {
            background: #f0f4fa;
        }

        .filters-panel {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.3s ease, margin 0.2s ease;
            margin-bottom: 0;
        }

        .filters-panel.open {
            max-height: 500px;
            opacity: 1;
            margin-bottom: 16px;
        }

        .filter-group {
            background: #f8fafc;
            border-radius: 20px;
            padding: 12px 16px;
            margin-bottom: 12px;
        }

        .filter-group label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #4a627a;
            display: block;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .filter-group select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            background: white;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1e2f3e;
            cursor: pointer;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        .filter-group select:focus {
            border-color: #2c6b9e;
            box-shadow: 0 0 0 3px rgba(44,107,158,0.1);
        }

        .search-options-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 8px;
        }

        .search-options-grid label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            text-transform: none;
            letter-spacing: normal;
        }

        .search-options-grid input {
            width: 16px;
            height: 16px;
            accent-color: #2c6b9e;
            cursor: pointer;
        }

        .ai-checkbox {
            border-top: 1px solid #e2e8f0;
            padding-top: 12px;
            margin-top: 8px;
        }

        .ai-checkbox label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: #764ba2;
            text-transform: none;
        }

        /* Topic Tree */
        .topic-tree {
            overflow-y: auto;
            flex: 1;
        }

        .tree-children {
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.33, 1, 0.68, 1), opacity 0.25s;
            max-height: 0;
            opacity: 0;
            margin-left: 20px;
            padding-left: 8px;
            border-left: 1px dashed rgba(100, 116, 139, 0.2);
        }

        .tree-children.expanded {
            max-height: 100000px;
            opacity: 1;
        }

        .tree-node {
            margin: 2px 0;
        }

        .tree-node-content {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .tree-node-content:hover {
            background: #ecf5fe;
            transform: translateX(5px);
        }

        .tree-node.active > .tree-node-content {
            background: linear-gradient(95deg, #e2effc, #d4e8fb);
            color: #1a5d9c;
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .tree-node.ai-found > .tree-node-content {
            background: linear-gradient(95deg, #f3e8ff, #e9d5ff);
            color: #6b21a5;
            border-left: 3px solid #9333ea;
        }

        .tree-node.search-match-description > .tree-node-content {
            background: #fef9e3;
            border-left: 3px solid #f1c40f;
        }

        .toggle-icon {
            width: 22px;
            text-align: center;
            cursor: pointer;
            font-size: 0.75rem;
            color: #5f7d9c;
        }

        .toggle-icon.empty {
            opacity: 0;
            pointer-events: none;
        }

        .node-title {
            flex: 1;
        }

        .framework-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 30, 45, 0.9);
            backdrop-filter: blur(20px);
            color: white;
            padding: 12px 28px;
            border-radius: 60px;
            font-size: 0.85rem;
            font-weight: 500;
            z-index: 1100;
            animation: toastSlide 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.2);
        }

        @keyframes toastSlide {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .ai-badge-small {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 12px;
            margin-left: 8px;
        }

        @media (max-width: 768px) {
            .content-wrapper {
                padding: 16px;
            }
            .two-columns {
                flex-direction: column;
            }
            .column-example {
                border-right: none;
                border-bottom: 1px solid #eff3f8;
            }
            .drawer {
                width: 95%;
                height: 90vh;
            }
        }
    </style>
</head>
<body>
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner">
        <i class="fas fa-graduation-cap"></i>
        <p>MathFrame | immersive learning</p>
    </div>
</div>
<div class="app" id="appRoot">
    <div class="top-bar">
        <div class="logo-area">
            <button class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
            <div class="logo"><i class="fas fa-graduation-cap"></i> MathFrame</div>
            <button class="home-btn" id="globalHomeBtn"><i class="fas fa-home"></i></button>
        </div>
    </div>
    <div class="main-layout">
        <div class="content-wrapper" id="unifiedScroller">
            <div class="unified-card" id="unifiedCard">
                <div class="nav-buttons" id="navButtonsContainer"></div>
                <div class="two-columns">
                    <div class="column-example">
                        <div class="section-title"><i class="fas fa-cursor"></i> ИНТЕРАКТИВНЫЙ ПРИМЕР</div>
                        <div class="example-placeholder" id="examplePlaceholder"></div>
                    </div>
                    <div class="column-description">
                        <div class="section-title"><i class="fas fa-book"></i> ТЕОРЕТИЧЕСКИЙ МАТЕРИАЛ</div>
                        <div class="desc-placeholder" id="descriptionPlaceholder"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Drawer (Menu) -->
<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="drawer">
    <div class="drawer-header">
        <h3><i class="fas fa-diagram-project"></i> Содержание</h3>
        <button class="close-drawer" id="closeDrawerBtn"><i class="fas fa-times"></i></button>
    </div>
    <div class="drawer-content">
        <div class="topic-tree" id="topicTree"></div>
    </div>
    <div class="drawer-search-row">
        <div class="filters-toggle" id="filtersToggleBtn">
            <i class="fas fa-sliders-h"></i> <span>Параметры поиска</span> <i class="fas fa-chevron-down" id="filtersChevron"></i>
        </div>
        <div class="filters-panel" id="filtersPanel">
            <div class="filter-group">
                <label><i class="fas fa-filter"></i> Упростить до</label>
                <select id="levelSelect">
                    <option value="all">Не упрощать (все темы)</option>
                    <option value="9">До 9 класса</option>
                    <option value="7">До 7 класса</option>
                    <option value="5">До 5-6 классов</option>
                    <option value="preschool">Для классов до 5</option>
                </select>
            </div>
            <div class="filter-group">
                <label><i class="fas fa-sort-amount-down"></i> Сортировка</label>
                <select id="sortSelect">
                    <option value="config">Как в конфиге</option>
                    <option value="name_asc">По алфавиту (А-Я)</option>
                    <option value="name_desc">По алфавиту (Я-А)</option>
                    <option value="grade_asc">По классам (возрастание)</option>
                    <option value="grade_desc">По классам (убывание)</option>
                </select>
            </div>
            <div class="filter-group">
                <label><i class="fas fa-search"></i> Параметры поиска</label>
                <div class="search-options-grid">
                    <label><input type="checkbox" id="searchInDescCheckbox"> <i class="far fa-file-alt"></i> В описании</label>
                    <label><input type="checkbox" id="keywordsCheckbox" checked> <i class="fas fa-tags"></i> Ключевые слова</label>
                    <label><input type="checkbox" id="fuzzyCheckbox" checked> <i class="fas fa-spell-check"></i> Опечатки</label>
                    <label><input type="checkbox" id="smartSortCheckbox" checked> <i class="fas fa-chart-line"></i> Умная сортировка</label>
                </div>
                <div class="ai-checkbox">
                    <label><input type="checkbox" id="aiSearchCheckbox"> <i class="fas fa-robot"></i> ИИ-поиск (beta) — понимает смысл</label>
                </div>
            </div>
        </div>

<script>

    class SmartAI {

            this.topics = topics;
            this.initKnowledgeBase();
        }
        
        initKnowledgeBase() {
            this.topicKeywords = {
                'triangles': {
                    words: ['треугольник', 'треугольники', 'три угла', 'три стороны', 'сумма углов', '180', 'равенство треугольников', 'признак равенства', 'подобие', 'геометрия'],
                    synonyms: ['фигура с тремя углами', 'три вершины']
                },
                'linear_eq': {
                    words: ['линейное уравнение', 'уравнение', 'ax+b', 'икс', 'неизвестная', 'корень уравнения', 'алгебра'],
                    synonyms: ['равенство с неизвестным', 'найти икс', 'простое уравнение']
                },
                'quadratic_eq': {
                    words: ['квадратное уравнение', 'дискриминант', 'парабола', 'ax²', 'x²', 'икс в квадрате'],
                    synonyms: ['уравнение с иксом в квадрате', 'где икс в квадрате']
                },
                'adjacent_angles': {
                    words: ['смежные углы', 'смежный угол', 'сумма 180', 'развёрнутый угол'],
                    synonyms: ['углы которые вместе дают 180', 'два угла с общей стороной']
                },
                'set_theory': {
                    words: ['множество', 'элемент множества', 'объединение', 'пересечение', 'подмножество', 'совокупность', 'набор', 'коллекция', 'группа объектов', 'теория множеств'],
                    synonyms: ['группа объектов', 'набор элементов', 'совокупность предметов', 'объединение объектов', 'коллекция чисел']
                },
                'divisibility_rules': {
                    words: ['признаки делимости', 'делимость', 'делится на', 'кратность', 'на 2', 'на 3', 'на 5', 'на 9', 'на 10'],
                    synonyms: ['правила деления', 'как узнать делится ли число']
                },
                'improper_integrals': {
                    words: ['несобственный интеграл', 'интеграл', 'сходимость', 'расходимость', 'бесконечный предел'],
                    synonyms: ['интеграл с бесконечностью', 'площадь под кривой до бесконечности']

                    synonyms: ['палка с двумя концами', 'ровная линия']
                }
            };
        }
        
        search(query) {
            const queryLower = query.toLowerCase();
            let scores = [];
            const validTopics = this.topics.filter(t => 
                t.id !== 'math_root' && t.id !== 'algebra_7' && t.id !== 'geometry_7' && t.id !== 'algebra_10'
            );
            
            for (let topic of validTopics) {
                let score = 0;
                
                if (queryLower === topic.name.toLowerCase()) score += 100;
                
                if (topic.keywords) {
                    for (let kw of topic.keywords) {
                        if (queryLower.includes(kw.toLowerCase())) score += 30;
                    }
                }
                
                const kb = this.topicKeywords[topic.id];
                if (kb) {
                    for (let word of kb.words) {
                        if (queryLower.includes(word.toLowerCase())) score += 25;
                    }
                    for (let syn of kb.synonyms) {
                        if (queryLower.includes(syn.toLowerCase())) score += 50;
                    }
                }
                
                if (topic.description) {
                    const descLower = topic.description.toLowerCase();
                    const queryWords = queryLower.split(/\s+/);
                    for (let qw of queryWords) {
                        if (qw.length > 3 && descLower.includes(qw)) score += 10;
                    }
                }
                
                if (queryLower.includes('группа') && queryLower.includes('объект') && topic.id === 'set_theory') score += 100;
                if ((queryLower.includes('признак') || queryLower.includes('признаки')) && queryLower.includes('равенство') && queryLower.includes('треугольник') && topic.id === 'triangles') score += 80;
                if ((queryLower.includes('сумма') && queryLower.includes('180')) && (topic.id === 'triangles' || topic.id === 'adjacent_angles')) score += 40;
                
                if (score > 0) scores.push({ topic, score });
            }
            
            scores.sort((a, b) => b.score - a.score);
            return scores.filter(s => s.score >= 30);
        }
    }
    
    let aiEngine = null;
    let useAISearch = false;
    let currentTopics = [], currentTopicId = null, collapsedFolders = new Map(), navigationStack = [];
    let currentGradeFilter = "all", currentSortMode = "config";
    let currentSearchQuery = "", searchInDescription = false, keywordsEnabled = true, fuzzyEnabled = true, smartSortEnabled = true;
    let matchOnlyByDescription = new Map(), topicRelevanceInfo = new Map();
    let aiFoundTopicIds = new Set();
    let isTreeExpandedForSearch = false;

    // ========== ТЕМЫ ==========
    const DEFAULT_TOPICS = [
        { id: "math_root", name: "Математика", parent: null, icon: "fa-folder", gradeLevel: 5, keywords: ["математика"], example: '<div style="padding:20px;"><h3>Математика</h3><p>Основы математики</p></div>', description: '<p>Главный раздел математики</p>' },
        { id: "algebra_7", name: "Алгебра 7–9", parent: "math_root", icon: "fa-folder", gradeLevel: 7, keywords: ["алгебра","выражения","формулы","7 класс"], example: '<div style="padding:20px; text-align:center;"><i class="fas fa-chart-line" style="font-size:2rem;"></i><div>Алгебра 7-9</div></div>', description: '<p><strong>Алгебра</strong> — раздел математики, изучающий операции над величинами и решение уравнений.</p>' },
        { id: "linear_eq", name: "Линейные уравнения", parent: "algebra_7", icon: "fa-file-alt", gradeLevel: 7, keywords: ["уравнение","линейное","корень","ax+b=0"], example: '<div style="padding:20px;"><i class="fas fa-chart-line"></i><div>ax + b = 0 → x = -b/a</div><div>Пример: 2x - 6 = 0 → x = 3</div></div>', description: '<p><strong>Линейное уравнение</strong>: ax + b = 0, a≠0. Корень: x = -b/a.</p>' },
        { id: "quadratic_eq", name: "Квадратные уравнения", parent: "algebra_7", icon: "fa-file-alt", gradeLevel: 8, keywords: ["дискриминант","парабола","ax²+bx+c=0"], example: '<div style="padding:20px;"><i class="fas fa-chart-line"></i><div>ax² + bx + c = 0, D = b² - 4ac</div></div>', description: '<p>Квадратное уравнение решается через дискриминант. При D>0 — два корня.</p>' },
        { id: "geometry_7", name: "Геометрия 7–9", parent: "math_root", icon: "fa-folder", gradeLevel: 7, keywords: ["геометрия","фигуры","углы"], example: '<div style="padding:20px;text-align:center;"><i class="fas fa-shapes" style="font-size:2rem;"></i><div>Геометрия</div></div>', description: '<p><strong>Геометрия</strong> — раздел математики, изучающий пространственные формы.</p>' },
        { id: "adjacent_angles", name: "Смежные углы", parent: "geometry_7", icon: "fa-file-alt", gradeLevel: 7, keywords: ["углы","смежные","сумма 180"], example: '<div style="padding:20px;"><i class="fas fa-angle-double-right"></i><div>∠α + ∠β = 180°</div></div>', description: '<p><strong>Смежные углы</strong> — два угла с общей стороной, сумма 180°.</p>' },
        { id: "triangles", name: "Треугольники", parent: "geometry_7", icon: "fa-file-alt", gradeLevel: 7, keywords: ["треугольник","сумма углов","признаки равенства","подобие"], example: '<div style="padding:20px;"><i class="fas fa-shapes"></i><div>Сумма углов = 180°</div></div>', description: '<p><strong>Треугольники</strong>: виды, признаки равенства (по двум сторонам и углу между ними, по стороне и прилежащим углам, по трём сторонам).</p>' },
        { id: "divisibility_rules", name: "Признаки делимости", parent: "math_root", icon: "fa-file-alt", gradeLevel: 6, keywords: ["делимость","признаки","на 2","на 3","на 5","на 9","на 10"], example: '<div style="padding:20px;"><i class="fas fa-calculator"></i><div>Признаки делимости<br>На 2: последняя цифра чётная</div></div>', description: '<p><strong>Признаки делимости</strong> — правила, позволяющие определить, делится ли число на заданное без остатка.</p>' },
        { id: "improper_integrals", name: "Несобственные интегралы", parent: "algebra_7", icon: "fa-file-alt", gradeLevel: 11, keywords: ["интеграл","несобственный","сходимость","расходимость"], example: '<div style="padding:20px;"><i class="fas fa-chart-line"></i><div>∫₁^∞ 1/x² dx — сходится</div></div>', description: '<p><strong>Несобственные интегралы</strong> — интегралы с бесконечными пределами.</p>' },
        { id: "algebra_10", name: "Алгебра 10–11", parent: "math_root", icon: "fa-folder", gradeLevel: 10, keywords: ["алгебра","старшая школа","функции"], example: '<div style="padding:20px;"><i class="fas fa-chart-line"></i><div>Старшая школа</div></div>', description: '<p>Углублённое изучение функций, производных и интегралов.</p>' },
        { id: "logarithms", name: "Логарифмы", parent: "algebra_10", icon: "fa-file-alt", gradeLevel: 10, keywords: ["логарифм","log","степень"], example: '<div style="padding:20px;"><i class="fas fa-chart-line"></i><div>logₐ b = c ⇔ a^c = b</div></div>', description: '<p>Логарифм — показатель степени, в которую нужно возвести основание.</p>' },
        { id: "straight_line", name: "Прямая", parent: "geometry_7", icon: "fa-file-alt", gradeLevel: 7, keywords: ["прямая","линия"], example: '<div style="padding:20px;"><i class="fas fa-chart-line"></i><div>Прямая линия: y = kx + b</div></div>', description: '<p><strong>Прямая</strong> — бесконечная линия, не имеющая изгибов.</p>' },
        { id: "set_theory", name: "Множество", parent: "math_root", icon: "fa-file-alt", gradeLevel: 9, keywords: ["множество","элемент","объединение","пересечение","подмножество","совокупность","набор"], example: '<div style="padding:20px;"><i class="fas fa-circle-nodes"></i><div>Множество — совокупность объектов, объединённых общим свойством.</div></div>', description: '<p><strong>Множество</strong> — одно из ключевых понятий математики. Это совокупность любых объектов (элементов), объединённых общим признаком.</p>' }
    ];

    // ========== ОСНОВНЫЕ ФУНКЦИИ ==========
    async function loadConfig() { 
        try { const r=await fetch('./config.json'); if(r.ok) return await r.json(); } catch(e){} 
        return JSON.parse(JSON.stringify(DEFAULT_TOPICS)); 
    }
    
    function buildHierarchyOrder(topics) {
        const ordered = [];
        const roots = topics.filter(t => t.parent === null).sort((a,b)=>a.name.localeCompare(b.name));
        function dfs(t) { ordered.push(t); topics.filter(c=>c.parent===t.id).sort((a,b)=>a.name.localeCompare(b.name)).forEach(ch=>dfs(ch)); }
        roots.forEach(r=>dfs(r));
        return ordered;
    }
    
    function levenshtein(a,b) { const m=[]; for(let i=0;i<=b.length;i++) m[i]=[i]; for(let j=0;j<=a.length;j++) m[0][j]=j; for(let i=1;i<=b.length;i++) for(let j=1;j<=a.length;j++) m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[j-1]===b[i-1]?0:1)); return m[b.length][a.length]; }
    
    function getMatchPercent(word, text) {
        if (!text) return 0;
        const lw = word.toLowerCase();
        const lt = text.toLowerCase();
        if (lw === lt) return 100;
        const wordBoundary = new RegExp(`\\b${lw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'i');
        if (wordBoundary.test(text)) return 100;
        if (lt.includes(lw)) return 90;
        if (fuzzyEnabled && lw.length >= 3) {
            const words = lt.split(/\s+/);
            for (let w of words) {
                if (w.length >= 3) {
                    const d = levenshtein(lw, w);
                    if (d === 1) return 85;
                    if (d === 2) return 70;
                }
            }
        }
        return 0;
    }
    
    function getRelevance(t, words) {
        if (!words.length) return { found: false, score: 0 };
        let nameScore = 0, kwScore = 0, descScore = 0;
        let bestName = 0, bestKw = 0, bestDesc = 0;
        let matchCount = 0;
        for (let w of words) {
            const np = getMatchPercent(w, t.name);
            const kwp = (keywordsEnabled && t.keywords) ? getMatchPercent(w, Array.isArray(t.keywords) ? t.keywords.join(" ") : String(t.keywords)) : 0;
            const dp = (searchInDescription && t.description) ? getMatchPercent(w, t.description.replace(/<[^>]*>/g, '')) : 0;
            bestName = Math.max(bestName, np);
            bestKw = Math.max(bestKw, kwp);
            bestDesc = Math.max(bestDesc, dp);
            nameScore += np;
            kwScore += kwp;
            descScore += dp;
            if (np > 0 || kwp > 0 || dp > 0) matchCount++;
        }
        let group = 0, percent = 0, onlyDesc = false;
        if (bestName > 0) { group = 1; percent = bestName; }
        else if (bestKw > 0) { group = 2; percent = bestKw; }
        else if (bestDesc > 0) { group = 3; percent = bestDesc; onlyDesc = true; }
        const totalScore = nameScore + kwScore * 0.7 + descScore * 0.3 + (matchCount * 20);
        return { found: group > 0, group, percent, onlyDesc, score: totalScore };
    }
    
    function sortByRelevance(arr) {
        if (!smartSortEnabled || !currentSearchQuery.trim()) {
            if (currentSortMode === "name_asc") return [...arr].sort((a,b)=>a.name.localeCompare(b.name));
            if (currentSortMode === "name_desc") return [...arr].sort((a,b)=>b.name.localeCompare(a.name));
            if (currentSortMode === "grade_asc") return [...arr].sort((a,b)=>(a.gradeLevel||0)-(b.gradeLevel||0));
            if (currentSortMode === "grade_desc") return [...arr].sort((a,b)=>(b.gradeLevel||0)-(a.gradeLevel||0));
            return [...arr];
        }
        return [...arr].sort((a,b)=>{
            const ia = topicRelevanceInfo.get(a.id) || { group: 999, score: 0 };
            const ib = topicRelevanceInfo.get(b.id) || { group: 999, score: 0 };
            if (ia.group !== ib.group) return ia.group - ib.group;
            if (ia.score !== ib.score) return ib.score - ia.score;
            return a.name.localeCompare(b.name);
        });
    }
    
    function getSearchWords() { return currentSearchQuery.trim() ? currentSearchQuery.toLowerCase().split(/\s+/).filter(w => w) : []; }
    
    function highlightText(html, words) { 
        if (!words.length) return html; 
        const div = document.createElement('div'); 
        div.innerHTML = html; 
        const walk = n => { 
            if (n.nodeType === 3) { 
                let t = n.nodeValue, changed = false; 
                for (let w of words) { 
                    const rg = new RegExp(`(${w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi'); 
                    if (rg.test(t)) { 
                        t = t.replace(rg, '<span class="search-highlight">$1</span>'); 
                        changed = true; 
                    } 
                } 
                if (changed) { 
                    const s = document.createElement('span'); 
                    s.innerHTML = t; 
                    n.parentNode.replaceChild(s, n); 
                } 
            } else if (n.nodeType === 1 && !['SCRIPT','STYLE'].includes(n.tagName)) { 
                Array.from(n.childNodes).forEach(walk); 
            } 
        }; 
        Array.from(div.childNodes).forEach(walk); 
        return div.innerHTML; 
    }
    
    function highlightElement(el, words) {
        if (!words.length) return;
        const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null, false);
        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        for (let node of nodes) {
            let text = node.nodeValue, changed = false;
            if (!text.trim()) continue;
            for (let w of words) {
                const regex = new RegExp(`(${w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                if (regex.test(text)) {
                    text = text.replace(regex, `<span class="search-highlight">$1</span>`);
                    changed = true;
                }
            }
            if (changed) {
                const span = document.createElement('span');
                span.innerHTML = text;
                node.parentNode.replaceChild(span, node);
            }
        }
    }
    
    function saveToStorage(){ 
        localStorage.setItem('mathframe_collapsed',JSON.stringify(Object.fromEntries(collapsedFolders))); 
        localStorage.setItem('mathframe_filter',currentGradeFilter); 
        localStorage.setItem('mathframe_sort',currentSortMode); 
        localStorage.setItem('mathframe_search',currentSearchQuery); 
        localStorage.setItem('mathframe_search_in_desc',searchInDescription); 
        localStorage.setItem('mathframe_keywords',keywordsEnabled); 
        localStorage.setItem('mathframe_fuzzy',fuzzyEnabled); 
        localStorage.setItem('mathframe_smart_sort',smartSortEnabled); 
        localStorage.setItem('mathframe_ai_search',useAISearch); 
    }
    
    function loadFromStorage(){ 
        const sc = localStorage.getItem('mathframe_collapsed'); 
        if (sc) collapsedFolders = new Map(Object.entries(JSON.parse(sc))); 
        currentGradeFilter = localStorage.getItem('mathframe_filter') || "all"; 
        currentSortMode = localStorage.getItem('mathframe_sort') || "config"; 
        currentSearchQuery = localStorage.getItem('mathframe_search') || ""; 
        searchInDescription = localStorage.getItem('mathframe_search_in_desc') === 'true'; 
        keywordsEnabled = localStorage.getItem('mathframe_keywords') !== 'false'; 
        fuzzyEnabled = localStorage.getItem('mathframe_fuzzy') !== 'false'; 
        smartSortEnabled = localStorage.getItem('mathframe_smart_sort') !== 'false'; 
        useAISearch = localStorage.getItem('mathframe_ai_search') === 'true'; 
    }
    
    function isVisible(t){ const g = t.gradeLevel || 1; if (currentGradeFilter === "all") return true; if (currentGradeFilter === "9") return g <= 9; if (currentGradeFilter === "7") return g <= 7; if (currentGradeFilter === "5") return g <= 5; if (currentGradeFilter === "preschool") return g <= 4; return true; }
    
    function getChildrenSorted(id){ return sortByRelevance(currentTopics.filter(t => t.parent === id && isVisible(t))); }
    
    function hasMatchingDescendant(id) {
        if (!currentSearchQuery.trim()) return false;
        const children = currentTopics.filter(t => t.parent === id && isVisible(t));
        for (let child of children) {
            if (topicRelevanceInfo.get(child.id)?.found) return true;
            if (hasMatchingDescendant(child.id)) return true;
        }
        return false;
    }
    
    function hasVisibleChildren(id){ 
        const kids = getChildrenSorted(id);
        if (!kids.length) return false;
        if (!currentSearchQuery.trim()) return kids.length > 0;
        for (let c of kids) {
            if (topicRelevanceInfo.get(c.id)?.found || aiFoundTopicIds.has(c.id)) return true;
            if (hasMatchingDescendant(c.id)) return true;
        }
        return false;
    }
    
    function updateRelevance(){ 
        matchOnlyByDescription.clear(); topicRelevanceInfo.clear(); 
        if (!currentSearchQuery.trim()) return; 
        const words = getSearchWords(); 
        for (let t of currentTopics) { 
            const info = getRelevance(t, words); 
            topicRelevanceInfo.set(t.id, info); 
            if (info.found && info.onlyDesc) matchOnlyByDescription.set(t.id, true); 
        } 
    }
    
    function expandAllNodes(nodeElement) {
        const childrenDiv = nodeElement.querySelector('.tree-children');
        if (childrenDiv && !childrenDiv.classList.contains('expanded')) {
            childrenDiv.classList.add('expanded');
            const toggleIcon = nodeElement.querySelector('.toggle-icon i');
            if (toggleIcon) toggleIcon.classList.replace('fa-chevron-right', 'fa-chevron-down');
        }
        const childNodes = nodeElement.querySelectorAll(':scope > .tree-children > .tree-node');
        childNodes.forEach(child => expandAllNodes(child));
    }
    
    function collapseAllNodes(nodeElement) {
        const childrenDiv = nodeElement.querySelector('.tree-children');
        if (childrenDiv && childrenDiv.classList.contains('expanded')) {
            childrenDiv.classList.remove('expanded');
            const toggleIcon = nodeElement.querySelector('.toggle-icon i');
            if (toggleIcon) toggleIcon.classList.replace('fa-chevron-down', 'fa-chevron-right');
        }
        const childNodes = nodeElement.querySelectorAll(':scope > .tree-children > .tree-node');
        childNodes.forEach(child => collapseAllNodes(child));
    }
    
    function clearAIFoundHighlights() {
        document.querySelectorAll('.tree-node').forEach(node => {
            node.classList.remove('ai-found');
        });
    }
    
    function applyAIFoundHighlights(foundTopicIds) {
        clearAIFoundHighlights();
        for (let id of foundTopicIds) {
            const node = document.querySelector(`.tree-node[data-id="${id}"]`);
            if (node) node.classList.add('ai-found');
        }
    }
    
    function renderTree(){
        const container = document.getElementById('topicTree'); if (!container) return;
        const wasExpanded = isTreeExpandedForSearch;
        container.innerHTML = ''; updateRelevance();
        const roots = sortByRelevance(currentTopics.filter(t => t.parent === null && isVisible(t)));
        for (let r of roots) renderNode(r, container);
        applyTreeFilter(); highlightActive(); attachEvents();
        
        if (currentSearchQuery.trim() && !wasExpanded) {
            const rootNodes = container.querySelectorAll(':scope > .tree-node');
            rootNodes.forEach(node => expandAllNodes(node));
            isTreeExpandedForSearch = true;
        } else if (!currentSearchQuery.trim() && wasExpanded) {
            const rootNodes = container.querySelectorAll(':scope > .tree-node');
            rootNodes.forEach(node => collapseAllNodes(node));
            isTreeExpandedForSearch = false;
        }
        
        if (aiFoundTopicIds.size > 0) {
            applyAIFoundHighlights(aiFoundTopicIds);
        }
        
        const words = getSearchWords();
        if (words.length) document.querySelectorAll('.node-title').forEach(el => highlightElement(el, words));
    }
    
    function renderNode(topic, parentEl){
        const children = getChildrenSorted(topic.id);
        const visibleKids = children.length > 0 && hasVisibleChildren(topic.id);
        const collapsed = collapsedFolders.get(topic.id) === true && !isTreeExpandedForSearch;
        const node = document.createElement('div'); node.className = 'tree-node'; node.setAttribute('data-id', topic.id);
        if (matchOnlyByDescription.get(topic.id)) node.classList.add('search-match-description');
        const content = document.createElement('div'); content.className = 'tree-node-content';
        const toggle = document.createElement('span'); toggle.className = 'toggle-icon';
        if (visibleKids) { 
            toggle.innerHTML = collapsed ? '<i class="fas fa-chevron-right"></i>' : '<i class="fas fa-chevron-down"></i>'; 
        } else { 
            toggle.classList.add('empty'); 
            toggle.innerHTML = ''; 
        }
        content.appendChild(toggle);
        const icon = document.createElement('i'); icon.className = `fas ${topic.icon || 'fa-book'}`; icon.style.width = '20px';
        content.appendChild(icon);
        const title = document.createElement('span'); title.className = 'node-title'; title.textContent = topic.name;
        content.appendChild(title); node.appendChild(content);
        if (visibleKids) {
            const kidsDiv = document.createElement('div'); kidsDiv.className = 'tree-children';
            if (!collapsed && !isTreeExpandedForSearch) kidsDiv.classList.add('expanded');
            if (isTreeExpandedForSearch) kidsDiv.classList.add('expanded');
            children.forEach(c => { if (isVisible(c)) renderNode(c, kidsDiv); });
            node.appendChild(kidsDiv);
            toggle.addEventListener('click', (e) => { 
                e.stopPropagation(); 
                if (isTreeExpandedForSearch) return;
                const newState = !collapsedFolders.get(topic.id); 
                collapsedFolders.set(topic.id, newState); 
                saveToStorage(); 
                if (newState) { 
                    kidsDiv.classList.remove('expanded'); 
                    toggle.innerHTML = '<i class="fas fa-chevron-right"></i>'; 
                } else { 
                    kidsDiv.classList.add('expanded'); 
                    toggle.innerHTML = '<i class="fas fa-chevron-down"></i>'; 
                } 
            });
        }
        parentEl.appendChild(node);
    }
    
    function applyTreeFilter(){ 
        const q = currentSearchQuery.trim(); 
        if (!q && aiFoundTopicIds.size === 0) { 
            document.querySelectorAll('.tree-node').forEach(n => n.style.display = ''); 
            return; 
        } 
        const matching = new Set(); 
        for (let t of currentTopics) {
            if (topicRelevanceInfo.get(t.id)?.found || aiFoundTopicIds.has(t.id)) { 
                matching.add(t.id); 
                let p = t.parent; 
                while (p) { 
                    matching.add(p); 
                    p = currentTopics.find(x => x.id === p)?.parent; 
                } 
            } 
        }
        if (matching.size === 0 && aiFoundTopicIds.size > 0) {
            aiFoundTopicIds.forEach(id => matching.add(id));
        }
        document.querySelectorAll('.tree-node').forEach(n => { 
            n.style.display = matching.has(n.getAttribute('data-id')) ? '' : 'none'; 
        }); 
    }
    
    function highlightActive(){ document.querySelectorAll('.tree-node').forEach(n => n.classList.remove('active')); if (currentTopicId && currentTopicId !== 'welcome') document.querySelector(`.tree-node[data-id="${currentTopicId}"]`)?.classList.add('active'); }
    
    function attachEvents(){ document.querySelectorAll('.tree-node-content').forEach(el => { el.removeEventListener('click', clickHandler); el.addEventListener('click', clickHandler); }); }
    
    function clickHandler(e){ 
        if (e.target.closest('.toggle-icon') && !e.target.closest('.toggle-icon')?.classList.contains('empty')) return; 
        const node = this.closest('.tree-node'); 
        if (node) { 
            const id = node.getAttribute('data-id'); 
            if (id) { 
                closeDrawer();
                loadTopic(id, false); 
            } 
        } 
    }
    
    function setExampleWithScripts(container, html) { container.innerHTML = html; }
    
    function showWelcomeScreen() {
        currentTopicId = 'welcome';
        const exampleDiv = document.getElementById('examplePlaceholder');
        const descDiv = document.getElementById('descriptionPlaceholder');
        exampleDiv.style.opacity = '0'; descDiv.style.opacity = '0';
        setTimeout(() => {
            exampleDiv.innerHTML = `<div class="welcome-message"><i class="fas fa-graduation-cap"></i><h2 style="margin: 16px 0 10px;">MathFrame</h2><p>Современная платформа для изучения точных наук</p><p style="margin-top: 22px; opacity:0.7;">Выберите тему в меню или начните поиск</p></div>`;
            descDiv.innerHTML = `<p style="font-size: 1rem;"><strong>Добро пожаловать!</strong><br>Адаптивный интерфейс, плавные анимации, умный поиск и качественные примеры.</p><p>Интерактивные примеры поддерживают JavaScript, Canvas и динамическую графику.</p>`;
            exampleDiv.style.opacity = '1'; descDiv.style.opacity = '1';
            updateNavButtons(); renderTree();
            document.getElementById('unifiedCard').style.animation = 'cardAppear 0.3s ease-out';
            setTimeout(() => document.getElementById('unifiedCard').style.animation = '', 350);
        }, 150);
    }
    
    window.loadTopic = function(id, fromLink) {
        if (id === 'welcome') { showWelcomeScreen(); return; }
        const topic = currentTopics.find(t => t.id === id);
        if (!topic) return;
        if (fromLink && currentTopicId && currentTopicId !== 'welcome') navigationStack.push(currentTopicId);
        currentTopicId = id;
        const exampleDiv = document.getElementById('examplePlaceholder');
        const descDiv = document.getElementById('descriptionPlaceholder');
        exampleDiv.style.opacity = '0'; descDiv.style.opacity = '0';
        setTimeout(() => {
            setExampleWithScripts(exampleDiv, topic.example || '<div style="padding:20px;">Пример не задан</div>');
            let descHtml = topic.description || '<p>Нет описания</p>';
            const words = getSearchWords();
            const shouldHighlight = words.length && (searchInDescription || keywordsEnabled);
            descDiv.innerHTML = shouldHighlight ? highlightText(descHtml, words) : descHtml;
            descDiv.querySelectorAll('.inline-link').forEach(link => {
                link.addEventListener('click', (e) => { e.preventDefault(); const tid = link.getAttribute('data-topic-id'); if (tid && currentTopics.find(t => t.id === tid)) loadTopic(tid, true); });
            });
            exampleDiv.style.opacity = '1'; descDiv.style.opacity = '1';
            updateNavButtons(); renderTree();
            document.getElementById('unifiedCard').style.animation = 'cardAppear 0.3s ease-out';
            setTimeout(() => document.getElementById('unifiedCard').style.animation = '', 350);
        }, 150);
        showToast(topic.name);
    };
    
    function updateNavButtons(){
        const cont = document.getElementById('navButtonsContainer'); if (!cont) return;
        if (currentTopicId === 'welcome') {
            cont.innerHTML = '<button class="nav-btn" id="homeWelcomeBtn"><i class="fas fa-graduation-cap"></i> Главная</button>';
            const btn = document.getElementById('homeWelcomeBtn');
            if (btn) btn.onclick = () => showWelcomeScreen();
            return;
        }
        const topic = currentTopics.find(t => t.id === currentTopicId);
        const hasParent = topic && topic.parent && currentTopics.some(p => p.id === topic.parent);
        cont.innerHTML = '';
        if (hasParent) {
            const btn = document.createElement('button');
            btn.className = 'nav-btn';
            btn.innerHTML = '<i class="fas fa-arrow-up"></i> Родительская тема';
            btn.onclick = () => { if (topic.parent) loadTopic(topic.parent, false); };
            cont.appendChild(btn);
        }
        if (navigationStack.length) {
            const back = document.createElement('button');
            back.className = 'nav-btn';
            back.innerHTML = '<i class="fas fa-undo-alt"></i> Вернуться по ссылке';
            back.onclick = () => { if (navigationStack.length) loadTopic(navigationStack.pop(), false); else showToast('Нет истории'); };
            cont.appendChild(back);
        }
    }
    
    function applyFilters(){
        currentGradeFilter = document.getElementById('levelSelect').value;
        currentSortMode = document.getElementById('sortSelect').value;
        saveToStorage(); renderTree();
        if (currentTopicId && currentTopicId !== 'welcome') {
            const cur = currentTopics.find(t => t.id === currentTopicId);
            if (cur && isVisible(cur)) {
                const descDiv = document.getElementById('descriptionPlaceholder');
                const words = getSearchWords();
                const shouldHighlight = words.length && (searchInDescription || keywordsEnabled);
                descDiv.innerHTML = shouldHighlight ? highlightText(cur.description || '<p>Нет описания</p>', words) : (cur.description || '<p>Нет описания</p>');
                descDiv.querySelectorAll('.inline-link').forEach(link => {
                    link.addEventListener('click', (e) => { e.preventDefault(); const tid = link.getAttribute('data-topic-id'); if (tid && currentTopics.find(t => t.id === tid)) loadTopic(tid, true); });
                });
            } else {
                const first = currentTopics.find(t => t.parent === null && isVisible(t));
                if (first) loadTopic(first.id, false);
                else showWelcomeScreen();
            }
        } else { renderTree(); }
    }
    
    function showToast(msg){ let t = document.querySelector('.framework-toast'); if (t) t.remove(); t = document.createElement('div'); t.className = 'framework-toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }
    
    function openDrawer() {
        const drawer = document.getElementById('drawer');
        const overlay = document.getElementById('drawerOverlay');
        drawer.classList.add('open');
        overlay.classList.add('visible');
        renderTree();
    }
    
    function closeDrawer() {
        const drawer = document.getElementById('drawer');
        const overlay = document.getElementById('drawerOverlay');
        drawer.classList.remove('open');
        overlay.classList.remove('visible');
    }
    
    function refreshUI() {
        saveToStorage();
        renderTree();
        if (currentTopicId && currentTopicId !== 'welcome') {
            const t = currentTopics.find(tt => tt.id === currentTopicId);
            if (t && isVisible(t)) {
                const descDiv = document.getElementById('descriptionPlaceholder');
                const words = getSearchWords();
                const shouldHighlight = words.length && (searchInDescription || keywordsEnabled);
                descDiv.innerHTML = shouldHighlight ? highlightText(t.description || '<p>Нет описания</p>', words) : (t.description || '<p>Нет описания</p>');
                descDiv.querySelectorAll('.inline-link').forEach(link => {
                    link.addEventListener('click', (e) => { e.preventDefault(); const tid = link.getAttribute('data-topic-id'); if (tid && currentTopics.find(tt => tt.id === tid)) loadTopic(tid, true); });
                });
            }
        }
    }
    
    // ========== ПОИСК С ИЛИ БЕЗ ИИ ==========
    async function performSearch() {
        const searchQuery = document.getElementById('searchTextarea').value;
        currentSearchQuery = searchQuery;
        aiFoundTopicIds.clear();
        
        if (searchQuery.trim()) {
            if (useAISearch) {
                if (!aiEngine) aiEngine = new SmartAI(currentTopics);
                const results = aiEngine.search(searchQuery);
                if (results.length > 0) {
                    for (let r of results) {
                        aiFoundTopicIds.add(r.topic.id);
                    }
                    showToast(`🤖 ИИ нашёл ${results.length} подходящих тем`);
                } else {
                    showToast(`🤖 ИИ не нашёл подходящих тем`);
                }
            }
            
            // Разворачиваем дерево при любом поиске
            const rootNodes = document.querySelectorAll('#topicTree > .tree-node');
            rootNodes.forEach(node => expandAllNodes(node));
            isTreeExpandedForSearch = true;
        } else {
            // Очищаем поиск
            const rootNodes = document.querySelectorAll('#topicTree > .tree-node');
            rootNodes.forEach(node => collapseAllNodes(node));
            isTreeExpandedForSearch = false;
            collapsedFolders.clear();
        }
        
        saveToStorage();
        renderTree();
        
        if (searchQuery.trim() && !useAISearch) {
            const words = getSearchWords();
            if (words.length) {
                showToast(`🔍 Найдено по ключевым словам`);
            }
        }
    }
    
    // ========== ИНИЦИАЛИЗАЦИЯ ==========
    async function init(){
        const loaded = await loadConfig();
        currentTopics = buildHierarchyOrder(loaded);
        collapsedFolders.clear(); 
        for (let t of currentTopics) if (currentTopics.some(c => c.parent === t.id)) collapsedFolders.set(t.id, true);
        loadFromStorage();
        
        document.getElementById('searchTextarea').value = currentSearchQuery;
        document.getElementById('searchInDescCheckbox').checked = searchInDescription;
        document.getElementById('keywordsCheckbox').checked = keywordsEnabled;
        document.getElementById('fuzzyCheckbox').checked = fuzzyEnabled;
        document.getElementById('smartSortCheckbox').checked = smartSortEnabled;
        document.getElementById('levelSelect').value = currentGradeFilter;
        document.getElementById('sortSelect').value = currentSortMode;
        const aiCheckbox = document.getElementById('aiSearchCheckbox');
        if (aiCheckbox) aiCheckbox.checked = useAISearch;
        
        showWelcomeScreen();
        
        document.getElementById('applySearchBtn').addEventListener('click', performSearch);
        document.getElementById('searchInDescCheckbox').addEventListener('change', (e) => { searchInDescription = e.target.checked; refreshUI(); });
        document.getElementById('keywordsCheckbox').addEventListener('change', (e) => { keywordsEnabled = e.target.checked; refreshUI(); });
        document.getElementById('fuzzyCheckbox').addEventListener('change', (e) => { fuzzyEnabled = e.target.checked; refreshUI(); });
        document.getElementById('smartSortCheckbox').addEventListener('change', (e) => { smartSortEnabled = e.target.checked; refreshUI(); });
        document.getElementById('levelSelect').addEventListener('change', applyFilters);
        document.getElementById('sortSelect').addEventListener('change', applyFilters);
        document.getElementById('aiSearchCheckbox').addEventListener('change', (e) => { useAISearch = e.target.checked; saveToStorage(); });
        
        document.getElementById('menuBtn').addEventListener('click', openDrawer);
        document.getElementById('closeDrawerBtn').addEventListener('click', closeDrawer);
        document.getElementById('drawerOverlay').addEventListener('click', closeDrawer);
        document.getElementById('globalHomeBtn').addEventListener('click', () => showWelcomeScreen());
        document.body.addEventListener('click', (e) => { const link = e.target.closest('.inline-link'); if (link && link.dataset.topicId) { e.preventDefault(); const tid = link.dataset.topicId; if (tid && currentTopics.find(t => t.id === tid)) loadTopic(tid, true); closeDrawer(); } });
        
        const filtersToggle = document.getElementById('filtersToggleBtn');
        const filtersPanel = document.getElementById('filtersPanel');
        const filtersChevron = document.getElementById('filtersChevron');
        filtersToggle.addEventListener('click', () => {
            filtersPanel.classList.toggle('open');
            filtersChevron.style.transform = filtersPanel.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0deg)';
        });
        
        if (currentSearchQuery.trim()) {
            setTimeout(() => {
                performSearch();
            }, 500);
        }
        
        setTimeout(() => { const loader = document.getElementById('loadingOverlay'); if (loader) { loader.style.opacity = '0'; setTimeout(() => { loader.style.display = 'none'; document.getElementById('appRoot').classList.add('content-visible'); }, 700); } else document.getElementById('appRoot').classList.add('content-visible'); }, 800);
    }
    
    init();
</script>
