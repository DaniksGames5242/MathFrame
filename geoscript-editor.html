<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Компилятор GeoScipt</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f7fa;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        h1 {
            margin: 0 0 16px 0;
            font-weight: 500;
            font-size: 1.8rem;
            color: #1e293b;
        }
        .main {
            display: flex;
            flex: 1;
            gap: 20px;
            min-height: 0;
        }
        .panel {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .panel-header {
            padding: 12px 16px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            font-weight: 600;
            font-size: 0.9rem;
            color: #334155;
            flex-shrink: 0;
        }
        .left { flex: 1; }
        .right { flex: 1; }
        textarea {
            flex: 1;
            border: none;
            padding: 16px;
            font-family: 'Cascadia Code', 'Consolas', monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            outline: none;
            background: #fafcff;
            color: #0f172a;
            tab-size: 2;
        }
        textarea:focus { background: #ffffff; }
        .controls {
            padding: 12px 16px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 12px;
            flex-shrink: 0;
            background: #f8fafc;
        }
        .controls button {
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn-primary {
            background: #2563eb;
            color: #fff;
        }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-success {
            background: #16a34a;
            color: #fff;
        }
        .btn-success:hover { background: #15803d; }
        .btn-success:disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .btn-secondary {
            background: #e2e8f0;
            color: #1e293b;
        }
        .btn-secondary:hover { background: #cbd5e1; }
        .iframe-wrapper {
            flex: 1;
            background: #ffffff;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        #output {
            padding: 8px 16px;
            font-size: 0.9rem;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            flex-shrink: 0;
            min-height: 44px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .error {
            color: #dc2626;
        }
        .success {
            color: #16a34a;
        }
        .info {
            color: #2563eb;
        }
        @media (max-width: 700px) {
            .main { flex-direction: column; }
            .left, .right { flex: 1; }
        }
    </style>
</head>
<body>

    <h1>🧮 Компилятор GeoScipt → HTML</h1>

    <div class="main">
        <div class="panel left">
            <div class="panel-header">📝 Входной код (GeoScipt)</div>
            <textarea id="codeInput" spellcheck="false">[
  space = 2D;
  title = "Пример треугольника";
  undertitle = "С описанной окружностью";
  description = "Формулы: \\(E=mc^2\\), \\(\\int_0^\\infty e^{-x} dx = 1\\)";

  new Point = { name = "A", pos = (-8, -4), color = #FF0000, text = true("A"), dynamic = true };
  new Point = { name = "B", pos = (8, -4), color = #00AA00, text = true("B"), dynamic = true };
  new Point = { name = "C", pos = (0, 8), color = #0000FF, text = true("C"), dynamic = true };

  new Line = { name = "AB", pos = ("A", "B"), color = #888888 };
  new Line = { name = "BC", pos = ("B", "C"), color = #888888 };
  new Line = { name = "CA", pos = ("C", "A"), color = #888888 };

  new Circle = {
    name = "circumcircle",
    type = FromPoints,
    points = ("A", "B", "C"),
    color = #FF8800
  };

  new UI {
    type = input,
    inputtype = number,
    label = "Параметр t",
    min = 0,
    max = 1,
    step = 0.01,
    default = 0.5,
    variable = t
  };
]</textarea>
            <div class="controls">
                <button class="btn-primary" id="compileBtn">▶ Скомпилировать</button>
                <button class="btn-success" id="downloadBtn" disabled>⬇ Скачать HTML</button>
                <button class="btn-secondary" id="copyBtn" disabled>📋 Копировать HTML</button>
            </div>
        </div>

        <div class="panel right">
            <div class="panel-header">👁️ Превью</div>
            <div class="iframe-wrapper">
                <iframe id="preview"></iframe>
            </div>
            <div id="output">
                <span class="info">➜ Ожидание компиляции...</span>
            </div>
        </div>
    </div>

    <!-- Карта импортов для модуля -->
    <script type="importmap">
        {
            "imports": {
                "/geoscript/geocompiler.js": "./geoscript/geocompiler.js"
            }
        }
    </script>

    <script type="module">
        import { compile } from '/geoscript/geocompiler.js';

        const codeInput = document.getElementById('codeInput');
        const compileBtn = document.getElementById('compileBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const copyBtn = document.getElementById('copyBtn');
        const preview = document.getElementById('preview');
        const output = document.getElementById('output');

        let lastHtml = null;

        function setOutput(message, type) {
            const colors = {
                error: 'error',
                success: 'success',
                info: 'info'
            };
            output.innerHTML = `<span class="${colors[type] || 'info'}">${message}</span>`;
        }

        function compileCode() {
            const code = codeInput.value;
            try {
                const result = compile(code);
                if (result.success) {
                    lastHtml = result.html;
                    // Показываем в iframe
                    const blob = new Blob([result.html], { type: 'text/html' });
                    const url = URL.createObjectURL(blob);
                    preview.src = url;
                    preview.onload = () => URL.revokeObjectURL(url);
                    setOutput('✅ Компиляция успешна!', 'success');
                    downloadBtn.disabled = false;
                    copyBtn.disabled = false;
                } else {
                    const errorList = result.errors.map(e => `• ${e}`).join('<br>');
                    setOutput(`❌ Ошибки компиляции:<br>${errorList}`, 'error');
                    downloadBtn.disabled = true;
                    copyBtn.disabled = true;
                    lastHtml = null;
                }
            } catch (e) {
                setOutput(`❌ Критическая ошибка: ${e.message}`, 'error');
                downloadBtn.disabled = true;
                copyBtn.disabled = true;
                lastHtml = null;
            }
        }

        compileBtn.addEventListener('click', compileCode);

        downloadBtn.addEventListener('click', () => {
            if (lastHtml) {
                const blob = new Blob([lastHtml], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'output.html';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
        });

        copyBtn.addEventListener('click', async () => {
            if (lastHtml) {
                try {
                    await navigator.clipboard.writeText(lastHtml);
                    setOutput('📋 HTML скопирован в буфер обмена', 'success');
                } catch {
                    // fallback
                    const textarea = document.createElement('textarea');
                    textarea.value = lastHtml;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    setOutput('📋 HTML скопирован (fallback)', 'success');
                }
            }
        });

        // Автоматическая компиляция при загрузке
        compileCode();

        // При изменении кода можно перекомпилировать по Ctrl+Enter
        codeInput.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                compileCode();
            }
        });
    </script>
</body>
</html>
