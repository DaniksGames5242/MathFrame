<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🧪 DeepSeek Chat (SiliconFlow)</title>
    <style>
        /* ===== Стили (полностью сохранены) ===== */
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0d1117; color:#e6edf3; font-family:'Segoe UI',sans-serif; height:100vh; display:flex; justify-content:center; align-items:center; padding:16px; }
        .app { display:flex; width:100%; max-width:1300px; height:100vh; max-height:850px; background:#161b22; border-radius:28px; overflow:hidden; border:1px solid #30363d; }
        .sidebar { width:300px; background:#0d1117; padding:24px 20px; overflow-y:auto; border-right:1px solid #30363d; flex-shrink:0; display:flex; flex-direction:column; gap:18px; }
        .sidebar h2 { font-size:20px; font-weight:600; display:flex; align-items:center; gap:10px; color:#f0f6fc; margin-bottom:4px; }
        .sidebar h2 small { font-size:14px; font-weight:400; color:#8b949e; }
        .sidebar .section-title { font-size:13px; font-weight:500; text-transform:uppercase; letter-spacing:0.5px; color:#8b949e; margin:6px 0 8px 0; }
        .param-group { margin-bottom:14px; }
        .param-group label { display:block; font-size:13px; font-weight:500; color:#c9d1d9; margin-bottom:4px; }
        .param-group label .hint { font-weight:400; color:#8b949e; font-size:12px; }
        .param-group select, .param-group textarea, .param-group input { width:100%; background:#0d1117; border:1px solid #30363d; border-radius:10px; padding:9px 14px; color:#e6edf3; font-size:14px; font-family:inherit; transition:border-color 0.2s; outline:none; }
        .param-group select:focus, .param-group textarea:focus, .param-group input:focus { border-color:#58a6ff; box-shadow:0 0 0 3px rgba(88,166,255,0.15); }
        .param-group textarea { resize:vertical; min-height:60px; line-height:1.5; }
        .range-row { display:flex; align-items:center; gap:12px; }
        .range-row input[type="range"] { flex:1; padding:0; height:6px; -webkit-appearance:none; appearance:none; background:#30363d; border-radius:4px; border:none; outline:none; }
        .range-row input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:18px; height:18px; border-radius:50%; background:#58a6ff; cursor:pointer; border:2px solid #0d1117; box-shadow:0 0 0 1px #58a6ff; }
        .range-row input[type="range"]::-moz-range-thumb { width:18px; height:18px; border-radius:50%; background:#58a6ff; cursor:pointer; border:2px solid #0d1117; box-shadow:0 0 0 1px #58a6ff; }
        .range-value { min-width:40px; text-align:center; font-weight:600; font-size:14px; color:#58a6ff; background:#0d1117; padding:2px 8px; border-radius:6px; border:1px solid #30363d; }
        .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:8px 18px; border-radius:10px; font-size:14px; font-weight:600; border:none; cursor:pointer; transition:all 0.2s; font-family:inherit; }
        .btn-primary { background:#238636; color:#fff; }
        .btn-primary:hover { background:#2ea043; transform:translateY(-1px); box-shadow:0 6px 20px rgba(35,134,54,0.25); }
        .btn-primary:disabled { opacity:0.5; cursor:not-allowed; transform:none; box-shadow:none; }
        .btn-outline { background:transparent; color:#c9d1d9; border:1px solid #30363d; }
        .btn-outline:hover { background:#21262d; border-color:#8b949e; }
        .btn-warning { background:#d29922; color:#fff; }
        .btn-warning:hover { background:#e3b341; }
        .btn-warning:disabled { opacity:0.5; cursor:not-allowed; }
        .btn-sm { padding:4px 12px; font-size:12px; }
        .chat-area { flex:1; display:flex; flex-direction:column; background:#161b22; min-width:0; }
        .chat-header { padding:18px 28px; border-bottom:1px solid #30363d; display:flex; justify-content:space-between; align-items:center; flex-shrink:0; flex-wrap:wrap; gap:8px; }
        .chat-header h3 { font-weight:500; font-size:18px; display:flex; align-items:center; gap:10px; }
        .chat-header .model-badge { background:#1f2937; padding:4px 14px; border-radius:20px; font-size:13px; font-weight:500; color:#8b949e; }
        .messages-container { flex:1; overflow-y:auto; padding:20px 28px; display:flex; flex-direction:column; gap:18px; }
        .messages-container::-webkit-scrollbar { width:6px; }
        .messages-container::-webkit-scrollbar-track { background:#0d1117; }
        .messages-container::-webkit-scrollbar-thumb { background:#30363d; border-radius:4px; }
        .message { display:flex; align-items:flex-start; gap:12px; max-width:85%; animation:fadeIn 0.25s ease; }
        .message.user { align-self:flex-end; flex-direction:row-reverse; }
        .message.model { align-self:flex-start; }
        .msg-avatar { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; background:#21262d; border:1px solid #30363d; }
        .message.user .msg-avatar { background:#1f6feb; border-color:#388bfd; }
        .message.model .msg-avatar { background:#2d333b; border-color:#58a6ff; }
        .msg-bubble { background:#0d1117; border:1px solid #30363d; border-radius:16px; padding:12px 18px; line-height:1.6; font-size:15px; word-wrap:break-word; white-space:pre-wrap; }
        .message.user .msg-bubble { background:#1f2937; border-color:#30363d; }
        .msg-timestamp { font-size:11px; color:#8b949e; margin-top:4px; text-align:right; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        .input-area { padding:16px 28px 24px; border-top:1px solid #30363d; display:flex; gap:12px; align-items:flex-end; flex-shrink:0; background:#161b22; }
        .input-area textarea { flex:1; background:#0d1117; border:1px solid #30363d; border-radius:14px; padding:12px 16px; color:#e6edf3; font-size:15px; font-family:inherit; resize:none; min-height:52px; max-height:150px; transition:border-color 0.2s; outline:none; }
        .input-area textarea:focus { border-color:#58a6ff; box-shadow:0 0 0 3px rgba(88,166,255,0.15); }
        .input-area .btn { padding:12px 24px; height:52px; flex-shrink:0; }
        .status-line { font-size:13px; color:#8b949e; display:flex; align-items:center; gap:10px; margin-top:4px; padding-top:12px; border-top:1px solid #30363d; }
        .status-line .spinner { display:none; width:16px; height:16px; border:2px solid #30363d; border-top-color:#58a6ff; border-radius:50%; animation:spin 0.8s linear infinite; }
        .status-line .spinner.active { display:inline-block; }
        .status-line .err { color:#f85149; }
        .status-line .ok { color:#3fb950; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .model-check-result { background:#0d1117; border:1px solid #30363d; border-radius:8px; padding:8px 12px; font-size:12px; max-height:200px; overflow-y:auto; white-space:pre-wrap; font-family:'Consolas',monospace; color:#8b949e; margin-top:4px; }
        .model-check-result .ok { color:#3fb950; }
        .model-check-result .err { color:#f85149; }
        .model-check-result .clickable { cursor:pointer; color:#58a6ff; text-decoration:underline; padding:0 2px; border-radius:4px; transition:background 0.15s; }
        .model-check-result .clickable:hover { background:#21262d; color:#79c0ff; }
        .model-check-result .working { color:#3fb950; }
        .progress-bar { width:100%; height:4px; background:#30363d; border-radius:2px; margin-top:4px; overflow:hidden; }
        .progress-bar .progress-fill { height:100%; background:#58a6ff; width:0%; transition:width 0.2s; }
        @media (max-width:820px) { .app { flex-direction:column; max-height:none; height:100vh; border-radius:20px; } .sidebar { width:100%; max-height:45vh; border-right:none; border-bottom:1px solid #30363d; padding:16px 18px; overflow-y:auto; } .chat-area { flex:1; min-height:55vh; } .chat-header { padding:12px 18px; } .messages-container { padding:14px 18px; } .input-area { padding:12px 18px 18px; flex-wrap:wrap; } .input-area textarea { min-height:44px; } .message { max-width:95%; } }
        @media (max-width:480px) { .sidebar { padding:12px 14px; max-height:40vh; } .chat-header h3 { font-size:16px; } .msg-bubble { font-size:14px; padding:10px 14px; } }
    </style>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <h2>⚙️ Настройки <small>SiliconFlow</small></h2>
            <div class="param-group">
                <label>API ключ <span class="hint">(вшит)</span></label>
                <input type="password" id="apiKey" value="sk-ytfuegaiaugriybwwaqdesefsdlaffazzoituaqarmnmlfto" readonly />
                <div style="font-size:12px; color:#8b949e; margin-top:6px;">✅ Ключ встроен.</div>
            </div>
            <div class="param-group">
                <label>Модель</label>
                <select id="modelSelect">
                    <option value="deepseek-ai/DeepSeek-V3">DeepSeek-V3</option>
                    <option value="deepseek-ai/DeepSeek-R1">DeepSeek-R1</option>
                    <option value="Qwen/Qwen2.5-72B-Instruct">Qwen 2.5 72B</option>
                </select>
                <div style="display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;">
                    <button class="btn btn-outline btn-sm" id="checkModelsBtn">📋 Проверить доступные</button>
                    <button class="btn btn-warning btn-sm" id="testAllBtn">🧪 Протестировать все</button>
                </div>
                <div id="modelCheckResult" class="model-check-result" style="display:none;"></div>
                <div class="progress-bar" id="progressBar" style="display:none;"><div class="progress-fill" id="progressFill"></div></div>
            </div>
            <div class="param-group">
                <label>System instruction</label>
                <textarea id="systemInstruction" rows="2">Ты — полезный, вежливый и тактичный ассистент. Отвечай на русском языке.</textarea>
            </div>
            <div class="section-title">Параметры генерации</div>
            <div class="param-group">
                <label>Temperature</label>
                <div class="range-row">
                    <input type="range" id="temperature" min="0" max="2" step="0.01" value="0.7" />
                    <span class="range-value" id="tempVal">0.70</span>
                </div>
            </div>
            <div class="param-group">
                <label>Max tokens</label>
                <div class="range-row">
                    <input type="range" id="maxTokens" min="1" max="8192" step="1" value="2048" />
                    <span class="range-value" id="maxVal">2048</span>
                </div>
            </div>
            <div class="status-line" id="statusLine">
                <span class="spinner" id="spinner"></span>
                <span id="statusText">Готово</span>
                <span style="margin-left:auto; font-size:12px;" id="usageInfo"></span>
            </div>
        </aside>
        <main class="chat-area">
            <div class="chat-header">
                <h3>💬 Чат <span class="model-badge" id="modelBadge">deepseek-ai/DeepSeek-V3</span></h3>
                <div class="actions"><button class="btn btn-outline" id="clearChatBtn">🗑️ Очистить</button></div>
            </div>
            <div class="messages-container" id="messagesContainer"></div>
            <div class="input-area">
                <textarea id="userInput" rows="1" placeholder="Напишите сообщение… (Ctrl+Enter для отправки)"></textarea>
                <button class="btn btn-primary" id="sendBtn">➤ Отправить</button>
            </div>
        </main>
    </div>

    <script>
        (function() {
            'use strict';

            // ===== ВАШ API КЛЮЧ SILICONFLOW =====
            const SILICONFLOW_API_KEY = 'sk-ytfuegaiaugriybwwaqdesefsdlaffazzoituaqarmnmlfto';

            // DOM refs
            const apiKeyInput = document.getElementById('apiKey');
            const modelSelect = document.getElementById('modelSelect');
            const systemInstruction = document.getElementById('systemInstruction');
            const userInput = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const clearChatBtn = document.getElementById('clearChatBtn');
            const messagesContainer = document.getElementById('messagesContainer');
            const modelBadge = document.getElementById('modelBadge');
            const statusText = document.getElementById('statusText');
            const spinner = document.getElementById('spinner');
            const usageInfo = document.getElementById('usageInfo');
            const checkModelsBtn = document.getElementById('checkModelsBtn');
            const testAllBtn = document.getElementById('testAllBtn');
            const modelCheckResult = document.getElementById('modelCheckResult');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const tempRange = document.getElementById('temperature');
            const tempVal = document.getElementById('tempVal');
            const maxRange = document.getElementById('maxTokens');
            const maxVal = document.getElementById('maxVal');

            let messages = [];
            let isProcessing = false;
            let availableModels = [];
            let workingModels = [];

            // Обновление ползунков
            function updateRangeDisplay(range, display, decimals) {
                const val = parseFloat(range.value);
                display.textContent = val.toFixed(decimals || 2);
            }
            tempRange.addEventListener('input', () => updateRangeDisplay(tempRange, tempVal, 2));
            maxRange.addEventListener('input', () => updateRangeDisplay(maxRange, maxVal, 0));

            // Бейдж модели
            modelSelect.addEventListener('change', () => { modelBadge.textContent = modelSelect.value; });
            modelBadge.textContent = modelSelect.value;

            // Статус
            function setStatus(msg, type) {
                statusText.textContent = msg;
                statusText.className = type || '';
            }

            function setLoading(loading) {
                if (loading) {
                    spinner.classList.add('active');
                    sendBtn.disabled = true;
                    setStatus('Отправка…', '');
                } else {
                    spinner.classList.remove('active');
                    sendBtn.disabled = false;
                }
            }

            // Рендер сообщений
            function renderMessages() {
                messagesContainer.innerHTML = '';
                if (messages.length === 0) {
                    const empty = document.createElement('div');
                    empty.style.textAlign = 'center';
                    empty.style.color = '#8b949e';
                    empty.style.padding = '40px 0';
                    empty.style.fontSize = '15px';
                    empty.textContent = '🤖 Начните диалог с DeepSeek';
                    messagesContainer.appendChild(empty);
                    return;
                }
                messages.forEach((msg, index) => {
                    const div = document.createElement('div');
                    div.className = `message ${msg.role === 'user' ? 'user' : 'model'}`;
                    const avatar = document.createElement('div');
                    avatar.className = 'msg-avatar';
                    avatar.textContent = msg.role === 'user' ? '👤' : '🤖';
                    const bubble = document.createElement('div');
                    bubble.className = 'msg-bubble';
                    bubble.textContent = msg.content;
                    const time = document.createElement('div');
                    time.className = 'msg-timestamp';
                    time.textContent = `#${index + 1}`;
                    bubble.appendChild(time);
                    div.appendChild(avatar);
                    div.appendChild(bubble);
                    messagesContainer.appendChild(div);
                });
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            function addMessage(role, content) {
                messages.push({ role, content });
                renderMessages();
            }

            function clearChat() {
                messages = [];
                renderMessages();
                usageInfo.textContent = '';
                setStatus('Чат очищен', 'ok');
            }
            clearChatBtn.addEventListener('click', clearChat);

            // ----- Получение списка моделей (SiliconFlow) -----
            async function fetchModels() {
                try {
                    const resp = await fetch('https://api.siliconflow.cn/v1/models', {
                        headers: {
                            'Authorization': `Bearer ${SILICONFLOW_API_KEY}`
                        }
                    });
                    if (!resp.ok) {
                        const text = await resp.text();
                        throw new Error(`HTTP ${resp.status}: ${text}`);
                    }
                    const data = await resp.json();
                    return data.data || [];
                } catch (e) {
                    throw new Error(`Ошибка получения списка моделей: ${e.message}`);
                }
            }

            // ----- Проверка доступных моделей -----
            async function checkModels() {
                setStatus('⏳ Запрос списка моделей…', '');
                modelCheckResult.style.display = 'block';
                modelCheckResult.textContent = 'Загрузка…';
                progressBar.style.display = 'none';
                try {
                    const models = await fetchModels();
                    if (models.length === 0) {
                        modelCheckResult.innerHTML = '❌ Модели не найдены. Проверьте ключ.';
                        setStatus('❌ Нет моделей', 'err');
                        return;
                    }
                    const ids = models.map(m => m.id).filter(id => id && typeof id === 'string');
                    availableModels = ids;

                    // Обновляем выпадающий список
                    modelSelect.innerHTML = '';
                    ids.forEach(id => {
                        const opt = document.createElement('option');
                        opt.value = id;
                        opt.textContent = id;
                        modelSelect.appendChild(opt);
                    });
                    // Выбираем DeepSeek если есть
                    const deepseek = ids.find(m => m.includes('deepseek'));
                    if (deepseek) modelSelect.value = deepseek;
                    modelBadge.textContent = modelSelect.value;

                    // Отображаем кликабельные ссылки
                    const listHtml = ids.map(id =>
                        `<span class="clickable" onclick="document.getElementById('modelSelect').value='${id}'; document.getElementById('modelBadge').textContent='${id}';">${id}</span>`
                    ).join(' · ');
                    modelCheckResult.innerHTML =
                        `<span class="ok">✅ Доступные модели (${ids.length}):</span><br>${listHtml}`;
                    setStatus(`✅ Найдено ${ids.length} моделей`, 'ok');
                } catch (err) {
                    modelCheckResult.innerHTML = `❌ Ошибка: ${err.message}`;
                    setStatus('❌ Ошибка при проверке', 'err');
                }
            }
            checkModelsBtn.addEventListener('click', checkModels);

            // ----- Тестирование всех моделей -----
            async function testAllModels() {
                if (availableModels.length === 0) {
                    setStatus('⏳ Сначала получите список моделей (кнопка "Проверить доступные")', 'err');
                    return;
                }
                progressBar.style.display = 'block';
                progressFill.style.width = '0%';
                modelCheckResult.style.display = 'block';
                modelCheckResult.innerHTML = '🧪 Тестирование моделей...<br>0/' + availableModels.length;
                testAllBtn.disabled = true;
                setStatus('⏳ Тестирование моделей…', '');

                let tested = 0;
                const total = availableModels.length;
                const working = [];

                for (const model of availableModels) {
                    const ok = await testSingleModel(model);
                    if (ok) working.push(model);
                    tested++;
                    progressFill.style.width = (tested / total * 100) + '%';
                    modelCheckResult.innerHTML = `🧪 Тестирование моделей...<br>${tested}/${total} (найдено рабочих: ${working.length})`;
                    await delay(200);
                }

                workingModels = working;
                if (working.length === 0) {
                    modelCheckResult.innerHTML = '❌ Не найдено ни одной рабочей модели. Проверьте ключ и права доступа.';
                    setStatus('❌ Нет рабочих моделей', 'err');
                } else {
                    const listHtml = working.map(id =>
                        `<span class="clickable working" onclick="document.getElementById('modelSelect').value='${id}'; document.getElementById('modelBadge').textContent='${id}';">${id}</span>`
                    ).join(' · ');
                    modelCheckResult.innerHTML =
                        `<span class="ok">✅ Рабочие модели (${working.length}):</span><br>${listHtml}`;
                    setStatus(`✅ Найдено ${working.length} рабочих моделей`, 'ok');
                }
                testAllBtn.disabled = false;
                progressBar.style.display = 'none';
            }

            async function testSingleModel(model) {
                try {
                    const resp = await fetch('https://api.siliconflow.cn/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${SILICONFLOW_API_KEY}`,
                        },
                        body: JSON.stringify({
                            model: model,
                            messages: [{ role: 'user', content: 'Hello' }],
                            max_tokens: 5,
                            temperature: 0,
                        }),
                    });
                    if (!resp.ok) return false;
                    const data = await resp.json();
                    return !!(data.choices && data.choices.length > 0 && data.choices[0].message);
                } catch (e) {
                    return false;
                }
            }

            function delay(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

            testAllBtn.addEventListener('click', testAllModels);

            // ----- Отправка сообщения -----
            async function sendMessage() {
                const apiKey = SILICONFLOW_API_KEY;
                if (!apiKey) {
                    setStatus('❌ API-ключ отсутствует!', 'err');
                    return;
                }

                const model = modelSelect.value;
                const text = userInput.value.trim();
                if (!text) {
                    setStatus('❌ Введите сообщение.', 'err');
                    return;
                }

                addMessage('user', text);
                userInput.value = '';
                userInput.style.height = 'auto';

                const system = systemInstruction.value.trim() || undefined;
                const temperature = parseFloat(tempRange.value);
                const max_tokens = parseInt(maxRange.value, 10);

                const chatMessages = [];
                if (system) {
                    chatMessages.push({ role: 'system', content: system });
                }
                for (const m of messages) {
                    chatMessages.push({ role: m.role, content: m.content });
                }

                const requestBody = {
                    model: model,
                    messages: chatMessages,
                    temperature: temperature,
                    max_tokens: max_tokens,
                };

                setLoading(true);
                setStatus('⏳ Ожидание ответа…');
                usageInfo.textContent = '';

                try {
                    const resp = await fetch('https://api.siliconflow.cn/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`,
                        },
                        body: JSON.stringify(requestBody),
                    });

                    const data = await resp.json();
                    if (!resp.ok) {
                        const errMsg = data.error?.message || `HTTP ${resp.status}`;
                        throw new Error(errMsg);
                    }

                    const content = data.choices?.[0]?.message?.content || '(пустой ответ)';
                    addMessage('model', content);

                    const usage = data.usage;
                    if (usage) {
                        usageInfo.textContent =
                            `🔹 Prompt: ${usage.prompt_tokens} · Completion: ${usage.completion_tokens} · Total: ${usage.total_tokens} токенов`;
                    } else {
                        usageInfo.textContent = '✅ Готово';
                    }
                    setStatus('✅ Ответ получен', 'ok');
                } catch (err) {
                    setStatus('❌ Ошибка', 'err');
                    addMessage('model', `⚠️ Ошибка: ${err.message}`);
                    usageInfo.textContent = '';
                } finally {
                    setLoading(false);
                }
            }

            sendBtn.addEventListener('click', sendMessage);
            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    sendMessage();
                }
                setTimeout(() => {
                    userInput.style.height = 'auto';
                    userInput.style.height = Math.min(userInput.scrollHeight, 150) + 'px';
                }, 0);
            });
            userInput.addEventListener('input', () => {
                userInput.style.height = 'auto';
                userInput.style.height = Math.min(userInput.scrollHeight, 150) + 'px';
            });

            // Автоматическая загрузка списка при старте
            checkModels();

            setStatus('Готово. Напишите сообщение.', 'ok');
            renderMessages();
